<title>Flujo de Ventas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700&display=swap');

  :root {
    --ground: #ecebe4;          /* page ground, warm off-white */
    --board: #f3f1ea;           /* diagram board */
    --ink: #1f2a3d;             /* dark navy text */
    --ink-soft: #64707f;        /* muted labels */
    --accent: #d9820f;          /* orange accent */
    --card: #ffffff;
    --card-line: #e7e3d8;
    --wire: #9aa2ad;            /* connector gray */
    --green-fill: #d8efe1;      /* Supabase */
    --green-line: #8ed3ac;
    --purple-fill: #eceafb;     /* Gestión Virgilio */
    --purple-line: #d2cbf3;
    --purple-label: #6a5ad4;
    --orange-fill: #fbecd4;     /* Excel */
    --orange-line: #eec78a;
    --blue-fill: #e7ecf4;       /* ISIS */
    --blue-line: #c4cee0;
    --blue-label: #7a8496;
    --shadow: rgba(31,42,61,.12);
  }
  :root:not([data-theme="light"]) {}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ground: #191b20; }
  }
  :root[data-theme="dark"] { --ground: #191b20; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 18px 40px;
  }
  .board {
    width: 100%;
    max-width: 900px;
    background: var(--board);
    border-radius: 20px;
    box-shadow: 0 18px 50px -24px var(--shadow);
    padding: 8px;
  }
  svg { width: 100%; height: auto; display: block; }

  .t-title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; fill: var(--ink); font-size: 46px; }
  .card-title { font-weight: 700; fill: var(--ink); font-size: 17px; }
  .card-title-sm { font-weight: 700; fill: var(--ink); font-size: 15.5px; }
  .card-sub { font-weight: 500; fill: var(--ink-soft); font-size: 12.5px; }
  .group-label { font-weight: 700; font-size: 15px; letter-spacing: 2.5px; }
  .flow-label { font-weight: 600; fill: var(--ink-soft); font-size: 13px; }
  .accent-label { font-weight: 700; fill: var(--accent); font-size: 13px; letter-spacing: .3px; }
  .center { text-anchor: middle; }
</style>

<div class="board">
  <svg viewBox="0 0 900 1150" role="img" aria-label="Diagrama del flujo de ventas: de las páginas web a Supabase, Gestión Virgilio y facturación ISIS">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--wire)"/>
      </marker>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="var(--shadow)"/>
      </filter>
    </defs>

    <!-- Título -->
    <text x="48" y="74" class="t-title">Flujo de Ventas</text>
    <rect x="50" y="92" width="84" height="4" rx="2" fill="var(--accent)"/>

    <!-- Fila 1: páginas -->
    <g filter="url(#soft)">
      <rect x="120" y="150" width="250" height="82" rx="16" fill="var(--card)" stroke="var(--card-line)"/>
      <rect x="530" y="150" width="250" height="82" rx="16" fill="var(--card)" stroke="var(--card-line)"/>
    </g>
    <text x="245" y="197" class="card-title center">Página LK</text>
    <text x="655" y="197" class="card-title center">Página CH</text>

    <!-- Convergencia a Supabase -->
    <path d="M245,232 C245,278 340,300 440,308" fill="none" stroke="var(--wire)" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M655,232 C655,278 560,300 460,308" fill="none" stroke="var(--wire)" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="450" y="280" class="flow-label center">envían pedidos</text>

    <!-- Supabase -->
    <g filter="url(#soft)">
      <rect x="330" y="316" width="240" height="86" rx="16" fill="var(--green-fill)" stroke="var(--green-line)"/>
    </g>
    <text x="450" y="356" class="card-title center">Supabase</text>
    <text x="450" y="378" class="card-sub center">base central · pedidos (orders)</text>

    <!-- Bajada Automático -->
    <path d="M450,402 L450,470" fill="none" stroke="var(--wire)" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="470" y="442" class="accent-label">Automático</text>

    <!-- Contenedor Gestión Virgilio -->
    <rect x="60" y="478" width="780" height="212" rx="20" fill="var(--purple-fill)" stroke="var(--purple-line)"/>
    <text x="92" y="516" class="group-label" fill="var(--purple-label)">GESTIÓN VIRGILIO</text>

    <!-- Tarjetas internas -->
    <g filter="url(#soft)">
      <rect x="92"  y="540" width="222" height="118" rx="15" fill="var(--card)" stroke="var(--card-line)"/>
      <rect x="339" y="540" width="222" height="118" rx="15" fill="var(--card)" stroke="var(--card-line)"/>
      <rect x="586" y="540" width="222" height="118" rx="15" fill="var(--card)" stroke="var(--card-line)"/>
    </g>
    <text x="203" y="605" class="card-title center">Programa de pedidos</text>

    <text x="450" y="592" class="card-title center">Picking</text>
    <text x="450" y="615" class="card-title center">y armado</text>

    <text x="697" y="605" class="card-title center">Facturación</text>

    <!-- Flechas horizontales entre tarjetas (izq → der) -->
    <path d="M316,599 L336,599" fill="none" stroke="var(--wire)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M563,599 L583,599" fill="none" stroke="var(--wire)" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Facturación → Excel -->
    <path d="M697,690 L697,752" fill="none" stroke="var(--wire)" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="717" y="726" class="flow-label">Genera</text>

    <!-- Excel de pedidos armados -->
    <g filter="url(#soft)">
      <rect x="562" y="760" width="270" height="92" rx="16" fill="var(--orange-fill)" stroke="var(--orange-line)"/>
    </g>
    <text x="697" y="811" class="card-title-sm center">Excel de pedidos armados</text>

    <!-- Excel → ISIS -->
    <path d="M697,852 L697,916" fill="none" stroke="var(--wire)" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="717" y="890" class="flow-label">Se importa</text>

    <!-- Contenedor ISIS -->
    <rect x="60" y="924" width="780" height="176" rx="20" fill="var(--blue-fill)" stroke="var(--blue-line)"/>
    <text x="92" y="962" class="group-label" fill="var(--blue-label)">ISIS</text>

    <!-- Tarjeta Facturación automática de ISIS -->
    <g filter="url(#soft)">
      <rect x="548" y="952" width="284" height="112" rx="16" fill="var(--card)" stroke="var(--card-line)"/>
    </g>
    <text x="690" y="1013" class="card-title-sm center">Facturación automática de ISIS</text>
  </svg>
</div>
