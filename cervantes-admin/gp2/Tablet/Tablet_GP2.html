       · una pieza cuya unidad es kg se manda y se recibe en kg (teclado con coma).
     El Conteo no escribe nada: es la ayuda para contar contra el online; el ajuste de stock va
     por Relevamientos → Validación de Stock (el operario cuenta, el operador del sistema decide). -->

<style>
  /* los tres modos: baldosas grandes, el activo en negro (mismo lenguaje que .seg-btn).
     Conteo es un <a>: se va al módulo de Relevamientos, así que nunca queda "activo". */
  .modos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
  .modo-btn{min-height:60px;border-radius:12px;border:2px solid #d0d7de;background:#fff;
    font-weight:900;font-size:20px;cursor:pointer;color:#111;text-decoration:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .modo-btn.active{background:#111;color:#fff;border-color:#111}
  .modo-btn small{display:block;font-size:13px;font-weight:700;color:#777;margin-top:2px}
  .modo-btn.active small{color:#cfcfcf}
  /* Primero el TIPO y recién después la contraparte: 33 botones juntos no se leen en la
     tablet. No se estiran a todo el ancho (máximo 320px cada uno) para no dejar baldosas
     enormes con dos palabras adentro. */
  .tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,320px));gap:10px;

  .tipo-btn small{display:block;font-size:14px;font-weight:700;color:#777;margin-top:4px;line-height:1.3}
  .tipo-btn small b{color:#c2410c}
  .cp-tipo{font-size:14px;color:#777;font-weight:700}
  /* fila con exceso: se ve, no frena */
  table.t tr.demas td{background:#fff4e5}
  .demas-tag{display:inline-block;margin-top:4px;background:#c2410c;color:#fff;border-radius:999px;
    padding:3px 10px;font-size:14px;font-weight:800;white-space:nowrap}
  .esp{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .esp small{display:block;color:#777;font-size:13px;font-weight:700}

  .uni-tag.kg{background:#e6f0ff;color:#0b4aa2}
  .cell-in.big{font-size:20px;width:110px}

  .env-eq{display:block;margin-top:4px;color:#0b4aa2;font-size:14px;font-weight:800;white-space:nowrap}
  .alerta-box{margin:10px 0;border:2px solid #f4c08c;background:#fff4e5;border-radius:12px;padding:12px 14px;
    font-size:17px;color:#5c2d00;line-height:1.4}
  .alerta-box b{color:#8a3b00}
  input#fRemito{height:44px;border:2px solid #d0d7de;border-radius:8px;padding:0 10px;font-size:19px;width:150px}
  /* COLUMNAS SIN BLANCO MUERTO EN LA TABLET [usuario 2026-09-17: "optimizame todos los espacios en
     blanco que hay entre las columnas en todas las pantallas de envio a ps en la version tablet"].
     table.t viene a width:100% de gp2-modulo.css: con 3 o 4 columnas el navegador repartia el ancho
     sobrante y dejaba un desierto entre la pieza y su numero (el ojo tenia que cruzar media pantalla
     para leer una fila). Aca #tblBox (buscador + cartel + tabla) es inline-block: encoge hasta el
     ancho de la tabla, y la tabla al de su propio contenido. El .table-wrap sigue con su scroll
     propio para cuando no entra (celular, o muchas columnas). */
  #tblBox{display:inline-block;max-width:100%;vertical-align:top}
  .table-wrap{display:block;max-width:100%}
  table.t{width:100%}   /* 100% de #tblBox, que ya mide lo que mide el contenido */
  /* un poco mas de aire ADENTRO de cada columna, que es el unico blanco que suma: separa los
     numeros del borde sin volver a abrir el hueco entre columnas. */
  table.t th,table.t td{padding-left:12px;padding-right:12px}
  table.t td.num,table.t th.num{white-space:nowrap}
  /* la de Pieza es la unica que puede crecer: con techo, para que una descripcion larga no reabra
     el hueco; abajo del techo la descripcion envuelve en dos lineas. */
  table.t th:first-child,table.t td:first-child{max-width:340px}
  table.t td:first-child .sub{white-space:normal}
  /* ---- TARJETAS DE PARTE — Enviar → Prov. de servicio [usuario 2026-09-18: "quiero reemplazar
     ese listado por boxes o tarjetas individuales… al seleccionar una parte, debe abrirse una vista

  #tblBox.cards{display:block;width:100%}          /* la grilla usa el ancho entero, no el de la tabla */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}

    /* nada de la tarjeta se puede cortar: el texto largo baja de renglon en vez de irse afuera
       (pasaba con "Sugerido 13.272 uni · sin cajón cargado", que quedaba comido por el borde) */
    overflow-wrap:anywhere}
  .parte-card:hover{border-color:#111}
  .parte-card.cargada{border-color:#15803d;background:#f4fbf6}
  /* recibi de mas: avisa, no frena (mismo criterio que la fila de la tabla) */

  .parte-card.demas .pc-estado{color:#c2410c}
  .pc-demas{display:block;font-size:15px;font-weight:800;color:#c2410c}
  .pc-cod{font-size:23px;font-weight:900;line-height:1.1}
  .pc-desc{font-size:16px;font-weight:700;color:#444;line-height:1.25}
  /* el sugerido es EL dato de la tarjeta: grande y en naranja fuerte [usuario 2026-09-18:
     "quiero que en todos los box me aparezca el sugerido mas grande y de otro color mas
     llamativo"]. La aclaracion de al lado ("sin cajon cargado") queda chica y gris para que
     el numero no compita con ella; el naranja no choca con el verde del estado "envia N". */
  .pc-sug{font-size:21px;font-weight:900;color:#c2410c;line-height:1.2}
  /* EL ROTULO va en su propio renglon, chico y gris (2026-09-21): en Recibir pasó a ser "Stock
     prov. de servicio", y en 21px negrita se comia tres renglones de la tarjeta y le robaba la
     jerarquia al numero, que es lo que el operario tiene que leer de lejos. */
  .pc-sug .pc-rot{display:block;font-size:14px;font-weight:800;color:#777;letter-spacing:.4px}
  .pc-sug .pc-nota{font-size:14px;font-weight:700;color:#777}
  .pc-estado{margin-top:auto;padding-top:6px;font-size:17px;font-weight:800;color:#15803d}
  .parte-card:not(.cargada) .pc-estado{color:#9aa1a8}
  /* EL RÓTULO DEL RUBRO: parte la grilla del tallerista en bloques (crudo, procesado, remaches,
     plásticas, cajas, cartones). Ocupa el ancho entero de la grilla, así que en 390px —donde la
     grilla es de una sola columna— se ve igual, arriba de su primera tarjeta. */
  .pc-rubro{grid-column:1/-1;font-size:18px;font-weight:900;color:#0b4aa2;letter-spacing:.4px;

  .pc-rubro.primero{border-top:0;padding-top:0;margin-top:0}
  /* Ver O.C. (v1.37.0): arriba del buscador, sólo Enviar a talleristas O.C. / prov. AT */

  .oc-box td.num,.oc-box th.num{text-align:right;white-space:nowrap}
  /* la vista de UNA parte: el sugerido bien grande y un solo campo para la cantidad que se manda */
  #detBox{max-width:560px}
  .det-card{border:2px solid #d0d7de;border-radius:16px;background:#fff;padding:18px 20px;margin-top:10px}

  .det-sug{font-size:34px;font-weight:900;color:#0b4aa2;line-height:1.1;margin-top:2px}

  .det-in{font-size:30px;font-weight:900;height:64px;width:100%;max-width:300px;text-align:right;
    border:2px solid #111;border-radius:12px;padding:0 14px;font-family:inherit;margin-top:4px}
  .det-uni{font-size:20px;font-weight:800;color:#333;margin-left:8px}
  .det-eq{display:block;margin-top:6px;font-size:16px;font-weight:800;color:#0b4aa2}
  /* las dos unidades, en dos columnas: apiladas la vista queda larguisima y el campo, ancho al
     pedo [usuario 2026-09-18]. No envuelven: se achican, que a 390px sigue entrando. */
  .det-dos{display:flex;gap:12px;align-items:flex-end}
  .det-col{flex:1 1 0;min-width:0}
  .det-campo{display:flex;align-items:center;gap:6px}
  .det-dos .det-in{width:100%;max-width:none;min-width:0;font-size:26px;padding:0 10px}
  .det-dos .det-uni{margin-left:0;white-space:nowrap}
  /* lo anotado no coincide con lo que dicen los kg: avisa, no frena */
  .det-eq.mal{color:#c2410c}
  .det-falta{align-self:center;font-size:16px;font-weight:800;color:#c2410c}
  .parte-card.incompleta{border-color:#c2410c;background:#fff9f3}
  /* "➕ Otro cartón" y las filas que entran por ahí: se distinguen de las piezas propias del
     destino, que son las que salen de su receta/ruta [2026-09-21]. */
  .parte-card.otro{border-style:dashed;justify-content:center;align-items:center;text-align:center;color:#0b4aa2}
  .parte-card.otro .pc-cod{font-size:21px}

  .parte-card.sust{border-color:#0b4aa2;background:#f5f9ff}
  .pc-sust,.det-sust{font-size:15px;font-weight:800;color:#0b4aa2}

  /* el catálogo del reemplazo, adentro de la vista de la parte */
  .sust-lista{max-height:52vh;overflow:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
  .sust-item{display:block;width:100%;text-align:left;border:2px solid #d0d7de;border-radius:12px;

  .det-acc{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .det-acc .btn{min-height:52px;font-size:19px}
  @media (max-width:640px){
    .modo-btn{font-size:17px;min-height:56px}

</style>

<script>
"use strict";

var E = GP2EE;
var $ = GP2UI.$, esc = GP2UI.esc, num = GP2N.num, fmt = GP2N.fmt, hoyISO = E.hoyISO;
var SB = GP2_SB();

var D = { contrapartes: [], enviar: [], recibir: [], alertas_abiertas: 0 };
var MODO = null;        // enviar | recibir  (Conteo no es un modo: es el salto a Relevamientos)
var selTipo = null;     // la baldosa elegida (objeto de TIPOS), no el string del tipo
var selCP = null;       // { tipo, ref, nombre, id }
var detK = null;        // la parte abierta en la vista de carga (solo vista de tarjetas)
var BUF = E.buffer("gp2_tablet_buffer", function(){ return { q: "" }; });

/* ---------- CARTÓN SUSTITUTO (2026-09-21) ----------
   Cuando no hay stock del cartón que le toca a un artículo se le manda el de OTRO y se le pega
   encima la etiqueta del que corresponde. La fila del cartón mandado NO sale del bundle (no es una
   pieza de ese destino): se agrega acá, en memoria, y viaja con `sust_de` = el cartón oficial al
   que reemplaza. No se guarda en localStorage a propósito: igual que la cantidad, si el operario
   se va sin registrar, el reemplazo desaparece [misma regla que envSinMemoria]. */
var SUST = {};          // contraparte (c.id) -> filas agregadas a mano en esta sesión
var CATS = {};          // contraparte (c.id) -> { oficiales:[], otros:[] } de cartones_para_reemplazo
var sustSel = null;     // mientras se elige: null | { paso:1|2, x:<fila elegida> }

/* Los TIPOS de contraparte de cada modo, en el orden en que el operario los busca. El que trae
   `link` no se carga acá: abre la pantalla que ya hace ese trabajo, para no tener dos copias de
   la misma lógica.
   `clave` es el nombre del BOTÓN (data-tipo) cuando dos baldosas comparten el mismo tipo de la
   base, y `oc` parte esas dos por GP2.tallerista.pedido_por_oc_virgilio: sin `oc` la baldosa
   muestra a todas las contrapartes del tipo (así queda Recibir, que no se partió). */
var TIPOS = {
  enviar: [
    { tipo: "tallerista",         icono: "👷", titulo: "Talleristas",            sub: "lo que arman afuera", oc: false },
    { tipo: "proveedor_servicio", icono: "🏭", titulo: "Prov. de servicio",      sub: "pintan, niquelan, cortan" },
    { tipo: "inyector",           icono: "💉", titulo: "Inyectores",             sub: "bolsas plásticas" },
    { tipo: "proveedor_at",       icono: "📦", titulo: "Prov. de art. terminado", sub: "cartones y cajas" },
    /* ---------- TALLERISTAS O.C. (2026-09-23) — AL FINAL DEL GRUPO [usuario 2026-09-24: "Talleristas O.C. que aparezca al final"] ----------
       [usuario, con la foto de la Tablet: "a Blist-Pack SA y Carlos Aguirre quiero que me los
       saques afuera de talleristas y me los pongas en un módulo nuevo de talleristas o.c." + "No
       es o.c. de insumos. Es orden de compra que se hace desde Gestión Virgilio que hoy no está
       modelado acá. Por ahora sugerí 0"]. A estos dos no se les manda contra el máximo de la casa:
       lo que tienen que hacer sale de una O.C. que emite Gestión Virgilio, que GP2 todavía no lee.
       Por eso la base les manda el sugerido en 0 (mismo criterio que el fasonero sin O.C.) y acá se
       los separa para que nadie los confunda con un tallerista a façon. SOLO EN ENVIAR: en Recibir
       siguen adentro de Talleristas, que es donde se les registra lo que traen. */
    { tipo: "tallerista", clave: "tallerista_oc", oc: true,
      icono: "🧾", titulo: "Talleristas O.C.", sub: "la O.C. la hace Virgilio" }
  ],

/* La unidad con la que se CARGA cada fila. El contrato de tablet_registrar acepta 'uni' o 'kg';
   componente.unidad_medida dice 'kg' o 'unidad'. Desde que el prov. de art. terminado salió de
   Recibir (entrega en Virgilio, no acá) no queda nada que se cargue en CAJAS. */
function unidadDe(x){
  return String(x.um || "").toLowerCase() === "kg" ? "kg" : "uni";
}

/* ---------- LA UNIDAD DEL REMITO LA DICE LA PIEZA ----------
   [usuario 2026-09-23, textual: "Martin Cornejo. El remito de las bombillas en uni. Control en
   bolsas. El remito de la cuchilla en kg y control kg y cajones (cajones dato)"]. Dos piezas del
   MISMO tallerista vienen en unidades distintas: las bombillas se cuentan y la cuchilla se pesa.
   No lo dice ni el destino ni el sector: lo dice la pieza, en componente.remito_unidad ('uni' |
   'kg'), que tablet_bundle manda en cada fila de Recibir. Sin ese dato vale la unidad canónica
   (unidad_medida), que hoy es "unidad" en casi todo.
   Sólo manda al RECIBIR: es la unidad del PAPEL. Al enviar no cambia nada. */
function uniRemito(x){
  var r = String((x && x.remito_unidad) || "").toLowerCase();
  return (r === "kg" || r === "uni") ? r : unidadDe(x);
}
function inputmodeDe(u){ return u === "kg" ? "decimal" : "numeric"; }

/* ---------- EL CAJÓN DE REFERENCIA DE UNA FILA DE RECIBIR ----------
   En Recibir de un P.S. el "Esperado" NO es la pieza de la fila: es lo que el proveedor tiene en su
   poder, o sea la pieza que le MANDAMOS, contada en unidades de ESA pieza. Donde vuelve en el mismo
   cajón en el que salió, el envase con el que se mira tiene que ser el de la pieza enviada
   [usuario 2026-09-18, remaches de Guazzaroni: "si envío 2 cajones lo esperado es recibir 2 cajones
   aprox"]. QUIÉN ENTRA EN ESA REGLA LO DECIDE LA BASE: tablet_bundle manda ent_uxc / ent_kgu solo
   en esas filas (hoy el sector Remache) y acá alcanza con preferirlas cuando vienen. Sin ellas
   (todo el resto) queda el cajón de la pieza devuelta, que es como estaba.
   Y EL CAJÓN QUE MANDA ES EL QUE ANOTÓ LOGÍSTICA (ent_uxc_anot, 2026-09-21): el cajón teórico del
   maestro es un promedio, el que salió del galpón pesó lo que pesó. CV1 salió como 1 cajón de 21 kg
   contra un uni_x_cajon de 20 kg y la tarjeta decía 1,05 cajones [usuario: "tiene que aparecer en
   su stock los cajones que escribe logística, no los que se calcula a partir de los kg"]. */
function uxcRef(x){
  var a = Number((x && x.ent_uxc_anot) || 0);
  if (MODO === "recibir" && a > 0) return a;
  var e = Number((x && x.ent_uxc) || 0);
  return (MODO === "recibir" && e > 0) ? e : Number((x && x.uxc) || 0);
}
function kguRef(x){
  var e = Number((x && x.ent_kgu) || 0);
  return (MODO === "recibir" && e > 0) ? e : Number((x && x.kg_x_uni) || 0);
}
function uniTag(u){ return '<span class="uni-tag ' + u + '">' + u + "</span>"; }

/* clave de fila: en recibir una pieza puede aparecer dos veces (dos entradas distintas del PS), y
   en enviar un mismo cartón puede ir como reemplazo de dos oficiales distintos (sust_de). */
function claveDe(x){
  return String(x.comp_id || "") + ":" + String(x.comp_entrada_id || "") + ":" + String(x.cod_art || "") +
         (x.sust_de ? ":s" + x.sust_de : "");
}
function claveCP(c){ return MODO + ":" + c.tipo + ":" + c.ref; }

/* En Enviar tienen sugerido: PS y talleristas (máximo − stock − lo que ya está en el destino) y los
   INYECTORES (bolsas de resina en kg = Σ deficit de las partes plásticas × kg_x_uni). El PROV. DE
   ART. TERMINADO también muestra el renglón, pero su sugerido es SIEMPRE 0: igual que el tallerista
   con O.C. de Virgilio, lo que hay que mandarle no sale del máximo de la casa sino de una O.C. que
   emite Gestión Virgilio y que GP2 no lee [usuario 2026-09-24: "no tienen un máximo allá... tiene
   que aparecer en cero... cuando salga orden de compra de Virgilio"]. DA VUELTA el 2026-09-23, que
   le había puesto consumo × meses (esa CTE queda dormida en la base).
   POR QUÉ EL PROV. AT PREGUNTA POR LA FILA y los otros no: el cartón de OTRO artículo que se manda
   como reemplazo (sust_de) viene con sugerido null y ahí la tarjeta vuelve a "Online sector" — un 0
   que no es un dato se lee como "no hay que mandarle nada". La fila normal del prov AT trae 0. */
function envConSugerido(x){
  if (MODO !== "enviar" || !selCP) return false;
  if (selCP.tipo === "proveedor_at") return !x || x.sugerido != null;
  return selCP.tipo === "proveedor_servicio" || selCP.tipo === "tallerista" || selCP.tipo === "inyector";
}

/* La tablet NO se acuerda de lo tipeado en Enviar a P.S. / inyector: si se sale sin registrar, la
   cantidad desaparece [usuario 2026-09-18, textual: "si cargue algo yo, cuando salgo quiero que
   desaparezca, no que se guarde, por lo tanto todas las cantidades deben estar vacias"]. El buffer
   de localStorage se sigue usando mientras la contraparte esta abierta (es de donde sale lo que se
   registra y lo que sobrevive a un toque de mas), pero se borra al ENTRAR y al SALIR: nunca queda
   un numero de ayer esperando que alguien lo registre sin mirar. Desde el 2026-09-18 vale TAMBIEN
   para los TALLERISTAS `[usuario, elegido entre tres opciones: "igual que P.S.: vacio y sin
   memoria"]`: con eso ya no queda nadie con la cantidad precargada. */
function envSinMemoria(c){
  // los cuatro destinos de Enviar: P.S., inyector, tallerista y prov. de art. terminado. O sea que
  // en Enviar ya no queda tabla ni memoria en ningun lado [usuario 2026-09-18].
  return MODO === "enviar" && !!c &&
    (c.tipo === "proveedor_servicio" || c.tipo === "inyector" ||
     c.tipo === "tallerista" || c.tipo === "proveedor_at");
}
function olvidarCargado(c){
  if (envSinMemoria(c)) { BUF.borrar(c.id); delete SUST[c.id]; }
}

/* Unidad de ENVIO del proveedor (display), p.ej. AJ Adhesivos manda de a PAQUETES de 100 pliegos
   [usuario 2026-09-17]. Solo presentacion: sugerido y cantidad se MUESTRAN/CARGAN divididos por
   factor y rotulados con label, pero al registrar se multiplica de nuevo y se guarda en la unidad
   canonica (uni/kg). Devuelve {factor,label} si el proveedor lo definio (envio_uni_x>1), o null. */
function packEnvio(){
  if (!selCP) return null;   // es del PROVEEDOR: en Recibir la entrega copia esta misma unidad
  var lab = String(selCP.envio_unidad || "");
  // envio_unidad='kg' es el envío POR PESO (Hernandez Julio), que tiene su propio camino
  // (pesoEnvio/bultoDe): ahí el bulto va en una columna aparte, no es la unidad del sugerido.
  if (!lab || lab.toLowerCase() === "kg") return null;
  var f = Number(selCP.envio_uni_x || 0);
  // cargaKg: el sugerido se MIRA en el envase pero la cantidad se ESCRIBE en kg (Ester,
  // Guazzaroni). Sin esto (AJ Adhesivos) el campo va en la misma unidad que el sugerido.
  var ckg = String(selCP.envio_carga_unidad || "").toLowerCase() === "kg";
  // SIN factor del proveedor el envase es el CAJÓN de CADA PIEZA (Guazzaroni Patricio): el factor
  // sale de componente.uni_x_cajon fila por fila, igual que el bulto de Julio. Solo tiene sentido
  // cargando en kg (si no, no habría con qué pasar del cajón a lo que se escribe).
  if (!(f > 1)) return ckg ? { factor: 0, label: lab, cargaKg: true, porPieza: true } : null;
  return { factor: f, label: lab, cargaKg: ckg, porPieza: false };
}

/* ---------- EL ENVASE DE UNA PIEZA ----------
   Con qué se manda ESA pieza a ESTE destino: {factor, label, cargaKg, redondea} o null (= va en
   unidades, no se inventa un envase). Junta las dos formas que conviven:
     · P.S.: lo dice el PROVEEDOR (packEnvio). Con envase por pieza (Guazzaroni, Jade y los otros
       que van por el cajón de cada pieza) el factor sale de componente.uni_x_cajon fila por fila.
     · TALLERISTA y PROV. DE ART. TERMINADO: lo dice la PIEZA, y lo manda la base en cada fila del
       bundle [usuario 2026-09-18]: cartón y caja en PAQUETES (el paquetón del formato / los 25 de
       la caja) y el resto con el sugerido en CAJONES y la cantidad en KG. Ver env_unidad /
       env_factor / env_carga en tablet_bundle.
   El redondeo del renglon de equivalencia NO vive aca: es uno solo para todos (textoEnvases). */
function envaseDe(x){
  if (!selCP || !x) return null;
  if (MODO === "recibir") {
    // ENTREGA DE UN TALLERISTA: el remito va en la unidad de la PIEZA, igual que el del P.S.
    // [usuario 2026-09-23: "Ahora seguimos con las recepciones de talleristas. Lucho. Remito en
    // unidades y control en kg y cajones"]. Lo que se carga acá es lo que dice el papel; el kilo y
    // el cajón se cuentan en el control. Da vuelta la v1.19.0 (esperado en cajones, cantidad en kg)
    // por el mismo motivo que la del P.S.: esa regla es de antes de que el control fuera un paso
    // aparte. componente.entrega_unidad / entrega_uni_x (las bolsas de 120 de GRJ5 y GRJ6) no se
    // borran: son el envase con el que se va a contar en el control.
    if (selCP.tipo === "tallerista") return null;
    // ENTREGA de un P.S.: VA EN UNIDADES, SIN ENVASE. Lo que se carga acá es EL REMITO, y el remito
    // del proveedor viene contado en unidades de la pieza; el envase (bolsas, paquetes, cajones) y
    // los kilos son del CONTROL, que es la pantalla siguiente [usuario 2026-09-23, dicho sobre cinco
    // proveedores distintos: "cuando voy a recibir de AJ adhesivos el remito marca en unidades de
    // pliego y después cuando voy a controlar sí, marco paquetes"; lo mismo con Ester ("en el remito
    // aparece en unidades y después el control si lo hago en bolsas y kilos"), Hernández Julio, Jade
    // y Maspoli]. DA VUELTA la regla de v1.20.0, que hacía que la entrega copiara la unidad del
    // envío: esa regla es de ANTES de que el control fuera una pantalla aparte (v1.28.0), cuando lo
    // que se cargaba acá era lo contado. Las columnas proveedor_servicio.entrega_unidad /
    // entrega_uni_x NO se tocaron: las sigue usando ControlEntregaPS_GP2.html, que es su lugar.
    // El TALLERISTA queda como estaba (arriba): ahí no hay pantalla de control y el usuario pidió
    // expresamente cajones + kg el 2026-09-18.
    return null;
  }
  if (MODO !== "enviar") return null;
  // tallerista y prov. de art. terminado: la unidad la trae la PIEZA en el bundle. El prov. AT
  // recibe solo cartones y cajas, asi que para el siempre son PAQUETES.
  if (selCP.tipo === "tallerista" || selCP.tipo === "proveedor_at") {
    var ft = Number(x.env_factor || 0);
    if (!x.env_unidad || !(ft > 0)) return null;   // pieza sin paquete / sin cajón cargado
    return { factor: ft, label: String(x.env_unidad),
             cargaKg: String(x.env_carga || "") === "kg" };
  }
  var pk = packEnvio();
  if (!pk) return null;
  var f = pk.porPieza ? Number(x.uxc || 0) : pk.factor;
  if (!(f > 0)) return null;
  return { factor: f, label: pk.label, cargaKg: pk.cargaKg };
}

/* Cuantos KG entran en UN envase de esta pieza. Si la pieza se cuenta en unidades, el envase son
   factor x kg_x_uni (Ester: 1800 x 0,0054 = 9,72 kg); si la pieza ya se mide en kg, el factor YA
   esta en kg. 0 = no se puede saber (a la pieza le falta kg_x_uni). */
function kgPorEnvase(x){
  var ev = envaseDe(x);
  if (!ev) return 0;
  if (unidadDe(x) === "kg") return ev.factor;
  var k = kguRef(x);
  return k > 0 ? ev.factor * k : 0;
}
/* true si la CANTIDAD de esta pieza se escribe en kg. Pide las dos cosas: que el envase lo diga y
   que la pieza permita pasar del envase a kg. Si no, cae al modo de AJ (se escribe en el envase) o
   a unidades, en vez de mostrar un kg inventado. */
function cargaEnKg(x){
  // al RECIBIR lo dice la pieza (remito_unidad): la cuchilla de Martín viene pesada y la bombilla
  // contada. Sin kg_x_uni no se puede pasar de kg a unidades, así que ahí no se escribe en kg.
  if (MODO === "recibir")
    return uniRemito(x) === "kg" && unidadDe(x) !== "kg" && kguRef(x) > 0;
  var ev = envaseDe(x);
  return !!(ev && ev.cargaKg && kgPorEnvase(x) > 0);
}
/* El "= N bolsas" que va debajo del campo cuando la cantidad se carga en kg. El número va tal
   cual, con decimales (textoEnvases): el envase se parte. */
function equivEnvase(kg, kgEnv, label){
  // campo vacío = nada que equivaler: un "= 0 cajones" debajo de un campo en blanco es ruido
  // (desde que la cantidad no se precarga, el campo arranca vacío en todos los P.S.).
  if (!(Number(kg || 0) > 0)) return "";
  return textoEnvases((kgEnv > 0) ? (Number(kg || 0) / kgEnv) : 0, label);
}

/* EL EQUIVALENTE EN ENVASES VA CON DECIMALES [usuario 2026-09-18, textual: "no quiero que
   redondees las bolsas, cajones -> lo quiero ver con decimales también"]. Esto DA VUELTA la regla
   de la mañana del mismo día ("todo lo que sea envio de cajones y bolsas redondear… 6,17 serían 6
   bolsas"): lo que se muestra ahora es el número exacto, 2 decimales, sin "≈" y sin el "menos de 1
   bolsa" en palabras (un "0,69 bolsas" dice más que la frase).
   OJO: esto es para lo que SE ENVÍA. El SUGERIDO sigue yendo para arriba (techo) — es "lo que
   falta", y pedir menos de lo que falta no llena el lugar [usuario 2026-09-17, Ester]. */
function textoEnvases(n, label){
  if (!(n > 0)) return "";
  var et = (Math.abs(n - 1) < 0.005) ? singularEnvase(label) : label;   // "= 1 cajon", no "= 1 cajones"
  return "= " + fmt(n, 2) + " " + et;
}
function singularEnvase(label){ return SINGULAR[label] || label; }

/* Envio POR PESO: el proveedor recibe pesado (hoy Hernandez Julio). Se marca con
   proveedor_servicio.envio_unidad='kg' SIN envio_uni_x, porque acá el bulto no es uno solo para
   todo el proveedor como en AJ: cambia por pieza (ver bultoDe). */
function pesoEnvio(){
  if (!selCP) return false;
  return String(selCP.envio_unidad || "").toLowerCase() === "kg" && !(Number(selCP.envio_uni_x) > 1);
}

/* El BULTO de una pieza cuando se manda por peso: las partes plásticas van en BOLSAS y el resto en
   CAJONES. El tamaño del bulto es componente.uni_x_cajon en los dos casos (en los plásticos esa
   columna ES el tamaño de la bolsa). Sin kg_x_uni no hay conversión: devuelve null y la fila se
   carga como siempre, en unidades. */
function bultoDe(x){
  var kgu = kguRef(x), uxc = uxcRef(x);
  if (!(kgu > 0)) return null;
  var plast = /pl[aá]stico/i.test(String((x && x.sector) || ""));
  return { kgu: kgu, uxc: uxc > 0 ? uxc : 0, label: plast ? "bolsas" : "cajones" };
}
/* Lo que se ANOTA en movimiento.cajones es el mismo número que se ve abajo del campo: con
   decimales [usuario 2026-09-18]. Se redondea a 2 decimales y nada más, para no guardar un
   0,6899999. Media bolsa deja de perderse: antes, con el entero, 0,4 bolsas se anotaban como 0
   (o sea null) y 1,4 como 1. */
function bultosDeKg(b, kg){
  return (b && b.uxc > 0 && kg > 0) ? redEnvase(kg / b.kgu / b.uxc) : null;
}
function redEnvase(n){ return Math.round(Number(n || 0) * 100) / 100; }
/* los envases crudos (con decimales) de esos kg, para el texto del renglón */
function envasesDeKg(b, kg){
  return (b && b.uxc > 0 && kg > 0) ? (kg / b.kgu / b.uxc) : null;
}
/* el sugerido de la pieza (que viene en unidades) llevado a bultos enteros */
function bultosSugeridos(b, sugUni){
  return (b && b.uxc > 0 && sugUni > 0) ? Math.ceil(sugUni / b.uxc) : null;
}

/* ---------- la vista de TARJETAS (Enviar → Prov. de servicio) ----------
   [usuario 2026-09-18: "quiero reemplazar ese listado por boxes o tarjetas individuales… al
   seleccionar una parte, debe abrirse una vista donde se muestre la cantidad sugerida y un campo
   para indicar la cantidad efectiva que se va a enviar"]. Vale para P.S. e inyector (que se elige
   adentro del mismo botón "Prov. de servicio"), que es justo el conjunto que ya no se acuerda de
   lo tipeado: la misma cuenta de envSinMemoria. Talleristas, prov. de art. terminado y TODO
   Recibir siguen con la tabla — ahí hay esperado, exceso y remito, y se leen de corrido. */
function vistaTarjetas(){
  // en Enviar, los cuatro destinos; en Recibir, el tallerista y el P.S. [usuario 2026-09-18:
  // "quiero que tambien aparezcan las partes en box... en vez de sugerido y cantidad, va a ser
  // esperado y cantidad"]. Ojo: en Recibir la tablet SI se acuerda de lo tipeado (envSinMemoria
  // es solo de Enviar): lo que cambia aca es como se ve, no la memoria.
  return envSinMemoria(selCP) ||
    (MODO === "recibir" && !!selCP &&
     (selCP.tipo === "tallerista" || selCP.tipo === "proveedor_servicio"));
}

/* El SUGERIDO de una pieza tal como se muestra, en la unidad de envío del proveedor. Lo usan la
   tabla y la tarjeta, así no hay dos cuentas que se puedan separar:
     txt   el número ya formateado          uni   su unidad (paquetes, bolsas, cajones, kg, uni)
     nota  la aclaración cuando no se puede  small lo que la TABLA pinta en su <small> */
function sugeridoInfo(x){
  var b = (MODO === "enviar" && pesoEnvio()) ? bultoDe(x) : null;
  var u = unidadDe(x);
  if (b) {
    // por peso el sugerido se mira EN BULTOS enteros, no en kilos [usuario 2026-09-17]
    var sugB = bultosSugeridos(b, Number(x.sugerido));
    var faltaB = "sin " + (b.label === "bolsas" ? "bolsa" : "cajón") + " cargado";
    return { txt: fmt(sugB, 0, "—"), num: sugB, uni: sugB != null ? b.label : "",
             nota: sugB != null ? "" : faltaB, small: sugB != null ? b.label : faltaB };
  }
  var ev = envaseDe(x);
  var sug = x.sugerido;
  if (ev && x.sugerido != null) sug = Math.ceil(Number(x.sugerido) / ev.factor);
  // el destino manda por envase pero ESTA pieza no lo tiene cargado: no se inventa el factor, la
  // fila queda en unidades (sugerido y campo) y se avisa para que no se lea como cajones.
  var falta = faltaEnvase(x);
  return { txt: fmt(sug, (!ev && u === "kg") ? 2 : 0, "—"),
           num: sug,
           uni: ev ? ev.label : u,
           nota: falta,
           small: falta ? (u + " · " + falta) : "" };
}

/* El aviso cuando el destino manda por envase y a la pieza le falta el dato para convertir:
   sin uni_x_cajon no hay cajón, sin el paquetón del formato no hay paquete. Vacío = no aplica. */
function faltaEnvase(x){
  if (MODO !== "enviar" || !selCP || !x || envaseDe(x)) return "";
  // La pieza que se mide en kg (el fleje) SE MANDA PESADA, no hay cajón que le falte: el sugerido
  // ya sale en kg, así que "sin cajón cargado" era mentira [usuario 2026-09-24, sobre el envío en
  // la tablet: "cuando es sector fleje no quiero esa aclaración, no tienen uni x cajón, se manda en
  // kilos"]. El aviso queda para la pieza que SE CUENTA y caería a unidades sin el factor.
  if (unidadDe(x) === "kg") return "";
  // el prov. AT va con el mismo aviso que el tallerista: los dos reciben la pieza con el envase que
  // dice la PIEZA (paquetón del cartón / los 25 de la caja), no con uno del proveedor [2026-09-23].
  if (selCP.tipo === "tallerista" || selCP.tipo === "proveedor_at")
    return x.env_unidad
      ? ("sin " + (String(x.env_unidad) === "paquetes" ? "paquete" : "cajón") + " cargado")
      : "";
  var pk = packEnvio();
  return (pk && pk.porPieza) ? "sin cajón cargado" : "";
}

/* COMO SE LLAMA EL NUMERO DE REFERENCIA DE RECIBIR. No es "lo que calculamos que va a traer":
   es EL STOCK QUE LA CONTRAPARTE TIENE EN SU PODER, y asi se lee mejor en la tablet
   [usuario 2026-09-21, textual: "en vez de esperado quiero que diga Stock tallerista o stock
   proveedor de servicio segun corresponda"]. El que no es ninguno de los dos (Virgilio) sigue
   diciendo "Esperado": ahi el numero es el online de Virgilio y nadie pidio cambiarlo. */
function rotuloRef(){
  if (!selCP) return "Esperado";
  if (selCP.tipo === "tallerista") return "Stock tallerista";
  if (selCP.tipo === "proveedor_servicio") return "Stock prov. de servicio";
  return "Esperado";
}

/* EL NUMERO DE REFERENCIA de la tarjeta y de la vista de la parte: el SUGERIDO donde lo hay (P.S.,
   tallerista, inyector y —desde el 2026-09-23— el prov. de art. terminado) y el ONLINE DEL SECTOR
   cuando la fila no trae sugerido: el cartón de otro artículo que se manda como reemplazo, o una
   base todavía sin la migración del consumo del prov AT. Ahí la referencia es lo que hay en
   Cervantes para mandarle. Devuelve el mismo {rotulo, txt, num, uni, nota} para los dos, así la
   tarjeta no sabe de la diferencia. */
function refInfo(x){
  if (MODO === "recibir") {
    // ESPERADO: lo que la base cree que el tallerista tiene para entregar, mirado en CAJONES (o en
    // las bolsas de 120 de GRJ5/GRJ6). Se dice con el mismo criterio que el resto de los envases:
    // el numero exacto, con decimales. [usuario 2026-09-18]
    var ev = envaseDe(x), u = unidadDe(x), rot = rotuloRef();
    if (x.esperado == null)
      return { rotulo: rot, txt: "—", num: null, uni: "", nota: "sin referencia", small: "" };
    var e = Number(x.esperado);
    if (ev) {
      // SIN STOCK SE DICE "0", no se deja en blanco [usuario 2026-09-21: "pero que me diga 0 si no
      // tiene stock"]. textoEnvases() devuelve "" cuando el numero no es > 0 — y eso esta BIEN
      // donde se usa para el renglon de equivalencia de abajo del campo (con el campo vacio no se
      // escribe nada), pero aca dejaba la tarjeta diciendo "Stock tallerista" y ningun numero, que
      // se lee como "no se". Para el tallerista y el P.S. el cero es un dato de verdad: la base lo
      // manda con coalesce(...,0), o sea que 0 significa "no tiene nada nuestro en su poder".
      var env = e / ev.factor;
      return { rotulo: rot,
               txt: env > 0 ? textoEnvases(env, ev.label).replace("= ", "")
                            : ("0 " + ev.label),
               num: null, uni: "", nota: "", small: "" };
    }
    // el stock del tercero se muestra EN LA UNIDAD DEL REMITO: si esa pieza viene pesada (la
    // cuchilla de Martín), el saldo en unidades no se puede comparar con lo que dice el papel.
    var uR = uniRemito(x), eR = cargaEnKg(x) ? e * kguRef(x) : e;
    return { rotulo: rot, txt: fmt(eR, uR === "kg" ? 2 : 0), num: eR, uni: uR,
             nota: faltaEnvase(x), small: "" };
  }
  // el cartón de OTRO artículo no tiene sugerido (no es una pieza de este destino, no hay consumo
  // suyo que lo pida): la referencia útil es lo que hay en Cervantes para mandarle.
  if (envConSugerido(x) && !x.sust_de) {
    var si = sugeridoInfo(x);
    si.rotulo = "Sugerido";
    return si;
  }
  var u = unidadDe(x);
  return { rotulo: "Online sector", txt: fmt(x.online_sector, u === "kg" ? 2 : 0, "—"),
           num: Number(x.online_sector), uni: u, nota: faltaEnvase(x), small: "" };
}

/* La unidad con la que se ESCRIBE la cantidad de esa pieza (la del campo, no la de la pieza). */
function uniCarga(x){
  if ((pesoEnvio() && bultoDe(x)) || cargaEnKg(x)) return "kg";   // pesoEnvio ya exige Enviar
  var ev = envaseDe(x);
  if (ev) return ev.label;
  return MODO === "recibir" ? uniRemito(x) : unidadDe(x);
}
function decDe(x){ return uniCarga(x) === "kg" ? 2 : 0; }

/* "1 cajones" no se lee: con uno va el singular. Solo toca las etiquetas que usamos. */
var SINGULAR = { cajones: "cajón", paquetes: "paquete", bolsas: "bolsa", cajas: "caja" };
function unidadTxt(n, label){
  return (Number(n) === 1 && SINGULAR[label]) ? SINGULAR[label] : label;
}

/* ---------- LAS DOS UNIDADES DE UNA FILA QUE SE MANDA PESADA ----------
   [usuario 2026-09-18, textual: "en cantidad a enviar tengo que poder poner cajones primero y
   despues los kg. Lo mismo con lo que se envía en bolsas… que no pueda poner listo hasta que haya
   cargado en las dos unidades de medida"]. Vale para toda fila de ENVIAR que tenga envase Y se
   escriba en kg: el bulto por sector (Hernandez Julio) y el envase del proveedor o de la pieza
   (Ester, los del cajón por pieza, los talleristas). Devuelve {label, kgEnv} — cuántos kg entra
   UN envase — o null si la fila no lleva las dos.
   Por qué se anotan las dos y no se calcula una: el envase que sale por la puerta es el que el
   operario cuenta, y el peso es el que pesa la balanza. Si se calculaba uno de los dos, el error
   de carga quedaba invisible; ahora los dos se declaran y la pantalla los cruza. */
function envaseDoble(x){
  if (MODO !== "enviar" || !x) return null;
  var b = pesoEnvio() ? bultoDe(x) : null;
  if (b) return (b.uxc > 0 && b.kgu > 0) ? { label: b.label, kgEnv: b.uxc * b.kgu } : null;
  if (!cargaEnKg(x)) return null;
  var k = kgPorEnvase(x), ev = envaseDe(x);
  return (k > 0 && ev) ? { label: ev.label, kgEnv: k } : null;
}

/* ¿Lo anotado en envases se pelea con lo que dicen los kg? LA TOLERANCIA ES EL ENVASE ENTERO de
   arriba y el de abajo: si los kg dan 2,5 bolsas, anotar 2 o 3 esta bien; si dan 2 justas, anotar 3
   ya no. Cierra con los dos ejemplos del usuario [2026-09-18: "si tengo 10k que equivalen a 2
   bolsas y puse 3 que me salte alerta… si 10kg eran 2 bolsas y media y puse 2, que no salte"] y no
   se rompe en el borde: con "media unidad" pelada, 3,49999 contra 4 (un caso real, porque el kg por
   envase casi nunca da redondo) avisaba por una millonesima. null = no hay desvío. */
function desvioEnvase(x, it){
  var ed = envaseDoble(x);
  if (!ed) return null;
  var c = num(it.c), q = num(it.q);
  if (!(c > 0) || !(q > 0)) return null;
  var calc = q / ed.kgEnv;
  var min = Math.floor(calc + 1e-9), max = Math.ceil(calc - 1e-9);
  return (c < min || c > max) ? { label: ed.label, anotado: c, calc: calc } : null;
}

/* Una fila esta LISTA cuando tiene cantidad y, si lleva las dos unidades, las dos. */
function filaCompleta(x, it){
  if (!x || !it || !(num(it.q) > 0)) return false;
  return !envaseDoble(x) || num(it.c) > 0;
}

/* El renglon chico de abajo del campo de kg cuando se anotan las dos unidades. */
function chequeoDoble(x, it){
  var ed = envaseDoble(x);
  if (!ed) return { txt: "", mal: false };
  var q = num(it.q);
  if (!(q > 0)) return { txt: "", mal: false };
  var eqtxt = textoEnvases(q / ed.kgEnv, ed.label);
  var d = desvioEnvase(x, it);
  if (!d) return { txt: eqtxt, mal: false };
  return { mal: true, txt: "\u26a0 " + fmt(q, 2) + " kg son " + eqtxt.replace("= ", "") +
           " y anotaste " + fmt(d.anotado, 0) + " " + unidadTxt(d.anotado, ed.label) };
}

/* la pieza abierta en la vista de una parte */
function piezaDe(k){
  var arr = piezasDe(selCP);
  for (var i = 0; i < arr.length; i++) if (claveDe(arr[i]) === k) return arr[i];
  return null;
}


/* EL RENGLÓN CHICO DE DEBAJO DEL CAMPO DE KG: a cuántos envases equivale lo tipeado. Es UNO SOLO
   para las dos formas que se cargan en kg, así el operario ve siempre lo mismo [usuario 2026-09-18,
   textual: "esta bien que me lo ponga chiquito abajo, pero modifica hernandez julio asi quedan
   todos asi"]:
     · envase del PROVEEDOR — Ester (bolsas de 1800) y los que van por el cajón de cada pieza
       (Guazzaroni, Jade, FAAT, Mabra, Maspoli, Pedernera, Scorrano);
     · envío POR PESO — Hernandez Julio, donde el bulto lo pone el SECTOR de la pieza (plásticos
       bolsas, el resto cajones) y va con TECHO: un bulto no se parte.
   null = esta fila no lleva renglón (no hay con qué convertir y no se inventa el factor). */
function eqFila(x, q){
  var b = (MODO === "enviar" && pesoEnvio()) ? bultoDe(x) : null;
  if (b) {
    var n = envasesDeKg(b, q);
    return n != null ? textoEnvases(n, b.label) : "";
  }
  var ev = envaseDe(x);
  return cargaEnKg(x) ? equivEnvase(q, kgPorEnvase(x), ev.label) : null;
}

/* ---------- carga ---------- */
async function cargar(){
  try {
    var r = await SB.rpc("tablet_bundle");
    if (r.error) throw r.error;
    D = r.data || D;
    BUF.load();
    var m = new URLSearchParams(location.search).get("modo");
    var guardado = null;
    try { guardado = localStorage.getItem("gp2_tablet_modo"); } catch(e){}
    setModo(m || guardado || "enviar");
  } catch(e){
    $("status").innerHTML = '<span style="color:#b91c1c">Error: ' + esc(e.message || e) + "</span>";
  }
}

function setModo(m){
  if (m !== "enviar" && m !== "recibir") m = "enviar";
  olvidarCargado(selCP);   // antes de cambiar MODO: despues envSinMemoria ya mira el modo nuevo
  MODO = m;
  try { localStorage.setItem("gp2_tablet_modo", m); } catch(e){}
  var bs = document.querySelectorAll("#modos .modo-btn");
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("active", bs[i].dataset.modo === m);
  // el Control es de lo que TRAEN: en Enviar no hay nada que controlar (v1.39.0)
  var lc = $("lnkControl"); if (lc) lc.classList.toggle("hidden", m !== "recibir");
  mostrarTipos();
}

/* contrapartes que aplican al modo. En enviar, sólo a quien se le manda desde Cervantes.
   En recibir queda afuera el prov. de art. terminado (entrega en Virgilio) y el prov. de
   insumos, que tiene su propia pantalla con rubros, pesaje y cruce contra OC. */
function cpsDelModo(){
  return (D.contrapartes || []).filter(function(c){
    if (MODO === "enviar") return c.tipo !== "virgilio" && c.tipo !== "proveedor_insumo" && Number(c.n_env) > 0;
    return c.tipo !== "proveedor_at" && c.tipo !== "proveedor_insumo" && Number(c.n_rec) > 0;
  });
}
/* Las contrapartes de UNA baldosa (el objeto de TIPOS, no el string): el tipo de la base y, cuando
   la baldosa lo define, el lado del flag `oc` (tallerista con O.C. de Virgilio o sin ella). */
function cpsDelTipo(t){
  // Los INYECTORES tienen su propio boton, NO van adentro de "Prov. de servicio" [usuario
  // 2026-09-18]. En la base son proveedor_insumo/inyector (no proveedor_servicio) y el envio de
  // bolsas lo sigue ruteando tablet_registrar a enviar_material_inyector: lo unico que cambio es
  // donde se los elige.
  return cpsDelModo().filter(function(c){
    if (c.tipo !== t.tipo) return false;
    // una baldosa sin `oc` no parte nada: se queda con todas las del tipo (Recibir, P.S., etc.)
    return t.oc === undefined || !!c.oc === t.oc;
  });
}
/* la contraparte como la espera el resto de la pantalla (id = clave del buffer) */
function cpItem(c){
  return { id: claveCP(c), tipo: c.tipo, ref: c.ref, nombre: c.nombre, oc: !!c.oc,
           envio_unidad: c.envio_unidad, envio_uni_x: c.envio_uni_x,
           envio_carga_unidad: c.envio_carga_unidad,
           entrega_unidad: c.entrega_unidad, entrega_uni_x: c.entrega_uni_x,
           n: MODO === "enviar" ? c.n_env : c.n_rec };
}
function cargadasDeCP(c){
  return E.cargadasDe(BUF.all[claveCP(c)], function(it){ return num(it.q) > 0; }).length;
}
/* El contador "⚠ N alertas de recepción sin revisar" se SACÓ de la Tablet [Thomas 2026-09-25:
   "Que no aparezcan más alertas"]. Las alertas se siguen generando y se revisan en
   Alertas/alertas_GP2.html; el aviso "recibí de más" al cargar una recepción sigue igual. */
function avisoAlertas(){ return ""; }

/* ---------- paso 1: el tipo ---------- */
function mostrarTipos(){
  olvidarCargado(selCP);
  cerrarDetalle();
  selTipo = null; selCP = null;
  E.mostrarFase(0);
  $("tipoGrid").classList.remove("hidden");
  $("cpBox").classList.add("hidden");
  $("btnVolverTipo").classList.add("hidden");
  $("fase0Title").textContent = MODO === "enviar" ? "¿A quién le enviás?" : "¿Quién trae?";
  pintarTipos();
}

function pintarTipos(){
  var g = $("tipoGrid");
  g.innerHTML = "";
  (TIPOS[MODO] || []).forEach(function(t){
    var lista = t.link ? null : cpsDelTipo(t);
    if (lista && !lista.length) return;   // un tipo sin contrapartes no se dibuja: no lleva a nada
    var b = document.createElement(t.link ? "a" : "button");
    if (t.link) b.href = t.link; else b.type = "button";
    b.className = "tipo-btn";
    b.dataset.tipo = t.clave || t.tipo;   // dos baldosas del mismo tipo (Talleristas / O.C.) no comparten el data-tipo
    // el número sin la palabra "contraparte": el título del tipo ya dice qué son. NO se muestra
    // "N sin registrar" [usuario 2026-09-16]: desde que Enviar precarga el sugerido, abrir una
    // contraparte ya llenaba el buffer y el cartelito contaba destinos sin trabajo real.
    b.innerHTML = '<span class="ti">' + t.icono + " " + esc(t.titulo) + "</span><small>" + esc(t.sub) +
      (lista ? " · " + lista.length : "") + "</small>";
    if (!t.link) b.addEventListener("click", function(){ elegirTipo(t); });
    g.appendChild(b);
  });
  $("status").textContent = avisoAlertas();
}

/* ---------- paso 2: la contraparte de ese tipo ---------- */
function elegirTipo(t){
  selTipo = t;                      // la BALDOSA entera: el tipo solo ya no alcanza para volver
  var lista = cpsDelTipo(t);
  if (lista.length === 1) { elegir(cpItem(lista[0])); return; }  // un solo destino: no se elige entre uno
  $("tipoGrid").classList.add("hidden");
  $("cpBox").classList.remove("hidden");
  $("btnVolverTipo").classList.remove("hidden");
  $("fase0Title").textContent = t.titulo;
  $("q0").value = "";
  pintarCPS();
}

function pintarCPS(){
  var lista = E.filtrar(cpsDelTipo(selTipo), $("q0").value, function(c){ return c.nombre; });
  E.gridContrapartes("cpGrid", lista.map(cpItem), {
    vacio: "No hay a quién en este modo.",
    meta: function(c){
      // el tipo no se repite en cada chip: ya lo dice el título de arriba
      var cargado = E.cargadasDe(BUF.all[c.id], function(it){ return num(it.q) > 0; }).length;
      return c.n + " pieza" + (c.n === 1 ? "" : "s") +
        (cargado ? (" · <b>" + cargado + " cargadas</b>") : "");
    },
    onPick: elegir
  });
  var av = avisoAlertas();
  $("status").textContent = lista.length + " para elegir" + (av ? " · " + av : "");
}

/* ---------- EL ORDEN DE LAS PIEZAS DE UN TALLERISTA ES POR RUBRO, NO ALFABÉTICO ----------
   [usuario 2026-09-23, textual: "en el módulo de envío a talleristas dentro de la versión tablet,
   quiero que me ordenes no alfanuméricamente, sino que primero me pongas todo lo que se le manda de
   sector crudo, después todo lo de sector procesado, después todo los remaches, después todo lo de
   partes plásticas, después todo lo de cajas y después todo lo de cartones" + "me refiero dentro de
   cada tallerista"]. El envío se arma caminando el galpón, y el abecedario obliga a ir y volver:
   A10 (crudo), BANDITA (cartón), C10 (cartón), CJ7 (caja), F7 (fleje) son cuatro lugares distintos
   en cinco tarjetas. Por rubro, cada bloque es una parada.
   LOS TRES SECTORES QUE FALTABAN TIENEN SU LUGAR, no van "al final" por descarte: el primer pedido
   nombró seis rubros, pero medido en la base el 2026-09-23 al tallerista también se le manda Fleje
   (6 filas en 3 talleristas), Bombilla (15 en 5) y Garage (11 en 4) — 32 de las 350 filas. Con eso a
   la vista el usuario cerró el orden completo [usuario 2026-09-23: "Garage ponelo primero, fleje
   segundo y bombilla último"], que es el de RUBRO_ORDEN de acá abajo.
   UN SECTOR QUE NO ESTÉ EN LA LISTA cae al fondo, DESPUÉS de Bombilla: hoy no hay ninguno en Enviar a
   tallerista (Movimiento, Terminado y Bolsas Plásticas no llegan acá), y si mañana aparece uno, el
   lugar honesto para algo que nadie clasificó es abajo, a la vista, no colado en el medio.
   Desde v1.38.0 (2026-09-28) vale para los cuatro destinos de Enviar (tallerista, P.S., prov. de
   art. terminado, inyector); Recibir sigue alfabético. */
/* La lista vive UNA vez en gp2-envios-common.js (GP2EE), así el Control de partes la
   comparte sin copiarla [2026-09-24]. rubroDe delega en GP2EE.rubroSector (incluye el
   carve-out de "Sector Bolsas Plásticas" = resina del inyector, que va al final). */
var RUBRO_ORDEN = GP2EE.RUBRO_ORDEN;
function rubroDe(x){ return GP2EE.rubroSector(x && x.sector); }
/* El índice del bloque de CARTONES, calculado y no escrito a mano: ahí termina el "➕ Otro cartón".
   Si mañana cambia el orden de RUBRO_ORDEN, el botón sigue cayendo donde está el cartón. */
var RUBRO_CARTON = rubroDe({ sector: "Sector Cartón" });
/* ¿esta contraparte se muestra en bloques por rubro? Lo consultan el orden y el rótulo de la grilla,
   así no hay dos criterios que se puedan separar. */
/* v1.38.0 (2026-09-28): los CUATRO destinos de Enviar van por rubro, no solo el tallerista
   [usuario: "Así como me ordenaste por sector el envío a talleristas quiero que me ordenes prov de
   art terminado, proveedores de servicio e inyectores"]. Mismo RUBRO_ORDEN, mismo rótulo. */
var TIPOS_POR_RUBRO = { tallerista: 1, proveedor_servicio: 1, proveedor_at: 1, inyector: 1 };
function agrupaPorRubro(c){ return MODO === "enviar" && !!c && !!TIPOS_POR_RUBRO[c.tipo]; }

/* ---------- piezas de la contraparte elegida ---------- */
function piezasDe(c){
  var arr;
  if (MODO === "enviar") {
    // Cada contraparte ve SOLO sus piezas (para prov. AT, los cartones/cajas que la receta de
    // sus articulos usa; antes iba con ref '*' y mostraba los 191 a todos, bug 2026-09-15).
    arr = (D.enviar || []).filter(function(x){
      return x.tipo === c.tipo && String(x.ref) === String(c.ref);
    });
    // los cartones de otro artículo agregados a mano en esta sesión (➕ Otro cartón)
    arr = arr.concat(SUST[c.id] || []);
  } else {
    arr = (D.recibir || []).filter(function(x){ return x.tipo === c.tipo && String(x.ref) === String(c.ref); });
  }
  var porRubro = agrupaPorRubro(c);
  return arr.sort(function(a,b){
    if (porRubro) {
      var ra = rubroDe(a), rb = rubroDe(b);
      if (ra !== rb) return ra - rb;
      // dentro del bloque "lo que no nombró el usuario" los sectores no se mezclan entre sí
      if (ra === RUBRO_ORDEN.length) {
        var sa = String(a.sector || ""), sb = String(b.sector || "");
        if (sa !== sb) return sa.localeCompare(sb);
      }
    }
    return String(a.cod).localeCompare(String(b.cod));   // adentro del rubro, por código
  });
}

function elegir(c){
  // lo que se hubiera tipeado antes en este P.S. no sobrevive: la tabla arranca vacia
  olvidarCargado(c);
  selCP = c;
  cerrarDetalle();                 // se entra por la grilla, nunca con una parte abierta
  // el tallerista con O.C. de Virgilio Y el prov. de art. terminado lo dicen en el título: su
  // sugerido es 0 porque el pedido no sale del máximo de la casa sino de una O.C. de Gestión
  // Virgilio que GP2 no lee, y sin ese renglón un 0 se lee como "no hay que mandarle nada"
  // [usuario 2026-09-24: el prov. AT va igual que talleristas O.C.].
  $("fase1Title").textContent = c.nombre + (MODO === "enviar" && (c.oc || c.tipo === "proveedor_at") ? " · O.C. Virgilio" : "");
  ocPrepararBox(c);
  E.mostrarFase(1);
  var esRec = MODO === "recibir";
  $("lblRemito").classList.toggle("hidden", !esRec);
  $("fRemito").classList.toggle("hidden", !esRec);
  if (!$("fFecha").value) $("fFecha").value = hoyISO();
  $("q").value = "";
  // Enviar con sugerido: la tabla muestra SOLO Pieza · Sugerido · Cantidad [usuario 2026-09-17:
  // "quiero ver solo la columna de pieza, sugerido y cantidad"]. Se sacaron Stock PS/Stock Tall.
  // (saldo_dest) y Máximo/O.C. (maximo); el cálculo del sugerido no cambia, solo el render.
  // Si el proveedor tiene unidad de envío propia (paquetes, etc.) se aclara en ambos encabezados.
  var _pk = packEnvio();
  var _u = _pk ? " (" + esc(_pk.label) + ")" : "";
  // Ester mira el sugerido en bolsas pero PESA lo que manda: ahí la Cantidad va en kg.
  var _uq = (_pk && _pk.cargaKg) ? " (kg)" : _u;
  // Envío por peso (Julio): 4 columnas — el sugerido EN BULTOS (enteros) y las dos cantidades, con
  // la unidad entre paréntesis como en el resto de las pantallas [usuario 2026-09-17].
  $("thead").innerHTML = pesoEnvio()
    ? "<th>Pieza</th><th class=\"num\">Sugerido</th><th class=\"num sep\">Cantidad (kg)</th>"
    : MODO === "enviar"
    ? (envConSugerido()
        ? "<th>Pieza</th><th class=\"num\">Sugerido" + _u + "</th><th class=\"num sep\">Cantidad" + _uq + "</th>"
        : "<th>Pieza</th><th class=\"num\">Online sector</th><th class=\"num sep\">Cantidad</th>")
    : "<th>Pieza</th><th class=\"num\">" + esc(rotuloRef()) + "</th><th class=\"num sep\">Recibido</th>";
  // NO se precarga NADA: desde el 2026-09-18 ningún destino de Enviar arranca con la cantidad
  // escrita (P.S. e inyector desde el 17, el tallerista desde el 18, elegido por el usuario). El
  // Sugerido se sigue mostrando: es la referencia, no la orden. Ver envSinMemoria().
  render();
}

/* ---------- Ver O.C. de Gestión Virgilio (v1.37.0) ----------
   La box sólo existe donde el sugerido sale de la O.C. de Virgilio (mismo criterio que el título).
   Se lee al abrirla: v_oc_virgilio_pendiente (espejo GP2, nada de public) + la descripción. */
function ocAplica(c){ return MODO === "enviar" && !!c && (c.oc || c.tipo === "proveedor_at"); }
function ocPrepararBox(c){
  var box = $("ocBox"); if (!box) return;
  box.classList.toggle("hidden", !ocAplica(c));
  $("ocBody").classList.add("hidden");
  $("ocBody").innerHTML = "";
  $("btnVerOC").textContent = "📄 Ver O.C.";
}
async function ocToggle(){
  var body = $("ocBody");
  if (!body.classList.contains("hidden")) {
    body.classList.add("hidden");
    $("btnVerOC").textContent = "📄 Ver O.C.";
    return;
  }
  var c = selCP; if (!ocAplica(c)) return;
  body.classList.remove("hidden");
  $("btnVerOC").textContent = "✕ Cerrar O.C.";
  body.innerHTML = '<div class="oc-msg">Cargando la O.C. de Gestión Virgilio…</div>';
  try {
    if (typeof SB.from !== "function") throw new Error("sin conexión a la base");
    var r = await SB.from("v_oc_virgilio_pendiente")
      .select("articulo_id,codigo,fecha,cajas_ped,cajas_rec,cajas_pend,unidad")
      .eq("tipo", c.tipo).eq("ref_id", Number(c.ref));
    if (r.error) throw r.error;
    if (selCP !== c) return;   // cambió de contraparte mientras cargaba
    var filas = r.data || [];
    if (!filas.length) { body.innerHTML = '<div class="oc-msg">No hay O.C. pendiente de Gestión Virgilio para ' + esc(c.nombre) + '.</div>'; return; }
    var ids = filas.map(function(f){ return f.articulo_id; }).filter(function(x){ return x != null; });
    var desc = {};
    if (ids.length) {
      var ra = await SB.from("articulo").select("id,descripcion").in("id", ids);
      if (!ra.error) (ra.data || []).forEach(function(a){ desc[a.id] = a.descripcion || ""; });
    }
    if (selCP !== c) return;
    filas.sort(function(a,b){ return String(a.codigo).localeCompare(String(b.codigo), "es", { numeric: true }); });
    var tot = 0;
    var h = '<div class="table-wrap"><table class="t"><thead><tr><th>Artículo</th><th>O.C. del</th>' +
            '<th class="num">Pedido</th><th class="num">Recibido</th><th class="num">Pendiente</th></tr></thead><tbody>';
    filas.forEach(function(f){
      var u = /^uni/i.test(f.unidad || "") ? "uni" : "cajas";
      tot += Number(f.cajas_pend) || 0;
      h += "<tr><td><b>" + esc(f.codigo) + "</b> " + esc(desc[f.articulo_id] || "") + "</td>" +
           "<td>" + esc(GP2UI.fechaAR(f.fecha)) + "</td>" +
           '<td class="num">' + fmt(Number(f.cajas_ped), 0) + "</td>" +
           '<td class="num">' + fmt(Number(f.cajas_rec), 0) + "</td>" +
           '<td class="num"><b>' + fmt(Number(f.cajas_pend), 0) + "</b> " + u + "</td></tr>";
    });
    h += "</tbody></table></div>" +
         '<div class="oc-msg">' + filas.length + " artículo" + (filas.length === 1 ? "" : "s") +
         " pendientes · " + fmt(tot, 0) + " en total. Es lo que Gestión Virgilio le pidió y todavía no entregó.</div>";
    body.innerHTML = h;
  } catch (e) {
    if (selCP !== c) return;
    body.innerHTML = '<div class="oc-msg">No se pudo leer la O.C.: ' + esc(e.message || String(e)) + "</div>";
  }
}

/* El "← Cambiar" vuelve un paso, no al principio: a la lista de contrapartes del tipo, y
   si ese tipo tenía una sola (Virgilio) directamente a los tipos. */

  E.mostrarFase(0);

/* esperado en la unidad con la que se carga */
function esperadoTxt(x){
  if (x.esperado == null) return '<span class="esp">—<small>sin referencia</small></span>';
  var u = unidadDe(x);
  var e = Number(x.esperado);
  var origen = { oc: "según OC", online_tall: "stock que tiene", online_ps: "stock que tiene",
                 online_virgilio: "online Virgilio" }[x.esperado_origen] || x.esperado_origen || "";
  return '<span class="esp">' + fmt(e, u === "kg" ? 2 : 0) + " " + u + "<small>" + esc(origen) + "</small></span>";
}

/* Lo tipeado llevado a la unidad CANONICA de la pieza (uni, o kg si la pieza se mide en kg), que
   es la del esperado y la del stock. Sin esto, escribir kg contra un esperado en unidades
   comparaba peras con manzanas. */
function canonDe(x, q){
  if (!(q > 0)) return 0;
  if (cargaEnKg(x) && unidadDe(x) !== "kg") {
    var k = kguRef(x);
    return k > 0 ? q / k : q;
  }
  var ev = envaseDe(x);
  return (ev && !ev.cargaKg) ? q * ev.factor : q;
}

/* "RECIBÍ DE MÁS" NO SE DISPARA POR UN DECIMAL [usuario 2026-09-23, con 1.852 uni de PC1A contra
   1.852 esperadas: "¿por qué salta la alerta? Es exactamente la misma cantidad" — y el cartel decía
   "0 de más", que es la firma del problema]. El stock que la contraparte tiene en su poder arrastra
   decimales de las conversiones kg↔uni (a Esther se le mandaron 10 kg = 1.851,8518 mangos, y ese
   0,8518 queda en el saldo), así que comparar crudo convierte cada redondeo en una alerta. La
   tolerancia es MEDIA UNIDAD, o 5 gramos si la pieza se mide en kg: nadie entrega 0,15 mangos. */
function tolExceso(x){ return unidadDe(x) === "kg" ? 0.005 : 0.5; }
/* Y NO SE COMPARA CONTRA EL STOCK DEL P.S. [usuario 2026-09-23: "esta alerta me tiene que aparecer
   no a la hora de recibir, sino a la hora de hacer el control... porque puede haber 1.800 unidades
   de stock de proveedor de servicio y capaz recibo menos"]. Lo que se carga acá es el REMITO: que
   traiga menos —o más— de lo que el proveedor tiene en su poder es normal (entregas parciales), no
   una anomalía. El juicio va en ControlEntregaPS, contra el remito. En los demás destinos el aviso
   sigue, con el MISMO 5 % que pidió para el control: una diferencia chica no es un exceso. */
var EXCESO_PCT = 5;
function exceso(x, q){
  if (MODO !== "recibir" || x.esperado == null || !(q > 0)) return 0;
  // el P.S. y el TALLERISTA tienen su pantalla de control: ahí se compara lo contado contra el
  // remito, que es lo que sí se puede contrastar [usuario 2026-09-23]. Acá no se juzga el papel.
  if (selCP && (selCP.tipo === "proveedor_servicio" || selCP.tipo === "tallerista")) return 0;
  var esp = Number(x.esperado);
  var d = canonDe(x, q) - esp;
  return d > Math.max(tolExceso(x), esp * EXCESO_PCT / 100) ? d : 0;
}

function filtradas(){
  return E.filtrar(piezasDe(selCP), $("q").value, function(x){
    return String(x.cod || "") + " " + String(x.desc || "") + " " + String(x.ent_cod || "") + " " + String(x.sector || "");
  });
}

/* Un solo punto de entrada: según la contraparte, tarjetas (P.S. / inyector) o tabla. */
