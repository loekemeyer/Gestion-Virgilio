/* ---------- las partes como TARJETAS ----------
   Código y descripción (lo mínimo que pidió el usuario), el sugerido de referencia y, abajo, lo
   que hoy se va a mandar: así se ve de un vistazo qué quedó cargado y qué no. */
function renderCards(){
  var arr = filtradas();
  var g = $("cardsGrid");
  g.innerHTML = "";
  $("tblEmpty").classList.toggle("hidden", arr.length > 0);
  if (!arr.length) $("tblEmpty").textContent = "Sin resultados para ese filtro.";
  // Los BLOQUES POR RUBRO del tallerista: un rótulo cada vez que cambia el sector. Sin él el orden
  // nuevo se lee como un desorden (el código ya no viene en orden y no se ve por qué).
  var enBloques = agrupaPorRubro(selCP), ultRubro = null, ultCarton = null;
  arr.forEach(function(x){
    if (enBloques) {
      var srub = String(x.sector || "Sin sector");
      if (srub !== ultRubro) {
        var h = document.createElement("div");
        h.className = "pc-rubro" + (ultRubro === null ? " primero" : "");
        h.textContent = srub;
        g.appendChild(h);
        ultRubro = srub;
      }
    }
    var k = claveDe(x), it = BUF.item(selCP.id, k), q = num(it.q);
    var si = refInfo(x), uc = uniCarga(x), ex = exceso(x, q);
    var ed = envaseDoble(x), c = num(it.c), completa = filaCompleta(x, it);
    var aMedias = !!ed && !completa && (q > 0 || c > 0);
    var desv = desvioEnvase(x, it);
    var b = document.createElement("button");
    b.type = "button";
    b.className = "parte-card" + (completa ? " cargada" : "") + (ex > 0 ? " demas" : "") +
                  (aMedias ? " incompleta" : "") + (x.sust_de ? " sust" : "");
    b.dataset.k = k;
    b.innerHTML =
      '<span class="pc-cod">' + esc(x.cod) + uniTag(uc) + "</span>" +
      '<span class="pc-desc">' + esc(x.desc || "") +
        // en Recibir importa QUE pieza consume lo que traen (la fila de la tabla ya lo decia)
        (MODO === "recibir" && x.ent_cod ? ' <span class="pc-nota">· consume ' + esc(x.ent_cod) + "</span>" : "") +
        "</span>" +
      // el cartón de otro artículo: lo primero que hay que ver es a cuál reemplaza
      (x.sust_de ? '<span class="pc-sust">↔ en lugar de ' + esc(x.sust_cod) + "</span>" : "") +
      '<span class="pc-sug"><span class="pc-rot">' + esc(si.rotulo) + "</span> " + si.txt +
        (si.uni ? " " + esc(unidadTxt(si.num, si.uni)) : "") +
        (si.nota ? '<span class="pc-nota"> · ' + esc(si.nota) + "</span>" : "") + "</span>" +
      '<span class="pc-estado">' + (aMedias
        ? '<span class="pc-demas">⚠ falta anotar ' + esc(q > 0 ? ed.label : "los kg") + "</span>"
        : completa
        ? (MODO === "recibir" ? "✓ recibe <b>" : "✓ envía <b>") +
          fmt(q, decDe(x)) + " " + esc(unidadTxt(q, uc)) + "</b>" +
          (ed ? " (" + fmt(c, 0) + " " + esc(unidadTxt(c, ed.label)) + ")" : "") +
          (desv ? '<span class="pc-demas">⚠ no coincide con los kg</span>' : "") +
          (ex > 0 ? '<span class="pc-demas">⚠ ' + fmt(ex, unidadDe(x) === "kg" ? 2 : 0) + " de más</span>" : "")
        : "sin cargar") + "</span>";
    g.appendChild(b);
    if (enBloques && rubroDe(x) === RUBRO_CARTON) ultCarton = b;   // dónde termina el cartón
  });
  // ➕ Otro cartón: al final de las suyas, porque es la excepción y no la regla [usuario 2026-09-21]
  if (puedeSustituir()) {
    var bo = document.createElement("button");
    bo.type = "button";
    bo.className = "parte-card otro";
    bo.dataset.otro = "1";
    bo.innerHTML = '<span class="pc-cod">➕ Otro cartón</span>' +
      '<span class="pc-desc">sin stock del que va: mandá el de otro artículo y pegale la etiqueta</span>';
    // CIERRA EL BLOQUE DE CARTONES, no la grilla [usuario 2026-09-23: "el módulo de otro cartón no
    // lo dejes al final de todo, ponelo a lo último de los cartones"]: es un cartón más, y el que
    // está cargando cartones lo tiene que tener ahí mismo, no dos bloques más abajo. Si no hay
    // ningún cartón en la lista, sigue al final.
    if (ultCarton) g.insertBefore(bo, ultCarton.nextSibling); else g.appendChild(bo);
  }
  actualizar();
}

function renderTabla(){
  var arr = filtradas();
  var tb = $("tbody");
  tb.innerHTML = "";
  $("tblEmpty").classList.toggle("hidden", arr.length > 0);
  if (!arr.length) $("tblEmpty").textContent = "Sin resultados para ese filtro.";

  arr.forEach(function(x){
    var k = claveDe(x);
    var it = BUF.item(selCP.id, k);
    var u = unidadDe(x);
    var q = num(it.q);
    var tr = document.createElement("tr");
    tr.dataset.k = k;
    var sub = esc(x.desc || "");
    if (MODO === "recibir" && x.ent_cod) sub += ' · <span class="proc">consume ' + esc(x.ent_cod) + "</span>";
    var ex = exceso(x, q);
    // Ester / Guazzaroni: el sugerido queda en el envase (bolsas, cajones) pero la cantidad se
    // escribe en kg, así que debajo del campo va a cuántos envases equivale lo tipeado (se
    // recalcula en el evento input).
    var cargaKgFila = cargaEnKg(x);
    // el cartelito de unidad dice con qué se carga la fila: por peso siempre kg, aunque la pieza
    // sea de unidades (a Julio se le manda pesado; a Ester y Guazzaroni también).
    var uCarga = (MODO === "enviar" && ((pesoEnvio() && bultoDe(x)) || cargaKgFila)) ? "kg" : u;
    var pieza = '<td><span class="cod">' + esc(x.cod) + "</span>" + uniTag(uCarga) +
      '<br><small class="sub">' + sub + "</small>" +
      (ex > 0 ? '<br><span class="demas-tag">⚠ ' + fmt(ex, u === "kg" ? 2 : 0) + " de más</span>" : "") + "</td>";
    var mitad;
    // el bulto de la pieza cuando el proveedor recibe por peso (null = se carga en unidades)
    var b = (MODO === "enviar" && pesoEnvio()) ? bultoDe(x) : null;
    if (MODO === "enviar") {
      // Solo el Sugerido (se sacaron Stock y Máximo) [usuario 2026-09-17]. Si el proveedor recibe
      // por peso, el sugerido va en kg con la equivalencia en bultos abajo; si manda por paquetes,
      // en paquetes (techo); si no, en su unidad. Se MUESTRA siempre; en P.S. e inyector ya no se
      // precarga en la carga (v1.12.0), y lo tipeado ahí no se guarda al salir (v1.13.0). El
      // cálculo del sugerido no cambió, solo el render.
      // el sugerido sale de sugeridoInfo(), la misma cuenta que usa la tarjeta
      var si = sugeridoInfo(x);
      if (b) {
        mitad = '<td class="num esp"><b>' + si.txt + "</b><small>" + esc(si.small) + "</small></td>";
      } else {
        mitad = envConSugerido(x)
          ? ('<td class="num esp"><b>' + si.txt + "</b>" +
             (si.small ? "<small>" + esc(si.small) + "</small>" : "") + "</td>")
          : ('<td class="num esp">' + fmt(x.online_sector, u === "kg" ? 2 : 0) + " " + u + "</td>");
      }
    } else {
      mitad = '<td class="num">' + esperadoTxt(x) + "</td>";
    }
    var carga = E.tdInput("q", it.q, false, "sep", (b || cargaKgFila) ? "decimal" : inputmodeDe(u))
                 .replace('class="cell-in', 'class="cell-in big');
    // el bulto (bolsas/cajones) va SIEMPRE como renglón chico debajo del campo de kg, en las dos
    // formas: dejó de ser una columna aparte para Julio el 2026-09-18, a pedido del usuario.
    var eqTxt = eqFila(x, q);
    if (eqTxt != null)
      carga = carga.replace("</td>", '<small class="env-eq">' + esc(eqTxt) + "</small></td>");
    tr.innerHTML = pieza + mitad + carga;
    if (ex > 0) tr.classList.add("demas");
    tb.appendChild(tr);
  });
  actualizar();
}

/* ---------- ➕ OTRO CARTÓN ----------
   Sólo al ENVIAR a un tallerista o a un prov. de art. terminado: son los dos que reciben cartón
   [usuario 2026-09-21]. El catálogo lo trae la base al tocar el botón y no en el bundle: son ~190
   filas que el 99% de los envíos no mira. Se cachea por contraparte mientras dure la pantalla. */
function puedeSustituir(){
  return MODO === "enviar" && !!selCP &&
    (selCP.tipo === "tallerista" || selCP.tipo === "proveedor_at");
}

async function abrirOtroCarton(){
  if (!puedeSustituir()) return;
  sustSel = { paso: 1, x: null, q: "" };
  detK = null;
  $("tblBox").classList.add("hidden");
  $("detBox").classList.remove("hidden");
  $("tblEmpty").classList.add("hidden");
  $("accBox").classList.add("hidden");
  if (!CATS[selCP.id]) {
    $("detCard").innerHTML = '<div class="det-lbl">Otro cartón</div>' +
      '<div class="det-desc">Buscando el catálogo…</div>';
    try {
      var r = await SB.rpc("cartones_para_reemplazo", { p_tipo: selCP.tipo, p_ref: Number(selCP.ref) });
      if (r.error) throw r.error;
      CATS[selCP.id] = r.data || { oficiales: [], otros: [] };
    } catch (err) {
      $("detCard").innerHTML = '<div class="det-lbl">Otro cartón</div>' +
        '<div class="det-desc" style="color:#b91c1c">No se pudo traer el catálogo: ' +
        esc(err.message || err) + "</div>" +
        '<div class="det-acc"><button class="btn btn-secondary" type="button" data-a="sust-cancel">← Partes</button></div>';
      return;
    }
  }
  pintarSust();
}

/* la lista del paso: los cartones que NO usa (paso 1) o los suyos (paso 2). Se repinta sola al
   filtrar, sin tocar el resto de la tarjeta, así el buscador no pierde el foco. */
function sustItemsHTML(){
  var cat = CATS[selCP.id] || { oficiales: [], otros: [] };
  var paso2 = !!(sustSel && sustSel.paso === 2);
  var q = String((sustSel && sustSel.q) || "").trim().toLowerCase();
  // en el paso 2 la lista ya viene acotada al sector del cartón elegido (sustSel.oficiales)
  var base = paso2 ? ((sustSel && sustSel.oficiales) || cat.oficiales || []) : (cat.otros || []);
  var lista = base.filter(function(o){
    return !q || ((o.cod || "") + " " + (o["desc"] || "")).toLowerCase().indexOf(q) >= 0;
  });
  if (!lista.length)
    return '<div class="empty">' + (base.length ? "Sin resultados para ese filtro."
      : paso2 ? "Este destino no tiene ningún cartón propio: no hay a cuál reemplazar."
              : "No queda ningún otro cartón en el catálogo.") + "</div>";
  return lista.map(function(o){
    var stk = Number(o.online_sector || 0);
    return '<button type="button" class="sust-item" data-a="' + (paso2 ? "sust-of" : "sust-pick") +
      '" data-c="' + esc(String(o.comp_id)) + '">' +
      '<span class="si-cod">' + esc(o.cod || "") + "</span>" +
      '<span class="si-desc">' + esc(o["desc"] || "") + "</span>" +
      (paso2 ? "" : '<span class="si-stk' + (stk > 0 ? "" : " cero") + '">Stock en el sector: ' +
        fmt(stk, 0) + " uni</span>") + "</button>";
  }).join("");
}

function pintarSust(){
  var paso2 = !!(sustSel && sustSel.paso === 2);
  $("detCard").innerHTML =
    '<div class="det-cod">' + (paso2 ? "¿En lugar de cuál?" : "➕ Otro cartón") + "</div>" +
    '<div class="det-desc">' + (paso2
      ? "El cartón del artículo que le corresponde: ese es el que se va a dejar de consumir cuando entregue el terminado."
      : "Los que " + esc(selCP.nombre) + " no usa. El stock que baja es el de este cartón, el que sale de verdad de Cervantes.") +
    "</div>" +
    (paso2 ? '<div class="det-sust">Le mandás <b>' + esc(sustSel.x.cod) + "</b></div>" : "") +
    '<input id="sustQ" inputmode="search" placeholder="Buscar por código o descripción…" value="' +
      esc((sustSel && sustSel.q) || "") + '">' +
    '<div class="sust-lista">' + sustItemsHTML() + "</div>" +
    '<div class="det-acc"><button class="btn btn-secondary" type="button" data-a="sust-cancel">← Partes</button></div>';
}

/* elegido el cartón que sale y el que reemplaza, entra como una fila más de la contraparte */
function agregarSustituto(of){
  var x = sustSel.x;
  var fila = {
    tipo: selCP.tipo, ref: String(selCP.ref), comp_id: Number(x.comp_id),
    cod: x.cod, "desc": x["desc"], sector: x.sector, um: "unidad",
    uxc: null, kg_x_uni: null,
    // mismo contrato que una fila del bundle: el cartón va en PAQUETES, con el paquetón de SU
    // formato (sin formato cargado queda en unidades y la tarjeta avisa, como cualquier otra).
    env_unidad: "paquetes", env_factor: x.factor, env_carga: "envase",
    online_sector: x.online_sector, saldo_dest: 0,
    maximo: null, stock_dest: null, sugerido: null,
    sust_de: Number(of.comp_id), sust_cod: of.cod
  };
  var arr = SUST[selCP.id] || (SUST[selCP.id] = []);
  var k = claveDe(fila);
  if (!arr.some(function(f){ return claveDe(f) === k; })) arr.push(fila);
  sustSel = null;
  abrirParte(k);
}

/* ---------- la vista de UNA parte ----------
   Se abre al tocar la tarjeta: arriba el sugerido (grande, de referencia) y abajo el campo con la
   cantidad efectiva que se va a enviar. Es la MISMA carga de siempre — escribe en el mismo buffer,
   con las mismas unidades y las mismas equivalencias que la tabla —, solo que de a una pieza. */
function abrirParte(k){
  if (!piezaDe(k)) return;
  detK = k;
  $("tblBox").classList.add("hidden");
  $("detBox").classList.remove("hidden");
  $("tblEmpty").classList.add("hidden");
  // adentro de una parte no se cierra la carga: la Fecha y el boton Registrar se van con la grilla
  // [usuario 2026-09-18: "cuando estas dentro de una parte... que no aparezca ni el boton de fecha
  // ni de enviar"]. Vuelven al tocar "← Partes".
  $("accBox").classList.add("hidden");
  pintarDetalle();
  var inp = $("detCard").querySelector('input[data-f="q"]');
  if (inp) inp.focus();
}

function cerrarDetalle(){
  detK = null;
  sustSel = null;            // si estaba eligiendo "otro cartón", se cancela
  $("detBox").classList.add("hidden");
  $("tblBox").classList.remove("hidden");
  $("accBox").classList.remove("hidden");
}

/* volver a la grilla: la tarjeta se repinta con lo que quedó cargado */
function volverAPartes(){
  cerrarDetalle();
  render();
}

function pintarDetalle(){
  var x = piezaDe(detK);
  if (!x) { volverAPartes(); return; }
  var it = BUF.item(selCP.id, detK), q = num(it.q);
  var si = refInfo(x), uc = uniCarga(x);
  var ckg = cargaEnKg(x);
  var b = (MODO === "enviar" && pesoEnvio()) ? bultoDe(x) : null;
  var ed = envaseDoble(x), chk = chequeoDoble(x, it);
  var h =
    '<div class="det-cod">' + esc(x.cod) + uniTag(uc) + "</div>" +
    '<div class="det-desc">' + esc(x.desc || "") + "</div>" +
    (x.sector ? '<div class="det-sector">' + esc(x.sector) + "</div>" : "") +
    // cartón de otro artículo: a cuál reemplaza es lo que hay que leer antes de cargar la cantidad
    (x.sust_de ? '<div class="det-sust">↔ en lugar de <b>' + esc(x.sust_cod) +
                 "</b> · pegale la etiqueta del artículo que corresponde</div>" : "") +
    // en Recibir el rotulo lo decide rotuloRef() (stock del tallerista / del P.S.), asi que se
    // usa el que ya vino en refInfo en vez de escribirlo otra vez aca.
    '<div class="det-lbl">' + (si.rotulo === "Sugerido" ? "Sugerido a enviar"
                              : MODO === "recibir" ? si.rotulo : "Online en el sector") + "</div>" +
    '<div class="det-sug">' + si.txt + (si.uni ? " " + esc(unidadTxt(si.num, si.uni)) : "") +
      (si.nota ? "<small>" + esc(si.nota) + "</small>" : "") + "</div>" +
    // con envase Y kg se anotan las DOS, y primero el envase: es lo que el operario cuenta
    // mientras carga el camion [usuario 2026-09-18].
    (ed
      // las dos, UNA AL LADO DE LA OTRA [usuario 2026-09-18: "que sea una al lado de la otra, no
      // una abajo de la otra (queda muy ancho)"]. El cruce va debajo, cruzando las dos columnas.
      ? '<div class="det-dos">' +
          '<div class="det-col"><div class="det-lbl">Cantidad (' + esc(ed.label) + ")</div>" +
            '<div class="det-campo"><input class="det-in" data-f="c" inputmode="numeric" value="' +
              esc(it.c || "") + '"><span class="det-uni">' + esc(ed.label) + "</span></div></div>" +
          '<div class="det-col"><div class="det-lbl">Cantidad (kg)</div>' +
            '<div class="det-campo"><input class="det-in" data-f="q" inputmode="decimal" value="' +
              esc(it.q || "") + '"><span class="det-uni">kg</span></div></div>' +
        "</div>" +
        '<small class="det-eq' + (chk.mal ? " mal" : "") + '">' + esc(chk.txt) + "</small>"
      : '<div class="det-lbl">' + (MODO === "recibir" ? "Cantidad" : "Cantidad a enviar") + "</div>" +
        '<div><input class="det-in" data-f="q" inputmode="' +
          ((b || ckg) ? "decimal" : inputmodeDe(unidadDe(x))) + '" value="' + esc(it.q || "") + '">' +
          '<span class="det-uni">' + esc(uc) + "</span>" +
          '<small class="det-eq">' + esc(eqFila(x, q) || "") + "</small></div>");
  // NO hay atajo para copiar el sugerido al campo [usuario 2026-09-18: "no quiero que aparezca la
  // opcion de enviar sugerido"]: la cantidad la escribe la persona, siempre. El sugerido de arriba
  // es referencia y nada mas (misma linea que 4ee).
  // "Listo" no se habilita hasta que esten las DOS unidades [usuario 2026-09-18]. El desvio, en
  // cambio, avisa pero NO frena: "que me salte alerta pero que me deje poner listo igual".
  h += '<div class="det-acc"><button class="btn btn-primary" type="button" data-a="listo"' +
       (filaCompleta(x, it) ? "" : " disabled") + ">Listo</button>" +
       (ed ? '<span class="det-falta">' +
               (filaCompleta(x, it) ? ""
                 : (num(it.q) > 0 ? "Falta anotar " + esc(ed.label) : "Falta anotar los kg")) +
             "</span>" : "") + "</div>";
  $("detCard").innerHTML = h;
}

/* Lo que se va a registrar: las filas con cantidad y, si llevan las dos unidades, con las dos.
   Una fila a medias no viaja — la tarjeta lo dice y el botón Listo no deja cerrarla. */
function cargadas(){
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });
  return E.cargadasDe(BUF.de(selCP.id), function(it){ return num(it.q) > 0; })
          .filter(function(o){ return filaCompleta(meta[o.k], o.it); });
}

function actualizar(){
  var n = cargadas().length;
  E.actualizarEnviar(n, MODO === "enviar" ? "Enviar" : "Recibir");
  // el aviso de exceso: informa, no frena (el botón sigue habilitado)
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });
  var conExceso = cargadas().filter(function(o){ return meta[o.k] && exceso(meta[o.k], num(o.it.q)) > 0; });
  var box = $("alertaBox");
  box.classList.toggle("hidden", conExceso.length === 0);
  if (conExceso.length) {
    box.innerHTML = "⚠ <b>Estás recibiendo más de lo esperado</b> en " + conExceso.length + " pieza" +
      (conExceso.length === 1 ? "" : "s") + " (" + conExceso.map(function(o){ return esc(meta[o.k].cod); }).join(", ") +
      "). <b>Podés registrar igual</b>: queda una alerta para que la revisen en Alertas.";
  }
}

/* ---------- eventos ---------- */
$("tbody").addEventListener("input", function(e){
  var inp = e.target.closest("input.cell-in");
  if (!inp) return;
  var tr = inp.closest("tr");
  BUF.item(selCP.id, tr.dataset.k)[inp.dataset.f] = inp.value;
  BUF.save();
  // repintar sólo lo que cambia de esa fila (el aviso de exceso), sin perder el foco
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });
  var x = meta[tr.dataset.k];
  if (x) {
    var q = num(inp.value), u = unidadDe(x), ex = exceso(x, q);
    // la cantidad se escribe en kg y debajo se ve a cuántos bultos equivale (los dos modos)
    var eq = tr.querySelector(".env-eq");
    if (eq) eq.textContent = eqFila(x, q) || "";
    tr.classList.toggle("demas", ex > 0);
    var old = tr.querySelector(".demas-tag"); if (old) { old.previousSibling && old.previousSibling.nodeName === "BR" && old.previousSibling.remove(); old.remove(); }
    if (ex > 0) tr.firstElementChild.insertAdjacentHTML("beforeend", '<br><span class="demas-tag">⚠ ' + fmt(ex, u === "kg" ? 2 : 0) + " de más</span>");
  }
  actualizar();
});

// cerrar la pestana, recargar o irse a otra pantalla cuenta como salir: lo tipeado en un P.S. no
// queda guardado para la proxima [usuario 2026-09-18].
window.addEventListener("pagehide", function(){ olvidarCargado(selCP); });

/* ---- eventos de la vista de tarjetas ---- */
$("cardsGrid").addEventListener("click", function(e){
  if (e.target.closest(".parte-card.otro")) { abrirOtroCarton(); return; }
  var c = e.target.closest(".parte-card");
  if (c) abrirParte(c.dataset.k);
});
$("btnVolverPartes").addEventListener("click", volverAPartes);
$("detBox").addEventListener("click", function(e){
  var b = e.target.closest("button[data-a]");
  if (!b) return;
  if (b.dataset.a === "listo") { volverAPartes(); return; }
  if (b.dataset.a === "sust-cancel") { sustSel = null; volverAPartes(); return; }
  if (!sustSel) return;
  var cat = CATS[selCP.id] || { oficiales: [], otros: [] };
  var cid = Number(b.dataset.c);
  if (b.dataset.a === "sust-pick") {
    var elegido = (cat.otros || []).filter(function(o){ return Number(o.comp_id) === cid; })[0];
    if (!elegido) return;
    sustSel.x = elegido;
    // los suyos del MISMO sector: un cartón reemplaza un cartón, una caja una caja (la base lo
    // valida igual, pero mostrar lo que va a ser rechazado no sirve de nada)
    var posibles = (cat.oficiales || []).filter(function(o){
      return Number(o.sec_id) === Number(elegido.sec_id);
    });
    if (!posibles.length) {
      alert("No hay ningún cartón de " + selCP.nombre + " del mismo tipo para reemplazar.");
      return;
    }
    if (posibles.length === 1) { agregarSustituto(posibles[0]); return; }   // uno solo: no se elige
    // el filtrado por sector vive en la elección, NO en el caché: pisarlo dejaría la lista corta
    // para el próximo cartón que se elija.
    sustSel.paso = 2; sustSel.q = ""; sustSel.oficiales = posibles;
    pintarSust();
    return;
  }
  if (b.dataset.a === "sust-of") {
    var of = (sustSel.oficiales || cat.oficiales || []).filter(function(o){ return Number(o.comp_id) === cid; })[0];
    if (of) agregarSustituto(of);
  }
});
$("detBox").addEventListener("input", function(e){
  // el buscador del catálogo de "otro cartón": se repinta SOLO la lista, si no se pierde el foco
  if (e.target.id === "sustQ") {
    if (sustSel) {
      sustSel.q = e.target.value;
      var lb = $("detCard").querySelector(".sust-lista");
      if (lb) lb.innerHTML = sustItemsHTML();
    }
    return;
  }
  var inp = e.target.closest("input.det-in");
  if (!inp || !detK) return;
  var x = piezaDe(detK);
  if (!x) return;
  var it = BUF.item(selCP.id, detK);
  it[inp.dataset.f] = inp.value;
  BUF.save();
  var q = num($("detCard").querySelector('input[data-f="q"]').value);
  var eq = $("detCard").querySelector(".det-eq");
  var ed = envaseDoble(x);
  if (ed) {
    // las dos unidades: el renglón de abajo cruza lo anotado contra lo que dicen los kg.
    var chk = chequeoDoble(x, it);
    if (eq) { eq.textContent = chk.txt; eq.classList.toggle("mal", chk.mal); }
  } else if (eq) {
    // el equivalente en bultos de lo tipeado: el mismo renglón chico del resto de las formas
    eq.textContent = eqFila(x, q) || "";
  }
  // EL BOTON SE REPINTA SIEMPRE, lleve la parte una unidad o dos. La tarjeta se dibuja con el
  // campo vacío (o sea con "Listo" deshabilitado) y acá es el único lugar donde se vuelve a
  // habilitar: mientras esto vivió adentro del if (ed), en TODO Recibir —envaseDoble() devuelve
  // null si el modo no es enviar— el botón quedaba gris con la cantidad escrita. Se repinta a
  // mano, sin redibujar la tarjeta, para no perder el foco del campo.
  var btn = $("detCard").querySelector('button[data-a="listo"]');
  var completa = filaCompleta(x, it);
  if (btn) btn.disabled = !completa;
  var falta = $("detCard").querySelector(".det-falta");   // solo existe con las dos unidades
  if (falta) falta.textContent = completa ? ""
    : (num(it.q) > 0 ? "Falta anotar " + ed.label : "Falta anotar los kg");
  actualizar();
});

$("btnEnviar").addEventListener("click", async function(){
  if (!selCP) return;
  var items = cargadas();
  if (!items.length) return;
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });

  var fecha = $("fFecha").value || hoyISO();
  // si el proveedor manda por paquetes, la cantidad se carga EN paquetes: se multiplica por el factor
  // para guardar en la unidad canonica (pliegos/uni). El inventario nunca ve "paquetes".
  // Si en cambio la cantidad se carga en KG (Ester) o el proveedor recibe pesado (Julio), el kg
  // viaja tal cual con unidad 'kg' y to_canonical lo pasa a mangos con kg_x_uni: tampoco ve bolsas.
  var _peso = pesoEnvio();
  var payload = {
    modo: MODO, tipo: selCP.tipo, ref: String(selCP.ref),
    fecha: fecha + "T12:00:00",
    remito: MODO === "recibir" ? ($("fRemito").value.trim() || null) : null,
    items: items.map(function(o){
      var x = meta[o.k] || {};
      var u = unidadDe(x);
      var ckg = cargaEnKg(x);
      var ev = envaseDe(x);
      // por peso: lo que viaja son los KG (la base los pasa a unidades con kg_x_uni) y el bulto va
      // aparte, en movimiento.cajones — los cajones tal como los anotó el operario, las bolsas
      // calculadas desde los kg.
      var b = _peso ? bultoDe(x) : null;
      var q = num(o.it.q);
      // con las dos unidades viaja el envase que ANOTO el operario, no el que sale de los kg: es
      // el que conto al cargar [usuario 2026-09-18]. Sin las dos, se sigue calculando.
      var caj = envaseDoble(x) ? num(o.it.c) : (b ? bultosDeKg(b, q) : null);
      if (caj == null && ckg && kgPorEnvase(x) > 0) caj = redEnvase(q / kgPorEnvase(x));
      return {
        comp_id: x.comp_id != null ? Number(x.comp_id) : null,
        comp_entrada_id: x.comp_entrada_id != null ? Number(x.comp_entrada_id) : null,
        cod_art: x.cod_art || null,
        // sin cargar en kg, lo tipeado está en envases: se multiplica por el factor de ESA pieza
        // para guardar en la unidad canónica. Factor 0 (envase por pieza sin cajón cargado) = la
        // fila se cargó en unidades y viaja tal cual.
        cantidad: (ckg || b) ? q : (ev ? q * ev.factor : q),
        unidad: (ckg || b || u === "kg") ? "kg" : "uni",
        cajones: (caj != null && caj > 0) ? caj : null,
        // el esperado viaja en la MISMA unidad que la cantidad: la base los compara crudos para
        // levantar la alerta de "recibi de mas", y un esperado en unidades contra kg no compara.
        esperado: (MODO === "recibir" && x.esperado != null)
          ? ((ckg && u !== "kg") ? Number(x.esperado) * kguRef(x) : Number(x.esperado))
          : null,
        esperado_origen: x.esperado_origen || null,
        // el cartón OFICIAL al que reemplaza lo que sale de verdad: la base lo guarda en el mismo
        // movimiento y el consumo del terminado lo gasta primero a él [usuario 2026-09-21]
        sustituye_comp_id: x.sust_de || null
      };
    })
  };
  var nEx = items.filter(function(o){ return meta[o.k] && exceso(meta[o.k], num(o.it.q)) > 0; }).length;
  function lineaResumen(o){
    var x = meta[o.k] || {};
    var ev = envaseDe(x);
    var ed = envaseDoble(x);
    if (ed)
      return (x.cod || o.k) + ": " + fmt(num(o.it.q), 2) + " kg (" +
             fmt(num(o.it.c), 0) + " " + unidadTxt(num(o.it.c), ed.label) + ")" +
             (desvioEnvase(x, o.it) ? " ⚠ no coincide" : "");
    if (cargaEnKg(x))
      return (x.cod || o.k) + ": " + fmt(num(o.it.q), 2) + " kg (" +
             equivEnvase(num(o.it.q), kgPorEnvase(x), ev.label)
               .replace("= ", "") + ")";
    var b = _peso ? bultoDe(x) : null;
    if (b) {
      var q2 = num(o.it.q);
      var cb = bultosDeKg(b, q2);
      return (x.cod || o.k) + ": " + fmt(q2, 2) + " kg" + (cb ? " (" + fmt(cb, 2) + " " + b.label + ")" : "");
    }
    return ev
      ? (x.cod || o.k) + ": " + fmt(num(o.it.q), 0) + " " + ev.label
      : (x.cod || o.k) + ": " + fmt(num(o.it.q), unidadDe(x) === "kg" ? 2 : 0) + " " + unidadDe(x);
  }
  // el reemplazo se dice en el confirm: es lo único que el operario no puede deshacer después
  var resumen = items.map(function(o){
    var xs = meta[o.k] || {};
    return lineaResumen(o) + (xs.sust_de ? "  ↔ EN LUGAR DE " + xs.sust_cod : "");
  });
  var verbo = MODO === "enviar" ? "Enviar a " : "Recibir de ";
  if (!confirm(verbo + selCP.nombre + " (" + fecha + "):\n\n" + resumen.join("\n") +
      (nEx ? "\n\n⚠ " + nEx + " pieza" + (nEx === 1 ? "" : "s") + " con más de lo esperado: se registra igual y queda la alerta." : ""))) return;

  var btn = $("btnEnviar");
  btn.disabled = true; btn.textContent = "Registrando…";
  $("msg1").textContent = "";
  try {
    var r = await SB.rpc("tablet_registrar", { p: payload });
    if (r.error) throw r.error;
    BUF.borrar(selCP.id);
    delete SUST[selCP.id];          // los "otro cartón" ya registrados no siguen en la grilla
    var res = r.data || {};
    var al = res.alertas || [];
    $("successTitle").textContent = MODO === "enviar" ? "✓ Enviado" : "✓ Recibido";
    $("successAlertas").innerHTML = al.length
      ? '<div class="alerta-box">⚠ <b>Quedó anotado para revisar</b>: ' + al.map(function(a){
          return esc(a.cod) + " (" + fmt(a.recibido, 0) + " contra " + fmt(a.esperado, 0) + " esperados)";
        }).join(", ") + ". La recepción se registró igual.</div>"
      : "";
    E.mostrarExito((res.n || items.length) + " pieza" + ((res.n || items.length) === 1 ? "" : "s") + " · " +
      (MODO === "enviar" ? "enviadas a " : "recibidas de ") + (res.contraparte || selCP.nombre) + " · " + fecha);
    // DESPUÉS DEL REMITO VIENE EL CONTROL [usuario 2026-09-21: "Después de recepcionar tengo que ir
    // al control"]. Lo que se acaba de registrar es lo que dice el remito; lo que se contó de verdad
    // se carga en ControlEntregaPS_GP2.html, que es la que pisa la cantidad. Se va DIRECTO, sin
    // cartel intermedio, igual que la recepción de insumos [usuario 2026-09-03: "me gusta que me
    // mande directo como en el caso de flejes"]. ÚNICA excepción: si quedó una alerta de "recibí de
    // más" no se salta la pantalla — ahí el operario tiene que leerla, y va con un botón.
    if (MODO === "recibir" && (selCP.tipo === "proveedor_servicio" || selCP.tipo === "tallerista")) {
      if (!al.length) { window.location.href = "ControlEntregaPS_GP2.html"; return; }
      $("successAlertas").innerHTML +=
        '<div class="row" style="justify-content:center;margin-top:10px">' +
        '<a class="btn btn-primary" href="ControlEntregaPS_GP2.html"' +
        ' style="display:inline-flex;align-items:center;text-decoration:none">Ir al control →</a></div>';
    }
    try { var r2 = await SB.rpc("tablet_bundle"); if (!r2.error && r2.data) D = r2.data; } catch(e2){}
  } catch(err){
    $("msg1").innerHTML = '<span style="color:#b91c1c">Error: ' + esc(err.message || err) + "</span>";
    btn.disabled = false; actualizar();
  }
});

$("fFecha").value = hoyISO();
cargar();

/* CUÁNTO QUEDÓ SIN CONTROLAR (2026-09-21; insumos desde v1.39.0). El circuito es remito → control,
   y lo que hace que no quede nada colgado es verlo en la puerta: si hay pendientes, el link del
   encabezado los cuenta — entregas de P.S. y talleristas (pend) más recepciones de insumos que
   tienen pantalla de control (insumos_pend, filtradas por GP2CI). Es BEST EFFORT y nunca bloquea
   la pantalla: si la RPC falla, el link queda diciendo "Control" y la tablet funciona igual. */
(async function () {
  try {
    var r = await SB.rpc("control_entrega_bundle");
    var d = (r && r.data) || {};
    var n = (d.pend || []).length +
            GP2CI.pendientes(d.insumos_pend).reduce(function (a, g) { return a + Number(g.n || 0); }, 0);
    var a = $("lnkControl");
    if (a && n) a.textContent = "Control (" + n + ")";
  } catch (e) {}
})();
</script>
