<!doctype html>
<html lang="es">
  <head>
    <script src="../auth-guard.js?v=20260904t"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Orden de Produccion</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="OrdenProduccion.css?v=20260830l" />
  </head>
  <body>
    <div class="card">
      <button onclick="window.location.href = '../GP2_MODULOS.html'"
              class="tallerista-btn btn-volver-home no-print">&larr; Volver al inicio</button>

      <h1>Orden de Produccion</h1>
      <div class="subtitle">
        Cuanto hay que fabricar en cada matriz para cubrir la demanda mensual (Est Madre x
        meses de stock) del Sector Crudo y el Sector Procesado. Una orden por matriz, separada
        por fleje. Tocar el consumo muestra que articulos lo piden.
      </div>

      <div class="toolbar no-print">
        <input type="text" id="searchInput" class="search-input"
               placeholder="Buscar matriz, sector o fleje..." />

        <select id="filtroDestino" class="filtro-select">
          <option value="">Crudo y Procesado</option>
          <option value="crudo">Solo Sector Crudo</option>
          <option value="procesado">Solo Sector Procesado</option>
        </select>

        <select id="filtroFleje" class="filtro-select">
          <option value="">Todos los flejes</option>
        </select>

        <label class="chk">
          <input type="checkbox" id="soloFaltante" checked />
          Solo matrices con faltante
        </label>

        <button type="button" id="btnImprimir" class="btn-accion">Imprimir orden</button>
      </div>

      <div id="status" class="status">Cargando...</div>
      <div id="totales" class="totales hidden"></div>
      <div id="result"></div>
    </div>

    <script src="../supabase-config.js?v=20260905k"></script>
    <script src="../gp2-ui.js?v=20260905a"></script>
    <script src="../gp2-numero.js?v=20260905m"></script>
    <script src="../consumo-detalle.js?v=20260905g"></script>
    <script src="OrdenProduccion.js?v=20260903m"></script>
  </body>
</html>
