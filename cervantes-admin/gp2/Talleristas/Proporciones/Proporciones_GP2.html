<style>

 }

<body>
<div id="gp2-logobar" style="position:relative;background:#e8edf7;text-align:center;padding:6px 0;border-bottom:1px solid #d0dae7"><a href="../../GP2_MODULOS.html" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#385475;text-decoration:none;font-weight:700;font-size:15px;padding:5px 10px;border:1px solid #d1d9e5;border-radius:8px;background:#e9eef7">← Atrás</a><a href="../../GP2_MODULOS.html" style="text-decoration:none"><img src="../../GP2_logo.png" alt="GP2 · Gestión Productiva" style="height:40px;vertical-align:middle"></a></div>

<div class="top">
 <h1>📊 Proporciones <span style="font-size:14px;color:#2a5783;font-weight:400">· pasos que hacen dos o más talleristas</span></h1>
 <div class="sel">
  <button id="btnCsv">⬇ Exportar CSV</button>
 </div>
</div>
<div class="canvas" id="canvas"><div class="empty">Cargando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase-config.js?v=20260929a"></script>
<script src="../../gp2-ui.js?v=20260913e"></script>
<script src="../../gp2-numero.js?v=20260911o"></script>
<script>var D={};
var SB=GP2_SB();

var esc = GP2UI.esc;   /* helpers de la casa (gp2-ui.js / gp2-numero.js) */

/* La pantalla muestra UNA cosa y NO se toca: los PASOS que hacen dos o mas talleristas, el % de
   cada uno y el MAXIMO de cada parte que recibe.
   [usuario 2026-09-14/15: "que aparezcan solo los articulos compartidos" -> "que me aparezcan
   nada mas los que hacen el mismo paso" -> "elimina la columna de situacion" -> "que no se pueda
   modificar la proporcion en el programa" + "quiero que me pongas los maximos de cada parte del
   articulo que se esta proporcionando".]

   POR QUE ES SOLO LECTURA: el 15-09, mientras se cargaban los porcentajes, alguien abrio la
   pantalla y apreto Guardar en los tres pasos. Eso dejo grabado como dato dictado el 50/50 que la
   pantalla mostraba de DEFAULT para el 510, y el maximo de Alex Escalante quedo en la mitad de lo
   que necesita. El % se carga por SQL; reparto_guardar ya no es ejecutable por anon.

   POR QUE EL CORTE ES EL PASO Y NO EL ARTICULO: que dos talleristas toquen el mismo articulo NO
   es un reparto de volumen. Si cada uno hace un PASO DISTINTO de la ruta (uno el mango, el otro
   el armado) van en cadena y cada uno hace el 100 % de lo suyo. El reparto existe solo cuando
   dos talleristas producen EL MISMO comp_salida, o sea la ruta duplicada por tallerista.

   EL % MANDA SOBRE EL MAXIMO: la columna de cada tallerista sale de v_consumo_tallerista
   (demanda del articulo x su %) x los meses de su ubicacion. Por eso las dos columnas suman el
   consumo del articulo y no lo duplican, que es lo que pasaba antes. */

function pctTxt(p){ return GP2N.fmt(Number(p), 2, "") + " %"; }
function maxTxt(m){ return (m == null) ? "—" : GP2N.fmt(Number(m), 0, "—"); }

function render(){
 var canvas=document.getElementById("canvas");
 var pasos=(D.pasos||[]);
 var nSup=pasos.filter(function(p){return (p.talleristas||[]).some(function(t){return t.es_supuesto;});}).length;

 var note='<div class="note">Los pasos que <b>hacen dos o más talleristas</b> (la misma pieza, la ruta '+
   'duplicada): ahí y sólo ahí se reparte el volumen. El % <b>manda sobre el máximo</b> de cada parte '+
   'que recibe cada uno, y por eso las columnas suman el consumo del artículo en vez de duplicarlo. '+
   'El porcentaje <b>no se edita acá</b>. Los talleristas que hacen <b>otro</b> paso del mismo '+
   'artículo no aparecen: van en cadena, cada uno hace el 100 % de lo suyo.</div>';
 var kpi='<div class="kpis">'+
   '<div class="kpi"><b>'+pasos.length+'</b>pasos compartidos</div>'+
   (nSup?'<div class="kpi"><b>'+nSup+'</b>sin definir (va mitad y mitad)</div>':'')+
 '</div>';

 if(!pasos.length){canvas.innerHTML=note+kpi+'<div class="empty">Hoy ningún paso lo hacen dos talleristas.</div>';return;}

 var H="";
 pasos.forEach(function(p){
  var talls=(p.talleristas||[]);
  var cab=talls.map(function(t){
   return '<th>'+esc(t.tallerista)+'<span class="pct">'+pctTxt(t.pct)+
     (t.es_supuesto?' <span class="sup">(sin definir)</span>':'')+'</span></th>';
  }).join("");
  var filas=(p.partes||[]).map(function(pa){
   var celdas=talls.map(function(t){
    var x=(pa.por_tall||[]).filter(function(y){return y.tall_id===t.tall_id;})[0];
    var m=x?x.maximo:null;
    return '<td class="'+(m==null?"sinmax":"max")+'">'+maxTxt(m)+'</td>';
   }).join("");
   return '<tr><td class="parte"><span class="pc">'+esc(pa.cod)+'</span>'+esc(pa.desc||"")+'</td>'+celdas+'</tr>';
  }).join("");
  H+='<div class="paso"><div class="paso-head">'+
      '<span class="cod">'+esc(p.art_codigo)+'</span>'+
      '<span class="fam">'+esc(p.familia||"")+'</span>'+
      '<span class="tag"><span class="pc">'+esc(p.paso_cod)+'</span> '+esc(p.paso_desc||"")+'</span>'+
     '</div><div class="tbl-wrap"><table><thead><tr><th>Parte que recibe</th>'+cab+'</tr></thead>'+
     '<tbody>'+(filas||'<tr><td class="parte" colspan="'+(talls.length+1)+'">(sin partes registradas)</td></tr>')+
     '</tbody></table></div></div>';
 });

 canvas.innerHTML=note+kpi+H;
}

function __run(){
 document.getElementById("btnCsv").addEventListener("click",function(){
  var out=[["Art_Codigo","Familia","Paso_cod","Paso_desc","Tallerista","Proporcion_pct","Parte_cod","Parte_desc","Maximo"]];
  (D.pasos||[]).forEach(function(p){
   (p.talleristas||[]).forEach(function(t){
    (p.partes||[]).forEach(function(pa){
     var x=(pa.por_tall||[]).filter(function(y){return y.tall_id===t.tall_id;})[0];
     out.push([p.art_codigo,p.familia||"",p.paso_cod,p.paso_desc||"",t.tallerista,t.pct,
               pa.cod,pa.desc||"",x&&x.maximo!=null?x.maximo:""]);
    });
   });
  });
  GP2UI.exportarCSV("proporciones_"+GP2UI.hoyAR(),out);
 });
}

async function __boot(){
 try{
  document.body.style.cursor="progress";
  __run();
  var r=await SB.rpc("proporciones_bundle");
  if(r.error)throw r.error;
  D=r.data||{};
  render();
 }catch(e){
  document.getElementById("canvas").innerHTML='<div class="empty" style="color:#982e16">Error cargando datos de Supabase: '+esc(e.message||e)+'</div>';
  console.error(e);
 }finally{document.body.style.cursor="";}
}
__boot();
</script>
</body></html>
