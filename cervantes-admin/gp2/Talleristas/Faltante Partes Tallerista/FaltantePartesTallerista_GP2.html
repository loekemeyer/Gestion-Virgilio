<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faltante Partes Tallerista · GP2</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#ebeff4;color:#385475;font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
 .top{background:linear-gradient(90deg,#e7f0f8,#e7f0f8);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
 .top h1{margin:0;font-size:16px}
 .top .sel{display:flex;gap:8px;align-items:center;font-size:12px;flex-wrap:wrap}
 select,input,button{background:#eaeff6;color:#385475;border:1px solid #cddaea;border-radius:6px;padding:6px 10px;font-size:18px;font-family:inherit}
 input{width:200px}
 button{cursor:pointer}
 button:hover{background:#e8eef7}
 label.chk{display:flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
 label.chk input{width:auto}
 .canvas{padding:14px;min-height:calc(100vh - 50px)}
 .note{background:#f5eeea;border:1px solid #eadbcd;color:#8e4c20;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px}
 .kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
 .kpi{background:#ebf0f5;border:1px solid #d1dae6;border-radius:8px;padding:6px 12px;font-size:11px;color:#475569}
 .kpi b{color:#166398;font-size:15px;margin-right:4px}
 .tall-card{background:#ebf0f5;border:1px solid #d1dae6;border-radius:10px;margin-bottom:12px;overflow:hidden}
 .tall-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#e8eef7;cursor:pointer}
 .tall-head .nm{font-size:14px;font-weight:800;color:#385775}
 .tall-head .cod{font-size:11px;color:#475569;font-weight:400;margin-left:6px}
 .tall-head .tot{display:flex;gap:6px;flex-wrap:wrap}
 .pill{padding:2px 10px;border-radius:10px;font-weight:700;font-size:12px;background:#eaeff5}
 .pill.pend{color:#986d16;background:#f5f2ea}
 .pill.pos{color:#258858;background:#eaf5ef}
 .pill.neg{color:#982e16;background:#f5eceb}
 .tbl-wrap{overflow-x:auto}
 table{width:100%;border-collapse:collapse;font-size:12px}
 th,td{padding:6px 10px;text-align:right;border-bottom:1px solid #d0dae7;white-space:nowrap}
 th{background:#eaeff6;color:#475569;text-transform:uppercase;font-size:10px;letter-spacing:.4px;position:sticky;top:50px}
 th.l,td.l{text-align:left}
 td.cod{font-family:ui-monospace,SF Mono,monospace;color:#165d98;font-weight:600}
 td.desc{color:#385775;max-width:320px;overflow:hidden;text-overflow:ellipsis}
 td.sec{color:#475569}
 td.env{color:#258858}
 td.ent{color:#166398}
 td.saldo{font-weight:800}
 td.saldo.pos{color:#986d16}
 td.saldo.neg{color:#982e16}
 tr.neg-row td{background:#f4edeb}
 .flag{color:#8e4c20;font-size:10px}
 .empty{padding:30px;text-align:center;color:#475569}
</style><link rel="icon" type="image/png" href="../../GP2_favicon.png">
<link rel="apple-touch-icon" href="../../GP2_favicon.png">
<link rel="stylesheet" href="../../gp2-claro.css?v=20260903b">
</head>
<body>
<div id="gp2-logobar" style="position:relative;background:#e8edf7;text-align:center;padding:6px 0;border-bottom:1px solid #d0dae7"><a href="../../GP2_MODULOS.html" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#385475;text-decoration:none;font-weight:700;font-size:15px;padding:5px 10px;border:1px solid #d1d9e5;border-radius:8px;background:#e9eef7">← Atrás</a><a href="../../GP2_MODULOS.html" style="text-decoration:none"><img src="../../GP2_logo.png" alt="GP2 · Gestión Productiva" style="height:40px;vertical-align:middle"></a></div>

<div class="top">
 <h1>📦 Faltante Partes Tallerista <span style="font-size:11px;color:#2a5783;font-weight:400">· GP2</span></h1>
 <div class="sel">
  <select id="fTall" style="display:none"><option value="">Todos</option></select>
  <input id="fBuscar" type="text" placeholder="Buscar código, descripción, sector…">
  <label class="chk"><input id="fSoloPos" type="checkbox"> Solo pendiente (saldo &gt; 0)</label>
  <button id="btnCsv">⬇ Exportar CSV</button>
 </div>
</div>
<div id="tallChips" class="provs-grid" style="display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 0"></div>
<div class="canvas" id="canvas"><div class="empty">Cargando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase-config.js?v=20260905k"></script>
<script src="../../gp2-ui.js?v=20260905a"></script>
<script src="../../gp2-numero.js?v=20260905m"></script>
<script>var D={};
var SB=GP2_SB();

var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function fmt(n){ return GP2N.fmt(n, 2); }   /* la regla de numero de la casa (gp2-numero.js) */
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}

function partesFiltradas(t,q,soloPos){
 var arr=t.partes||[];
 if(soloPos)arr=arr.filter(function(p){return Number(p.saldo||0)>0;});
 if(!q)return arr;
 return arr.filter(function(p){
  return norm(p.cod).indexOf(q)>=0||norm(p.desc).indexOf(q)>=0||norm(p.sector).indexOf(q)>=0;
 });
}

function __run(){
 var canvas=document.getElementById("canvas");
 var fTall=document.getElementById("fTall");
 var fBuscar=document.getElementById("fBuscar");
 var fSoloPos=document.getElementById("fSoloPos");

 // poblar dropdown de talleristas
 (D.talleristas||[]).forEach(function(t){
  var o=document.createElement("option");o.value=String(t.id);o.textContent=t.nombre;fTall.appendChild(o);
 });

 // chips de tallerista (estilo GP viejo)
 (function(){
  var cg=document.getElementById("tallChips"); if(!cg)return;
  function chip(val,label){
   var b=document.createElement("button"); b.className="prov-btn"+(fTall.value===val?" active":""); b.type="button";
   b.textContent=label;
   b.addEventListener("click",function(){
    fTall.value=val;
    cg.querySelectorAll(".prov-btn").forEach(function(x){x.classList.remove("active");});
    b.classList.add("active");
    fTall.dispatchEvent(new Event("change"));
   });
   cg.appendChild(b);
  }
  cg.innerHTML="";
  chip("","Todos");
  (D.talleristas||[]).forEach(function(t){ chip(String(t.id), t.nombre+(t.cod_prov?(" ("+t.cod_prov+")"):"")); });
 })();

 function render(){
  var tallSel=fTall.value;
  var q=norm(fBuscar.value.trim());
  var soloPos=fSoloPos.checked;
  var lista=(D.talleristas||[]).filter(function(t){return !tallSel||String(t.id)===tallSel;});

  var totPend=0,totNeg=0,totPares=0,hayFlag=false,vistos=0;
  var H="";

  lista.forEach(function(t){
   var partes=partesFiltradas(t,q,soloPos);
   if(!partes.length)return;
   vistos++;
   var sPend=0,sNeg=0;
   partes.forEach(function(p){
    var sal=Number(p.saldo||0);
    if(sal>0)sPend+=sal;else if(sal<0)sNeg+=sal;
    totPares++;
    if(p.kg_sin_factor)hayFlag=true;
   });
   totPend+=sPend;totNeg+=sNeg;

   var rows="";
   partes.forEach(function(p){
    var saldo=Number(p.saldo||0);
    var neg=saldo<0;
    var kgTxt=(p.enviado_kg&&Number(p.enviado_kg)>0)?(fmt(p.enviado_kg)+" kg"):"";
    rows+='<tr'+(neg?' class="neg-row"':'')+">"+
      '<td class="l cod">'+esc(p.cod)+(p.kg_sin_factor?' <span class="flag" title="envío en kg sin factor kg_x_uni">⚠</span>':'')+"</td>"+
      '<td class="l desc" title="'+esc(p.desc)+'">'+esc(p.desc)+"</td>"+
      '<td class="l sec">'+esc(p.sector)+"</td>"+
      '<td class="env">'+fmt(p.enviado)+"</td>"+
      '<td class="ent">'+fmt(p.entregado)+"</td>"+
      '<td class="ent">'+fmt(p.devuelto)+"</td>"+
      '<td class="saldo '+(neg?"neg":"pos")+'">'+fmt(saldo)+"</td>"+
      '<td class="sec" style="font-size:11px">'+kgTxt+"</td>"+
    "</tr>";
   });

   H+='<div class="tall-card">'+
     '<div class="tall-head">'+
       '<div><span class="nm">'+esc(t.nombre)+'</span>'+(t.cod_prov?'<span class="cod">'+esc(t.cod_prov)+'</span>':'')+' <span class="cod">· '+partes.length+' partes</span></div>'+
       '<div class="tot">'+
         '<span class="pill pend">Pendiente '+fmt(sPend)+'</span>'+
         '<span class="pill neg">Negativo '+fmt(sNeg)+'</span>'+
         '<span class="pill '+((sPend+sNeg)<0?"neg":"pos")+'">Saldo neto '+fmt(sPend+sNeg)+'</span>'+
       '</div>'+
     '</div>'+
     '<div class="tbl-wrap"><table><thead><tr>'+
       '<th class="l">Código</th><th class="l">Descripción</th><th class="l">Sector</th>'+
       '<th>Enviado (uni)</th><th>Entregado (uni)</th><th>Devuelto (uni)</th><th>Saldo (uni)</th><th>Env (kg)</th>'+
     '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '</div>';
  });

  var kpi='<div class="kpis">'+
    '<div class="kpi"><b>'+vistos+'</b>talleristas</div>'+
    '<div class="kpi"><b>'+totPares+'</b>partes</div>'+
    '<div class="kpi"><b>'+fmt(totPend)+'</b>pendiente en poder (uni)</div>'+
    '<div class="kpi"><b>'+fmt(totNeg)+'</b>saldo negativo (uni)</div>'+
    '<div class="kpi"><b>'+fmt(totPend+totNeg)+'</b>saldo neto (uni)</div>'+
  '</div>';

  var note='<div class="note">📦 <b>Faltante = saldo pendiente en poder del tallerista</b> (enviado − entregado − devuelto). Positivo = todavía no lo devolvió; negativo = devolvió más de lo que figura enviado. ⚠ El ledger GP2 es <b>parcial</b>: falta cargar producción / stock inicial, por eso muchos saldos dan <b>negativos</b>. Es lo esperado en esta etapa — los datos se muestran tal cual, sin corregir. Enviado normalizado a unidades vía <code>kg_x_uni</code> (envíos originales mayormente en kg); entregas siempre en unidades.'+(hayFlag?' <b>⚠ Hay componentes con envío en kg sin factor de conversión</b> (marcados con ⚠, no sumados en unidades).':'')+'</div>';

  canvas.innerHTML=note+kpi+(H||'<div class="empty">Sin resultados para el filtro.</div>');
 }

 fTall.addEventListener("change",render);
 fBuscar.addEventListener("input",render);
 fSoloPos.addEventListener("change",render);

 document.getElementById("btnCsv").addEventListener("click",function(){
  var tallSel=fTall.value;
  var q=norm(fBuscar.value.trim());
  var soloPos=fSoloPos.checked;
  var lista=(D.talleristas||[]).filter(function(t){return !tallSel||String(t.id)===tallSel;});
  var out=[["Tallerista","Cod_Prov","Codigo","Descripcion","Sector","Enviado_uni","Entregado_uni","Devuelto_uni","Saldo_uni","Enviado_kg","kg_sin_factor"]];
  lista.forEach(function(t){
   partesFiltradas(t,q,soloPos).forEach(function(p){
    out.push([t.nombre,t.cod_prov||"",p.cod,p.desc,p.sector,p.enviado,p.entregado,p.devuelto,p.saldo,p.enviado_kg,p.kg_sin_factor?"SI":""]);
   });
  });
  var csv=out.map(function(r){return r.map(function(c){var s=String(c==null?"":c);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(";");}).join("\r\n");
  var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="faltante_partes_tallerista_"+GP2UI.hoyAR()+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
 });

 render();
}

async function __boot(){
 try{
  document.body.style.cursor="progress";
  var r=await SB.rpc("faltante_partes_tallerista_bundle");
  if(r.error)throw r.error;
  Object.assign(D,r.data);
  __run();
 }catch(e){
  document.getElementById("canvas").innerHTML='<div class="empty" style="color:#982e16">Error cargando datos de Supabase: '+esc(e.message||e)+'</div>';
  console.error(e);
 }finally{document.body.style.cursor="";}
}
__boot();
</script>
</body></html>
