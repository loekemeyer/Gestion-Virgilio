     (a) La columna Precio pasa de texto a CAMPO: arranca con el de la lista
         (precio_proveedor) y lo que se escriba pisa SOLO esta OC — el campo queda en
         ambar y debajo se ve el de lista para no perder la referencia. Vaciarlo vuelve
         al de lista. Al lado, un boton de moneda US$/$ (hace falta: hay insumos con
         sugerido y SIN precio de lista, hoy BOM10, CV13 y CV18D). Subtotales y totales
         de la barra siguen el precio pisado. NO se toca precio_proveedor: la lista
         oficial se sigue cargando por su lado.
     (b) crear_oc ahora RESPETA ese precio (antes lo pisaba siempre con el de la lista,
         mandaras lo que mandaras) — migracion oc_precio_editable_y_fecha_entrega.
     (c) BUG: la fecha de entrega estimada se elegia en pantalla, viajaba a la RPC y se
         PERDIA. La columna orden_compra.fecha_entrega_estimada existia pero el insert
         nunca la escribia. Ahora se guarda, en la OC y en sus gemelas (Altrak/Aperam).
     v1.7.1 — MODULO COMPLETO DE OC POR PROVEEDOR (usuario 2026-09-03: "desarrolla el
     modulo completo para la generacion de OCs de los insumos de todos los proveedores.
     Con el maximo que hablamos. Tiene que funcionar contra el stock actual y el maximo.
     Y la orden debe generarse prolija con un lugar para poner la fecha de entrega
     estimada x prov"):
     (1) TODOS LOS PROVEEDORES: la botonera de proveedor se muestra SIEMPRE (antes solo
         aparecia con un rubro elegido y 2+ proveedores, asi que habia proveedores a los
         que no se les podia armar la OC). El proveedor es la eleccion principal — la OC
         sale con SUS insumos — y el rubro quedo como filtro de arriba: al cambiarlo el
         proveedor solo se limpia si ese proveedor no vende nada del rubro nuevo.
     (2) CONTRA EL MAXIMO: columna Maximo (con su origen EM/fisico/5 caj) al lado de
         Stock y Pend. OC, y debajo del sugerido la cuenta que lo explica
         ("max - stock"). El numero lo calcula el backend (oc_bundle):
         sugerido = max(0, maximo - stock)  [sin pendiente_oc desde 2026-09-04].
     (3) FECHA DE ENTREGA ESTIMADA por OC: se propone sola con los dias_entrega del
         proveedor (hoy + dias), se puede pisar a mano y viaja a crear_oc como
         p_fecha_entrega (ademas de p.fecha_entrega). Se ve en la tarjeta de la OC.
     (4) HOJA IMPRESA PROLIJA: membrete, bloque de datos con la entrega estimada
         destacada, tabla con cebra y totales por moneda, y pie de firmas.
     v1.6.0 — esCharcasIt() detecta por proveedor solo (ya no filtra por sector 12).
     Motivo: migracion f90(_v2) y f90b (2026-09-02) movieron F90 (id 372) y F90B
     (id 373) al sector 5 (Fleje) con unidad='kg'. La OC a Charcas sigue pidiendo
     en paquetes de 10 kg y disparando OC gemela a Altrak por kg de ALAM_FILTRO.
     v1.5.0 — OC A ECLIPSE TAMBIÉN DISPARA OC GEMELA A APERAM (Fase 4 modelo Aperam->Eclipse->Cervantes, usuario 2026-09-01: "con altrak y charcas sucede lo mismo con aperam y Eclipse"). crear_oc en Supabase agrega el caso: si proveedor='Eclipse', suma kg_chapa = Σ (uni × kg_x_uni) por item, aplica desperdicio (parametro eclipse_desperdicio_pct=0 default) y crea OC gemela a 'Aperam' con esos kg de CHAPA430. Frontend muestra el N° de la gemela y sus kg en el success box. oc_bundle ya trae 1686 (sector 14 esta en _es_sector_insumo). v1.4.0 — OC A CHARCAS DISPARA OC GEMELA A ALTRAK (Fase 4 modelo Altrak->Charcas->Cervantes, usuario 2026-09-01: "a la par que se emite la orden a charcas se tiene que emitir la orden al track, porque en realidad charcas lo unico que hace es transforma el material del track"). oc_bundle amplia el where con OR proveedor='Resortes Charcas' para que 031/034 aparezcan en el listado; su stock online se busca en Virgilio (ubic 33). Nuevo helper JS esCharcasIt(i)+uniPorPaqCharcas(i): cuando el proveedor es Charcas, el sugerido se convierte de uni a paquetes de 10 kg (round up); el input queda en paquetes con "= N uni" al lado; el submit manda unidad='paq'. La RPC crear_oc detecta proveedor='Resortes Charcas' y crea automaticamente una segunda OC a 'Altrak' con Σ (paquetes × 10 × (1+desperdicio/100)) kg de ALAM_FILTRO, y enlaza las dos por numero en la nota. Success muestra el N° de la gemela y sus kg. v1.3.0 — la OC sale VALORIZADA: precio vigente y subtotal por insumo (precio_proveedor,
     hoy regulacion 1 USD / $1000 cajas), total de lo pedido en la barra (US$ y $ separados,
     + equivalente en pesos con el dolar del cron), precios y total en la hoja de impresion,
     y cada OC guarda la foto historica del precio al crearla (crear_oc). v1.2.0 — la celda de consumo es TOCABLE: abre el sustento por articulo
     (consumo-detalle.js, RPC consumo_detalle). El bundle ademas ya sale de
     v_consumo_componente / v_consumo_fleje_kg (atribucion por articulo; hasta el 2026-09-05 se llamaba _v2).
     v1.1.1 — fix: "Pedir" acepta decimales es-AR (12,5 ya no se convertía en 125) y la OC solo lleva los items del rubro/proveedor seleccionado. v1.1.0 — Ordenes de Compra de insumos: sugerido = consumo Est Madre x meses - stock - pendiente OC; imprimir OC -->

<style>

  #panOcs tr.rc-par td{background:#fef3c7}

  /* Cuadro sinoptico (v1.35.0): la tabla abraza el dato, sin 100% de ancho ni anchos fijos. */
  /* table.t (gp2-modulo.css) pone width:100% y le ganaba a .t-insumos: por eso los huecos (v1.39.0). */
  table.t.t-insumos{width:auto}
  #panGen .table-wrap{width:fit-content;max-width:100%}
  /* v1.44.0: ENCABEZADOS FIJOS al bajar [Thomas 2026-09-29: "quiero que en todas las o.c. me aparezcan los
     encabezados fijos para que cuando baje siga leyendo los encabezados"]. Para que el sticky pegue contra
     la pagina, el .table-wrap no puede ser un contenedor de scroll: en escritorio va overflow visible; en
     el celular (<=700px) se queda con el scroll horizontal y sin sticky, porque ahi la tabla es mas ancha
     que la pantalla y la regla de la casa es que la pagina nunca scrollee de costado. */
  @media (min-width:701px){
    #panGen .table-wrap, #panOcs .table-wrap{overflow:visible}
    #panGen table.t thead th, #panOcs table.t thead th{position:sticky;top:0;z-index:3}

  tr.fila-alt{cursor:pointer}
  .barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;padding:8px 10px;background:#f6f8fa;border-radius:10px;width:fit-content;max-width:100%;box-sizing:border-box}
  .barra .tot{font-size:17px;font-weight:800}
  .barra input[type=text]{padding:10px;min-height:44px;font-size:18px;border:2px solid #d0d7de;border-radius:8px;width:200px}
  .btn-crear{padding:12px 22px;font-size:18px;font-weight:800;border-radius:8px;border:2px solid #111;background:#111;color:#fff;cursor:pointer}
  .btn-crear:disabled{opacity:.4;cursor:default}
  .acc-crear{margin:0 0 10px}
  td.um-cell{white-space:nowrap;font-weight:700;color:#333}
  .btn-sug{padding:11px 14px;min-height:44px;font-size:16px;font-weight:700;border-radius:8px;border:2px solid #ead9cd;background:#fff;color:#b45309;cursor:pointer}
  .btn-limpiar{padding:11px 14px;min-height:44px;font-size:16px;font-weight:700;border-radius:8px;border:2px solid #d0d7de;background:#fff;cursor:pointer}
  .regla-carton{border:2px solid #eae0cd;background:#fff8e1;color:#7a5b00;border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
  .regla-carton.mal{border-color:#eacdcd;background:#ffebee;color:#b71c1c}
  .oc-card{border:2px solid #d0d7de;border-radius:12px;padding:14px;margin:10px 0;background:#fff}
  .oc-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .oc-head .num-oc{font-size:20px;font-weight:800}
  .badge{padding:4px 12px;border-radius:14px;font-size:13px;font-weight:800}
  .badge.borrador{background:#f6f8fa;color:#555;border:1px solid #d0d7de}
  .badge.enviada{background:#e3f2fd;color:#0b3b73}
  .badge.recibida{background:#e8f5e9;color:#0a7a2f}
  .badge.anulada{background:#ffebee;color:#b71c1c}
  .oc-acts{margin-left:auto;display:flex;gap:8px}
  .oc-acts button{padding:8px 12px;font-size:14px;font-weight:700;border-radius:8px;border:2px solid #d0d7de;background:#fff;cursor:pointer}
  .oc-acts button.wpp{border-color:#25d366;color:#0a7a2f;background:#eafff1}
  .oc-acts button.anu{border-color:#eacdcd;color:#c62828}
  /* Filtros: DOS bloques separados, Sector arriba y Proveedor abajo. Cada uno es su propia
     caja, con la etiqueta pegada adentro a la izquierda; antes las dos botoneras se leian
     como una sola corrida [usuario 2026-09-21: "separame bien lo que es sector y proveedor
     porque no se entiende bien la separacion"]. La caja ABRAZA su contenido (inline-flex):
     con un sector elegido queda chica, sin barra vacia a lo ancho. */
  .filtros{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin:10px 0 12px}
  /* align-items:flex-start: con la botonera en dos renglones, la etiqueta queda arriba,
     a la altura del primer chip, y no flotando en el medio. */
  .filtro{display:inline-flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:0;max-width:100%;
          border:2px solid #dbe3ec;border-radius:14px;background:#f6f8fa;padding:8px 14px 8px 8px}
  .filtro-lb{font-size:14px;font-weight:800;color:#0b3b73;text-transform:uppercase;letter-spacing:.5px;
             background:#fff;border:2px solid #dbe3ec;border-radius:10px;padding:0 14px;
             min-height:44px;display:inline-flex;align-items:center}
  /* flex:1 para que los chips queden AL LADO de la etiqueta y envuelvan entre ellos: sin esto,
     una botonera larga (11 proveedores) se va entera abajo y la etiqueta se come un renglon. */
  .filtro .chips{margin:0;flex:1;min-width:0}
  /* "Todos" NO es un sector: se distingue del que quedo elegido para que no se confundan. */
  .chip.todos{background:#fff;border-style:dashed;border-color:#0b3b73;color:#0b3b73}
  .prov-info{background:#f6f8fa;border:2px solid #e6ebf0;border-radius:10px;padding:9px 12px;font-size:15px;color:#333;margin:8px 0;width:fit-content;max-width:100%;box-sizing:border-box}
  #panGen .search-box{width:fit-content;max-width:100%;box-sizing:border-box;padding:8px;margin:8px 0}
  #panGen .search-box input{width:320px;max-width:100%}
  .sub-nota{display:block;font-size:12px;color:#777;font-weight:400}

  /* ventanita flotante del desglose (v1.36.0): se abre al pasar por el Maximo */

  table.dsg th{font-size:13px;color:#475569}
  table.dsg td.l,table.dsg th.l{text-align:left}
  table.dsg td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.dsg tfoot td{font-weight:700;border-top:2px solid #cbd5e1}
  .rep-tag{display:block;font-size:12px;font-weight:700;white-space:nowrap}
  .rep-pend{color:#0b3b73}
  td.bajo-min b, td.bajo-min{color:#b71c1c}
  .campo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .badge.entrega{background:#fff3e0;color:#8a4b00;border:1px solid #f0d9b5}
  /* v1.40.0 — TODO CENTRADO Y LA TARJETA DEL ANCHO DEL DATO [Thomas 2026-09-28: "quiero que este todo
     centrado y sin tanto blanco. Si es necesario pone proveedores sobrantes abajo"]. La tarjeta toma el
     ancho de la TABLA (fit-content); los filtros y el cartel del proveedor no cuentan para ese ancho
     (contain:inline-size) y sus chips bajan de renglon. Piso de 720px para que sin tabla (antes de

  .card{width:fit-content;min-width:min(100%,720px);max-width:100%}
  .card:has(#zonaLista:not(.hidden)){min-width:0}   /* v1.45.1: con tabla, la tarjeta abraza la tabla */
  .filtros,#reglaCarton,#panOcs,#elegiSector,#tblEmpty,#status{contain:inline-size}
  /* v1.40.1: botones, filtros, buscador y Crear OC alineados a la IZQUIERDA [Thomas: "todo esto alineacion a la izquierda"] */

<body>

<!-- Desglose del Máximo (v1.36.0): ventanita flotante, se abre al pasar el mouse por la celda. -->
<div class="dsg-pop" id="dsgPop" hidden></div>

<div class="card">
  <div class="header">
    <h1>Órdenes de Compra · Insumos</h1>
    <div class="hbtns"><a href="../GP2_MODULOS.html">Atrás</a></div>
  </div>

  <div class="steps">
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabGen">Generar OC</button>
      <button type="button" class="tab-btn" id="tabOcs">Órdenes <span id="ocsN"></span></button>
    </div>

    <div id="panGen">
      <div class="filtros">
        <div class="filtro"><span class="filtro-lb">Sector</span><div class="chips" id="rubros"></div></div>
        <div class="filtro hidden" id="filtroProv"><span class="filtro-lb">Proveedor</span><div class="chips" id="provs"></div></div>
      </div>
      <div class="prov-info hidden" id="provInfo"></div>
      <div class="regla-carton hidden" id="reglaCarton"></div>
      <!-- Sin sector ni proveedor elegido no se muestra NADA de la lista [usuario
           2026-09-04: "si no pongo el sector y no pongo el proveedor, que no me aparezca
           la lista"]: la pantalla arranca en los botones de sector y nada mas. -->
      <div id="zonaLista" class="hidden">
      <!-- v1.37.0 [Thomas 2026-09-28: "de todo esto quede el boton de Crear O.C. nomas. Que aparezca
           abajo de Buscar Insumo"]. Usar sugeridos, Limpiar, total, Entrega y Nota quedan OCULTOS, no
           borrados: la fecha se sigue proponiendo sola (hoy + dias_entrega) y viaja a crear_oc, y el
           total sigue calculandose por si se vuelve a pedir. -->
      <div class="hidden" id="barraOculta">
        <button type="button" class="btn-sug" id="btnSug">Usar sugeridos</button>
        <button type="button" class="btn-limpiar" id="btnLimpiar">Limpiar</button>
        <span class="tot" id="tot">0 ítems</span>
        <input type="date" id="fechaEnt" aria-label="Entrega">
        <input type="text" id="nota" aria-label="Nota">
      </div>

      <div class="search-box"><input type="text" id="q" placeholder="Buscar insumo…"></div>
      <div class="acc-crear"><button type="button" class="btn-crear" id="btnCrear" disabled>Crear OC</button></div>
      <div class="table-wrap">
        <table class="t t-insumos">
          <thead><tr>
            <th>Insumo</th><th>Proveedor</th>
            <th class="num">Stock<br>actual</th><th class="num">Máximo</th>
            <th class="num">Pedir</th><th>Uni<br>Medida</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="tblEmpty" class="empty hidden">Sin insumos en este sector.</div>
      </div>
      <div id="elegiSector" class="empty">Elegí un <b>sector</b> arriba para ver los insumos y armar la orden.</div>
    </div>

    <div id="panOcs" class="hidden">
      <div id="ocsList"></div>
      <div id="ocsEmpty" class="empty hidden">Todavía no hay órdenes de compra.</div>
    </div>

    <div id="status" class="status">Cargando…</div>
  </div>
</div>

<script>
var SB = GP2_SB();
var $ = GP2UI.$;
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function fmt(n,d){ return GP2N.fmt(n, d==null?0:d, '—'); }   /* la regla de numero de la casa; '—' sin valor */
// es-AR: punto = miles, coma = decimal ("12,5" -> 12.5; antes parseInt borraba la coma y daba 125)
/* La regla de numero es la de la casa y vive en gp2-numero.js (idea 7217).
   Esta pantalla ya la aplicaba bien; ahora la comparte en vez de repetirla. */
function parseNum(s){ var x=GP2N.num(s); return x<0?0:x; }
// total mixto: nunca inventar tipo de cambio propio — solo mostrar el del cron si vino.
function fmtTotalMon(usd, ars){
  var partes=[];
  if(usd>0) partes.push('US$ '+fmt(usd,2));
  if(ars>0) partes.push('$ '+fmt(ars,2));
  return partes.length?partes.join(' + '):'—';
}

// Fechas: el <input type=date> trabaja en ISO (aaaa-mm-dd) y en pantalla va dd/mm/aaaa.
// Se arma en hora LOCAL a proposito (toISOString correria un dia con el huso de AR).
function isoLocal(d){
  var m=String(d.getMonth()+1), dd=String(d.getDate());
  return d.getFullYear()+'-'+(m.length<2?'0':'')+m+'-'+(dd.length<2?'0':'')+dd;
}
function hoyMas(dias){ var d=new Date(); d.setDate(d.getDate()+(Number(dias)||0)); return isoLocal(d); }
/* La fecha en dd/mm/aaaa es la de la casa: GP2UI.fechaAR (gp2-ui.js). Esta pantalla tenia
   su propia copia, identica, como otras dos. Se deja el nombre local para no tocar las llamadas. */
var fmtFecha = GP2UI.fechaAR;
// Lectura tolerante del bundle: el contrato nuevo manda stock / consumo_uni_mes / maximo,
// el viejo mandaba online / consumo. La pantalla entiende los dos y no se rompe si falta.
function vStock(i){ return i.stock!=null ? Number(i.stock) : (i.online!=null?Number(i.online):null); }
function vConsumo(i){ return i.consumo_uni_mes!=null ? Number(i.consumo_uni_mes) : (i.consumo!=null?Number(i.consumo):null); }
function vMaximo(i){ return i.maximo!=null ? Number(i.maximo) : null; }
function vPend(i){ return Number(i.pendiente_oc)||0; }
/* EL GATILLO DE REPOSICION ES EL MAXIMO [usuario 2026-09-14, textual: "lo de minimo
   borralo. la orden de compra tiene que disparar segun el maximo. es algo que habiamos
   hecho mal" / "todo lo que usaba el minimo ahora que use el maximo. es la misma logica"].
   La v1.21.0 habia metido un punto de pedido aparte (inventario.minimo): el minimo
   disparaba y el maximo dimensionaba. Esa columna se borro de la base el 14-09 y con ella
   el estado intermedio. Ahora hay una sola pregunta y un solo numero:
     'pedir'       stock < maximo  -> falta para llegar al techo, se carga solo.
     'sin-gatillo' no hay maximo o no hay stock -> se carga solo igual. Es a proposito:
                   ante la duda, que NO se esconda algo que hace falta.
   Ya no existe el estado 'viaje': lo que esta abajo del maximo se pide. */
function estadoRepo(i){
  var st=vStock(i), mx=vMaximo(i);
  if(st==null || mx==null) return 'sin-gatillo';
  return st<mx ? 'pedir' : 'lleno';
}
// La OC guarda la fecha en orden_compra.fecha_entrega_estimada y asi la emite oc_bundle;
// el payload que se MANDA a crear_oc la llama fecha_entrega. Se leen las dos: la fecha ya se
// perdio una vez por esta diferencia de nombre (ver changelog v1.18.0) y no se pierde de nuevo.
function vFechaEnt(o){ return o.fecha_entrega_estimada || o.fecha_entrega || ''; }

var D={}, PAQ=250, PAQ_PLIEGO=100, rubroSel=null, provSel=null;
var PEDIDO={}; // comp_id -> cantidad
/* Insumos que el usuario DEJO VACIOS a proposito. Como el sugerido ahora se carga
   solo en "Pedir", sin esta marca cada render volveria a llenar lo que el acaba de
   borrar. Se limpia con "Usar sugeridos". */
var SIN_PEDIDO={}; // comp_id -> true
/* Precio y Subtotal SALIERON DE LA TABLA en v1.18.0 [usuario 2026-09-04: "precio se va
   y subtotal tambien"]. La pantalla de pedir quedo en lo fisico (que hay, cuanto entra,
   cuanto pido) y la plata se mira en la barra de abajo y en la OC ya creada.
   El precio NO desaparecio del circuito: precioDe/monedaDe siguen leyendo el de
   precio_proveedor (que llega en el bundle), valorizan el total de la barra, viajan a
   crear_oc y son los que salen en la hoja impresa. Lo unico que ya no se puede es
   PISARLO desde esta pantalla. Estos dos objetos son el canal: si vuelve a hacer falta
   pisarlo, se repone la celda y funciona. */
var PRECIO={};   // comp_id -> precio pisado
var MONEDA={};   // comp_id -> 'USD' | 'ARS' pisada
/* UN INSUMO PUEDE COMPRARSE A MAS DE UN PROVEEDOR (2026-09-17, usuario: "en las ordenes de
   compra tendrias que agregar a recicor tambien"). componente.proveedor sigue siendo el
   PRINCIPAL; los demas que entregan lo mismo viven en GP2.componente_proveedor_alt y llegan
   en i.proveedores_alt. Todo filtro por proveedor de esta pantalla pasa por esDelProv():
   comparar i.proveedor===provSel a mano deja al proveedor alternativo con la lista vacia. */
function provsDeInsumo(i){
  if(!i) return [];
  var l = i.proveedor ? [i.proveedor] : [];
  (Array.isArray(i.proveedores_alt) ? i.proveedores_alt : []).forEach(function(p){
    if(p && l.indexOf(p)<0) l.push(p);
  });
  if(!l.length) l.push('(sin proveedor)');
  return l;
}
function esDelProv(i, p){ return p==null || provsDeInsumo(i).indexOf(p)>=0; }
/* El proveedor con el que se esta armando la OC (para mostrarlo en la fila): si hay uno
   elegido y este insumo es suyo, ese; si no, el principal de la ficha. */
function provDeFila(i){
  if(provSel!=null && provSel!=='(sin proveedor)' && esDelProv(i, provSel)) return provSel;
  return i.proveedor || '—';
}
/* Celda Proveedor: el nombre y nada mas. v1.48.0 [Thomas 2026-09-30: "No quiero que me aparezcan los
   precios aca. Solo en el modulo de ordenes. Para poner a recicor repeti el item del componente y ya"]:
   el alternativo ya no es un boton con precio debajo del principal; sin proveedor elegido, render()
   repite la fila del insumo a nombre de cada alternativo (filasAlt). */
function provCelda(i){ return esc(provDeFila(i)); }
function filasAlt(i, st, mx, bajoMin, um){
  if(provSel!=null) return '';
  return provsDeInsumo(i).slice(1).map(function(p){
    return '<tr class="fila-alt" data-alt-prov="'+esc(p)+'" title="Tocar para armar la OC a '+esc(p)+'">'+
      '<td><b>'+esc(i.codigo||'—')+'</b><br><small style="color:#777">'+esc(i.descripcion||'')+
        '<span class="prov-mini"> · '+esc(p)+'</span></small></td>'+
      '<td>'+esc(p)+'</td>'+
      '<td class="num'+(bajoMin?' bajo-min':'')+'">'+(st==null?'—':(fmt(st)+' '+esc(i.unidad)))+'</td>'+
      '<td class="num">'+(mx==null?'—':fmt(mx))+'</td>'+
      '<td class="num"></td>'+
      '<td class="um-cell">'+esc(um.lbl)+'</td>'+
    '</tr>';
  }).join('');
}
/* PRECIO POR PROVEEDOR: la hoja que se le manda a cada uno tiene que salir con SU lista
   (Recicor cotiza las cajas ~19% mas barato que Corrugadora). i.precios_prov trae el precio
   de cada proveedor que cotiza el componente; i.precio sigue siendo el VIGENTE (el del
   proveedor asignado), que es el que usa el costo. */
function precioProvSel(i){
  var m = i && i.precios_prov;
  if(provSel!=null && m && m[provSel] && m[provSel].precio!=null) return m[provSel];
  return null;
}
function precioDe(i){
  if(PRECIO[i.comp_id]!=null) return PRECIO[i.comp_id];
  var pp=precioProvSel(i);
  if(pp) return Number(pp.precio);
  // Se esta comprando a un proveedor que NO es el de la ficha y que no tiene lista propia
  // para esta pieza: se deja sin precio. Ponerle el del otro seria inventar plata en la
  // hoja que se le manda al proveedor.
  if(provSel!=null && i.proveedor && provSel!==i.proveedor) return null;
  return i.precio!=null?Number(i.precio):null;
}
function monedaDe(i){
  if(MONEDA[i.comp_id]) return MONEDA[i.comp_id];
  var pp=precioProvSel(i);
  if(pp && pp.moneda) return pp.moneda;
  return i.moneda || 'ARS';
}
// Fecha de entrega: se propone sola (hoy + dias_entrega del proveedor). Si el usuario la
// pisa a mano, se respeta mientras siga en el mismo proveedor.
var fechaTocada=false, fechaTocadaProv=null;

async function boot(){
  var r=await SB.rpc('oc_bundle');
  if(r.error){ $('status').textContent='Error: '+r.error.message; return; }
  D=r.data||{};
  PAQ=Number(D.paq)||250;
  await cargarReglasRubro();
  pintarRubros();
  proponerFecha();
  pintarOcs();
  $('status').textContent='';
}

/* Pliegos por paquete: el pliego se pide y se recibe de a 100 [usuario 2026-09-03:
   "los pliegos del quinientos, quinientos seis y bombillas se tienen en paquetes de
   100 pliegos"]. Vive en GP2.parametro y llega en el bundle; el 100 de aca es solo
   el default por si el parametro no esta. */
function paqPliego(){ return Number(D.pliego_uni_x_paquete)||PAQ_PLIEGO; }

/* El RUBRO de la OC es el SECTOR del componente, con dos reglas de PANTALLA
   [usuario 2026-09-04]: el Alambre (13) se muestra dentro de Fleje (5) —el alambre es
   materia prima del fleje— y el Procesado (2) NO se pide por OC (Eclipse es proveedor de
   SERVICIO, no de insumo). Es mapeo de pantalla: NO toca la base. Si algún día se baja a
   datos, se saca de acá. */
/* Desde el 2026-09-04 la regla VIVE EN LA BASE: GP2.sector.oc_rubro_id (a que rubro sube
   este sector) y GP2.sector.oc_pide (si se compra por OC). Lo de aca abajo es solo el
   FALLBACK por si la consulta falla, para que la pantalla nunca quede sin agrupar.
   No se movio el sector fisico de ningun componente a proposito: el sector es la ZONA
   FISICA y moverlo corrompe el stock. */
var RUBRO_MAP={13:5};          // alambre -> fleje
var RUBRO_OCULTO={2:true};     // procesado (serigrafia = servicio) no se compra por OC
async function cargarReglasRubro(){
  try{
    var r=await SB.from('sector').select('id,oc_rubro_id,oc_pide');
    if(r.error || !r.data || !r.data.length) return;   // se queda con el fallback
    var map={}, ocu={};
    r.data.forEach(function(s){
      var id=Number(s.id);
      if(s.oc_rubro_id!=null && Number(s.oc_rubro_id)!==id) map[id]=Number(s.oc_rubro_id);
      if(s.oc_pide===false) ocu[id]=true;
    });
    RUBRO_MAP=map; RUBRO_OCULTO=ocu;
  }catch(e){ /* sin conexion a la tabla: fallback */ }
}
function rubroDe(i){ var s=Number(i.sector_id); return RUBRO_MAP[s]||s; }
function ocultoRubro(i){ return !!RUBRO_OCULTO[Number(i.sector_id)]; }
// Nombre del rubro: prioriza el sector canónico (5 = "Fleje"), no el del alambre mapeado.
function nombreRubro(id){
  var xs=(D.insumos||[]);
  var it=xs.filter(function(x){ return Number(x.sector_id)===id; })[0]
       || xs.filter(function(x){ return rubroDe(x)===id; })[0];
  return it ? String(it.sector).replace(/^Sector\s+/i,'') : String(id);
}
function rubrosDistintos(){
  var seen={}, out=[];
  (D.insumos||[]).forEach(function(i){
    if(ocultoRubro(i)) return;
    var id=rubroDe(i);
    if(!seen[id]){ seen[id]=true; out.push({id:id, nombre:nombreRubro(id)}); }
  });
  return out;
}

function pintarRubros(){
  var g=$('rubros'); g.innerHTML='';
  function elegir(id){
    rubroSel=id;
    // El proveedor NO se limpia siempre: solo si ya no vende nada de este rubro. Asi se
    // puede elegir primero el proveedor (que es como se arma la OC) y despues afinar.
    if(provSel!=null && provsDistintos().indexOf(provSel)<0) provSel=null;
    pintarRubros();
    proponerFecha();
  }
  // CON UN SECTOR ELEGIDO SE VE SOLO ESE CHIP + "Todos" [usuario 2026-09-21: "cuando toco
  // un sector me desaparezca el resto de los sectores y ademas haya un boton que diga
  // Todos"]. Los 9 sectores ocupaban dos renglones incluso despues de elegir uno.
  var lista=rubrosDistintos();
  if(rubroSel!=null) lista=lista.filter(function(rb){ return rb.id===rubroSel; });
  lista.forEach(function(rb){
    var b=document.createElement('button'); b.type='button'; b.className='chip'+(rubroSel===rb.id?' active':''); b.textContent=rb.nombre;
    b.addEventListener('click',function(){ elegir(rubroSel===rb.id?null:rb.id); });
    g.appendChild(b);
  });
  // "Todos" suelta el sector y devuelve la botonera entera. Sin sector no hay lista
  // (regla del 2026-09-04), asi que vuelve a verse el cartel que pide elegir uno.
  if(rubroSel!=null){
    var t=document.createElement('button'); t.type='button'; t.className='chip todos'; t.id='rubroTodos'; t.textContent='Todos';
    t.addEventListener('click',function(){ elegir(null); });
    g.appendChild(t);
  }
  pintarProvs();
  render();
}

// Todos los proveedores que tienen insumos en el rubro elegido (o TODOS si no hay rubro).
// Antes esta lista solo aparecia con un rubro elegido y 2+ proveedores: a un proveedor
// solitario o de varios rubros no se le podia armar la OC.
function provsDistintos(){
  var seen={}, out=[];
  (D.insumos||[]).forEach(function(i){
    if(ocultoRubro(i)) return;
    if(rubroSel!=null && rubroDe(i)!==rubroSel) return;
    // Principal + alternativos: una caja que entregan Corrugadora y Recicor da los DOS chips.
    provsDeInsumo(i).forEach(function(p){ if(!seen[p]){ seen[p]=true; out.push(p); } });
  });
  out.sort(function(a,b){ return String(a).localeCompare(String(b),'es'); });
  return out;
}

function pintarProvs(){
  var g=$('provs'), wrap=$('filtroProv'), info=$('provInfo');
  g.innerHTML='';
  // Los proveedores NO se muestran hasta tocar un rubro [usuario 2026-09-04:
  // "que no me aparezcan los proveedores, y cuando toco el rubro que aparezcan"].
  if(rubroSel==null){
    if(provSel!=null) provSel=null;
    if(wrap) wrap.classList.add('hidden');
    if(info) info.classList.add('hidden');
    return;
  }
  if(wrap) wrap.classList.remove('hidden');
  if(info) info.classList.remove('hidden');
  provsDistintos().forEach(function(p){
    var b=document.createElement('button'); b.type='button'; b.className='chip'+(provSel===p?' active':''); b.textContent=p;
    b.addEventListener('click',function(){
      provSel=(provSel===p?null:p);
      pintarProvs(); proponerFecha(); render();
    });
    g.appendChild(b);
  });
  pintarProvInfo();
}

// Datos del proveedor tal como los manda oc_bundle (lista proveedores con dias_entrega).
function nombreProv(p){ return String((p&&(p.nombre||p.proveedor||p.prov))||''); }
function provInfo(nom){
  if(!nom) return null;
  var k=String(nom).trim().toLowerCase(), ps=D.proveedores||[];
  for(var x=0;x<ps.length;x++) if(nombreProv(ps[x]).trim().toLowerCase()===k) return ps[x];
  return null;
}
function diasEntregaProv(nom){
  var p=provInfo(nom), d=p?Number(p.dias_entrega):NaN;
  if(!(isFinite(d)&&d>0)){
    // por si el plazo viaja en la fila del insumo en vez de la lista de proveedores
    var it=(D.insumos||[]).filter(function(i){ return (i.proveedor||'')===nom && i.dias_entrega!=null; })[0];
    d = it?Number(it.dias_entrega):NaN;
  }
  return (isFinite(d)&&d>0)?d:null;
}

function pintarProvInfo(){
  var el=$('provInfo');
  if(!el) return;
  // Sin proveedor no hay cartel [v1.35.0: "elimina todos esos textos"].
  el.classList.toggle('hidden', provSel==null);
  if(provSel==null){ el.innerHTML=''; return; }
  var xs=(D.insumos||[]).filter(function(i){
    return esDelProv(i, provSel) && (rubroSel==null || i.sector_id===rubroSel);
  });
  var conSug=xs.filter(function(i){ return i.sugerido>0; }).length;
  var d=diasEntregaProv(provSel);
  el.innerHTML='<b>'+esc(provSel)+'</b> · '+xs.length+' insumo'+(xs.length===1?'':'s')+
    ' · '+conSug+' con sugerido'+(d!=null?(' · entrega en '+d+' día'+(d===1?'':'s')):' · sin plazo de entrega cargado');
}

// Propone hoy + dias_entrega del proveedor. No pisa lo que el usuario escribio a mano
// mientras siga parado en el mismo proveedor.
function proponerFecha(){
  var inp=$('fechaEnt');
  if(!inp) return;
  if(!(fechaTocada && fechaTocadaProv===provSel)){
    var d=(provSel!=null)?diasEntregaProv(provSel):null;
    inp.value = (d!=null) ? hoyMas(d) : '';
    fechaTocada=false; fechaTocadaProv=null;
  }
}

/* Sin sector NI proveedor elegido no hay lista [usuario 2026-09-04: "si no pongo el
   sector y no pongo el proveedor, que no me aparezca la lista"]. Devolver [] de una
   tiene un efecto de fondo: cargarSugeridos() tampoco carga nada, asi que la pantalla
   ya no arranca con TODOS los insumos de la fabrica con cantidad puesta. */
function haySeleccion(){ return rubroSel!=null || provSel!=null; }
function filtradas(){
  if(!haySeleccion()) return [];
  var q=($('q').value||'').trim().toLowerCase();
  return (D.insumos||[]).filter(function(i){
    if(ocultoRubro(i)) return false;
    if(rubroSel!=null && rubroDe(i)!==rubroSel) return false;
    if(!esDelProv(i, provSel)) return false;
    if(q && !(((i.codigo||'')+' '+(i.descripcion||'')+' '+provsDeInsumo(i).join(' ')).toLowerCase().includes(q))) return false;
    return true;
  });
}

function esCharcasIt(i){
  // Cualquier componente cuyo proveedor sea Resortes Charcas se pide en paquetes
  // de 10 kg. Antes filtraba tambien por sector_id=12; desde la migracion
  // f90_alambre_filtro_cafe_y_cod_prov_charcas_v2 (2026-09-02) los flejes F90/F90B
  // viven en sector 5 (Fleje). uniPorPaqCharcas() sigue valido: 10 / kg_x_uni.
  // v1.38.0: SOLO sus flejes (sector 5). Los resortes que Charcas nos VENDE (EP10, LLF8, BOM10,
  // sector 7) se reciben en UNIDADES y se piden en unidades [Thomas 2026-09-28: "los resortes
  // batidor los pido en unidades"]; con el paquete, 3 paq de EP10 viajaban como 30 kg.
  return i && String(i.proveedor||'').trim().toLowerCase()==='resortes charcas' && Number(i.sector_id)===5;
}

/* ═══ UNIDAD DEL REMITO (v1.38.0) ═══
   La O.C. se pide en la MISMA unidad en que llega el remito [Thomas 2026-09-28: "te dije en todas
   las recepciones con que unidad de medida va el remito. Usa las mismas para las ordenes de compra"].
   Es la misma decision, en el mismo orden, que abrirPopup() de StockFlejes/RecepcionInsumos_GP2.html:
   si se cambia alla, se cambia aca. Devuelve {lbl, k}: lo que se ve en "Pedir" = PEDIDO × k.
   PEDIDO sigue guardado en la unidad del bundle (i.unidad) — asi el carton sigue validando sus
   multiplos en unidades y a crear_oc viaja lo mismo que antes. */
var PLAST_UNI=['eduardo pintos','pat bet plast','pettofrezza rafael'];   // = RecepcionInsumos
function umRemito(i){
  var canon = i.unidad==='kg' ? 'kg' : 'uni';
  if(esCharcasIt(i)) return {lbl:'paq '+fmt(kgPorPaqCharcas())+' kg', k:1};   // PEDIDO ya va en paq
  var kx=Number(i.kg_x_uni)||0, r=String(i.remito_unidad||'').toLowerCase(), u=null;
  if(r==='envase' && Number(i.entrega_uni_x)>0 && canon==='uni')
    return {lbl:String(i.entrega_unidad||'envases')+' '+fmt(i.entrega_uni_x), k:1/Number(i.entrega_uni_x)};
  if(r==='kg' || r==='uni') u=r;
  else if(GP2UI.esCarton(i)) u = i.es_pliego ? 'uni' : 'paq';
  else if([7,8,11].indexOf(Number(i.sector_id))>=0) u='uni';
  else if(Number(i.sector_id)===6 && PLAST_UNI.indexOf(String(provDeFila(i)||'').trim().toLowerCase())>=0) u='uni';
  else if(Number(i.sector_id)===5){
    var pv=String(provDeFila(i)||'').trim().toLowerCase();
    u = (pv==='basconia'||pv==='altrak'||pv==='altrack') ? 'kg' : (String(i.um||'')==='unidad' ? 'uni' : 'kg');
  }
  else if(i.recibe_en_cajas) u='kg';
  else u=canon;
  if(u==='paq' && canon==='uni') return {lbl:'paq '+fmt(PAQ), k:1/PAQ};
  if(u===canon) return {lbl:u, k:1};
  // kg <-> uni: sin kg_x_uni no se puede convertir y queda la unidad del bundle (no se inventa)
  if(!(kx>0)) return {lbl:canon, k:1};
  return u==='kg' ? {lbl:'kg', k:kx} : {lbl:'uni', k:1/kx};
}
// numero para el campo: hasta 2 decimales, coma decimal
function valCampo(n){ var r=Math.round(n*100)/100; return String(r).replace('.',','); }
// Kg de producto por paquete de Charcas: vive en GP2.parametro (charcas_kg_x_paquete) y llega
// en el bundle; el 10 de aca es solo el default por si el parametro no esta. crear_oc usa el
// mismo parametro para guardar la OC en kg (la pantalla manda paquetes con unidad 'paq').
function kgPorPaqCharcas(){ return Number(D.charcas_kg_x_paquete)||10; }
// Uni por paquete de Charcas: kg del paquete / kg_x_uni. Sin el factor NO hay conversion
// (regla unica GP2N.aUni, la misma que "GP2".to_canonical): devuelve 0 y quien llama ya
// contempla ese caso (valorSugerido cae al sugerido en unidades).
function uniPorPaqCharcas(i){
  var u = GP2N.aUni(i && i.kg_x_uni, kgPorPaqCharcas());
  return u === null ? 0 : Math.round(u);
}

// Uni por bolsa de la parte plastica: el inyector entrega en bolsas de N uni y se pide
// por bolsa entera [usuario 2026-09-16: "segun la cantidad de uni que entran por bolsa...
// si entran 250 por bolsa y segun maximo tengo que pedir 960 -> sugerido -> 1000"]. El
// dato es componente.uni_x_cajon (viaja en el bundle) y SOLO aplica a las partes
// plasticas (Sector Plástico = 6): en otros sectores uni_x_cajon es otra cosa (el cajon
// de despacho), no la unidad de compra, asi que ahi no se redondea. Los 14 codigos de
// sector 6 sin uni_x_cajon cargado quedan sin redondear (no se inventa la bolsa).
var SECTOR_PARTE_PLASTICA = 6;
function uniPorBolsa(i){
  if(!i || Number(i.sector_id)!==SECTOR_PARTE_PLASTICA) return 0;
  var b=Number(i.uni_x_cajon)||0;
  return b>0 ? b : 0;
}
// Cuanto se carga en "Pedir" cuando se toma el sugerido. Charcas viene en uni y se
// pide en paquetes de 10 kg: se convierte y se redondea PARA ARRIBA (no quedar corto).
// La parte plastica se redondea PARA ARRIBA al multiplo de la bolsa (uni_x_cajon).
function valorSugerido(i){
  if(!(i && i.sugerido>0)) return 0;
  if(esCharcasIt(i)){
    var uxp=uniPorPaqCharcas(i);
    if(uxp>0) return Math.max(1, Math.ceil(i.sugerido/uxp));
  }
  var b=uniPorBolsa(i);
  if(b>0) return techo(i.sugerido, b);   // 960 con bolsa 250 -> 1000
  return i.sugerido;
}

/* El sugerido se carga SOLO en "Pedir" [usuario 2026-09-04: "que me aparezca el
   sugerido directamente en pedir"]. Ya no hay columna Sugerido para tocar: la fila
   llega con la cantidad puesta y el que quiera cambiarla la pisa, y el que no quiera
   pedir ese insumo VACIA el campo (queda en SIN_PEDIDO y no se vuelve a llenar).
   Solo se llenan las filas VISIBLES: lo de otro rubro/proveedor no se toca. */
function cargarSugeridos(){
  var toco=false;
  filtradas().forEach(function(i){
    if(PEDIDO[i.comp_id]!=null || SIN_PEDIDO[i.comp_id]) return;
    // El gatillo (v1.26.0): lo que ya llego al maximo NO se carga solo.
    if(estadoRepo(i)==='lleno') return;
    // Y lo que YA se pidio y viene en camino tampoco: se avisa en la fila y decide el
    // usuario. Es AVISO, no resta -- la resta se saco en v1.19.x porque rompia la cuenta
    // a la vista [usuario 2026-09-04: "por ahora borralo"].
    if(vPend(i)>0) return;
    var v=valorSugerido(i);
    if(v>0){ PEDIDO[i.comp_id]=v; toco=true; }
  });
  // El carton se pide por familia: si entro un sugerido nuevo, se redondea al
  // multiplo para que la OC no nazca invalida (misma logica que "Usar sugeridos").
  if(toco) ajustarPedidoCarton();
}

/* Debajo de Pedir queda SOLO el aviso de lo que ya viene en camino: es lo unico que explica
   por que una fila abajo del maximo llega vacia. Los cartelitos "sugerido N · max − stock" y
   "hay que pedir / no hace falta" se sacaron en v1.35.0 [Thomas 2026-09-28: "elimina todos esos
   textos"]: el stock en rojo ya dice que esta abajo del maximo. */
function notaRepo(i){
  var out='';
  var pe=vPend(i);
  if(pe>0) out+='<span class="rep-tag rep-pend">ya pediste '+fmt(pe)+' '+esc(i.unidad||'')+' (en camino)</span>';
  return out;
}

// El PEDIDO MINIMO POR PIEZA (componente.pedido_minimo_uni), debajo del campo Pedir [usuario
// 2026-09-28: "cargá esos mínimos y que me aparezca abajo del 2 que aparece en la columna pedir"].
// Es un dato a la vista, no un freno (el recuadro amarillo con "Subir al minimo" se saco el 14-09
// y no vuelve): el comprador ve cuanto pide el proveedor como minimo y decide. Para Charcas, que se
// pide en paquetes, se muestra tambien el equivalente en paquetes (round up). Se marca "corto"
// cuando lo pedido queda por debajo del minimo.
function notaMinUni(i, ped, esChar, uxpChar, um){
  var m = Number(i.pedido_minimo_uni)||0;
  // v1.42.0: en el CARTON el minimo tambien es POR CARTON (componente.pedido_minimo_uni, cargado
  // desde la planilla: 12.000 / 16.000 / 25.000 / 30.000 / 18.000 / 24.000 segun el carton), aunque
  // se agrupen por familia [Thomas 2026-09-29: "En cartones los minimos son por carton, aunque
  // esten agrupados por familia"]. La v1.41.0 mostraba aca la tirada de la familia
  // (pliegos_multiplo); era una lectura equivocada de la planilla y se saco.
  // v1.43.0: si la pieza tiene familia de pedido, el minimo es de la familia y se lee en su titulo.
  if(i.familia_pedido) return '';
  if(m<=0) return '';
  var pedUni = esChar ? (Number(ped)||0)*uxpChar : (Number(ped)||0);
  var corto = pedUni>0 && pedUni<m;
  // v1.44.0: el minimo se lee PRIMERO en la unidad de la O.C. (la del remito: kg, paq, cajas...) y
  // entre parentesis en la unidad del stock [Thomas 2026-09-29: "el min es en kg en este caso, creo que
  // siempre los min es la unidad de medida que aparece en el remito de recepcion y en la columna de la
  // orden de compra"]. En la base sigue en la unidad canonica (uni o kg); la conversion es la misma
  // que usa el campo Pedir (umRemito). Clavo 505: 1.000 kg (= 153.139 uni).
  var canon = i.unidad==='kg' ? 'kg' : 'uni';
  var txt;
  if(esChar && uxpChar>0) txt = 'mín. pedido '+fmt(Math.ceil(m/uxpChar))+' paq (= '+fmt(m)+' uni)';
  else if(um && um.k!==1) txt = 'mín. pedido '+fmt(m*um.k, um.lbl==='kg'?2:0)+' '+esc(um.lbl)+' (= '+fmt(m)+' '+canon+')';
  else txt = 'mín. pedido '+fmt(m)+' '+canon;   // v1.43.1 [Thomas: 'que me diga min. pedido en vez de min. proveedor']
  return '<span class="min-uni'+(corto?' corto':'')+'">'+txt+'</span>';
}

// v1.42.0: los CARTONES se listan SEPARADOS POR FAMILIA (formato + marca + categoria), con un
// renglon de titulo por familia [Thomas 2026-09-29: "quiero que en la o.c. me separes por familia"].
// El orden dentro de la familia es el que ya venia (el del bundle). Los demas sectores no cambian.
// v1.43.0: el PLASTICO tambien va agrupado, por FAMILIA DE PEDIDO (componente.familia_pedido = las
// piezas de la misma matriz del inyector) y el minimo del proveedor es de la familia, no de la pieza
// [Thomas 2026-09-29: "el minimo va por familia, no por parte. Entre todos los pirolos tengo que
// llegar a 36000"]. El titulo de la familia muestra el minimo y lo pedido entre todas sus piezas
// (rojo si no llega); no frena. Las piezas sin familia van al final, sin titulo.
function pedidoUniDe(i){
  var ped=Number(PEDIDO[i.comp_id])||0;
  if(esCharcasIt(i)) return ped*uniPorPaqCharcas(i);
  return ped;
}
function conTitulosDeFamiliaPlastico(fs){
  var plas=fs.filter(function(i){ return i.sector_id===6; });
  if(!plas.length) return null;
  var resto=fs.filter(function(i){ return i.sector_id!==6; });
  var grupos={}, orden=[];
  // v1.43.1: lo que no tiene familia va junto en "Otros" [Thomas 2026-09-29: "todos aquellos que
  // no tengan una familia barra formato, que me los metan en la familia o formato otros"].
  // v1.44.1: "Otros" es UN solo titulo, con las piezas ORDENADAS por proveedor adentro [Thomas
  // 2026-09-29: "Que los otros esten bajo un solo encabezado pero que esten ordenados por proveedor"].
  // (La v1.43.2 abria un titulo por proveedor; duro un rato.) Los cartones no cambian.
  plas.forEach(function(i){
    var k=i.familia_pedido ? String(i.familia_pedido) : 'Otros';
    if(!grupos[k]){ grupos[k]=[]; orden.push(k); }
    grupos[k].push(i);
  });
  if(grupos['Otros']) grupos['Otros'].sort(function(a,b){
    var pa=String(provDeFila(a)||''), pb=String(provDeFila(b)||'');
    return pa.localeCompare(pb,'es') || String(a.codigo||'').localeCompare(String(b.codigo||''),'es');
  });
  orden.sort(function(a,b){ if(a==='Otros') return 1; if(b==='Otros') return -1; return a.localeCompare(b,'es'); });
  var out=[];
  orden.forEach(function(k){
    var xs=grupos[k], m=(k==='Otros')?0:(Number(xs[0].familia_minimo)||0);
    var tot=xs.reduce(function(a,i){ return a+pedidoUniDe(i); },0);
    var corto=m>0 && tot>0 && tot<m;
    out.push({hdr:k+' · '+xs.length+(xs.length===1?' pieza':' piezas')+
                  (m>0?(' · mín. familia '+fmt(m)+' uni · pedido '+fmt(tot)+' uni'):''), corto:corto});
    xs.forEach(function(i){ out.push({it:i}); });
  });
  return out.concat(ordenadoPorProveedor(resto).map(function(i){ return {it:i}; }));
}

// v1.45.0: los DEMAS sectores (fleje, remache, bombilla, garage, caja, bolsas plasticas) van ORDENADOS
// por proveedor y despues por codigo, sin titulos [Thomas 2026-09-29: "quiero que en la parte de todos
// los provs (cuando no filtro por prov) igualmente este ordenado por prov sin encabezados, solo ordenado"].
function ordenadoPorProveedor(fs){
  return fs.slice().sort(function(a,b){
    var pa=String(provDeFila(a)||''), pb=String(provDeFila(b)||'');
    return pa.localeCompare(pb,'es') || String(a.codigo||'').localeCompare(String(b.codigo||''),'es');
  });
}

function conTitulosDeFamilia(fs){
  var carton=fs.filter(function(i){ return i.sector_id===10; });
  if(!carton.length) return conTitulosDeFamiliaPlastico(fs) || ordenadoPorProveedor(fs).map(function(i){ return {it:i}; });
  var otros=ordenadoPorProveedor(fs.filter(function(i){ return i.sector_id!==10; }));
  var grupos={}, orden=[];
  // v1.42.1: SOLO por formato [Thomas 2026-09-29: "Solo por formato, ni por marca ni por familia
  // de articulo"]. famKey (formato + marca + categoria) sigue siendo la familia de la REGLA de
  // pedido; aca es solo como se ordena la tabla.
  function grupoDe(i){ return i.es_pliego ? 'Pliegos' : (i.carton_formato ? 'Formato '+String(i.carton_formato) : 'Otros'); }
  carton.forEach(function(i){
    var k=grupoDe(i);
    if(!grupos[k]){ grupos[k]=[]; orden.push(k); }
    grupos[k].push(i);
  });
  orden.sort(function(a,b){ if(a==='Otros') return 1; if(b==='Otros') return -1; return a.localeCompare(b,'es'); });
  var out=otros.map(function(i){ return {it:i}; });
  orden.forEach(function(k){
    out.push({hdr:k+' · '+grupos[k].length+(grupos[k].length===1?' cartón':' cartones')});
    grupos[k].forEach(function(i){ out.push({it:i}); });
  });
  return out;
}

function render(){
  cargarSugeridos();
  var fs=filtradas();
  $('tbody').innerHTML=conTitulosDeFamilia(fs).map(function(fila){
    if(fila.hdr) return '<tr class="fam-hdr'+(fila.corto?' corto':'')+'"><td colspan="6">'+esc(fila.hdr)+'</td></tr>';
    var i=fila.it;
    var ped=PEDIDO[i.comp_id]||'';
    var esCarton=GP2UI.esCarton(i);   /* el 10 vive en gp2-ui.js (idea 7334) */
    var esChar=esCharcasIt(i);
    var uxpChar=esChar ? uniPorPaqCharcas(i) : 0;
    var bolsa=uniPorBolsa(i);
    var st=vStock(i), mx=vMaximo(i), pe=vPend(i);
    var bajoMin=(mx!=null && st!=null && st<Number(mx));
    // Charcas: input en PAQUETES; el sugerido se convierte a paq (round up).
    // Parte plastica: se muestra en cuantas BOLSAS enteras cae lo pedido.
    // La equivalencia se muestra al lado del input.
    var um=umRemito(i);
    // v1.44.2: SIN equivalencias debajo del campo ("= 227 bolsas de 150", "= 11.000 uni", "= N paq")
    // [Thomas 2026-09-29: "Estas aclaraciones no las quiero, solo el min pedido"]. Queda la linea del
    // minimo (notaMinUni) y el "ya pediste N (en camino)" (notaRepo). El campo ya va en la unidad del
    // remito, asi que la equivalencia no agregaba nada.
    var paqEq='';
    return '<tr data-id="'+i.comp_id+'"'+(ped>0?' class="con-pedido"':'')+'>'+
      '<td><b>'+esc(i.codigo||'—')+'</b><br><small style="color:#777">'+esc(i.descripcion||'')+
        (i.carton_formato?(' · Formato '+esc(i.carton_formato)):'')+
        // En el celular la columna Proveedor se esconde (no entraba y dejaba "Pedir"
        // fuera de pantalla) y el proveedor se lee acá mismo. Nada se pierde.
        '<span class="prov-mini"> · '+esc(provDeFila(i))+'</span></small></td>'+
      '<td>'+provCelda(i)+'</td>'+
      // El "mín N" debajo del stock se saco [usuario 2026-09-04: "eso no lo quiero ver"].
      // El stock se pinta en rojo cuando esta abajo del MAXIMO (el minimo se borro el 14-09).
      '<td class="num'+(bajoMin?' bajo-min':'')+'">'+(st==null?'—':(fmt(st)+' '+esc(i.unidad)))+'</td>'+
      // El origen del maximo (fisico / EM / migrado) NO se muestra en la fila
      // [usuario 2026-09-16: "no quiero que me especifique de donde sale el maximo"].
      // Sigue disponible en el desglose que se abre al tocar el Maximo.
      '<td class="num'+(mx!=null?' max-cell" data-max="'+i.comp_id+'" title="Ver de qué se compone':'')+'">'+(mx==null?'—':fmt(mx))+'</td>'+
      '<td class="num"><input class="pedir-in" data-in="'+i.comp_id+'" inputmode="decimal" value="'+(ped?valCampo(ped*um.k):'')+'" placeholder="'+esc(um.lbl)+'">'+
        notaMinUni(i, ped, esChar, uxpChar, um)+paqEq+
        notaRepo(i)+'</td>'+
      '<td class="um-cell">'+esc(um.lbl)+'</td>'+
    '</tr>'+filasAlt(i, st, mx, bajoMin, um);
  }).join('');
  // Toda la zona de armar la OC (buscador, leyenda, tabla y barras) aparece recien
  // cuando hay sector o proveedor elegido; hasta entonces solo se ve el cartel.
  $('zonaLista').classList.toggle('hidden', !haySeleccion());
  $('elegiSector').classList.toggle('hidden', haySeleccion());
  $('tblEmpty').classList.toggle('hidden', fs.length>0);
  // "Aprovechar el viaje" se saco el 2026-09-14 junto con el minimo: era la valvula de
  // escape del gatillo viejo (sumar a mano lo que estaba arriba del minimo). Con el
  // maximo como unico gatillo no queda nada afuera que aprovechar — todo lo que esta
  // abajo del techo ya entra solo, y lo que llego al techo tiene sugerido 0.

  document.querySelectorAll('.pedir-in').forEach(function(inp){
    inp.addEventListener('change',function(){
      var v=parseNum(inp.value);
      var id=Number(inp.dataset.in);
      // Vaciar el campo = "este no lo pido": queda anotado en SIN_PEDIDO para que el
      // sugerido NO se vuelva a cargar solo en el proximo render.
      // Lo tipeado esta en la unidad del remito; PEDIDO se guarda en la del bundle.
      var itv=(D.insumos||[]).filter(function(x){ return x.comp_id===id; })[0];
      var k=itv?umRemito(itv).k:1;
      if(v>0 && k!==1){ v=v/k; if(itv.unidad!=='kg') v=Math.round(v); }
      if(v>0){ PEDIDO[id]=v; delete SIN_PEDIDO[id]; }
      else { delete PEDIDO[id]; SIN_PEDIDO[id]=true; }
      render(); barra();
    });
  });
  // Fila repetida del proveedor alternativo: tocarla equivale a tocar su chip arriba.
  document.querySelectorAll('tr.fila-alt').forEach(function(b){
    b.addEventListener('click', function(){ provSel=b.dataset.altProv; pintarProvs(); proponerFecha(); render(); });
  });
  // Tocar el Máximo abre el desglose: de dónde sale ese número.
  document.querySelectorAll('td.max-cell').forEach(function(td){
    // Mouse: se abre al pasar por arriba y se cierra al salir. Solo pointerType 'mouse': un
    // toque tambien dispara "enter" y abriria y cerraria en el mismo gesto.
    td.addEventListener('pointerenter', function(e){ if(e.pointerType==='mouse'){ DSG_HOVER=true; abrirDesglose(Number(td.dataset.max), td); } });
    td.addEventListener('pointerleave', function(e){ if(e.pointerType==='mouse'){ DSG_HOVER=false; if(!DSG_FIJA) cerrarDesglose(); } });
    // Clic (mouse o toque): la FIJA para poder bajar por la lista [Thomas 2026-09-29]. Un segundo clic
    // sobre la misma celda, un clic afuera o Escape la cierran.
    td.addEventListener('click', function(e){
      e.stopPropagation();
      if(DSG_FIJA && DSG_TD===td){ cerrarDesglose(); return; }
      DSG_FIJA=true; $('dsgPop').classList.add('fija');
      if(DSG_TD!==td || $('dsgPop').hidden) abrirDesglose(Number(td.dataset.max), td);
    });
  });
  barra();
}

/* ═══ Desglose del Máximo (RPC oc_maximo_desglose) ═══
   Al tocar el Máximo se ve de qué se compone: cuántos meses, el consumo/mes y qué lo arma
   — por ARTÍCULO (con su venta de est_madre y lo que consume del insumo) o, en la resina,
   por PIEZA. Siempre en unidades y, si hay kg_x_uni, también en kg. [usuario 2026-09-14] */
var DSG_CACHE={}, DSG_TD=null, DSG_HOVER=false, DSG_FIJA=false;
async function abrirDesglose(compId, td){
  DSG_TD=td;
  var pop=$('dsgPop');
  if(!DSG_CACHE[compId]){
    pop.innerHTML='<p class="dsg-vacio">Cargando…</p>'; ubicarDesglose(); pop.hidden=false;
    var r=await SB.rpc('oc_maximo_desglose',{p_componente_id:compId});
    if(r.error){ if(DSG_TD===td){ pop.innerHTML='<p class="dsg-vacio">'+esc(r.error.message)+'</p>'; ubicarDesglose(); } return; }
    DSG_CACHE[compId]=r.data||{};
  }
  if(DSG_TD!==td) return;   // el mouse ya se fue a otra celda (o afuera) mientras llegaba la RPC
  pop.innerHTML=htmlDesglose(DSG_CACHE[compId]);
  pop.hidden=false; ubicarDesglose();
}
/* SOLO la tabla por articulo (o por pieza en la resina) [Thomas 2026-09-28: "solo esos datos. El
   resto no lo quiero"]: sin titulo, sin Maximo/Origen/Meses/Consumo y sin aviso. */
function htmlDesglose(d){
  var c=d.comp||{}, hayKg=c.es_resina||c.es_fleje||c.kg_x_uni!=null;
  // Mayor → menor por lo que consume: lo que mas pesa en el maximo, arriba.
  var filas=(d.filas||[]).slice().sort(function(a,b){ return (Number(b.aporte_uni_mes)||0)-(Number(a.aporte_uni_mes)||0); });
  if(!filas.length) return '<p class="dsg-vacio">Sin demanda registrada.</p>';
  var pz=d.base==='piezas', totUni=0, totKg=0;
  var head='<tr><th class="l">'+(pz?'Pieza':'Artículo')+'</th>'+(pz?'':'<th>Venta<br>(uni/mes)</th>')+
    '<th>Consume<br>(uni/mes)</th>'+(hayKg?'<th>kg/mes</th>':'')+'</tr>';
  var rows=filas.map(function(f){ totUni+=Number(f.aporte_uni_mes)||0; totKg+=Number(f.aporte_kg)||0;
    return '<tr><td class="l"><b>'+esc(f.cod)+'</b> '+esc(f.desc||'')+'</td>'+
      (pz?'':'<td class="num">'+(f.venta_uni_mes==null?'—':fmt(f.venta_uni_mes))+'</td>')+
      '<td class="num">'+fmt(f.aporte_uni_mes)+'</td>'+(hayKg?'<td class="num">'+fmt(f.aporte_kg,2)+'</td>':'')+'</tr>'; }).join('');
  var foot='<tfoot><tr><td class="l">Total ('+filas.length+')</td>'+(pz?'':'<td></td>')+
    '<td class="num">'+fmt(totUni)+'</td>'+(hayKg?'<td class="num">'+fmt(totKg,2)+'</td>':'')+'</tr></tfoot>';
  return '<table class="dsg"><thead>'+head+'</thead><tbody>'+rows+'</tbody>'+foot+'</table>';
}
// Pegada a la celda: abajo si entra, si no arriba; nunca afuera de la pantalla.
function ubicarDesglose(){
  var pop=$('dsgPop'), td=DSG_TD;
  if(!td) return;
  var r=td.getBoundingClientRect(), vw=window.innerWidth, vh=window.innerHeight;
  pop.style.left='0px'; pop.style.top='0px';
  var w=pop.offsetWidth, h=pop.offsetHeight;
  var x=Math.min(Math.max(8, r.right-w), vw-w-8);
  var y=(r.bottom+6+h<=vh) ? r.bottom+6 : Math.max(8, r.top-6-h);
  pop.style.left=x+'px'; pop.style.top=y+'px';
}

/* Solo los pedidos del rubro/proveedor seleccionado: lo cargado en otros chips
   queda guardado para su propia OC, no se mezcla en la OC de este rubro. */
function itemsPedidos(){
  return (D.insumos||[]).filter(function(i){
    if(!(PEDIDO[i.comp_id]>0)) return false;
    if(ocultoRubro(i)) return false;
    if(rubroSel!=null && rubroDe(i)!==rubroSel) return false;
    if(!esDelProv(i, provSel)) return false;
    return true;
  }).map(function(i){
    // Charcas: el PEDIDO viene ya en paquetes; unidad='paq' para la RPC
    // (crear_oc se encarga de la OC gemela a Altrak).
    var u = esCharcasIt(i) ? 'paq' : i.unidad;
    return {comp_id:i.comp_id, cantidad:PEDIDO[i.comp_id], unidad:u,
            precio:precioDe(i), moneda:monedaDe(i), it:i};
  });
}

/* ===== Cartones: como se pide cada familia (REGLAS_OC_INSUMOS.md) =====
   El carton NO se pide codigo por codigo: se pide por FAMILIA. El total de la
   familia va en multiplos de pliegos_multiplo (C 12.000 · LOKE 16.000 · "8"
   30.000 · Huevo 25.000, confirmado por el usuario 2026-09-03), cada codigo de a
   codigo_multiplo (1.000) y con un MINIMO POR CODIGO FIJO — el paquete en que
   viene el carton [usuario 2026-09-03: "el paquete viene a mil, se puede recibir
   a mil"]. NO escala con el multiplo, aunque REGLAS_OC_INSUMOS.md decia que si:
   con el minimo escalado, una familia con muchos codigos no tenia NINGUN pedido
   valido (26 codigos LOKE CHEF x 1.000 ya se pasan de 16.000, y subir al multiplo
   siguiente subia tambien el minimo, asi que nunca cerraba). Con el minimo fijo
   sube el multiplo y entra. Ademas [usuario]: "los codigos de resto no siempre se
   piden, solamente se pide lo que se necesita" — el minimo corre para los codigos
   QUE ENTRAN en el pedido, no para todos los de la familia.
   La familia es formato + categoria de pliego: el tipo C agrupa por categoria
   (Pisapapas, Pelapapas, Sacacorchos, Abrelatas, Resto) y solo en Resto se puede
   mezclar cualquier codigo. Mientras carton_categoria siga vacia en la base cada
   formato es una sola familia, que es como venia funcionando. */
/* La familia de pedido es FORMATO + MARCA + CATEGORIA:
     - marca: el formato LOKE lo usan las dos marcas y NO se piden juntas [usuario
       2026-09-03: "los dos usan formato LOKE, pero una marca va con un pliego y la
       otra con el otro"]. Vale para todos los formatos: el pliego es de una marca.
     - categoria: solo el tipo C la tiene (Pelapapas, Sacacorchos, Abrelatas, Resto). */
function famKey(it){
  // El pliego no comparte familia con los cartones de su formato: es otro producto.
  if(it.es_pliego) return 'PLIEGO|'+String(it.marca||'(sin marca)')+'|';
  return String(it.carton_formato||'')+'|'+String(it.marca||'(sin marca)')+'|'+String(it.carton_categoria||'');
}
/* Base = formato + marca, sin la categoria: es el universo dentro del cual el comodin
   se puede mover (un sacacorchos LOEKE no completa un pedido CHEF). */
function famBase(it){
  if(it.es_pliego) return 'PLIEGO|'+String(it.marca||'(sin marca)');
  return String(it.carton_formato||'')+'|'+String(it.marca||'(sin marca)');
}
function famLabel(it){
  if(it.es_pliego) return 'Pliegos'+(it.marca?(' '+it.marca):'');
  return 'Formato '+String(it.carton_formato||'')+
         (it.marca?(' '+it.marca):'')+
         (it.carton_categoria?(' · '+it.carton_categoria):'');
}
/* Reglas de pedido de UN item. El PLIEGO es el caso aparte: lleva carton_formato
   porque el formato dice sus POSICIONES (para el costo), pero no se pide por la
   familia de ese formato — se pide de a 100 pliegos, y punto [usuario 2026-09-03].
   Por eso el pliego del 500 (formato C) no arrastra el multiplo de 12.000. */
function reglaDe(it){
  if(!it || it.sector_id!==10) return null;
  if(it.es_pliego){
    var q=paqPliego();
    return {pliegos_multiplo:q, codigo_multiplo:q, min_codigo_x_multiplo:q, pedido_minimo:0, pliego:true};
  }
  if(!(it.pliegos_multiplo>0)) return null;
  return {pliegos_multiplo:Number(it.pliegos_multiplo),
          codigo_multiplo:Number(it.codigo_multiplo)||1,
          min_codigo_x_multiplo:Number(it.min_codigo_x_multiplo)||0,
          // PEDIDO MINIMO de la familia: cosa distinta del multiplo. El multiplo dice de
          // a cuanto sube el total; el minimo, cuanto hay que juntar para que el proveedor
          // lo tome. Hoy solo lo tiene la Bolsa (20.000, Envases Vihal).
          pedido_minimo:Number(it.pedido_minimo)||0, pliego:false};
}
function esCartonRegla(it){ return !!reglaDe(it); }
function techo(n,m){ m=Number(m)||0; return m>0 ? Math.ceil(n/m)*m : n; }

/* Arma las familias del pedido. El COMODIN (categoria con mezcla_libre; hoy solo
   Sacacorchos) no forma familia propia: se suma a la familia de su mismo formato y
   marca a la que MAS le falta para llegar al multiplo, que es exactamente para lo
   que sirve [usuario 2026-09-03: "sacacorcho se puede mezclar con cualquiera"]. Si
   en el pedido no hay ninguna otra familia, entonces si va sola.
   Recibe [{cantidad, it}] y devuelve [{cf, lbl, xs:[...]}]. */
function gruposCarton(items){
  var g={};
  items.forEach(function(x){
    if(!esCartonRegla(x.it)) return;
    var k=famKey(x.it);
    if(!g[k]) g[k]={cf:x.it, xs:[], comodin:!!x.it.mezcla_libre};
    g[k].xs.push(x);
  });
  var fijas={}, libres={};
  Object.keys(g).forEach(function(k){
    if(g[k].comodin) (libres[famBase(g[k].cf)]=libres[famBase(g[k].cf)]||[]).push(g[k]);
    else fijas[k]=g[k];
  });
  Object.keys(libres).forEach(function(base){
    var cand=Object.keys(fijas).filter(function(k){ return famBase(fijas[k].cf)===base; });
    if(!cand.length){ libres[base].forEach(function(grp,n){ fijas[base+'|comodin'+n]=grp; }); return; }
    var elegida=cand.map(function(k){
      var pm=(reglaDe(fijas[k].cf)||{}).pliegos_multiplo||1;
      var t=fijas[k].xs.reduce(function(a,x){return a+x.cantidad;},0);
      return {k:k, falta:Math.ceil(t/pm)*pm-t};
    }).sort(function(a,b){ return b.falta-a.falta; })[0].k;
    libres[base].forEach(function(grp){
      fijas[elegida].xs=fijas[elegida].xs.concat(grp.xs);
      fijas[elegida].conComodin=true;
    });
  });
  return Object.keys(fijas).map(function(k){
    var grp=fijas[k];
    return {cf:grp.cf, xs:grp.xs,
            lbl:famLabel(grp.cf)+(grp.conComodin?' (+ sacacorchos)':'')};
  });
}

function validarCarton(items){
  var errores=[];
  gruposCarton(items).forEach(function(grupo){
    var xs=grupo.xs, cf=reglaDe(grupo.cf), lbl=grupo.lbl;
    var total=xs.reduce(function(a,x){return a+x.cantidad;},0);
    if(cf.pedido_minimo > 0 && total < cf.pedido_minimo){
      errores.push(lbl+': el pedido mínimo es '+fmt(cf.pedido_minimo)+' y hay '+fmt(total)+'.');
      return;
    }
    // v1.41.0: el MULTIPLO de la familia y el minimo por codigo YA NO frenan ni avisan aca
    // [Thomas 2026-09-28: "Que esto no aparezca", sobre el cartel rojo "Formato LOKE CHEF: el
    // total (60.000) debe ser multiplo de 16.000 / Ajustar al multiplo"]. La tirada se lee en
    // cada fila, debajo de Pedir (notaMinUni), y "Sugerir" sigue dejando el carton redondeado a
    // su familia (ajustarPedidoCarton). Lo que el comprador escribe a mano es su decision.
    // Solo queda el PISO de la familia (carton_formato.pedido_minimo: la bolsa de Vihal 20.000).
  });
  return errores;
}

/* Lleva una familia a un pedido valido, SIEMPRE para arriba (nunca deja corto lo
   que hace falta): cada codigo al multiplo de codigo, el piso por codigo, y lo
   que falte hasta el multiplo de familia repartido de a codigo_multiplo
   empezando por el que mas pidio. Devuelve {comp_id: cantidad} o null si la
   familia no tiene regla. */
function ajustarFamilia(xs){
  var cf=xs[0];
  var pm=Number(cf.pliegos_multiplo)||0, cm=Number(cf.codigo_multiplo)||1, mc=Number(cf.min_codigo_x_multiplo)||0;
  var pmin=Number(cf.pedido_minimo)||0;
  if(!(pm>0)) return null;
  var q={};
  xs.forEach(function(x){ q[x.comp_id]=techo(Math.max(0,Number(x.cant)||0), cm); });
  var ids=Object.keys(q);
  if(!ids.length) return null;
  for(var iter=0; iter<25; iter++){
    var total=ids.reduce(function(a,k){ return a+q[k]; },0);
    var mult=Math.max(1, Math.ceil(total/pm));
    // El piso de la familia manda sobre el multiplo: si 20.000 es el minimo, el pedido
    // arranca ahi aunque el consumo pida menos.
    if(pmin>0 && mult*pm < pmin) mult=Math.ceil(techo(pmin,pm)/pm);
    var minCod=mc;   // FIJO: el paquete, no una cuota que crezca con el pedido
    var subio=false;
    ids.forEach(function(k){ if(q[k]<minCod){ q[k]=techo(minCod,cm); subio=true; } });
    // Subir el piso puede empujar el total al multiplo siguiente: se recalcula.
    if(subio) continue;
    var falta=mult*pm-total;
    if(falta<=0) return q;
    var orden=ids.slice().sort(function(a,b){ return q[b]-q[a]; });
    var i=0;
    while(falta>0){ var d=Math.min(cm,falta); q[orden[i%orden.length]]+=d; falta-=d; i++; }
    return q;
  }
  return q;
}

/* Aplica el ajuste a lo que hay cargado en PEDIDO, familia por familia. Solo toca
   los codigos que YA tienen pedido: no agrega codigos que nadie pidio. */
function ajustarPedidoCarton(){
  var cargados=[];
  filtradas().forEach(function(i){
    var c=Number(PEDIDO[i.comp_id])||0;
    if(c>0) cargados.push({comp_id:i.comp_id, cantidad:c, it:i});
  });
  var toco=false;
  gruposCarton(cargados).forEach(function(grupo){
    var rg=reglaDe(grupo.cf);
    var q=ajustarFamilia(grupo.xs.map(function(x){
      return {comp_id:x.comp_id, cant:x.cantidad,
              pliegos_multiplo:rg.pliegos_multiplo, codigo_multiplo:rg.codigo_multiplo,
              min_codigo_x_multiplo:rg.min_codigo_x_multiplo, pedido_minimo:rg.pedido_minimo};
    }));
    if(!q) return;
    Object.keys(q).forEach(function(id){
      if(PEDIDO[Number(id)]!==q[id]){ PEDIDO[Number(id)]=q[id]; toco=true; }
    });
  });
  return toco;
}

/* v1.24.0 — PEDIDO MINIMO DEL PROVEEDOR (kg). Del Excel del usuario (hoja "Relev y OP Bolsas Plast",
   columna `Pedi Minimo KG`): Indarnyl no vende menos de 400 kg, Beta y Santa Rosa 25, el masterbatch 5.
   Vale para la materia prima plastica, que se pide en kg: si la OC de ese proveedor no llega al piso,
   NO se deja crear y se dice cuanto falta. No se infla solo — que falten kg es una decision de compra
   (sumar otro material del mismo proveedor o esperar), no algo para resolver redondeando. */
function validarMinimoProveedor(items){
  if(!items.length) return [];
  var mats=items.filter(function(x){ return Number(x.it.sector_id)===SECTOR_MATERIA_PRIMA; });
  if(!mats.length) return [];
  var porProv={};
  mats.forEach(function(x){
    var p=provDeFila(x.it);
    porProv[p]=(porProv[p]||0)+(Number(x.cantidad)||0);
  });
  var errs=[];
  Object.keys(porProv).forEach(function(p){
    var prov=(D.proveedores||[]).filter(function(v){ return v.nombre===p; })[0];
    var min=prov?Number(prov.pedido_minimo_kg)||0:0;
    if(min>0 && porProv[p]<min)
      errs.push(p+': el pedido mínimo es '+fmt(min)+' kg y hay '+fmt(porProv[p])+' kg (faltan '+fmt(min-porProv[p])+').');
  });
  return errs;
}

/* El recuadro amarillo "Pedido mínimo de la pieza" se saco el 2026-09-14 [usuario: "eliminá
   este recuadro" / "el amarillo"]. Avisaba cuando el sugerido quedaba por debajo de la tirada
   minima del inyector (componente.pedido_minimo_uni) y ofrecia un boton "Subir al mínimo". El
   dato pedido_minimo_uni sigue viajando en oc_bundle por si se lo vuelve a usar; lo que se fue
   es el aviso y su boton. */

function barra(){
  var items=itemsPedidos();
  var errsCart=validarCarton(items);
  var errs=errsCart.concat(validarMinimoProveedor(items));
  var rc=$('reglaCarton');
  if(errs.length){
    rc.classList.remove('hidden'); rc.classList.add('mal');
    // El boton de ajustar es del CARTON (redondea al multiplo de la familia): si lo que falla es el
    // piso en kg del proveedor de resina no hay nada que redondear, lo resuelve el comprador.
    // v1.41.0: se fue el boton "Ajustar al multiplo" junto con el aviso del multiplo (arriba).
    rc.innerHTML=errs.map(esc).join('<br>');
  }
  else rc.classList.add('hidden');
  var tUsd=0, tArs=0, sinPrecio=0;
  items.forEach(function(x){
    if(x.precio==null){ sinPrecio++; return; }
    if(x.moneda==='ARS') tArs+=x.cantidad*x.precio; else tUsd+=x.cantidad*x.precio;
  });
  var tot=items.length+' ítems';
  if(tUsd>0||tArs>0){
    tot+=' · '+fmtTotalMon(tUsd,tArs);
    if(D.tc && tUsd>0) tot+=' (≈ $ '+fmt(tUsd*Number(D.tc)+tArs,0)+')';
  }
  // Sin este aviso el total miente por lo bajo y nadie se entera: pasa cuando se le compra a
  // un proveedor alternativo que no cotizo esa pieza (Recicor no cotiza las cajas N°15, 16 y
  // 22). No se rellena con el precio del otro proveedor: eso seria inventar plata.
  if(sinPrecio>0) tot+=' · ⚠ '+sinPrecio+(sinPrecio===1?' ítem sin precio':' ítems sin precio')+
                        (provSel!=null?(' de '+provSel):'');
  $('tot').textContent=tot;
  $('btnCrear').disabled = items.length===0 || errs.length>0;
}

// Vuelve a poner los sugeridos: borra las marcas de "este no lo pido" de lo que se ve.
// Es la ORDEN EXPLICITA del usuario, asi que pisa el gatillo y el aviso de "en camino":

$('btnSug').addEventListener('click',function(){

  });

  ajustarPedidoCarton();

});

$('fechaEnt').addEventListener('change',function(){

});

$('btnCrear').addEventListener('click', async function(){
  var items=itemsPedidos();
  if(!items.length) return;
  $('btnCrear').disabled=true;
  try{
    var rubro = rubroSel!=null ? (rubrosDistintos().filter(function(r){return r.id===rubroSel;})[0]||{}).nombre : null;
    // Fecha de entrega estimada: viaja dentro de p (crear_oc la lee de p.fecha_entrega).
