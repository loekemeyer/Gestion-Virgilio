      rubro: rubro, nota: ($('nota').value||'').trim() || null, usuario: null,
      fecha_entrega: fEnt,
      // precio/moneda viajan SIEMPRE: si no se toco nada son los de la lista, y si
      // se pisaron, crear_oc guarda estos y no los de precio_proveedor.
      items: items.map(function(x){ return {comp_id:x.comp_id, cantidad:x.cantidad, unidad:x.unidad,
                                            precio:x.precio, moneda:x.moneda}; })
    } });
    if(r.error) throw r.error;
    PEDIDO={}; PRECIO={}; MONEDA={}; SIN_PEDIDO={}; $('nota').value='';
    fechaTocada=false; fechaTocadaProv=null;
    await boot();
    mostrarTab('ocs');
    // Materia prima plastica: la OC se EMITE sola al generarla (se abre la hoja con el formato del
    // usuario para imprimir / mandar al proveedor) [usuario 2026-09-11: "que se emita automaticamente
    // desde gestion productiva cuando genero el pedido"].
    var creada = (D.ocs||[]).filter(function(x){ return x.id===r.data.oc_id; })[0];
    if (creada && esOcMaterial(creada)) imprimirOC(creada.id);
    // OC gemela al proveedor de la materia prima de un PS hibrido (Charcas -> Altrak, Eclipse ->
    // Aperam, o el que se configure en proveedor_servicio): crear_oc la crea y la devuelve.
    var gem = r.data && r.data.oc_gemela;
    $('status').className='status ok';
    $('status').innerHTML='✓ OC N° '+r.data.numero+' creada con '+r.data.items+' ítems (borrador).' +
      (fEnt?(' Entrega estimada: '+fmtFecha(fEnt)+'.'):'') +
      (gem ? ('<br><b style="color:#0b3b73">✓ OC gemela N° '+gem.numero+' a '+esc(gem.proveedor)+' con '+fmt(gem.kg,1)+' kg de '+esc(gem.componente)+'.</b>') : '');
    setTimeout(function(){ $('status').innerHTML=''; $('status').className='status'; }, gem ? 12000 : 6000);
  }catch(e){ $('status').className='status bad'; $('status').textContent='Error: '+(e.message||e); }
  finally{ $('btnCrear').disabled=false; }
});

function pintarOcs(){
  /* La OC ANULADA no se muestra mas [usuario 2026-09-04: "si anula una orden de compra,
     no quiero que me siga apareciendo en ordenes"]. Se esconde de la PANTALLA nada mas:
     la fila sigue en GP2.orden_compra (es el historial y lo que explica una numeracion
     con huecos). Anular una OC ya no descuenta ni suma nada, asi que esconderla no
     cambia ningun numero. */
  var ocs=(D.ocs||[]).filter(function(o){ return String(o.estado||'')!=='anulada'; });
  $('ocsN').textContent=ocs.length?('('+ocs.length+')'):'';
  $('ocsEmpty').classList.toggle('hidden', ocs.length>0);
  var cardOC=function(o){
    var acts='<button type="button" class="imp" data-imp="'+o.id+'">🖨 Imprimir</button>';
    if(o.estado==='borrador'||o.estado==='enviada') acts+='<button type="button" class="wpp" data-oc="'+o.id+'">🟢 WhatsApp</button>'+
      '<button type="button" class="anu" data-oc="'+o.id+'" data-est="anulada">Anular</button>';
    return '<div class="oc-card">'+
      '<div class="oc-head"><span class="num-oc">OC N° '+o.numero+'</span>'+
      '<span class="badge '+o.estado+'">'+o.estado+'</span>'+
      (o.proveedor?('<span>'+esc(o.proveedor)+'</span>'):'')+
      (o.rubro?('<span style="color:#777">'+esc(o.rubro)+'</span>'):'')+
      '<span style="color:#777">'+new Date(o.creado_en).toLocaleDateString('es-AR')+'</span>'+
      (vFechaEnt(o)?('<span class="badge entrega">Entrega '+fmtFecha(vFechaEnt(o))+'</span>'):'')+
      ((o.total_usd>0||o.total_ars>0)?('<span style="font-weight:800">'+fmtTotalMon(Number(o.total_usd)||0,Number(o.total_ars)||0)+'</span>'):'')+
      '<div class="oc-acts">'+acts+'</div></div>'+
      (o.nota?('<div style="color:#555;font-size:14px;margin-top:4px">'+esc(o.nota)+'</div>'):'')+
      '<div class="table-wrap" style="margin-top:8px"><table class="t"><thead><tr>'+
      '<th>Insumo</th><th class="num">Pedido</th><th class="num">Precio</th><th class="num">Subtotal</th><th class="num">Recibido</th></tr></thead><tbody>'+
      (o.items||[]).map(function(it){
        var rc=Number(it.recibido)||0, pe=Number(it.cantidad)||0;
        var sem=(o.estado==='enviada'||o.estado==='recibida')?
          (rc<=0?' class="rc-no"':(rc>=pe?' class="rc-ok"':' class="rc-par"')):'';
        return '<tr'+sem+'><td><b>'+esc(it.codigo)+'</b> <small style="color:#777">'+esc(it.descripcion||'')+'</small></td>'+
          '<td class="num">'+fmt(it.cantidad)+' '+esc(it.unidad)+'</td>'+
          '<td class="num">'+(it.precio_uni==null?'—':((it.moneda==='ARS'?'$ ':'US$ ')+fmt(it.precio_uni,2)))+'</td>'+
          '<td class="num">'+(it.subtotal==null?'—':((it.moneda==='ARS'?'$ ':'US$ ')+fmt(it.subtotal,2)))+'</td>'+
          '<td class="num">'+(it.recibido>0?fmt(it.recibido):'—')+'</td></tr>';
      }).join('')+
      '</tbody></table></div></div>';
  };
  /* v1.47.0: VIGENTES = la ultima OC (mayor numero) de cada proveedor; las anteriores de ese
     proveedor pasan a HISTORICAS solas al emitir una nueva. Una OC sin proveedor queda vigente sola. */
  var ult={};
  ocs.forEach(function(o){ var k=o.proveedor||('#'+o.id); if(!ult[k]||Number(o.numero)>Number(ult[k].numero)) ult[k]=o; });
  var vig=ocs.filter(function(o){ return ult[o.proveedor||('#'+o.id)]===o; });
  var his=ocs.filter(function(o){ return ult[o.proveedor||('#'+o.id)]!==o; });
  var abiertaHis=!!($('ocsHis')&&$('ocsHis').open);
  $('ocsList').innerHTML=
    '<details class="oc-box" open><summary>Vigentes <span>('+vig.length+')</span></summary>'+vig.map(cardOC).join('')+'</details>'+
    (his.length?('<details class="oc-box" id="ocsHis"'+(abiertaHis?' open':'')+'><summary>Históricas <span>('+his.length+')</span></summary>'+his.map(cardOC).join('')+'</details>'):'');

  document.querySelectorAll('.oc-acts button.imp').forEach(function(b){
    b.addEventListener('click', function(){ imprimirOC(Number(b.dataset.imp)); });
  });
  document.querySelectorAll('.oc-acts button.anu').forEach(function(b){
    b.addEventListener('click', async function(){
      var est=b.dataset.est;
      if(est==='anulada' && !confirm('¿Anular la OC?')) return;
      b.disabled=true;
      try{
        var r=await SB.rpc('oc_marcar',{ p_oc_id:Number(b.dataset.oc), p_estado:est });
        if(r.error) throw r.error;
        await boot(); mostrarTab('ocs');
      }catch(e){ $('status').className='status bad'; $('status').textContent='Error: '+(e.message||e); b.disabled=false; }
    });
  });
  // WhatsApp: abre wa.me con el texto formal de la OC y, si estaba en borrador, la marca enviada.
  document.querySelectorAll('.oc-acts button.wpp').forEach(function(b){
    b.addEventListener('click', async function(){
      var oc=(D.ocs||[]).find(function(x){ return String(x.id)===String(b.dataset.oc); });
      if(!oc) return;
      // el window.open va PRIMERO y sincronico: si esperamos el await, el navegador bloquea el popup.
      window.open('https://wa.me/?text='+encodeURIComponent(textoWhatsappOC(oc)), '_blank');
      if(oc.estado==='borrador'){
        b.disabled=true;
        try{
          var r=await SB.rpc('oc_marcar',{ p_oc_id:Number(b.dataset.oc), p_estado:'enviada' });
          if(r.error) throw r.error;
          await boot(); mostrarTab('ocs');
        }catch(e){ $('status').className='status bad'; $('status').textContent='Error: '+(e.message||e); b.disabled=false; }
      }
    });
  });
}

// Texto formal de la OC para mandar por WhatsApp (wa.me). Sin número por ahora: el operario elige el
// contacto; cuando cargue el teléfono del proveedor se le antepone y va directo.
function textoWhatsappOC(o){
  var L=[];
  L.push('Estimados'+(o.proveedor?(' '+o.proveedor):'')+',');
  L.push('');
  L.push('Les enviamos la Orden de Compra N° '+o.numero+'.');
  L.push('Fecha de emisión: '+new Date(o.creado_en).toLocaleDateString('es-AR'));
  var fe=vFechaEnt(o); if(fe) L.push('Fecha de entrega solicitada: '+fmtFecha(fe));
  L.push('');
  L.push('Detalle del pedido:');
  (o.items||[]).forEach(function(it){
    var linea='• '+it.codigo+(it.descripcion?(' - '+it.descripcion):'')+': '+fmt(it.cantidad)+' '+(it.unidad||'');
    if(it.precio_uni!=null) linea+=' — '+(it.moneda==='ARS'?'$ ':'US$ ')+fmt(it.precio_uni,2)+'/u';
    L.push(linea);
  });
  if(Number(o.total_usd)>0||Number(o.total_ars)>0){
    L.push('');
    L.push('Total: '+fmtTotalMon(Number(o.total_usd)||0, Number(o.total_ars)||0));
  }
  L.push('');
  L.push('Agradecemos confirmar la recepción y la fecha de entrega. Muchas gracias.');
  L.push('Loekemeyer Hnos. S.R.L.');
  return L.join('\n');
}

/* ── OC de MATERIA PRIMA PLASTICA: el formato del usuario (hojas "O.C." del workbook) ──
   Una OC es "de material" cuando todos sus items son del sector 14. Se imprime con membrete doble
   (las dos empresas facturan: Loekemeyer 85 % / Chef 15 %, parametro oc_facturar_pct_loeke), entrega
   en Virgilio 2788 (ahi vive el material), y cada material en dos renglones LK / CH con su Cod ISIS
   de cada empresa. Los datos de las empresas son fijos de la casa (los mismos de la hoja). */
var SECTOR_MATERIA_PRIMA = 14;
var EMPRESAS = {
  LK: { nombre:'Loekemeyer Hnos. S.R.L', cuit:'30-51584245-0', dir:'Cervantes 2868', loc:'Villa Devoto, CABA' },
  CH: { nombre:'Chef SRL',               cuit:'30-68575625-7', dir:'Virgilio 2788',  loc:'Villa Real, CABA' }
};
function esOcMaterial(o){
  var its = o && o.items || [];
  return its.length > 0 && its.every(function(it){ return Number(it.sector_id) === SECTOR_MATERIA_PRIMA; });
}
function hojaOCMaterial(o){
  var pctLK = Number(D.facturar_pct_loeke != null ? D.facturar_pct_loeke : 85);
  var pctCH = 100 - pctLK;
  var fPed = new Date(o.creado_en).toLocaleDateString('es-AR');
  var fEnt = vFechaEnt(o) ? fmtFecha(vFechaEnt(o)) : '';
  var css =
    '@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}'+
    'body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0;padding:18px;font-size:13px;background:#fff}'+
    '.hoja{max-width:1080px;margin:0 auto}'+
    '.tit{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #111;padding-bottom:6px}'+
    '.tit h1{margin:0;font-size:22px;letter-spacing:1px}.tit .fp{font-size:14px;font-weight:700}'+
    '.emps{display:flex;gap:24px;margin:12px 0}.emp{flex:1;border:1px solid #bbb;border-radius:6px;padding:8px 10px}'+
    '.emp b{display:block;font-size:15px;margin-bottom:4px}.emp div{font-size:12px;line-height:1.5}'+
    '.prov{display:flex;gap:24px;flex-wrap:wrap;margin:6px 0;font-size:14px}.prov span b{margin-right:6px}'+
    '.avisos{display:flex;justify-content:space-between;gap:20px;margin:10px 0;font-weight:800;font-size:13px}'+
    'table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}'+
    'th{background:#ececec;text-align:left;padding:6px;border:1px solid #999;font-size:10px;text-transform:uppercase}'+
    'td{padding:6px;border:1px solid #bbb;vertical-align:middle;height:30px}'+
    'td.num{text-align:right;white-space:nowrap}td.emp{font-weight:800;text-align:center;width:44px}'+
    'tr.ch td{background:#fafafa;color:#333}td.cod{font-weight:800}'+
    '.pie{margin-top:18px;border-top:1px solid #ddd;padding-top:6px;color:#888;font-size:11px;display:flex;justify-content:space-between}'+
    '@media print{body{padding:0}tr{page-break-inside:avoid}thead{display:table-header-group}}';
  var n = 0;
  var filas = (o.items||[]).map(function(it){
    n++;
    var kg = Number(it.cantidad)||0;
    // Sin codigo de Chef no hay renglon CH: ese material lo usa solo Loekemeyer y va 100% LK.
    var conCH = !!it.codigo_isis_ch;
    var kgLK = conCH ? Math.round(kg * pctLK / 100 * 100) / 100 : kg, kgCH = Math.round((kg - kgLK) * 100) / 100;
    var vacias = '<td></td><td></td><td></td><td></td><td></td><td></td>';   // Fecha Ent / Kg Ent x3: se anotan a mano
    return '<tr class="lk"><td class="emp">LK</td><td class="cod">'+esc(it.codigo)+'</td><td class="num">'+n+'</td>'+
             '<td>'+esc(it.descripcion||'')+'</td><td class="num">'+fmt(kg,2)+'</td><td class="emp">LK</td>'+
             '<td class="num">'+fmt(kgLK,2)+'</td><td>'+esc(fEnt)+'</td>'+vacias+'</tr>'+
           (conCH ? '<tr class="ch"><td class="emp">CH</td><td class="cod">'+esc(it.codigo_isis_ch)+'</td><td></td>'+
             '<td></td><td></td><td class="emp">CH</td><td class="num">'+fmt(kgCH,2)+'</td><td></td>'+vacias+'</tr>' : '');
  }).join('');
  var emp = function(e){ return '<div class="emp"><b>'+esc(e.nombre)+'</b><div>CUIT: '+esc(e.cuit)+'<br>DIRECCION: '+esc(e.dir)+'<br>LOCALIDAD: '+esc(e.loc)+'</div></div>'; };
  return '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>OC N° '+o.numero+' · '+esc(o.proveedor||'')+'</title><style>'+css+'</style></head><body><div class="hoja">'+
    '<div class="tit"><h1>ORDEN DE COMPRA N° '+o.numero+'</h1><div class="fp">FECHA PEDIDO: '+fPed+'</div></div>'+
    '<div class="emps">'+emp(EMPRESAS.LK)+emp(EMPRESAS.CH)+'</div>'+
    '<div class="prov"><span><b>RAZON SOCIAL:</b>'+esc(String(o.proveedor||'').toUpperCase())+'</span>'+
      '<span><b>COD PROV:</b>'+esc(o.cod_prov||'—')+'</span>'+
      '<span><b>ENTREGA EN:</b>'+esc(o.entrega_en || EMPRESAS.CH.dir)+'</span>'+
      (fEnt?('<span><b>ENTREGA ESTIMADA:</b>'+esc(fEnt)+'</span>'):'')+'</div>'+
    '<div class="avisos"><span>FACTURAR Loekemeyer '+fmt(pctLK)+'% · Chef '+fmt(pctCH)+'%</span><span>ESTE PEDIDO ANULA CUALQUIER PEDIDO ANTERIOR</span></div>'+
    '<table><thead><tr><th>Empresa</th><th>Cód ISIS</th><th>N° Ord</th><th>Descripción Material</th><th>Pedido KG</th><th>Emp</th><th>KG a FC</th>'+
    '<th>Fecha Pos Ent</th><th>Fecha Ent</th><th>Kg Ent</th><th>Fecha Ent</th><th>Kg Ent</th><th>Fecha Ent</th><th>Kg Ent</th></tr></thead><tbody>'+
    (filas||'<tr><td colspan="14">Sin ítems.</td></tr>')+'</tbody></table>'+
    (o.nota?('<div style="margin-top:10px;font-size:12px"><b>Nota:</b> '+esc(o.nota)+'</div>'):'')+
    '<div class="pie"><span>Loekemeyer · Gestión Productiva 2.0 · Bolsas plásticas</span><span>Impreso el '+new Date().toLocaleDateString('es-AR')+'</span></div>'+
    '</div></body></html>';
}

// Hoja limpia para mandar/imprimir la OC al proveedor.
// Membrete + bloque de datos (con la ENTREGA ESTIMADA destacada) + tabla + total + firmas.
function imprimirOC(ocId){
  var o=(D.ocs||[]).filter(function(x){ return x.id===ocId; })[0];
  if(!o) return;
  var w=window.open('','_blank');
  if(!w){ alert('El navegador bloqueó la ventana de impresión.'); return; }
  if(esOcMaterial(o)){
    w.document.write(hojaOCMaterial(o));
    w.document.close(); w.focus();
    setTimeout(function(){ w.print(); }, 250);
    return;
  }
  var entrega = vFechaEnt(o) ? fmtFecha(vFechaEnt(o)) : '';
  var emision = new Date(o.creado_en).toLocaleDateString('es-AR');
  var totLinea = (o.total_usd>0||o.total_ars>0) ? fmtTotalMon(Number(o.total_usd)||0,Number(o.total_ars)||0) : '';
  var css=
    '@page{size:A4;margin:14mm}'+
    '*{box-sizing:border-box}'+
    'body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0;padding:26px;font-size:14px;background:#fff}'+
    '.hoja{max-width:840px;margin:0 auto}'+
    '.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:3px solid #111;padding-bottom:10px}'+
    '.emp{font-size:23px;font-weight:800;letter-spacing:.5px;line-height:1.1}'+
    '.emp span{display:block;font-size:12px;font-weight:400;color:#555;letter-spacing:0;margin-top:3px}'+
    '.oc-n{text-align:right}'+
    '.oc-n .n{font-size:21px;font-weight:800;white-space:nowrap}'+
    '.oc-n .e{font-size:12px;color:#555;margin-top:4px}'+
    '.datos{display:flex;gap:10px;margin:16px 0 8px;flex-wrap:wrap}'+
    '.dato{flex:1;min-width:150px;border:1px solid #bbb;border-radius:6px;padding:8px 10px}'+
    '.dato .lb{font-size:10px;text-transform:uppercase;color:#666;letter-spacing:.7px}'+
    '.dato .vl{font-size:16px;font-weight:700;margin-top:3px}'+
    '.dato.entrega{border:2px solid #111;background:#f0f0f0}'+
    '.dato.entrega .lb{color:#111;font-weight:800}'+
    '.dato.entrega .vl{font-size:19px}'+
    'table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}'+
    'th{background:#ececec;text-align:left;padding:8px;border:1px solid #999;font-size:11px;text-transform:uppercase;letter-spacing:.5px}'+
    'td{padding:8px;border:1px solid #bbb;vertical-align:top}'+
    'tbody tr:nth-child(even) td{background:#fafafa}'+
    'td.num,th.num{text-align:right;white-space:nowrap}'+
    '.cod{font-weight:800}'+
    '.tot{margin-top:12px;text-align:right;font-size:18px;font-weight:800}'+
    '.tot small{display:block;font-size:11px;font-weight:400;color:#666;margin-top:2px}'+
    '.nota{margin-top:14px;border-left:4px solid #999;padding:6px 12px;color:#333;font-size:13px}'+
    '.firmas{display:flex;gap:44px;margin-top:52px}'+
    '.firma{flex:1;border-top:1px solid #111;padding-top:6px;font-size:11px;color:#555;text-align:center}'+
    '.pie{margin-top:26px;border-top:1px solid #ddd;padding-top:8px;color:#888;font-size:11px;display:flex;justify-content:space-between;gap:10px}'+
    '@media print{body{padding:0}tbody tr{page-break-inside:avoid}thead{display:table-header-group}}';
  var filas=(o.items||[]).map(function(it){
    var mon=it.moneda==='ARS'?'$ ':'US$ ';
    return '<tr><td class="cod">'+esc(it.codigo)+'</td><td>'+esc(it.descripcion||'')+'</td>'+
      '<td class="num">'+fmt(it.cantidad)+' '+esc(it.unidad)+'</td>'+
      '<td class="num">'+(it.precio_uni==null?'—':mon+fmt(it.precio_uni,2))+'</td>'+
      '<td class="num">'+(it.subtotal==null?'—':mon+fmt(it.subtotal,2))+'</td></tr>';
  }).join('');
  var html='<!doctype html><html lang="es"><head><meta charset="utf-8">'+
    '<title>OC N° '+o.numero+(o.proveedor?(' · '+esc(o.proveedor)):'')+'</title><style>'+css+'</style></head><body><div class="hoja">'+
    '<div class="top">'+
      '<div class="emp">LOEKEMEYER<span>Gestión Productiva 2.0 · Compras</span></div>'+
      '<div class="oc-n"><div class="n">Orden de Compra N° '+o.numero+'</div>'+
      '<div class="e">Emitida el '+emision+(o.estado?(' · '+esc(o.estado)):'')+'</div></div>'+
    '</div>'+
    '<div class="datos">'+
      '<div class="dato"><div class="lb">Proveedor</div><div class="vl">'+esc(o.proveedor||'—')+'</div></div>'+
      // La etiqueta que se lee es "Sector" [usuario 2026-09-04]; el campo de la base

      '<div class="dato"><div class="lb">Sector</div><div class="vl">'+esc(o.rubro||'—')+'</div></div>'+

    '<div class="pie"><span>Loekemeyer · Gestión Productiva 2.0</span>'+
    '<span>Impreso el '+new Date().toLocaleDateString('es-AR')+'</span></div>'+
    '</div></body></html>';
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(function(){ w.print(); }, 250);
}

function mostrarTab(t){
  $('panGen').classList.toggle('hidden', t==='ocs');
  $('panOcs').classList.toggle('hidden', t!=='ocs');
  $('tabGen').classList.toggle('active', t!=='ocs');
  $('tabOcs').classList.toggle('active', t==='ocs');
}
$('tabGen').addEventListener('click',function(){ mostrarTab('gen'); });
$('tabOcs').addEventListener('click',function(){ mostrarTab('ocs'); });

$('q').addEventListener('input', render);
// Cerrar el desglose: la X, tocar el fondo, o Escape.
function cerrarDesglose(){ DSG_TD=null; DSG_FIJA=false; var p=$('dsgPop'); p.hidden=true; p.classList.remove('fija'); }
$('dsgPop').addEventListener('click', function(e){ e.stopPropagation(); });   // clic adentro no la cierra
document.addEventListener('click', cerrarDesglose);          // tocar afuera la cierra
// Si la PAGINA se mueve, la ventanita no queda flotando; el scroll de la propia ventanita no cuenta.
window.addEventListener('scroll', function(e){ if(e.target!==$('dsgPop')) cerrarDesglose(); }, true);
document.addEventListener('keydown', function(e){ if(e.key==='Escape') cerrarDesglose(); });
boot();
</script>
