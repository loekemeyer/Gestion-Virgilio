<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Informe Rendimiento x Persona (GP2)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260905k"></script>
<script src="../gp2-ui.js?v=20260905a"></script>
<script src="../gp2-numero.js?v=20260905m"></script>
<style>
  :root{--bg:#ebeff4;--card:#ffffff;--line:#d0d7de;--txt:#1e293b;--muted:#64748b;--accent:#0066cc;--pos:#0a7a2f;--neg:#b91c1c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 Inter,system-ui,Segoe UI,sans-serif}
  .page{max-width:1200px;margin:0 auto;padding:22px}
  h1{font-size:20px;margin:0 0 2px}
  .muted{color:var(--muted);font-size:12px}
  .bar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:18px 0;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  input[type=date]{background:#e8edf7;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
  button{background:var(--accent);color:#04222f;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .status{color:var(--muted);font-size:12px;min-height:16px;margin:6px 2px}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card)}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{position:sticky;top:0;background:#e8edf7;color:var(--muted);font-weight:600;text-align:center;font-size:11px}
  tbody td{text-align:center}
  td.l{text-align:left}
  td.r{text-align:right;font-variant-numeric:tabular-nums}
  td.b{font-weight:700}
  .pos{color:var(--pos)}
  .neg{color:var(--neg)}
  tbody tr:hover{background:#e8edf7}
  .title{font-weight:700;padding:10px 12px;background:#e8edf7;border-bottom:1px solid var(--line)}
</style>
<link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
<link rel="stylesheet" href="../gp2-claro.css?v=20260903b">
</head>
<body>
<div id="gp2-logobar" style="position:relative;background:#e8edf7;text-align:center;padding:6px 0;border-bottom:1px solid #d0dae7"><a href="../GP2_MODULOS.html" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#385475;text-decoration:none;font-weight:700;font-size:15px;padding:5px 10px;border:1px solid #d1d9e5;border-radius:8px;background:#e9eef7">← Atrás</a><a href="../GP2_MODULOS.html" style="text-decoration:none"><img src="../GP2_logo.png" alt="GP2 · Gestión Productiva" style="height:40px;vertical-align:middle"></a></div>

<div class="page">
  <h1>Informe &mdash; Rendimiento x Persona</h1>
  <div class="muted">Schema GP2 &middot; RPC <code>informes_bundle(desde,hasta)</code> &middot; agregado desde <code>"GP2".produccion</code></div>

  <div class="bar">
    <div class="field">
      <label>Desde</label>
      <input type="date" id="desde" value="2026-07-01" />
    </div>
    <div class="field">
      <label>Hasta</label>
      <input type="date" id="hasta" value="2026-07-31" />
    </div>
    <div class="field">
      <button id="btn">Generar</button>
    </div>
  </div>

  <div id="status" class="status"></div>
  <div id="result"></div>
</div>

<script>
"use strict";
// MIGRADO a schema GP2: los datos salen del RPC "GP2".informes_bundle(p_desde,p_hasta),
// que agrega "GP2".produccion server-side (evita traer 14k filas al front).
// No existe tabla Empleados en GP2: nombre/legajo vienen embebidos en produccion.nombre_empleado.
var SB = GP2_SB();

var $status = document.getElementById('status');
var $result = document.getElementById('result');
var $btn = document.getElementById('btn');

/* ===== Helpers (portados del informes.js viejo) ===== */
function n(v){ var x = Number(v); return Number.isFinite(x) ? x : 0; }
function f(v, d){ return GP2N.fmt(v, d || 0); }   /* la regla de numero de la casa (gp2-numero.js) */
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function hs(seg){ return f(seg / 3600, 1); }          // segundos -> horas
function dias85(seg){ return f(seg / 30600, 1); }      // jornada de 8.5 h
function pct(segT, segH){ return segH > 0 ? f((-(segT / segH - 1)) * 100, 0) + '%' : '-'; }
function ptje(segT, segH){ return segH > 0 ? f((-(segT / segH - 1)) * 10, 1) : '-'; }
function ptjeNum(segT, segH){ return segH > 0 ? (-(segT / segH - 1)) * 10 : 0; }
function sueldoPremio(segT, segH){ var p = ptjeNum(segT, segH); return f(((((p * 10) + 100) - 100) / 2) / 100, 2); }
function cls(v){ return n(v) > 0 ? 'pos' : (n(v) < 0 ? 'neg' : ''); }

/* ===== Render (equivalente a renderPersona del modulo viejo) ===== */
function renderPersona(personas){
  if(!personas.length){ $result.innerHTML = '<p class="muted" style="padding:20px">No se encontraron registros en el rango.</p>'; return; }

  // Recolectar codigos de Tiempo Muerto (pivot dinamico)
  var tmCodes = {};
  personas.forEach(function(g){ Object.keys(g.tm || {}).forEach(function(k){ tmCodes[k] = 1; }); });
  var tmSorted = Object.keys(tmCodes).sort();

  var html = ''
    + '<div class="scroll">'
    + '<div class="title">Rendimiento x Persona</div>'
    + '<table>'
    + '<thead><tr>'
    + '<th rowspan="2">Leg</th><th rowspan="2">Empleado</th>'
    + '<th colspan="2">Puntaje</th>'
    + '<th colspan="2">Segundos</th>'
    + tmSorted.map(function(c){ return '<th rowspan="2">' + esc(c) + '</th>'; }).join('')
    + '<th rowspan="2">Seg<br>Anul</th>'
    + '<th rowspan="2">%<br>Puntaje</th>'
    + '<th rowspan="2">Dias</th>'
    + '<th rowspan="2">Horas</th>'
    + '<th rowspan="2">Rot<br>Mat</th>'
    + '</tr><tr><th>Ptos</th><th>%</th><th>Trab</th><th>Prom</th></tr></thead>'
    + '<tbody>';

  personas.forEach(function(g){
    var segTrab = n(g.segTrab), segHist = n(g.segHist);
    var p = ptjeNum(segTrab, segHist);
    var segAnul = n(g.segAnulados), segTotal = n(g.segTotal), rot = n(g.roturas);
    html += '<tr>'
      + '<td class="b">' + esc(g.legajo) + '</td>'
      + '<td class="l">' + esc(g.nombre) + '</td>'
      + '<td class="b ' + cls(p) + '">' + ptje(segTrab, segHist) + '</td>'
      + '<td class="' + cls(p) + '">' + pct(segTrab, segHist) + '</td>'
      + '<td class="r">' + (segTrab > 0 ? f(segTrab) : '-') + '</td>'
      + '<td class="r">' + (segHist > 0 ? f(segHist) : '-') + '</td>'
      + tmSorted.map(function(c){ var s = n((g.tm || {})[c]); return '<td class="r">' + (s > 0 ? hs(s) : '') + '</td>'; }).join('')
      + '<td class="r">' + (segAnul > 0 ? f(segAnul) : '') + '</td>'
      + '<td>' + (segHist > 0 ? sueldoPremio(segTrab, segHist) : '-') + '</td>'
      + '<td class="r">' + (segTotal > 0 ? dias85(segTotal) : '-') + '</td>'
      + '<td class="r">' + (segTotal > 0 ? hs(segTotal) : '-') + '</td>'
      + '<td>' + (rot || '') + '</td>'
      + '</tr>';
  });

  html += '</tbody></table></div>';
  $result.innerHTML = html;
}

/* ===== Carga via RPC ===== */
async function __run(){
  var desde = document.getElementById('desde').value || null;
  var hasta = document.getElementById('hasta').value || null;
  $btn.disabled = true;
  $status.textContent = 'Cargando...';
  $result.innerHTML = '';
  try {
    var r = await SB.rpc('informes_bundle', { p_desde: desde, p_hasta: hasta });
    if (r.error) throw r.error;
    var personas = (r.data && r.data.personas) || [];
    renderPersona(personas);
    $status.textContent = personas.length + ' persona(s) · ' + (desde || 'inicio') + ' a ' + (hasta || 'fin');
  } catch (e) {
    $status.textContent = 'Error: ' + (e.message || e);
    console.error(e);
  } finally {
    $btn.disabled = false;
  }
}

$btn.addEventListener('click', __run);

async function __boot(){ __run(); }
__boot();
</script>
</body>
</html>
