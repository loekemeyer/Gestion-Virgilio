<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Informe Rendimiento x Matriz (GP2)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260905k"></script>
<script src="../gp2-ui.js?v=20260905a"></script>
<script src="../gp2-numero.js?v=20260905m"></script>
<style>
  :root{--bg:#ebeff4;--card:#ffffff;--line:#d0d7de;--txt:#1e293b;--muted:#64748b;--accent:#0066cc;--pos:#0a7a2f;--neg:#b91c1c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 Inter,system-ui,Segoe UI,sans-serif}
  .page{max-width:1400px;margin:0 auto;padding:22px}
  h1{font-size:20px;margin:0 0 2px}
  .muted{color:var(--muted);font-size:12px}
  code{background:#e8edf7;padding:1px 5px;border-radius:5px}
  .bar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:18px 0;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  input[type=date],select{background:#e8edf7;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
  .chk{flex-direction:row;align-items:center;gap:6px}
  .chk input{width:16px;height:16px}
  button{background:var(--accent);color:#04222f;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .status{color:var(--muted);font-size:12px;min-height:16px;margin:6px 2px}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card)}
  th,td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{position:sticky;top:0;background:#e8edf7;color:var(--muted);font-weight:600;text-align:center;font-size:11px}
  tbody td{text-align:center}
  td.l{text-align:left}
  td.r{text-align:right;font-variant-numeric:tabular-nums}
  td.b{font-weight:700}
  .pos{color:var(--pos)}
  .neg{color:var(--neg)}
  tbody tr:hover{background:#e8edf7}
  tbody tr.sep td{background:#e8edf7;font-weight:700;border-top:2px solid var(--line)}
  .title{font-weight:700;padding:10px 12px;background:#e8edf7;border-bottom:1px solid var(--line)}
</style>
<link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
<link rel="stylesheet" href="../gp2-claro.css?v=20260903b">
</head>
<body>
<div id="gp2-logobar" style="position:relative;background:#e8edf7;text-align:center;padding:6px 0;border-bottom:1px solid #d0dae7"><a href="../GP2_MODULOS.html" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#385475;text-decoration:none;font-weight:700;font-size:15px;padding:5px 10px;border:1px solid #d1d9e5;border-radius:8px;background:#e9eef7">← Atrás</a><a href="../GP2_MODULOS.html" style="text-decoration:none"><img src="../GP2_logo.png" alt="GP2 · Gestión Productiva" style="height:40px;vertical-align:middle"></a></div>

<div class="page">
  <h1>Informe &mdash; Rendimiento x Matriz</h1>
  <div class="muted">Schema GP2 &middot; RPC <code>informes_matriz_bundle(desde,hasta,incluir_piedra)</code> &middot; agregado desde <code>"GP2".produccion</code> (tabla cruzada matriz &times; empleado)</div>

  <div class="bar">
    <div class="field"><label>Desde</label><input type="date" id="desde" value="2026-07-01" /></div>
    <div class="field"><label>Hasta</label><input type="date" id="hasta" value="2026-07-31" /></div>
    <div class="field">
      <label>Metrica</label>
      <select id="metrica">
        <option value="ambos">Seg x Uni + Puntaje</option>
        <option value="segxuni">Seg x Uni</option>
        <option value="premio">Puntaje</option>
      </select>
    </div>
    <div class="field">
      <label>Unidad tiempo</label>
      <select id="unidad">
        <option value="seg">Segundos</option>
        <option value="min">Minutos</option>
        <option value="hs">Horas</option>
      </select>
    </div>
    <div class="field chk"><input type="checkbox" id="piedra" /><label for="piedra" style="text-transform:none">Incluir Piedra (501)</label></div>
    <div class="field"><button id="btn">Generar</button></div>
  </div>

  <div id="status" class="status"></div>
  <div id="result"></div>
</div>

<script>
"use strict";
// MIGRADO a schema GP2: los datos salen del RPC "GP2".informes_matriz_bundle(p_desde,p_hasta,p_incluir_piedra),
// que agrega "GP2".produccion server-side y devuelve la tabla cruzada matriz x empleado ya armada.
// Equivalente a la vista "matriz" (renderMatriz) del informes.js viejo.
// No existe tabla Empleados/Matrices en GP2: nombre_empleado y nombre_matriz vienen embebidos en produccion.
var SB = GP2_SB();

var $ = GP2UI.$;
var $status = $('status'), $result = $('result'), $btn = $('btn');

/* ===== Helpers (portados del informes.js viejo) ===== */
function n(v){ var x = Number(v); return Number.isFinite(x) ? x : 0; }
function f(v, d){ return GP2N.fmt(v, d || 0); }   /* la regla de numero de la casa (gp2-numero.js) */
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function hs(seg){ return f(seg / 3600, 1); }
function cls(v){ return n(v) > 0 ? 'pos' : (n(v) < 0 ? 'neg' : ''); }
function fmtTiempo(seg){
  var u = $('unidad').value;
  if (u === 'min') return f(seg / 60, 2);
  if (u === 'hs')  return f(seg / 3600, 2);
  return f(seg, 2);
}
function unidadLabelCorto(){
  var u = $('unidad').value;
  return u === 'min' ? 'Min' : u === 'hs' ? 'Hs' : 'Seg';
}

/* ===== Render tabla cruzada (equivalente a renderMatriz del modulo viejo) ===== */
function renderMatriz(bundle){
  var empleados = bundle.empleados || [];
  var matrices  = bundle.matrices || [];
  var hsTotal   = bundle.hsTotalByEmp || {};

  if(!matrices.length){ $result.innerHTML = '<p class="muted" style="padding:20px">No se encontraron registros en el rango.</p>'; return; }

  var metrica = $('metrica').value;
  var showSeg = metrica === 'segxuni' || metrica === 'ambos';
  var showPremio = metrica === 'premio' || metrica === 'ambos';
  var uLbl = unidadLabelCorto();
  var soloPiedra = $('piedra').checked && matrices.length === 1;
  var uniLbl = soloPiedra ? 'Kg' : 'Uni';
  var tituloMetrica = metrica === 'ambos' ? (uLbl + ' x ' + uniLbl + ' y Puntaje') : metrica === 'segxuni' ? (uLbl + ' x ' + uniLbl) : 'Puntaje';

  var html = ''
    + '<div class="scroll">'
    + '<div class="title">Rendimiento x Matriz &mdash; ' + esc(tituloMetrica) + ' por Empleado</div>'
    + '<table><thead><tr>'
    + '<th ' + (metrica === 'ambos' ? 'rowspan="2"' : '') + '>N</th>'
    + '<th ' + (metrica === 'ambos' ? 'rowspan="2"' : '') + '>Matriz</th>'
    + '<th ' + (metrica === 'ambos' ? 'rowspan="2"' : '') + '>' + uLbl + '<br>Prom</th>'
    + empleados.map(function(e){
        var parts = String(e.nombre || e.legajo).trim().split(/\s+/);
        var l1 = parts[0] || '', l2 = parts.slice(1).join(' ');
        var label = esc(l1) + '<br><span style="font-weight:400;font-size:11px">' + esc(l2) + '</span>';
        return metrica === 'ambos' ? '<th colspan="2">' + label + '</th>' : '<th>' + label + '</th>';
      }).join('')
    + '</tr>'
    + (metrica === 'ambos' ? '<tr>' + empleados.map(function(){ return '<th>' + uLbl + '</th><th>Ptje</th>'; }).join('') + '</tr>' : '')
    + '</thead><tbody>';

  matrices.forEach(function(m){
    var tHist = n(m.tHist);
    html += '<tr>'
      + '<td class="b">' + esc(m.mat) + '</td>'
      + '<td class="l">' + esc(m.nombre) + '</td>'
      + '<td class="r b">' + (tHist > 0 ? fmtTiempo(tHist) : '') + '</td>';
    empleados.forEach(function(e){
      var c = (m.celdas || {})[e.legajo];
      if (c && n(c.uni) > 0){
        var segXUni = n(c.segTrab) / n(c.uni);
        var colorSeg = tHist > 0 ? (segXUni <= tHist ? 'pos' : 'neg') : '';
        var premio = tHist > 0 ? (-(segXUni / tHist - 1)) * 10 : 0;
        if (showSeg) html += '<td class="r ' + colorSeg + '">' + fmtTiempo(segXUni) + '</td>';
        if (showPremio) html += '<td class="b ' + cls(premio) + '">' + f(premio, 1) + '</td>';
      } else {
        if (showSeg) html += '<td></td>';
        if (showPremio) html += '<td></td>';
      }
    });
    html += '</tr>';
  });

  // Fila HS TOTAL por empleado
  html += '<tr class="sep"><td></td><td class="l">HS TOTAL</td><td></td>'
    + empleados.map(function(e){
        var h = '<td class="r">' + hs(n(hsTotal[e.legajo])) + '</td>';
        return (showSeg && showPremio) ? h + '<td></td>' : h;
      }).join('')
    + '</tr>';

  html += '</tbody></table></div>';
  $result.innerHTML = html;
}

/* ===== Carga via RPC ===== */
var lastBundle = null;

async function __run(){
  var desde = $('desde').value || null;
  var hasta = $('hasta').value || null;
  $btn.disabled = true;
  $status.textContent = 'Cargando...';
  $result.innerHTML = '';
  try {
    var r = await SB.rpc('informes_matriz_bundle', { p_desde: desde, p_hasta: hasta, p_incluir_piedra: $('piedra').checked });
    if (r.error) throw r.error;
    lastBundle = r.data || {};
    renderMatriz(lastBundle);
    var nm = (lastBundle.matrices || []).length, ne = (lastBundle.empleados || []).length;
    $status.textContent = nm + ' matriz(es) · ' + ne + ' empleado(s) · ' + (desde || 'inicio') + ' a ' + (hasta || 'fin');
  } catch (e) {
    $status.textContent = 'Error: ' + (e.message || e);
    console.error(e);
  } finally {
    $btn.disabled = false;
  }
}

// Metrica y unidad re-renderizan sin volver a pegarle a la DB
$('metrica').addEventListener('change', function(){ if (lastBundle) renderMatriz(lastBundle); });
$('unidad').addEventListener('change', function(){ if (lastBundle) renderMatriz(lastBundle); });
$btn.addEventListener('click', __run);

async function __boot(){ __run(); }
__boot();
</script>
</body>
</html>
