  <h1>▦ Stock por ubicación · GP2</h1>
  <button class="btn-acc" onclick="openAjuste()">± Ajuste</button>

 <div class="toolbar">
   <input type="text" id="q" placeholder="Buscar componente (código o descripción)…" oninput="render()">

     <th>fecha</th><th>tipo</th><th>componente</th><th>origen</th><th>destino</th>

 </div>

<script>
const SB=GP2_SB();
var D=null;
// orden de sectores pedido por el usuario (id de sector)
const SECT_ORDER=[1,2,4,5,6,7,8,9,10,11,3]; // crudo,proc,afilado,fleje,plastico,bombilla,remache,garage,carton,caja,(transito al final)
var $ = GP2UI.$;
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function unidad(c){return (c&&c.um==='kg')?'kg':'uni';}
function fmt(n){ return GP2N.fmt(n, 2); }   /* la regla de numero de la casa (gp2-numero.js) */

// arma: por cada ubic id -> [{cid, cant, min}]
function invPorUbic(){
 var m={};
 for(var k in D.inv){var p=k.split(':');var cid=+p[0],uid=+p[1];var v=D.inv[k];
  (m[uid]=m[uid]||[]).push({cid:cid,cant:Number(v.cant)||0,min:Number(v.min)||0});}
 return m;
}
function filtRows(rows){
 var q=($('q').value||'').trim().toLowerCase();
 var solo=$('soloStock').checked;
 return rows.filter(r=>{
  if(solo && !(r.cant>0 || r.cant<0))return false;
  if(q){var c=D.comp[String(r.cid)]||{};var s=((c.cod||'')+' '+(c.d||'')).toLowerCase();if(s.indexOf(q)<0)return false;}
  return true;
 }).sort((a,b)=>{var ca=D.comp[String(a.cid)]||{},cb=D.comp[String(b.cid)]||{};return (ca.cod||'').localeCompare(cb.cod||'');});
}
function tablaRows(rows){
 if(!rows.length)return '<p class="empty">— sin componentes —</p>';
 var h='<table><thead><tr><th>Cód</th><th>Descripción</th><th class="num">Cantidad</th><th class="num">Máximo</th></tr></thead><tbody>';
 rows.forEach(r=>{var c=D.comp[String(r.cid)]||{cod:'?',d:''};
  var cls=r.cant>0?'stock':(r.cant<0?'neg':'zero');
  h+='<tr class="'+cls+'"><td class="cod">'+esc(c.cod||'')+'</td><td>'+esc(c.d||'')+'</td>'+
     '<td class="num">'+fmt(r.cant)+' <span class="mini">'+unidad(c)+'</span></td>'+
     '<td class="num mini">'+(r.min?fmt(r.min):'')+'</td></tr>';
 });
 return h+'</tbody></table>';
}
function group(open, nm, rows, sub){
 var f=filtRows(rows);
 var conStock=f.filter(r=>r.cant>0||r.cant<0).length;
 var badge=conStock?('<span class="badge hot">'+conStock+' con stock</span>'):('<span class="badge">'+f.length+'</span>');
 return '<div class="grp'+(open?' open':'')+'"><div class="gh" onclick="tog(this)"><span class="arr">▶</span>'+
   '<span class="nm">'+esc(nm)+'</span>'+badge+'</div><div class="gb">'+(sub||tablaRows(f))+'</div></div>';
}
function subgroup(nm, rows){
 var f=filtRows(rows);
 var conStock=f.filter(r=>r.cant>0||r.cant<0).length;
 var badge=conStock?('<span class="badge hot">'+conStock+'</span>'):('<span class="badge">'+f.length+'</span>');
 return '<div class="sub"><div class="sh" onclick="tog(this)"><span class="arr">▶</span><span class="nm">'+esc(nm)+'</span>'+badge+'</div><div class="sb">'+tablaRows(f)+'</div></div>';
}
function tog(el){el.parentElement.classList.toggle('open');}
function expandAll(v){document.querySelectorAll('.grp,.sub').forEach(e=>e.classList.toggle('open',v));}

function render(){
 if(!D){return;}
 var byU=invPorUbic();
 // agrupa ubicaciones por tipo
 var sectores={}, provs=[], talls=[], virg=null;
 for(var uid in D.ubic){var u=D.ubic[uid];var id=+uid;
  if(u.tipo==='sector')sectores[u.ref]=id;
  else if(u.tipo==='proveedor_servicio')provs.push({uid:id,ref:u.ref,nom:u.nom});
  else if(u.tipo==='tallerista')talls.push({uid:id,ref:u.ref,nom:u.nom});
  else if(u.tipo==='virgilio')virg=id;
 }
 var H='';
 // 1) sectores en orden pedido
 SECT_ORDER.forEach(sid=>{var uid=sectores[sid];if(!uid)return;var nom=(D.sect[String(sid)]||{nom:'Sector '+sid}).nom;H+=group(false,'▦ '+nom,byU[uid]||[]);});
 // 2) proveedores de servicio (subdividido)
 provs.sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
 var totProv=provs.reduce((n,p)=>n+filtRows(byU[p.uid]||[]).filter(r=>r.cant>0||r.cant<0).length,0);
 var subsP=provs.map(p=>subgroup((D.prov_serv[String(p.ref)]||{nom:p.nom}).nom||p.nom, byU[p.uid]||[])).join('');
 H+='<div class="grp"><div class="gh" onclick="tog(this)"><span class="arr">▶</span><span class="nm">☰ Proveedores de Servicio</span><span class="badge'+(totProv?' hot':'')+'">'+(totProv||provs.length+' PS')+(totProv?' con stock':'')+'</span></div><div class="gb">'+subsP+'</div></div>';
 // 3) talleristas (subdividido)
 talls.sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
 var totTall=talls.reduce((n,t)=>n+filtRows(byU[t.uid]||[]).filter(r=>r.cant>0||r.cant<0).length,0);
 var subsT=talls.map(t=>subgroup((D.tall[String(t.ref)]||{nom:t.nom}).nom||t.nom, byU[t.uid]||[])).join('');
 H+='<div class="grp"><div class="gh" onclick="tog(this)"><span class="arr">▶</span><span class="nm">🔧 Talleristas</span><span class="badge'+(totTall?' hot':'')+'">'+(totTall||talls.length+' tall')+(totTall?' con stock':'')+'</span></div><div class="gb">'+subsT+'</div></div>';
 // 4) virgilio
 if(virg)H+=group(false,'🚛 Virgilio (Distribución)',byU[virg]||[]);
 $('tree').innerHTML=H;
}

async function reload(){
 $('status').textContent='Cargando…';
 try{
  // mismo movimientos_bundle de siempre, pero via el motor compartido:
  // asi los flujos de Ajuste/Armado usan LA MISMA data y lookups.
  D=await GP2M.cargar(SB);
 }catch(e){
  var msg=(e&&e.message)||e;
  $('status').textContent='Error: '+msg;
  $('tree').innerHTML='<p class="empty">No se pudo cargar: '+esc(msg)+'</p>';
  return;
 }
 var n=Object.keys(D.inv||{}).length;
 var con=Object.values(D.inv||{}).filter(v=>Number(v.cant)!==0).length;
 $('status').textContent='GP2 · '+n+' posiciones · '+con+' con stock';
 render();
 renderMovs();
}

/* ═══ Ajuste +/- y Armado en fabrica ═══
   Mismos modales y mismo payload que tenia Registrar_Movimiento.html (borrada):
   la construccion de filas vive en gp2-motor.js (GP2M.ajuste / GP2M.armadoFabrica)
   y se escribe con GP2M.registrar -> RPC registrar_movimientos. */
var MODAL_TIPO=null,_busy=false;
function val(id){var el=$(id);return el?el.value:'';}
function opt(v,t){return '<option value="'+esc(v)+'">'+esc(t)+'</option>';}
function todayLocal(){var d=new Date(),z=n=>(n<10?'0':'')+n;return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function optsComps(ids){
 return ids.filter((v,i,a)=>a.indexOf(v)===i)
  .sort((a,b)=>{var ca=D.comp[String(a)]||{},cb=D.comp[String(b)]||{};return (ca.cod||'').localeCompare(cb.cod||'');})
  .map(id=>{var c=D.comp[String(id)]||{cod:'?',d:''};return opt(id,c.cod+' — '+(c.d||'').replace(/\n/g,' ').substring(0,50));}).join('');
}
function openAjuste(){
 if(!D){toast('Datos todavía cargando…',true);return;}
 MODAL_TIPO='ajuste';
 $('modalTitle').textContent='✏️ Ajuste de inventario (+/-)';
 $('modalForm').innerHTML=
  '<div class="row"><label>Fecha</label><input type="date" id="f_fecha" value="'+todayLocal()+'"></div>'+
  '<div class="row"><label>Componente</label><select id="f_comp" onchange="onAjComp()"><option value="">— Elegí —</option>'+optsComps(Object.keys(D.comp).map(Number))+'</select></div>'+
  '<div class="row"><label>Ubicación</label><select id="f_ubic"><option value="">Elegí componente primero</option></select></div>'+
  '<div class="row"><label>Cantidad (+/-)</label><input inputmode="decimal" type="number" id="f_qty" step="0.01" placeholder="ej -5 o +12"><div class="hint">Positivo suma, negativo descuenta. Corrección manual del stock.</div></div>';
 $('modalBg').classList.add('on');
}
function openArmado(){
 if(!D){toast('Datos todavía cargando…',true);return;}
 MODAL_TIPO='armado_fabrica';
 $('modalTitle').textContent='🏭 Armado en fábrica';
 $('modalForm').innerHTML=
  '<div class="row"><label>Fecha</label><input type="date" id="f_fecha" value="'+todayLocal()+'"></div>'+
  '<div class="row"><label>Artículo a armar</label><select id="f_comp"><option value="">— Elegí —</option>'+optsComps(GP2M.artsFabricaDirecto())+'</select><div class="hint">Solo artículos que arma Cervantes (sin tallerista externo). Consume el BOM y crea el terminado en Fábrica.</div></div>'+
  '<div class="row"><label>Unidades</label><input inputmode="numeric" type="number" id="f_qty" step="1" min="0"></div>';
 $('modalBg').classList.add('on');
}
function onAjComp(){
 var cid=GP2N.entero(val('f_comp'));var sel=$('f_ubic');
 if(!cid){sel.innerHTML='<option value="">Elegí componente primero</option>';return;}
 var ubics=GP2M.ubicacionesDeComp(cid);
 if(!ubics.length){sel.innerHTML='<option value="">(sin ubicación)</option>';return;}
 if(ubics.length===1){sel.innerHTML=opt(ubics[0],D.ubic[String(ubics[0])].nom);return;}
 sel.innerHTML='<option value="">— Elegí —</option>'+ubics.map(u=>opt(u,D.ubic[String(u)].nom)).join('');
}
function closeModal(){$('modalBg').classList.remove('on');MODAL_TIPO=null;}
function setBusy(b){_busy=b;var btn=$('btnSave');if(btn){btn.disabled=b;btn.textContent=b?'Guardando…':'✔ Registrar';}}
var _toastT=null;
function toast(msg,err){var el=$('toast');el.textContent=msg;el.className='on'+(err?' err':'');clearTimeout(_toastT);_toastT=setTimeout(()=>{el.className='';},err?5000:3000);}
async function saveModal(){
 if(_busy||!MODAL_TIPO)return;
 var r;
 try{
  if(MODAL_TIPO==='ajuste')
   r=GP2M.ajuste({comp_id:val('f_comp'),ubic_id:val('f_ubic'),cantidad:GP2N.num(val('f_qty')),fecha:val('f_fecha')});
  else
   r=GP2M.armadoFabrica({comp_id:val('f_comp'),cantidad:GP2N.num(val('f_qty')),fecha:val('f_fecha')});
 }catch(e){alert((e&&e.message)||e);return;}
 setBusy(true);
 try{
  var res=await GP2M.registrar(SB,r.rows);
  closeModal();
  toast('✔ '+((res&&res.n)||r.rows.length)+' movimiento(s) registrado(s)');
  await reload();
 }catch(e){
  toast('Error: '+((e&&e.message)||e),true);
 }finally{setBusy(false);}
}

/* ═══ Ultimos movimientos (misma tabla/labels que Registrar_Movimiento) ═══ */
/* Vocabulario del ledger (GP2.movimiento.tipo_mov), el mismo que escriben las RPC y el motor:
   antes esta tabla tenia los nombres del Registrar_Movimiento viejo (envio_prov, recepcion_tall...)
   y la mayoria de los movimientos reales salian con el codigo crudo. */
var TIPOS={
 compra:{lbl:'Compra',cls:'t-compra'}, fabricacion:{lbl:'Fabricación',cls:'t-prod'},
 armado_fabrica:{lbl:'Armado fábrica',cls:'t-prod'}, consumo_prod:{lbl:'Consumo prod',cls:'t-prod'},
 envio_ps:{lbl:'Env prov serv',cls:'t-envio'}, entrega_ps:{lbl:'Entrega prov serv',cls:'t-recep'},
 consumo:{lbl:'Consumo prov serv',cls:'t-recep'},
 envio_tallerista:{lbl:'Env tall',cls:'t-envio'}, entrega_tallerista:{lbl:'Entrega tall',cls:'t-recep'},
 consumo_tall:{lbl:'Consumo tall',cls:'t-recep'}, devolucion_tallerista:{lbl:'Devolución tall',cls:'t-recep'},
 envio_prov_at:{lbl:'Env prov AT',cls:'t-envio'},
 recepcion_virgilio:{lbl:'Rec Virgilio',cls:'t-virgilio'}, consumo_virgilio:{lbl:'Consumo Virgilio',cls:'t-virgilio'},
 stock_inicial:{lbl:'Stock inicial',cls:'t-ajuste'}, ajuste:{lbl:'Ajuste',cls:'t-ajuste'}
};
function fmtNum(n){if(n==null)return '';var x=Number(n);return Number.isInteger(x)?String(x):x.toFixed(2);}
function fmtFecha(f){if(!f)return '';try{return new Date(f).toLocaleDateString('es-AR');}catch(e){return f;}}
function cNom(cid){var c=(D&&D.comp[String(cid)])||null;return c?c.cod:(cid==null?'':String(cid));}
function uNom(uid){return uid?(((D&&D.ubic[String(uid)])||{nom:'?'}).nom):'';}
async function renderMovs(){
 var tb=$('tbodyMovs');if(!tb)return;
 var res=await SB.from('movimiento').select('*').order('id',{ascending:false}).limit(50);
 if(res.error){tb.innerHTML='<tr><td colspan="8" class="empty">Error: '+esc(res.error.message)+'</td></tr>';return;}
 var movs=res.data||[];
 var bd=$('movsBadge');if(bd)bd.textContent=movs.length?String(movs.length):'0';
 if(!movs.length){tb.innerHTML='<tr><td colspan="8" class="empty">Sin movimientos todavía</td></tr>';return;}
 tb.innerHTML=movs.map(m=>{
  var ti=TIPOS[m.tipo_mov]||{lbl:m.tipo_mov,cls:''};
  return '<tr>'+
   '<td>'+fmtFecha(m.fecha)+'</td>'+
   '<td><span class="tag '+ti.cls+'">'+esc(ti.lbl)+'</span></td>'+
   '<td>'+esc(cNom(m.comp_id))+'</td>'+
   '<td>'+(esc(uNom(m.ubic_origen_id))||'—')+'</td>'+
   '<td>'+(esc(uNom(m.ubic_destino_id))||'—')+'</td>'+
   '<td class="num">'+fmtNum(m.cantidad)+' '+esc(m.unidad_origen||'')+'</td>'+
   '<td>'+esc(m.comp_transformado_id?cNom(m.comp_transformado_id):'')+'</td>'+
   '<td class="num">'+(m.cantidad_transformada!=null?fmtNum(m.cantidad_transformada)+' '+esc(m.unidad_destino||''):'')+'</td>'+
  '</tr>';
 }).join('');
}
reload();
</script>
