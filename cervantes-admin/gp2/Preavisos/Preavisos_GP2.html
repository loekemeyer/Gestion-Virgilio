<!doctype html>
<html lang="es">
<head>
<!-- v1.0.0 — Preaviso de entrega (hueco ① del croquis, idea 7340). Lo que una contraparte
     AVISA que va a traer, antes de traerlo. No mueve stock: el movimiento lo hace después la
     pantalla de entrega. Qué puede entregar cada uno sale de la RUTA (preavisos_bundle),
     no de una tabla nueva. -->
<script src="../auth-guard.js?v=20260929a"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Preavisos · GP2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260929a"></script>
<link rel="stylesheet" href="../gp2-modulo.css?v=20260912c"/>
<link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
<style>
  .pend{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .pcard{border:1px solid #e5e9ee;border-left:5px solid #0066cc;border-radius:8px;padding:10px 12px;background:#fff;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pcard.vencido{border-left-color:#b42318;background:#fff8f8}
  .pcard.hoy{border-left-color:#a15c00;background:#fffdf5}
  .pcard .qué{flex:1;min-width:200px;font-size:17px}
  .pcard .cuando{font-size:15px;font-weight:800;white-space:nowrap}
  .pcard .llego{font-size:14px;color:#0a7a2f;font-weight:800}
  .sub2{font-size:14px;color:#777}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Preavisos</h1>
    <div class="hbtns">
      <button class="hlink hidden" id="btnVolver" type="button">← Cambiar quién avisa</button>
      <a href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">

    <!-- FASE 0 — pendientes + elegir quién avisa -->
    <div id="fase0">
      <div class="row"><label class="lbl">Lo prometido y todavía no entregado</label></div>
      <div class="pend" id="pend"></div>

      <div class="row"><label class="lbl">Anotar un preaviso nuevo · ¿Quién avisa?</label></div>
      <div class="provs-grid" id="cpGrid"></div>
      <div class="aviso">
        Esto <b>no mueve stock</b>: es la promesa. Cuando la mercadería llega de verdad se carga
        por la pantalla de entrega de siempre, y acá el preaviso se marca cumplido.
      </div>
      <div id="status" class="status">Cargando…</div>
    </div>

    <!-- FASE 1 — cargar lo que promete -->
    <div id="fase1" class="hidden">
      <div class="row" style="justify-content:space-between">
        <div class="row" style="margin:0"><label class="lbl" id="fase1Title">—</label></div>
        <div class="row" style="margin:0">
          <label class="lbl" style="font-size:16px">Lo trae el</label>
          <input type="date" id="fFecha">
          <button class="btn btn-primary" id="btnEnviar" type="button" disabled>Anotar</button>
        </div>
      </div>

      <div class="search-box"><input type="text" id="q" placeholder="Buscar por código o descripción…"></div>

      <div class="table-wrap">
        <table class="t">
          <thead><tr>
            <th>Pieza</th>
            <th class="num sep">Cantidad</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="tblEmpty" class="empty hidden"></div>
      <div id="msg1" class="status"></div>
    </div>

    <!-- FASE 3 — listo -->
    <div id="fase3" class="hidden">
      <div class="successBox">
        <div class="title">✓ Preaviso anotado</div>
        <div>Tu código:</div>
        <div class="code" id="successCode">—</div>
        <div id="successDetail" style="font-size:17px;color:#444"></div>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn btn-primary" id="btnVolverTall" type="button">← Volver</button>
      </div>
    </div>

  </div>
</div>

<script src="../gp2-ui.js?v=20260913e"></script>
<script src="../gp2-numero.js?v=20260911o"></script>
<script src="../gp2-envios-common.js?v=20260924b"></script>
<script>
"use strict";

var E = GP2EE;
var $ = GP2UI.$, esc = GP2UI.esc, num = E.num, hoyISO = E.hoyISO;
var SB = GP2_SB();

var D = { contrapartes: [], entrega: [], abiertos: [] };
var selCP = null;
var BUF = E.buffer("gp2_preavisos_buffer", function(){ return { uni:"" }; });

function claveCP(c){ return c.tipo + ":" + c.id; }

async function cargar(){
  try {
    var r = await SB.rpc("preavisos_bundle");
    if (r.error) throw r.error;
    D = r.data || D;
    BUF.load();
    pintarPendientes();
    pintarCPS();
    $("status").textContent = D.contrapartes.length + " contrapartes · " +
      D.abiertos.length + " preaviso" + (D.abiertos.length === 1 ? "" : "s") + " pendiente" +
      (D.abiertos.length === 1 ? "" : "s") + ".";
  } catch(e){
    $("status").innerHTML = '<span style="color:#b91c1c">Error: ' + esc(e.message || e) + "</span>";
  }
}

function pintarPendientes(){
  var w = $("pend");
  if (!D.abiertos.length){
    w.innerHTML = '<div class="empty">Nadie prometió nada pendiente. Anotá abajo lo que te avisen.</div>';
    return;
  }
  w.innerHTML = D.abiertos.map(function(p){
    var d = Number(p.dias);
    var cls = d < 0 ? " vencido" : (d === 0 ? " hoy" : "");
    var cuando = d < 0 ? ("⚠ " + (-d) + " día" + (d === -1 ? "" : "s") + " tarde")
              : d === 0 ? "hoy"
              : ("en " + d + " día" + (d === 1 ? "" : "s"));
    var llego = Number(p.entregado_desde) > 0
      ? '<span class="llego">ya entregó ' + GP2N.fmt(p.entregado_desde, 0) + "</span>" : "";
    return '<div class="pcard' + cls + '">' +
      '<div class="qué"><b>' + esc(p.contraparte || "—") + "</b> · " +
        '<span class="cod">' + esc(p.comp_cod) + "</span> " + GP2N.fmt(p.cantidad, 0) + " " + esc(p.unidad) +
        '<br><small class="sub2">' + esc(p.comp_desc || "") + (p.nota ? (" · " + esc(p.nota)) : "") + "</small></div>" +
      '<div class="cuando">' + esc(cuando) + "</div>" + llego +
      '<button class="btn btn-secondary" data-a="cumplido" data-id="' + p.id + '">✓ Llegó</button>' +
      '<button class="btn btn-secondary" data-a="anulado" data-id="' + p.id + '">✕ No viene</button>' +
      "</div>";
  }).join("");
}

function pintarCPS(){
  E.gridContrapartes("cpGrid", D.contrapartes.map(function(c){
    return { id: claveCP(c), tipo: c.tipo, ref: c.id, nombre: c.nombre };
  }), {
    vacio: "No hay contrapartes con rutas cargadas.",
    meta: function(c){
      var n = piezasDe(c).length;
      var cargado = E.cargadasDe(BUF.all[c.id], function(it){ return num(it.uni) > 0; }).length;
      var t = c.tipo === "tallerista" ? "tallerista" : c.tipo === "proveedor_at" ? "prov. AT" : "prov. servicio";
      return t + " · " + n + " pieza" + (n === 1 ? "" : "s") + (cargado ? (" · " + cargado + " cargadas") : "");
    },
    onPick: elegir
  });
}

function piezasDe(c){
  return D.entrega.filter(function(x){ return x.tipo === c.tipo && String(x.ref) === String(c.ref); })
    .sort(function(a,b){ return String(a.cod).localeCompare(String(b.cod)); });
}

function elegir(c){
  selCP = c;
  $("fase1Title").textContent = c.nombre;
  E.mostrarFase(1);
  if (!$("fFecha").value) $("fFecha").value = hoyISO();
  $("q").value = "";
  render();
}
function volver(){ selCP = null; E.mostrarFase(0); pintarCPS(); }

function render(){
  var arr = E.filtrar(piezasDe(selCP), $("q").value, function(x){
    return String(x.cod || "") + " " + String(x.desc || "");
  });
  var tb = $("tbody");
  tb.innerHTML = "";
  $("tblEmpty").classList.toggle("hidden", arr.length > 0);
  if (!arr.length) $("tblEmpty").textContent = "Sin resultados para ese filtro.";

  arr.forEach(function(x){
    var it = BUF.item(selCP.id, x.comp_id);
    var tr = document.createElement("tr");
    tr.dataset.cid = x.comp_id;
    tr.innerHTML =
      '<td><span class="cod">' + esc(x.cod) + '</span><br><small class="sub">' + esc(x.desc || "") + "</small></td>" +
      E.tdInput("uni", it.uni, false, "sep");
    tb.appendChild(tr);
  });
  actualizar();
}

function cargadas(){ return E.cargadasDe(BUF.de(selCP.id), function(it){ return num(it.uni) > 0; }); }
function actualizar(){ E.actualizarEnviar(cargadas().length, "Anotar"); }

$("tbody").addEventListener("input", function(e){
  var inp = e.target.closest("input.cell-in");
  if (!inp) return;
  BUF.item(selCP.id, inp.closest("tr").dataset.cid)[inp.dataset.f] = inp.value;
  BUF.save(); actualizar();
});

$("q").addEventListener("input", render);
$("btnVolver").addEventListener("click", volver);
$("btnVolverTall").addEventListener("click", function(){ location.reload(); });

/* Cerrar o anular un pendiente */
$("pend").addEventListener("click", async function(e){
  var btn = e.target.closest("button[data-a]");
  if (!btn) return;
  var estado = btn.dataset.a;
  if (estado === "anulado" && !confirm("¿Marcar que finalmente no viene?")) return;
  btn.disabled = true;
  try {
    var r = await SB.rpc("preaviso_marcar", { p_id: Number(btn.dataset.id), p_estado: estado });
    if (r.error) throw r.error;
    await cargar();
  } catch(err){
    alert("No se pudo: " + (err.message || err));
    btn.disabled = false;
  }
});

$("btnEnviar").addEventListener("click", async function(){
  if (!selCP) return;
  var items = cargadas();
  if (!items.length) return;
  var metaPor = {};
  piezasDe(selCP).forEach(function(x){ metaPor[x.comp_id] = x; });

  var fecha = $("fFecha").value || hoyISO();
  var usuario = null;
  try { usuario = localStorage.getItem("gp2_usuario") || null; } catch(e2){}

  var payload = {
    tipo_contraparte: selCP.tipo,
    contraparte_id: selCP.ref,
    fecha_promesa: fecha,
    usuario: usuario,
    items: items.map(function(o){
      return { comp_id: Number(o.k), cantidad: num(o.it.uni), unidad: "uni" };
    })
  };
  var resumen = items.map(function(o){
    var m = metaPor[o.k] || {};
    return (m.cod || o.k) + ": " + GP2N.fmt(num(o.it.uni), 0);
  });
  if (!confirm("Anotar que " + selCP.nombre + " trae el " + fecha + ":\n\n" + resumen.join("\n"))) return;

  var btn = $("btnEnviar");
  btn.disabled = true; btn.textContent = "Anotando…";
  $("msg1").textContent = "";
  try {
    var r = await SB.rpc("crear_preaviso", { p: payload });
    if (r.error) throw r.error;
    BUF.borrar(selCP.id);
    await cargar();
    E.mostrarExito((r.data && r.data.n) + " piezas prometidas por " + selCP.nombre + " para el " + fecha);
  } catch(err){
    $("msg1").innerHTML = '<span style="color:#b91c1c">Error: ' + esc(err.message || err) + "</span>";
    btn.disabled = false; actualizar();
  }
});

$("fFecha").value = hoyISO();
cargar();
</script>
</body>
</html>
