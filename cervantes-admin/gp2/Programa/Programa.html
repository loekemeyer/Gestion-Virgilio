<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Anti-cache: TODO el CSS y el JS de esta pantalla viven embebidos en este HTML y la pantalla
     se navega directo desde el menu (sin ?v= propio). Sin estos meta, una copia cacheada del
     HTML deja al usuario con la version vieja para siempre. Mismo agujero que se tapo el
     2026-09-11 en GP2_MODULOS.html y envios-only.html. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Loekemeyer · ¿Qué necesito para producir?</title>
<style>
 /* ============================================================================
    GP2 · ¿Qué necesito para producir? — rediseño 2026-09-11 (pedido del usuario:
    "más grande, sin tantos colores, no tan claro, fondo más oscuro, más legible").
    Tres decisiones de fondo:
      1. FONDO OSCURO y contraste alto. Esta pantalla NO carga gp2-claro.css
         (el tema claro global) a propósito: se pisa entera acá.
      2. DOS colores, no once. Ámbar = lo nuestro (matriz, fleje, kg, artículo).
         Celeste = lo de afuera (proveedor, tallerista). Todo lo demás, gris.
         El tipo de nodo se lee por la ETIQUETA y por la barra lateral, no por
         diez fondos de colores distintos.
      3. El sector donde queda el stock dejó de ser un nodo suelto: es el pie de
         la tarjeta del paso que lo produce. Eso parte al medio el largo de cada
         cadena (de ~10 nodos a ~5), que era lo que obligaba a scrollear y a
         achicar la letra.
    ========================================================================== */
 *{box-sizing:border-box}
 /* Gris azulado MEDIO, no negro. La primera vuelta (2026-09-11) quedó casi negra y el
    usuario la vio menos legible, no más: con el fondo muy oscuro el texto gris de las
    descripciones se apaga. Fondo medio + texto blanco puro = más contraste real. */
 :root{
  --bg:#29323d; --bar:#212a35; --lane:#343f4c; --card:#414e5d; --cardq:#3a4655;
  --line:#4d5b6b; --line2:#64748a;
  --tx:#ffffff; --tx2:#d3dde8; --tx3:#adbbc9;
  --amb:#ffc046; --blu:#8fd0ff;
 }
 html,body{background:var(--bg);color:var(--tx)}
 body{margin:0;font:16px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}

 /* ---- barra de filtros: pegada arriba, campos grandes (regla de accesibilidad) ---- */
 .top{position:sticky;top:0;z-index:30;background:var(--bar);border-bottom:1px solid var(--line);
      padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
 .top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px;color:var(--tx)}
 .top .sel{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;
           text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);font-weight:700}
 .top .fld{display:flex;flex-direction:column;gap:3px}
 .top select,.top input{background:#0d151d;color:var(--tx);border:1px solid var(--line2);border-radius:8px;
                        padding:8px 11px;font-size:19px;font-family:inherit;font-weight:600}
 .top select:focus,.top input:focus{outline:none;border-color:var(--amb)}
 .top input#uni{width:130px;text-align:right;color:var(--amb);font-weight:800;font-size:20px}
 .top input#buscar{width:230px;max-width:78vw;font-weight:500}
 .top select#art{max-width:min(620px,78vw)}
 .top select#marca,.top select#tallAlt{max-width:78vw}
 [hidden]{display:none!important}
 /* ---- selector de articulo en DOS PASOS: primero la marca, despues el articulo
    (pedido del usuario 2026-09-11). El <select id="art"> sigue existiendo OCULTO: es el
    modelo que lee el resto de la pantalla. ---- */
 .top .artbtn{background:#0d151d;color:var(--tx);border:1px solid var(--line2);border-radius:8px;
   padding:8px 12px;font-size:19px;font-family:inherit;font-weight:700;text-align:left;cursor:pointer;
   min-height:46px;min-width:260px;max-width:min(620px,78vw);text-transform:none;letter-spacing:0;
   display:flex;align-items:center;justify-content:space-between;gap:12px}
 .top .artbtn #artBtnTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .top .artbtn .caret{color:var(--tx3);font-size:15px;flex-shrink:0}
 .top .artbtn:focus{outline:none;border-color:var(--amb)}
 .pick{position:fixed;inset:0;background:rgba(10,16,22,.62);display:flex;align-items:flex-start;
   justify-content:center;padding:20px 12px;z-index:60}
 .pickbox{background:var(--lane);border:1px solid var(--line);border-radius:14px;width:100%;
   max-width:480px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
 .pickhead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);
   font-size:17px;color:var(--tx)}
 .pickhead b{flex:1;font-weight:800}
 .pickhead button{background:var(--card);border:1px solid var(--line2);border-radius:9px;color:var(--tx);
   font-size:19px;min-width:46px;min-height:46px;cursor:pointer;font-family:inherit}
 .marcas{display:flex;flex-direction:column;gap:10px;padding:14px}
 .marcas button{background:var(--card);border:1px solid var(--line2);border-radius:11px;color:var(--tx);
   font-size:22px;font-weight:800;min-height:56px;cursor:pointer;font-family:inherit}
 .marcas button:hover{border-color:var(--amb);color:var(--amb)}
 #pickArts{display:flex;flex-direction:column;min-height:0;padding:14px;gap:10px}
 #pickArts input{background:#0d151d;color:var(--tx);border:1px solid var(--line2);border-radius:8px;
   padding:11px 12px;font-size:19px;font-family:inherit;width:100%}
 #pickArts input:focus{outline:none;border-color:var(--amb)}
 .picklist{overflow-y:auto;min-height:0}
 .picklist .fam{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);
   margin:12px 0 5px;font-weight:800}
 .picklist button{display:block;width:100%;text-align:left;background:var(--cardq);
   border:1px solid var(--line);border-radius:9px;color:var(--tx2);font-size:18px;padding:11px 13px;
   min-height:46px;margin-bottom:7px;cursor:pointer;font-family:inherit}
 .picklist button:hover{border-color:var(--line2);color:var(--tx)}
 .picklist button.on{border-color:var(--amb);color:var(--amb);font-weight:800}

 .canvas{padding:18px 18px 48px;max-width:1680px;overflow-x:auto}

 /* ---- encabezado del artículo ---- */
 .hero{background:linear-gradient(180deg,#1e2b3a,#18222e);border:1px solid var(--line);
       border-left:5px solid var(--amb);border-radius:14px;padding:14px 20px;margin-bottom:14px;
       display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
       width:fit-content;max-width:100%}
 .hero .cod{font-size:42px;font-weight:800;color:var(--amb);line-height:1;letter-spacing:1px}
 .hero .fam{font-size:16px;color:var(--tx2);margin-top:5px}
 .hero .kpis{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
 .hero .kpi{padding:2px 18px;border-left:1px solid var(--line);font-size:12px;color:var(--tx3);
            text-transform:uppercase;letter-spacing:.6px;font-weight:700}
 .hero .kpi b{display:block;font-size:21px;color:var(--tx);font-weight:800;text-transform:none;letter-spacing:0}
 .hero .kpi.ens b{color:var(--blu)}

 /* ---- despiece del artículo (qué piezas lleva y cuántas) ---- */
 .despiece{background:var(--lane);border:1px solid var(--line);border-left:5px solid var(--amb);
           border-radius:14px;padding:12px 18px 14px;margin-bottom:16px;width:fit-content;max-width:100%;
           overflow-x:auto}
 .despiece h3{margin:0 0 8px;color:var(--tx3);font-size:12.5px;text-transform:uppercase;letter-spacing:1px}
 .despiece table{border-collapse:collapse;width:auto}
 .despiece th{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);
              text-align:left;padding:4px 16px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
 .despiece td{font-size:16px;color:var(--tx2);padding:6px 16px 6px 0;border-bottom:1px solid var(--line);
              white-space:nowrap}
 .despiece tr:last-child td{border-bottom:0}
 .despiece td:last-child,.despiece th:last-child{padding-right:0}
 .despiece .cd{font-family:ui-monospace,SF Mono,Menlo,monospace;font-weight:800;color:var(--tx);font-size:16.5px}
 .despiece .ds{color:var(--tx2);white-space:normal;max-width:380px}
 .despiece .sc{color:var(--tx3);font-size:14px;text-transform:uppercase;letter-spacing:.5px}
 .despiece .nu{text-align:right;font-weight:800;color:var(--tx)}
 .despiece .tt{text-align:right;font-weight:800;color:var(--amb);font-size:17px}

 /* ---- títulos de bloque ---- */
 .section-title{display:flex;align-items:center;gap:10px;margin:26px 0 10px;font-size:14px;font-weight:800;
                color:var(--tx2);text-transform:uppercase;letter-spacing:1.2px}
 .section-title .n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
                   border-radius:50%;background:rgba(243,175,69,.15);border:1px solid rgba(243,175,69,.45);
                   color:var(--amb);font-size:14px;font-weight:800;letter-spacing:0;flex-shrink:0}

 /* ---- carril de una ruta. width:fit-content = sin espacio muerto a la derecha.
        Sin max-width: si la ruta es más larga que la pantalla, el carril mide lo que
        necesita y ajustarFilas() lo escala para que entre entero. ---- */
 .lane{background:var(--lane);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
       margin-bottom:10px;width:fit-content}
 .lane.conv{border-color:#4a5b6e}
 .lane .head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:10px;
             font-size:16px;color:var(--tx2);flex-wrap:wrap}
 .lane .head b{color:var(--tx);font-size:17px;font-weight:800}
 .lane .head .fkg{background:rgba(243,175,69,.13);color:var(--amb);border:1px solid rgba(243,175,69,.38);
                  padding:3px 13px;border-radius:20px;font-weight:800;font-size:16px;white-space:nowrap}
 .lane .head .uni{background:rgba(255,255,255,.07);border:1px solid var(--line2);color:var(--tx);
                  padding:3px 13px;border-radius:20px;font-weight:800;font-size:16px;white-space:nowrap}

 /* ---- la cadena ----
    UNA RUTA = UNA FILA [usuario 2026-09-11: "quiero que una misma ruta entre en una sola
    fila, que no se mande por abajo, para terminarla"]. Nada de wrap y nada de scroll
    lateral (que escondía el final de la ruta): el carril que no entra se ACHICA solo
    hasta que entra — lo hace ajustarFilas() en JS, con piso para que no se vuelva
    ilegible. En celular la cadena sigue bajando en vertical. */
 .flow{display:flex;gap:8px;align-items:stretch;flex-wrap:nowrap;padding-bottom:2px}
 .flow.branch{margin-bottom:4px}
 .branch-lbl{font-size:14.5px;font-weight:700;color:var(--tx2);margin:12px 0 5px}
 .branch-lbl .r{color:var(--amb);font-weight:800}
 .converge-bar{display:flex;align-items:center;gap:12px;margin:14px 0 10px;color:var(--amb);font-size:13px;
               font-weight:800;text-transform:uppercase;letter-spacing:1.2px}
 .converge-bar .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}

 /* ---- tarjeta de paso ---- */
 /* Angosta a propósito: cuanto más angosta la tarjeta, menos hay que achicar el carril
    para que la ruta entre en una fila — y la letra queda más grande, no más chica. */
 .node{background:var(--card);border:1px solid var(--line2);border-left:4px solid var(--line2);
       border-radius:10px;padding:9px 11px;min-width:150px;max-width:225px;display:flex;flex-direction:column;
       gap:2px;flex-shrink:0}
 .node .tp{font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--tx3);
           line-height:1.25}
 .node .nm{font-size:21px;font-weight:800;font-family:ui-monospace,SF Mono,Menlo,monospace;color:var(--tx);
           line-height:1.15;word-break:break-word;margin-top:1px}
 .node .ex{font-size:14.5px;color:var(--tx2);line-height:1.3;margin-top:1px;
           display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
 .node .rend{font-size:14px;color:var(--amb);font-weight:700;margin-top:2px}
 .node .foot{margin-top:auto;padding-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
 .node .dest{width:100%;font-size:13.5px;font-weight:700;color:var(--tx2);background:var(--cardq);
             border:1px dashed var(--line2);border-radius:8px;padding:4px 9px;line-height:1.3}
 .node .dest .sc{color:var(--tx);font-weight:800}
 .node .qty{font-size:16px;font-weight:800;color:var(--tx);background:rgba(255,255,255,.09);
            border-radius:8px;padding:2px 10px;white-space:nowrap}
 .node .kg{font-size:16px;font-weight:800;color:var(--amb);background:rgba(243,175,69,.13);
           border-radius:8px;padding:2px 10px;white-space:nowrap}

 /* ---- SOLO DOS COLORES: ámbar = lo nuestro, celeste = lo de afuera ---- */
 .n-matriz,.n-afil,.n-fleje{border-left-color:var(--amb)}
 .n-matriz .tp,.n-afil .tp,.n-fleje .tp{color:var(--amb)}
 .n-prov,.n-tall{border-left-color:var(--blu)}
 .n-prov .tp,.n-tall .tp{color:var(--blu)}
 .n-virg{background:linear-gradient(180deg,#2c2314,#231c11);border-color:#6a512c;border-left-color:var(--amb)}
 .n-virg .tp{color:var(--amb)}
 .n-virg .nm{color:var(--amb)}

 .arr{color:var(--tx3);font-size:22px;align-self:center;user-select:none;flex-shrink:0;padding:0 1px}
 .arr.plus{color:var(--amb);font-size:20px;font-weight:800}

 /* ---- celular: la cadena baja en vertical y cada tarjeta ocupa el ancho ---- */
 @media(max-width:560px){
  .top h1{font-size:17px}
  .canvas{padding:14px 12px 40px}
  .hero .cod{font-size:34px}
  .hero .kpi{padding:2px 12px}
  .hero .kpi:first-child{border-left:0;padding-left:0}
  .lane{width:auto;padding:12px}
  .flow{flex-direction:column;align-items:stretch;gap:6px}
  .node{min-width:0;max-width:none}
  .arr{align-self:center;transform:rotate(90deg);font-size:24px;padding:0}
  .arr.plus{transform:none}
 }
</style><link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
</head>
<body>
<div id="gp2-logobar" style="position:relative;background:#141e28;text-align:center;padding:6px 0;border-bottom:1px solid #2a3a4a"><a href="../GP2_MODULOS.html" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#eef4f9;text-decoration:none;font-weight:700;font-size:16px;padding:6px 12px;border:1px solid #3c5468;border-radius:8px;background:#1d2836">← Atrás</a><a href="../GP2_MODULOS.html" style="text-decoration:none"><img src="../GP2_logo.png" alt="GP2 · Gestión Productiva" style="height:40px;vertical-align:middle"></a></div>

<div class="top">
 <h1>🏭 ¿Qué necesito para producir?</h1>
 <div class="sel">
  <span class="fld">Artículo <button type="button" id="artBtn" class="artbtn"><span id="artBtnTxt">—</span><span class="caret">▾</span></button></span>
  <select id="marca" hidden><option value="">Todas</option><option value="LOEKE">Loeke</option><option value="LOKE">Loke</option><option value="CHEF">Chef</option></select>
  <select id="art" hidden></select>
  <span class="fld">Unidades <input inputmode="numeric" id="uni" type="number" value="1000" min="1"></span>
  <span class="fld" id="tallAltBox" style="display:none">Tallerista <select id="tallAlt"></select></span>
 </div>
</div>
<div class="canvas" id="canvas"></div>

<div id="pick" class="pick" hidden>
 <div class="pickbox">
  <div class="pickhead">
   <button type="button" id="pickBack" hidden>←</button>
   <b id="pickTit">Elegí la marca</b>
   <button type="button" id="pickX">✕</button>
  </div>
  <div id="pickMarcas" class="marcas">
   <button type="button" data-mk="LOEKE">Loeke</button>
   <button type="button" data-mk="LOKE">Loke</button>
   <button type="button" data-mk="CHEF">Chef</button>
   <button type="button" data-mk="">Todas</button>
  </div>
  <div id="pickArts" hidden>
   <input id="buscar" type="search" placeholder="código o nombre" autocomplete="off">
   <div id="pickList" class="picklist"></div>
  </div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260905k"></script>
<script src="../gp2-ui.js?v=20260912a"></script>
<script src="../gp2-numero.js?v=20260911o"></script>
<script>var D={};

var SB=GP2_SB();
function __run(){
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function sName(sid){var s=D.sect[String(sid)];return s?s.t:"?"}
var SECT2CLS={"crudo":"crudo","procesado":"proc","movimiento":"tr","afilado":"afil","fleje":"fleje","plástico":"insu","bombilla":"insu","remache":"insu","garage":"sub","cartón":"insu","caja":"insu","terminado":"virg"};
function sCls(sid){return SECT2CLS[sName(sid)]||"crudo"}
function cById(cid){return D.comp[String(cid)]||{cod:"?",d:"",s:null}}
function fmt(n){if(n==null||isNaN(n))return "?";n=Number(n);return GP2N.fmt(n, n>=100?0:n>=10?1:n>=1?2:3, null, true);}   /* la regla de numero de la casa; decimales segun magnitud */

// Defensive: ordenar rp por 'orden' aunque en Excel esté fuera de orden físico
for(var _rid in D.rp)D.rp[_rid].sort(function(a,b){return a.o-b.o;});
var sel=document.getElementById("art");
var selMarca=document.getElementById("marca");
var inpBuscar=document.getElementById("buscar");
var artBtn=document.getElementById("artBtn"),pick=document.getElementById("pick"),
    pickMarcas=document.getElementById("pickMarcas"),pickArts=document.getElementById("pickArts"),
    pickList=document.getElementById("pickList"),pickTit=document.getElementById("pickTit"),
    pickBack=document.getElementById("pickBack");
var MKLBL={LOEKE:"Loeke",LOKE:"Loke",CHEF:"Chef","":"Todas"};
/* el articulo realmente elegido: solo cambia al tocar una fila, nunca al filtrar */
var elegido=null;
/* busca por codigo o por descripcion, sin acentos ni mayusculas */
function norm(t){return (t||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
/* El combo se arma por FAMILIA (optgroup) y cada opcion muestra la descripcion del articulo,
   no la familia repetida. La familia y la descripcion salen de GP2.articulo (catalogo mayorista,
   2026-09-10). El filtro de marca deja LOEKE / CHEF / todas. */
function llenarArticulos(){
 var mk=selMarca.value, prev=sel.value, q=norm(inpBuscar.value).trim();
 var arts=D.art.filter(function(a){
     if(mk&&a.mk!==mk)return false;
     if(!q)return true;
     return norm(a.cod).indexOf(q)>=0||norm(a.d).indexOf(q)>=0||norm(a.fam).indexOf(q)>=0;
   })
   .sort(function(a,b){
     var fa=a.fam||"zzz", fb=b.fam||"zzz";
     if(fa!==fb)return fa.localeCompare(fb,"es");
     return (parseInt(a.cod)||9999)-(parseInt(b.cod)||9999);
   });
 sel.innerHTML="";
 var grupo=null, famAct=null;
 arts.forEach(function(a){
  if(a.fam!==famAct){famAct=a.fam;grupo=document.createElement("optgroup");grupo.label=famAct||"Sin familia";sel.appendChild(grupo);}
  var o=document.createElement("option");
  o.value=a.id;
  o.textContent=a.cod+"  —  "+(a.d||a.fam||"")+(a.disc?"  (discontinuado)":"");
  grupo.appendChild(o);
 });
 if(!arts.length)sel.innerHTML='<option value="">(ningún artículo con ese filtro)</option>';
 /* El <select> oculto es EL MODELO que lee render(). Al rearmar las opciones el navegador
    auto-selecciona la primera, y eso movia el articulo elegido solo (entrabas a Loeke y te
    quedaba el 066, a Chef el 043). Se restaura siempre a 'elegido'; si con este filtro no
    esta en la lista, se le agrega una opcion suelta para que el valor siga siendo el correcto. */
 if(elegido!=null&&elegido!==""){
  if(!arts.some(function(a){return String(a.id)===String(elegido);})){
   var ox=document.createElement("option");ox.value=elegido;sel.insertBefore(ox,sel.firstChild);
  }
  sel.value=elegido;
 }
 pintarLista(arts);
 return arts.length>0;
}
/* La lista del paso 2 del selector: mismas familias y mismo texto que el <select> oculto. */
function pintarLista(arts){
 pickList.innerHTML="";
 if(!arts.length){pickList.innerHTML='<div class="fam">(ningún artículo con ese filtro)</div>';return;}
 var famAct=null;
 arts.forEach(function(a){
  if(a.fam!==famAct){famAct=a.fam;var h=document.createElement("div");h.className="fam";h.textContent=famAct||"Sin familia";pickList.appendChild(h);}
  var b=document.createElement("button");b.type="button";b.setAttribute("data-id",a.id);
  b.textContent=a.cod+"  —  "+(a.d||a.fam||"")+(a.disc?"  (discontinuado)":"");
  if(elegido!=null&&String(a.id)===String(elegido))b.className="on";
  pickList.appendChild(b);
 });
}
function pintarBoton(){
 var a=null;D.art.forEach(function(x){if(String(x.id)===String(sel.value))a=x;});
 document.getElementById("artBtnTxt").textContent=a?(a.cod+"  \u2014  "+(a.d||a.fam||"")):"Elegí un artículo";
}
llenarArticulos();

function expandBOM(aid){
 var need={};
 var bom=D.bom.filter(function(b){return b.a===aid;});
 // vis por rama: corta ciclos en componente_bom (padre->hijo->padre) sin romper diamantes (mismo patron que Faltantes)
 function add(cid,q,vis){if(vis[cid])return;var v=Object.assign({},vis);v[cid]=1;need[cid]=(need[cid]||0)+q;var subs=D.children[String(cid)]||[];subs.forEach(function(s){add(s.c,q*s.q,v);});}
 bom.forEach(function(b){add(b.c,b.q,{});});
 return {need:need,bom:bom};
}

/* Una tarjeta de paso. 'dest' es el pie: dónde queda lo que sale de este paso
   (sector de stock o tránsito). Antes era un nodo aparte y duplicaba el largo
   de la cadena; ahora vive adentro de la tarjeta que lo produce. */
function node(tp,cls,nm,ex,extra,qty,kg,dest){
 var h='<div class="node n-'+cls+'">';
 h+='<div class="tp">'+esc(tp)+'</div>';
 h+='<div class="nm">'+esc(nm)+'</div>';
 if(ex)h+='<div class="ex">'+esc(ex)+'</div>';
 if(extra)h+='<div class="rend">'+esc(extra)+'</div>';
 if(dest||qty!=null||kg!=null){
  h+='<div class="foot">';
  if(dest)h+=dest;
  if(qty!=null)h+='<div class="qty">× '+fmt(qty)+'</div>';
  if(kg!=null)h+='<div class="kg">'+fmt(kg)+' kg</div>';
  h+='</div>';
 }
 h+='</div>';
 return h;
}
/* pie "queda en el sector X" */
function destSector(sec,cod,desc){
 var t='📦 <span class="sc">'+esc(sec.toUpperCase())+'</span>';
 if(cod)t+=' · stock '+esc(cod);
 if(desc)t+=' · '+esc(desc);
 return '<div class="dest">'+t+'</div>';
}

/* ---- Stock Tránsito PS -------------------------------------------------------------
   Una pieza que sale de un proveedor de servicio y se va DERECHO a otro no vuelve a
   ningún sector: espera "en tránsito" hasta que se manda al siguiente. Dibujar ahí un
   "stock Sector X" es mentira — ese stock no existe.
   La regla es LA MISMA que usa stock_transito_ps_bundle (módulo Stock Tránsito PS):
   dos pasos proveedor_servicio consecutivos donde el segundo consume lo que salió del
   primero. No se inventa nada acá.                                                     */
function esTransitoPS(p,pNext){
 return !!(p && pNext && p.tp==='proveedor_servicio' && pNext.tp==='proveedor_servicio'
           && p.cs && pNext.ce===p.cs);
}
// El proceso que espera, en infinitivo, para leerlo como el resto de las descripciones
// ("Resorte U p/Templar" que ya se templó y espera niquelado → "Resorte U p/Niquelar").
var PROC_INF={"Niquelado":"Niquelar","Cromado":"Cromar","Zincado":"Zincar","Pintado":"Pintar",
 "Serigrafiado":"Serigrafiar","Pavonado":"Pavonar","Rectificado":"Rectificar","Calado":"Calar",
 "Adhesivado":"Adhesivar","Blisteado":"Blistear","blisteado":"Blistear","Armado Mango":"Armar Mango",
 "Templado, Cementado":"Templar"};
function procInf(proc){
 proc=String(proc||"").trim();
 if(!proc)return "";
 if(PROC_INF[proc])return PROC_INF[proc];
 return /ado$/.test(proc)?proc.replace(/ado$/,"ar"):proc;   // niquelado → niquelar
}
// "Resorte U p/Templar" → "Resorte U": el estado viejo ya no aplica, la pieza espera otra cosa
function descSinDestino(d){ return String(d||"").replace(/\s*p\/\s*.*$/i,"").trim(); }
/* pie "no vuelve a ningún sector: queda en tránsito esperando al PS siguiente" */
function destTransito(comp,pNext){
 var px=D.prov[String(pNext.pr)]||{};
 var inf=procInf(px.p);
 var base=descSinDestino(comp.d);
 var ex=(comp.cod||"?")+(base?(" · "+base):"")+(inf?(" p/"+inf):"");
 return '<div class="dest">🚚 <span class="sc">TRÁNSITO</span> · '+esc(ex)+' → '+esc(px.n||"?")+'</div>';
}
/* el pie que corresponde al paso p (tránsito, sector, o nada) */
function destDePaso(p,pNext){
 if(!p.cs)return "";
 var cs=cById(p.cs), sn=sName(cs.s);
 if(esTransitoPS(p,pNext))return destTransito(cs,pNext);
 if(sn && sn!=='terminado' && sn!=='fleje' && sn!=='?')return destSector(sn,cs.cod,"");
 return "";
}

function pasoNode(p,need,uni,pNext){
 var tp="",cls="",nm="",ex="",extra="";
 var ce=cById(p.ce), cs=cById(p.cs);
 if(p.tp==="matriz"){var mx=D.mat[String(p.m)]||{};tp="MATRIZ N°"+mx.n;cls="matriz";nm=cs.cod||"?";ex=(cs.d||mx.d||"");if(mx.r)extra="⚙️ "+mx.r+" uni/kg";}
 else if(p.tp==="proveedor_servicio"){var px=D.prov[String(p.pr)]||{};tp="PROV "+(px.n||"?");cls="prov";nm=cs.cod||ce.cod||"?";ex=(px.p||"")+(cs.cod?(" · "+cs.cod):"");}
 else if(p.tp==="tallerista"){var tx=D.tall[String(p.ta)]||"(sin asignar)";tp="TALLERISTA";cls="tall";nm=tx.trim();ex=(ce.cod||"")+" → "+(cs.cod||"?");}
 else if(p.tp==="afilado"){tp="AFILADO";cls="afil";nm="Afilar";ex=(ce.cod||"")+" → "+(cs.cod||"?");}
 else if(p.tp==="proveedor_at"){var pa=D.provat?D.provat[String(p.pat)]:null;tp="PROV. ART. TERM.";cls="prov";nm=(pa||"(sin prov)").trim();ex="entrega terminado";}
 else if(p.tp==="virgilio"){tp="VIRGILIO";cls="virg";nm="Distribución";ex="centro";}
 else return "";
 // El sector/tránsito y la cantidad van DENTRO de la tarjeta del paso (fallback 1:1 con uni)
 var dest="", qty=null;
 if(p.cs && p.tp!=='virgilio' && p.tp!=='tallerista'){
  dest=destDePaso(p,pNext);
  qty=(need[p.cs]?need[p.cs]*uni:uni);
 }
 return node(tp,cls,nm,ex,extra,qty,null,dest);
}

function renderStandaloneLane(r,pasos,fl,need,uni,flejesTotal){
 var qty=0, cs_final=null;
 for(var i=pasos.length-1;i>=0;i--){var p=pasos[i];if(p.cs && need[p.cs]){cs_final=p.cs;qty=need[p.cs]*uni;break;}}
 if(!cs_final){for(var i=pasos.length-1;i>=0;i--){if(pasos[i].cs){cs_final=pasos[i].cs;break;}}}
 var mat0=null;
 for(var i=0;i<pasos.length;i++){if(pasos[i].tp==="matriz"){mat0=D.mat[String(pasos[i].m)];break;}}
 var rend=mat0?mat0.r:null;
 var kg=(rend && qty)?qty/rend:0;
 if(kg){flejesTotal[r.f]=(flejesTotal[r.f]||0)+kg;}
 // fleje ahora es un componente que ingresa (ce del primer paso ingreso)
 var flComp=null;
 for(var i=0;i<pasos.length;i++){if(pasos[i].tp==="ingreso" && pasos[i].ce){flComp=cById(pasos[i].ce);break;}}
 if(!flComp)flComp=cById(r.f);
 var cs_desc = cs_final ? (" → "+cById(cs_final).cod+" ("+(cById(cs_final).d||"")+")") : "";
 var H='<div class="lane"><div class="head"><b>'+esc((flComp.cod||"?")+' · '+(flComp.d||"")+cs_desc)+'</b>'+
    (kg?'<span class="fkg">'+fmt(kg)+' kg fleje</span>':(qty?'<span style="color:#7d92a5">sin rendimiento</span>':""))+
    '</div><div class="flow">';
 H+=node("INSUMO","fleje",flComp.cod||"?",flComp.d||"",rend?rend+" uni/kg":"",null,kg||null,"");
 pasos.forEach(function(p,i,arr){
  if((p.tp==="fleje"||p.tp==="ingreso"))return;
  H+='<span class="arr">→</span>'+pasoNode(p,need,uni,arr[i+1]);
 });
 H+='</div></div>';
 return H;
}

function renderConvergenceLane(padre_id,ruta_list,need,uni,flejesTotal,aid,insumoEnConv){
 var pc=cById(padre_id);
 var hijos=D.children[String(padre_id)]||[];
 // Identificar paso de convergencia (matriz o tallerista que arma padre) desde primera ruta que lo tenga
 var convPaso=null, postPasos=null;
 ruta_list.forEach(function(r){
  if(convPaso)return;
  var pasos=D.rp[String(r.id)]||[];
  for(var i=0;i<pasos.length;i++){
   if(pasos[i].cs===padre_id){convPaso=pasos[i];postPasos=pasos.slice(i+1);break;}
  }
 });

 var qty_padre=need[padre_id]?need[padre_id]*uni:0;
 if(!qty_padre && postPasos){
  for(var pi=0;pi<postPasos.length;pi++){
   var pc2=postPasos[pi].cs;
   if(pc2 && need[pc2]){qty_padre=need[pc2]*uni;break;}
  }
 }
 var H='<div class="lane conv"><div class="head"><b>🔀 Convergencia · '+esc(pc.cod+' · '+(pc.d||""))+'</b>'+
    '<span class="uni">× '+fmt(qty_padre)+' u</span></div>';

 // Loop puro por hijos del componente_bom
 var brN=0;
 var usedRutas={};
 hijos.forEach(function(h){
  brN++;
  var hc=cById(h.c);
  var qty_hijo=qty_padre*(h.q||1);
  // Buscar ruta del articulo cuyo cs sea este hijo. Las de fleje primero; las de insumo
  // (f null, ej. CV3 -> niquelado -> V3 que entra a la Matriz 135) son el fallback, si no
  // la rama se dibujaba como un insumo pelado y se perdia el paso del proveedor.
  var rutas_art=(D.rutas_by_art[String(aid)]||[]).filter(function(x){return !usedRutas[x.id];})
    .sort(function(x,y){return (y.f?1:0)-(x.f?1:0);});
  var matchRuta=null, matchIdx=-1;
  for(var ri=0;ri<rutas_art.length;ri++){
   var rr=rutas_art[ri]; var pps=D.rp[String(rr.id)]||[];
   // buscar ÚLTIMO cs=h.c (incluye pasos intermedios que "pasan" el componente)
   var lastMatch=-1;
   for(var pi=0;pi<pps.length;pi++){if(pps[pi].cs===h.c)lastMatch=pi;}
   if(lastMatch>=0){matchRuta=rr;matchIdx=lastMatch;break;}
  }
  if(matchRuta){
   usedRutas[matchRuta.id]=1;
   // La ruta de insumo ya se dibuja aca: no repetirla abajo en el bloque 4
   if(!matchRuta.f && insumoEnConv)insumoEnConv[matchRuta.id]=1;
   var pps=D.rp[String(matchRuta.id)]||[];
   var prePasos=pps.slice(0,matchIdx+1);
   var flComp2=null;
   // De donde arranca la rama: el fleje del paso 'ingreso' o, en una ruta de insumo, la pieza
   // del paso 'insumo' (sin esto la rama salia con el nodo vacio, "? produce BOM10")
   for(var i=0;i<prePasos.length;i++){if((prePasos[i].tp==="ingreso"||prePasos[i].tp==="insumo") && prePasos[i].ce){flComp2=cById(prePasos[i].ce);break;}}
   if(!flComp2)flComp2=cById(matchRuta.f);
   var mat0=null;
   for(var i=0;i<prePasos.length;i++){if(prePasos[i].tp==="matriz"){mat0=D.mat[String(prePasos[i].m)];break;}}
   var rend=mat0?mat0.r:null;
   var kg=(rend && qty_hijo)?qty_hijo/rend:0;
   if(kg){flejesTotal[matchRuta.f]=(flejesTotal[matchRuta.f]||0)+kg;}
   var mergedNeed=Object.assign({},need);mergedNeed[h.c]=qty_hijo/uni;
   // 'ingreso' e 'insumo' son marcas de entrada, no pasos productivos
   var pasosNoFleje=prePasos.filter(function(p){return p.tp!=='fleje'&&p.tp!=='ingreso'&&p.tp!=='insumo';});
   // Si el "productor" es el mismo componente y no hay pasos productivos, solo mostrar el insumo (evita duplicado)
   if(pasosNoFleje.length===0 && flComp2.cod===hc.cod){
    H+='<div class="branch-lbl"><span class="r">Rama '+brN+'</span> — Insumo '+esc(hc.cod||'?')+' · × '+fmt(qty_hijo)+' u</div>';
    H+='<div class="flow branch">';
    H+=node("INSUMO",sCls(hc.s),hc.cod||"?",hc.d||"","",qty_hijo,null,"");
    H+='</div>';
   } else {
    H+='<div class="branch-lbl"><span class="r">Rama '+brN+'</span> — '+esc((flComp2.cod||"?")+' produce '+hc.cod)+(kg?' · '+fmt(kg)+' kg fleje':'')+'</div>';
    H+='<div class="flow branch">';
    H+=node("INSUMO",matchRuta.f?"fleje":sCls(flComp2.s),flComp2.cod||"?",flComp2.d||"",rend?rend+" uni/kg":"",matchRuta.f?null:qty_hijo,kg||null,"");
    pasosNoFleje.forEach(function(p,i,arr){
     H+='<span class="arr">→</span>'+pasoNode(p,mergedNeed,uni,arr[i+1]);
    });
    if(pasosNoFleje.length===0){
     var _sn=sName(hc.s);
     var _dest=(_sn && _sn!=='terminado' && _sn!=='fleje' && _sn!=='?')?destSector(_sn,hc.cod,""):"";
     H+='<span class="arr">→</span>'+node("COMPONENTE",sCls(hc.s),hc.cod,hc.d||"","",qty_hijo,null,_dest);
    }
    H+='</div>';
   }
   return;
  }
  // Fallback: insumo
  var sn=sName(hc.s);
  var destIns=(sn && sn!=='terminado' && sn!=='fleje' && sn!=='?')?destSector(sn,hc.cod,""):"";
  H+='<div class="branch-lbl"><span class="r">Rama '+brN+'</span> — Insumo '+esc((hc.cod||'?')+' ('+sn+')')+' · × '+fmt(qty_hijo)+' u</div>';
  H+='<div class="flow branch">';
  H+=node("INSUMO",sCls(hc.s),hc.cod||"?",hc.d||"","",qty_hijo,null,destIns);
  H+='</div>';
 });
 // barra de convergencia
 H+='<div class="converge-bar"><span class="line"></span>↓ Convergencia ↓<span class="line"></span></div>';
 // paso conv + post
 H+='<div class="flow">';
 // convergencia node muestra padre como resultado
 var mx=D.mat[String(convPaso.m)]||{};
 var extra=mx.r?"⚙️ "+mx.r+" uni/kg":"";
 var convTp,convCls,convNm,convEx;
 if(convPaso.tp==="matriz"){convTp="MATRIZ N°"+mx.n;convCls="matriz";convNm=pc.cod;convEx=pc.d||"";}
 else if(convPaso.tp==="tallerista"){var _tn=D.tall[String(convPaso.ta)]||"(sin asignar)";convTp="TALLERISTA";convCls="tall";convNm=(typeof _tn==='string'?_tn.trim():_tn.n||"?");convEx=pc.cod+" · "+(pc.d||"");}
 else if(convPaso.tp==="proveedor_servicio"){var _px=D.prov[String(convPaso.pr)]||{};convTp="PROV "+(_px.n||"?");convCls="prov";convNm=pc.cod;convEx=(_px.p||"")+" · "+(pc.d||"");}
 else {convTp=convPaso.tp.toUpperCase();convCls="prov";convNm=pc.cod;convEx=pc.d||"";}
 var _snConv=sName(pc.s), _post=postPasos||[];
 var destConv="";
 if(esTransitoPS(convPaso,_post[0]))destConv=destTransito(pc,_post[0]);
 else if(_snConv && _snConv!=='terminado' && _snConv!=='fleje' && _snConv!=='?')destConv=destSector(_snConv,pc.cod,"");
 H+=node(convTp,convCls,convNm,convEx,extra,qty_padre,null,destConv);
 _post.forEach(function(p,i,arr){
  H+='<span class="arr">→</span>'+pasoNode(p,need,uni,arr[i+1]);
 });
 H+='</div></div>';
 return H;
}

function render(){
 var aid=GP2N.entero(sel.value);
 var uni=Math.max(1,GP2N.num(document.getElementById("uni").value)||1);
 var a=D.art.find(function(x){return x.id===aid;});
 if(!a){document.getElementById("canvas").innerHTML='<div style="padding:20px">Artículo no encontrado</div>';return;}
 var ex=expandBOM(aid);
 var need=ex.need, bom=ex.bom;
 var rutas=(D.rutas_by_art[String(aid)]||[]);
 var talls=D.tall_art[String(aid)]||[];
 // Selector tallerista alternativo: rellenar dropdown y filtrar rutas
 var tallAltBox=document.getElementById('tallAltBox');
 var tallAlt=document.getElementById('tallAlt');
 // FIX aud4-p6: selector usa tallerista_id, nombre es solo label (evita bug de espacios "Pettofrezza Rafael ")
 var nomToId={};Object.keys(D.tall).forEach(function(k){nomToId[(D.tall[k]||'').trim()]=parseInt(k);});
 var tallsIds=talls.map(function(n){return nomToId[(n||'').trim()];}).filter(Boolean);
 if(tallsIds.length>1){
  tallAltBox.style.display='';
  if(tallAlt.dataset.aid!==String(aid)){
   tallAlt.innerHTML='';
   tallsIds.forEach(function(tid){tallAlt.innerHTML+='<option value="'+tid+'">'+esc((D.tall[String(tid)]||'').trim())+'</option>';});
   tallAlt.dataset.aid=String(aid);
  }
  var tallElegidoId=GP2N.entero(tallAlt.value);
  rutas=rutas.filter(function(r){
   var pasos=D.rp[String(r.id)]||[];
   var tids=pasos.filter(function(p){return p.tp==='tallerista' && p.ta;}).map(function(p){return parseInt(p.ta);});
   if(!tids.length)return true;
   return tids.indexOf(tallElegidoId)>=0;
  });
  talls=[(D.tall[String(tallElegidoId)]||'').trim()];
 } else {
  tallAltBox.style.display='none';
 }
 /* EL PROV. DE ARTÍCULO TERMINADO REEMPLAZA AL TALLERISTA [usuario 2026-09-11, textual].
    Un artículo comprado terminado no lo ensambla nadie acá: de casa sale el cartón y la
    caja, y el proveedor entrega el artículo hecho en Virgilio. Antes, como tall_art no
    traía ningún tallerista, la pantalla dibujaba "TALLERISTA (sin asignar) — tabla
    incompleta": mentira, y encima escondía quién entrega. Son 39 de 189 artículos
    (761 Cucharita Matera, que lo entrega Melinox, es el que lo destapó). */
 var provAT=[];
 rutas.forEach(function(r){
  (D.rp[String(r.id)]||[]).forEach(function(p){
   if(p.tp!=='proveedor_at'||!p.pat)return;
   var n=String((D.provat&&D.provat[String(p.pat)])||'').trim();
   if(n&&provAT.indexOf(n)<0)provAT.push(n);
  });
 });
 var rutas_prod=rutas.filter(function(r){return r.f;});
 var rutas_ins=rutas.filter(function(r){return !r.f;});
 var flejesTotal={};
 var insumoEnConv={}; // ruta de insumo consumida dentro de una convergencia → no repetir en el bloque 4

 // Agrupar por convergencia: {padre_sub_id: [ruta,...]}
 var convergences={}; // padre_id → [rutaObj]
 var rutas_en_conv={}; // ruta.id → padre_id
 rutas_prod.forEach(function(r){
  var pasos=D.rp[String(r.id)]||[];
  for(var i=0;i<pasos.length;i++){
   var cs=pasos[i].cs;
   if(cs && D.children[String(cs)]){
    convergences[cs]=convergences[cs]||[];
    convergences[cs].push(r);
    rutas_en_conv[r.id]=cs;
    break; // primera convergencia por ruta
   }
  }
 });
 // filtrar convergences: solo padres que aparecen en need (bom expandido) o cuya continuación aporta
 // (todas quedan, ya que están en rutas del articulo)

 // Los bloques se arman primero (ahí se suman los kg de fleje) y el encabezado
 // se compone al final, para poder mostrar el total de fleje arriba de todo.
 var B='';

 // Marcar rutas que producen hijos de un sub-conjunto convergente (se consumen dentro de la convergencia)
 var childrenOfConv={};
 Object.keys(convergences).forEach(function(padre){
  (D.children[padre]||[]).forEach(function(h){childrenOfConv[h.c]=parseInt(padre);});
 });
 rutas_prod.forEach(function(r){
  if(rutas_en_conv[r.id])return;
  var pasos=D.rp[String(r.id)]||[];
  // último cs de la ruta
  var lastCs=null;
  for(var i=pasos.length-1;i>=0;i--){if(pasos[i].cs){lastCs=pasos[i].cs;break;}}
  if(lastCs && childrenOfConv[lastCs]){rutas_en_conv[r.id]=childrenOfConv[lastCs];}
 });

 function titulo(n,txt){return '<div class="section-title"><span class="n">'+n+'</span>'+txt+'</div>';}

 // Rutas standalone
 var standalone=rutas_prod.filter(function(r){return !rutas_en_conv[r.id];});
 if(standalone.length){
  B+=titulo(1,'Partes que se fabrican en Cervantes ('+standalone.length+(standalone.length===1?' ruta simple)':' rutas simples)'));
  standalone.forEach(function(r){
   var pasos=D.rp[String(r.id)]||[];
   B+=renderStandaloneLane(r,pasos,{},need,uni,flejesTotal);
  });
 }
 // Rutas con convergencia
 var convKeys=Object.keys(convergences);
 if(convKeys.length){
  B+=titulo(2,'Convergencias · sub-conjuntos que unen 2+ rutas ('+convKeys.length+')');
  convKeys.forEach(function(padre){
   B+=renderConvergenceLane(parseInt(padre),convergences[padre],need,uni,flejesTotal,aid,insumoEnConv);
  });
  // Las rutas de insumo que ya se dibujaron dentro de una convergencia no se repiten en el bloque 4
  rutas_ins=rutas_ins.filter(function(r){return !insumoEnConv[r.id];});
 }

 // Sub-conjuntos NO cubiertos por rutas (BOM puro)
 var subsCubiertos={};
 convKeys.forEach(function(k){subsCubiertos[k]=1;});
 var subKeys=Object.keys(D.children).filter(function(k){return need[parseInt(k)] && !subsCubiertos[k];});
 if(subKeys.length){
  B+=titulo(3,'Sub-conjuntos (BOM sin ruta explícita)');
  subKeys.forEach(function(k){
   var pid=parseInt(k); var pc=cById(pid);
   var pq=need[pid]*uni;
   B+='<div class="lane"><div class="head"><b>'+esc(pc.cod+' · '+(pc.d||""))+'</b><span class="uni">× '+fmt(pq)+' u</span></div><div class="flow">';
   var hijos=D.children[k];
   hijos.forEach(function(hh,i){
    var hc=cById(hh.c);
    var hq=hh.q*pq;
    if(i>0)B+='<span class="arr plus">+</span>';
    B+=node(sName(hc.s).toUpperCase(),sCls(hc.s),hc.cod,hc.d||"","",hq,null,"");
   });
   B+='<span class="arr">=</span>'+node(sName(pc.s).toUpperCase(),"sub",pc.cod,pc.d||"","sub-conjunto",pq,null,"");
   B+='</div></div>';
  });
 }

 if(rutas_ins.length){
  B+=titulo(4,'Insumos comprados / transformados (entran al tallerista)');
  // FIX aud4-p7: agrupar por firma SIN tall → mostrar "Alex O Martin" en vez de dos líneas duplicadas
  // FIX aud5-p3: agrupar talls por POSICIÓN/etapa, no juntar todos los talls de la ruta
  var grupos={};
  rutas_ins.forEach(function(r){
   var pasos=D.rp[String(r.id)]||[];
   var p0=pasos[0]||{}; var cidIni=p0.ce||p0.cs;
   // Firma reemplaza cada tall por marcador de etapa: T_<orden>
   var sigSinTall=cidIni+'|'+pasos.map(function(p,idx){return p.tp+':'+(p.pr||'')+':'+(p.ce||'')+':'+(p.cs||'')+(p.tp==='tallerista'?':T'+idx:'');}).join('>');
   if(!grupos[sigSinTall])grupos[sigSinTall]={pasos:pasos,cidIni:cidIni,tallsPorPos:{}};
   pasos.forEach(function(p,idx){
    if(p.tp==='tallerista'&&p.ta){
     var n=(D.tall[String(p.ta)]||'').trim();
     grupos[sigSinTall].tallsPorPos[idx]=grupos[sigSinTall].tallsPorPos[idx]||[];
     if(grupos[sigSinTall].tallsPorPos[idx].indexOf(n)<0)grupos[sigSinTall].tallsPorPos[idx].push(n);
    }
   });
  });
  Object.keys(grupos).forEach(function(k){
   var g=grupos[k],pasos=g.pasos,cidIni=g.cidIni;
   var comp=cById(cidIni);
   var qFin=null,csFin=cidIni;
   for(var ii=pasos.length-1;ii>=0;ii--){var pp=pasos[ii];if(pp.cs && need[pp.cs]){csFin=pp.cs;qFin=need[pp.cs]*uni;break;}}
   if(qFin===null && need[cidIni])qFin=need[cidIni]*uni;
   B+='<div class="lane"><div class="head"><b>'+esc(comp.cod+' — '+(comp.d||""))+'</b>'+(qFin?'<span class="uni">× '+fmt(qFin)+' u</span>':"")+'</div><div class="flow">';
   B+=node("INSUMO",sCls(comp.s),comp.cod||"?",comp.d||"","",qFin,null,"");
   pasos.forEach(function(p,idx){
    if(idx===0)return;
    if(p.tp==="proveedor_servicio"){
     var pv=D.prov[String(p.pr)]||{n:"(sin prov)",p:""};
     var csComp=cById(p.cs);
     // lo que sale del proveedor va en el PIE de su tarjeta, no en un nodo aparte
     var dst="";
     if(esTransitoPS(p,pasos[idx+1]))dst=destTransito(csComp,pasos[idx+1]);
     else if(csComp && csComp.cod)dst=destSector(csComp.s?sName(csComp.s):"componente",csComp.cod,csComp.d||"");
     B+='<span class="arr">→</span>'+node("PROV.SERV.","prov",pv.n.trim(),pv.p||"","",qFin,null,dst);
    }
    else if(p.tp==="tallerista"){
     var tallsEtapa=g.tallsPorPos[idx]||[(D.tall[String(p.ta)]||'').trim()];
     var lbl=tallsEtapa.length>1?tallsEtapa.join(' O '):tallsEtapa[0];
     B+='<span class="arr">→</span>'+node("TALLERISTA","tall",lbl,"","",qFin,null,"");
    }
    else if(p.tp==="proveedor_at"){
     /* Articulo comprado terminado: lo unico que sale de casa es el carton y la caja;
        el Prov AT los usa y entrega el articulo ya terminado en Virgilio. */
     var pa=(D.provat?D.provat[String(p.pat)]:null)||"(sin prov)";
     B+='<span class="arr">→</span>'+node("PROV. ART. TERM.","prov",pa.trim(),"entrega terminado","",qFin,null,"");
    }
    else if(p.tp==="virgilio"){B+='<span class="arr">→</span>'+node("VIRGILIO","virg","Distribución","artículo","",null,null,"");}
   });
   B+='</div></div>';
  });
 }

 B+=titulo(5,(talls.length||!provAT.length)?'Convergencia final → Artículo → Virgilio'
                                          :'Artículo comprado terminado → Virgilio');
 B+='<div class="lane"><div class="flow">';
 if(talls.length){talls.forEach(function(t,i){B+=(i>0?'<span class="arr plus">O</span>':"")+node("TALLERISTA","tall",t,"ensambla","",uni,null,"");});}
 else if(provAT.length){provAT.forEach(function(n,i){B+=(i>0?'<span class="arr plus">O</span>':"")+node("PROV. ART. TERM.","prov",n,"entrega terminado","",uni,null,"");});}
 else B+=node("TALLERISTA","tall","(sin asignar)","tabla incompleta","",uni,null,"");
 B+='<span class="arr">→</span>'+node("ARTÍCULO","virg",a.cod,a.fam+" terminado","",uni,null,"")+
    '<span class="arr">→</span>'+node("VIRGILIO","virg","Distribución","centro logístico","",uni,null,"");
 B+='</div></div>';

 // ---- encabezado + resumen de fleje (se arman al final: necesitan los kg sumados) ----
 var H='<div class="hero">'+
    '<div><div class="cod">'+esc(a.cod)+'</div><div class="fam">'+esc(a.d||"")+(a.d&&a.fam?' · ':'')+esc(a.fam||"")+(a.mk?' · '+esc(a.mk):'')+'</div></div>'+
    '<div class="kpis">'+
      '<div class="kpi"><b>'+fmt(uni)+'</b>unidades a producir</div>'+
      '<div class="kpi"><b>'+bom.length+'</b>partes BOM</div>'+
      '<div class="kpi"><b>'+rutas_prod.length+'</b>rutas de producción</div>'+
      (talls.length?'<div class="kpi ens"><b>'+esc(talls.join(" O "))+'</b>ensambla</div>'
        :provAT.length?'<div class="kpi ens"><b>'+esc(provAT.join(" O "))+'</b>entrega terminado</div>':"")+
    '</div></div>';

 // DESPIECE: qué piezas lleva el artículo y cuántas. Sale del BOM ya expandido (need),
 // que es el mismo número con el que se dibujan las rutas — no se calcula nada aparte.
 // [usuario 2026-09-11] pidió esto en lugar del "fleje a pedir" (los kg de fleje siguen
 // estando en el badge de cada carril, que es donde se leen por ruta).
 var despKeys=Object.keys(need).filter(function(k){return need[k]>0;});
 if(despKeys.length){
  despKeys.sort(function(x,y){return (need[y]*uni)-(need[x]*uni);});
  H+='<div class="despiece"><h3>Despiece del artículo · '+despKeys.length+' componentes para '+fmt(uni)+' unidades</h3>'+
     '<table><thead><tr><th>Código</th><th>Descripción</th><th>Sector</th>'+
     '<th style="text-align:right">Por unidad</th><th style="text-align:right">Total</th></tr></thead><tbody>';
  despKeys.forEach(function(k){
   var c=cById(k), sn=sName(c.s);
   H+='<tr><td class="cd">'+esc(c.cod||"?")+'</td><td class="ds">'+esc(c.d||"")+'</td>'+
      '<td class="sc">'+esc(sn==='?'?'—':sn)+'</td>'+
      '<td class="nu">'+fmt(need[k])+'</td><td class="tt">'+fmt(need[k]*uni)+' u</td></tr>';
  });
  H+='</tbody></table></div>';
 }

 document.getElementById("canvas").innerHTML=H+B;
 ajustarFilas();
}

/* UNA RUTA = UNA FILA. El carril mide lo que la ruta necesita (fit-content, sin tope) y
   acá se lo achica con `zoom` hasta que entra en el ancho de la pantalla. `zoom` y no
   `transform:scale` a propósito: zoom SÍ reacomoda el layout, así que el carril ocupa de
   verdad lo que se ve y no deja un hueco abajo ni desborda la página.
   PISO: por debajo de esto la letra dejaría de leerse, que es justo lo que se vino a
   arreglar; si una ruta no entra ni al piso, ese carril (solo ese) scrollea. */
var PISO_ZOOM=0.62;
/* OJO: el ancho de la fila NO se puede medir con offsetWidth/scrollWidth del carril.
   El carril es width:fit-content, y fit-content se capea al ancho del contenedor: mide
   1.464 aunque la cadena adentro pida 1.900 y se esté cortando. El ancho REAL de la fila
   es de dónde arranca la primera tarjeta a dónde termina la última. */
function anchoFila(f){
 var k=f.children;
 if(!k.length)return 0;
 var pri=k[0], ult=k[k.length-1];
 return (ult.offsetLeft+ult.offsetWidth)-pri.offsetLeft;
}
function ajustarFilas(){
 var cv=document.getElementById("canvas");
 var carriles=cv.querySelectorAll(".lane");
 var movil=window.innerWidth<=560;          // en celular la cadena va en vertical: no se escala
 for(var i=0;i<carriles.length;i++){
  var l=carriles[i];
  l.style.zoom="";                          // medir siempre sin escalar
  if(movil)continue;
  var disp=cv.clientWidth-36;               // el padding del canvas
  if(disp<=0)continue;
  var filas=l.querySelectorAll(".flow"), nec=0;
  for(var j=0;j<filas.length;j++)nec=Math.max(nec,anchoFila(filas[j]));
  nec+=l.offsetWidth-l.clientWidth+28;      // bordes + el padding lateral del carril
  if(nec>disp)l.style.zoom=Math.max(PISO_ZOOM,disp/nec);
 }
}
var _rsz;
window.addEventListener("resize",function(){clearTimeout(_rsz);_rsz=setTimeout(ajustarFilas,120);});

  try{
    document.body.style.cursor='progress';
    var r=await SB.rpc('programa_bundle');
    if(r.error) throw r.error;
    Object.assign(D, r.data);
    __run();
  }catch(e){
    document.body.innerHTML='<p style=\'padding:24px;font-family:system-ui;color:#ff9b8a\'>Error cargando datos de Supabase: '+(e.message||e)+'</p>';
    console.error(e);
  }finally{ document.body.style.cursor=''; }
}
__boot();
