<!doctype html>
<html lang="es">
<head>
<!-- v1.0.1 — Monitor 2.0: ultimos cajones cerrados del dia con premio + alertas <=-3 / >=3 -->
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cierres del Día · Premios · GP2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260905k"></script>
<script src="../gp2-ui.js?v=20260905a"></script>
<script src="../gp2-numero.js?v=20260905m"></script>
<link rel="stylesheet" href="../gp2-modulo.css?v=20260903b"/>
<link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
<style>
  .live-dot{display:inline-block;width:10px;height:10px;background:#f44336;border-radius:50%;animation:pulse 1.5s infinite;margin-left:6px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  .barra input[type=date]{padding:10px;min-height:44px;border:2px solid #d0d7de;border-radius:8px;font-size:18px}
  .barra button{padding:11px 16px;min-height:44px;font-size:16px;border-radius:8px;border:2px solid #d0d7de;background:#fff;font-weight:700;cursor:pointer}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .premio-good{color:#2e7d32;font-weight:800}
  .premio-bad{color:#c62828;font-weight:800}
  .alerta{border-radius:10px;padding:12px 16px;margin:8px 0}
  .alerta .tit{font-weight:900;font-size:17px;margin-bottom:6px}
  .alerta .item{display:inline-block;background:#fff;border-radius:6px;padding:3px 10px;margin:2px 4px 2px 0;font-weight:700;font-size:14px}
  .alerta.mala{background:#fee2e2;border:2px solid #dc2626}
  .alerta.mala .tit{color:#7f1d1d}
  .alerta.mala .item{border:1px solid #dc2626}
  .alerta.mala .item b{color:#c62828}
  .alerta.buena{background:#d1fae5;border:2px solid #059669}
  .alerta.buena .tit{color:#065f46}
  .alerta.buena .item{border:1px solid #059669}
  .alerta.buena .item b{color:#059669}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Cierres del Día · Premios <span class="live-dot"></span></h1>
    <div class="hbtns">
      <a href="monitor_GP2.html">Monitor en Vivo</a>
      <a href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">
    <div class="barra">
      <label style="font-weight:800">Día:</label><input type="date" id="fDia">
      <button type="button" id="btnAuto">Auto: ON</button>
      <button type="button" id="btnRef">↻ Refrescar</button>
      <span id="liveTxt" style="color:#888;font-size:13px;margin-left:auto"></span>
    </div>

    <div id="alertas"></div>

    <div class="table-wrap"><table class="t">
      <thead><tr><th>Hora</th><th>Legajo</th><th>Operario</th><th>Matriz</th><th>Descripción</th>
        <th class="num">Uni</th><th class="num">Premio</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <div id="tblEmpty" class="empty hidden">Sin cajones cerrados ese día.</div>
    <div id="status" class="status">Cargando…</div>
  </div>
</div>

<script>
var SB = GP2_SB();
var $ = GP2UI.$;
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function fmt(n,d){ return GP2N.fmt(n, d==null?0:d, '—', true); }   /* decimales fijos; '—' sin valor */
var hoyAR = GP2UI.hoyAR;   /* helper de la casa, gp2-ui.js (2026-09-05): era una copia identica */
function horaAR(iso){
  try{ return new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso)); }
  catch(e){ return ''; }
}

var timer=null, auto=true;

// premio: el que trae la fila (espejo) o calculado como el vecino:
// (-(tiempo_toma / tiempo_historico) + 1) * 10
function premioDe(p){
  if(p.premio!=null && p.premio!=='') return Number(p.premio);
  var tt=Number(p.tiempo_toma), th=Number(p.tiempo_historico);
  if(tt>0 && th>0) return Math.round(((-(tt/th)+1)*10)*100)/100;
  return null;
}

async function cargar(){
  var dia=$('fDia').value||hoyAR();
  var r=await SB.from('produccion')
    .select('legajo,nombre_empleado,matriz_raw,nombre_matriz,uni,fecha,premio,tiempo_toma,tiempo_historico,eliminar')
    .gte('fecha', dia+'T00:00:00-03:00')
    .lte('fecha', dia+'T23:59:59-03:00')
    .gt('uni', 0)
    .order('fecha',{ascending:false})
    .limit(2000);
  if(r.error){ $('status').textContent='Error: '+r.error.message; return; }
  var filas=(r.data||[]).filter(function(p){ return String(p.eliminar||'').toUpperCase()!=='S'; });

  var malos=[], buenos=[];
  filas.forEach(function(p){
    var pr=premioDe(p);
    p._premio=pr;
    if(pr==null) return;
    var item={ nombre:p.nombre_empleado||p.legajo, matriz:p.matriz_raw, premio:pr };
    if(pr<=-3) malos.push(item);
    else if(pr>=3) buenos.push(item);
  });

  $('alertas').innerHTML=
    (malos.length?('<div class="alerta mala"><div class="tit">⚠ Cajones con puntaje ≤ -3 ('+malos.length+')</div>'+
      malos.map(function(b){ return '<span class="item">'+esc(b.nombre)+' · M'+esc(b.matriz)+' <b>'+b.premio.toFixed(1)+'</b></span>'; }).join('')+'</div>'):'')+
    (buenos.length?('<div class="alerta buena"><div class="tit">⭐ Cajones con puntaje ≥ 3 ('+buenos.length+')</div>'+
      buenos.map(function(b){ return '<span class="item">'+esc(b.nombre)+' · M'+esc(b.matriz)+' <b>+'+b.premio.toFixed(1)+'</b></span>'; }).join('')+'</div>'):'');

  $('tbody').innerHTML=filas.slice(0,100).map(function(p){
    var pr=p._premio, cell='—';
    if(pr!=null) cell='<span class="'+(pr>=0?'premio-good':'premio-bad')+'">'+fmt(pr,1)+'</span>';
    return '<tr><td>'+horaAR(p.fecha)+'</td><td>'+esc(p.legajo)+'</td><td>'+esc(p.nombre_empleado||'')+'</td>'+
      '<td><b>'+esc(p.matriz_raw||'—')+'</b></td><td>'+esc(p.nombre_matriz||'')+'</td>'+
      '<td class="num">'+fmt(p.uni)+'</td><td class="num">'+cell+'</td></tr>';
  }).join('');
  $('tblEmpty').classList.toggle('hidden', filas.length>0);
  $('status').textContent=filas.length+' cajones cerrados';
  $('liveTxt').textContent='actualizado '+horaAR(new Date().toISOString());
}

function setAuto(on){
  auto=on;
  $('btnAuto').textContent='Auto: '+(on?'ON':'OFF');
  if(timer){ clearInterval(timer); timer=null; }
  if(on) timer=setInterval(cargar, 30000);
}

$('btnRef').addEventListener('click', cargar);
$('btnAuto').addEventListener('click', function(){ setAuto(!auto); });
$('fDia').addEventListener('change', cargar);
$('fDia').value=hoyAR();
cargar();
setAuto(true);
</script>
</body>
</html>
