name: CI — smoke tests

# Red de seguridad para que un commit roto NO salga a GitHub Pages en blanco.
#
# El nombre decía "DESHABILITADO TEMPORALMENTE" pero el workflow SEGUÍA corriendo
# en cada push: nadie lo había apagado de verdad, sólo renombrado. Y fallaba
# siempre por un test que miraba la planimetría de producción en vivo, así que
# main quedaba en rojo permanente y el rojo dejaba de significar algo. Arreglado
# el test (tests/dual-ubic-mg-draft.cjs) y devuelto el nombre real.
# Corre la misma suite que `tests/run.sh`: sintaxis del sw.js, sintaxis de TODOS
# los <script> inline del index.html (lo que más rompe), y un smoke headless con
# Playwright (funciones clave existen, sin errores de página).
on:
  push:
    branches: [main]
  pull_request:

# v21.53 — para poder abrir/cerrar el issue del aviso. El GITHUB_TOKEN del propio workflow
# alcanza: no hay que cargar ningun secret.
permissions:
  contents: read
  issues: write

# v21.57 — EN `main` LOS RUNS NO SE CANCELAN. La v16.25 lo puso al revés ("un push nuevo
# cancela el viejo") y con la suite corriendo entera (v21.53, 8-12 min) contra sesiones que
# pushean cada 3-5 min, eso significa que NINGÚN run llega a terminar: medido el 23/09, los
# runs 1147 a 1150 murieron cancelados uno atrás del otro. Un CI que nunca da veredicto no
# avisa nada, que es justo lo que se venía arreglando.
# El motivo original —"corridas peleando por el runner"— no aplica: el repo es PÚBLICO, así
# que Actions es gratis y hay 20 jobs concurrentes. Se apilan 3 o 4 y terminan todos.
# En los PR sí se cancela: ahí el commit viejo no le importa a nadie.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    # v16.25 — sin límite, un test colgado esperando red deja el job tomado 6 horas (el
    # default de GitHub) y encima NO publica el log, así que no se puede ni diagnosticar.
    # Pasó: el run 532 quedó 19 minutos adentro de la suite, que local tarda 5-6.
    timeout-minutes: 15
    env:
      # 0 => Playwright guarda/busca los browsers dentro de node_modules (portable).
      # tests/run.sh respeta esta variable (no cae al path /opt del sandbox).
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # 20 quedó deprecado en los runners
      - name: Instalar Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Correr la suite de smoke-tests
        id: suite
        run: |
          set -o pipefail
          bash tests/run.sh 2>&1 | tee /tmp/suite.txt

      # v21.53 (Luis, 23/09: "que la suite en rojo avise sola") — el aviso NO es Telegram (lo
      # descartó) ni el mail de Actions, que no lo lee nadie: cuando la suite se pone roja se
      # abre UN issue con el commit y los tests que fallaron, y se CIERRA SOLO al volver a
      # verde. Si el issue está abierto, la suite está rota ahora.
      # ⚠ Un issue por vez: se busca el que ya esté abierto con la etiqueta antes de crear otro,
      # o cada push dejaría uno nuevo y el aviso volvería a ser ruido, que es de lo que se venía.
      - name: Avisar / dar por cerrado
        if: always()
        uses: actions/github-script@v7
        env:
          ROJA: ${{ steps.suite.outcome == 'failure' }}
        with:
          script: |
            const fs = require("fs");
            const roja = process.env.ROJA === "true";

            // v21.57 — sin cancelación conviven varios runs, y pueden terminar DESORDENADOS:
            // uno viejo que cierra el issue que abrió uno nuevo diría "está verde" con main en
            // rojo. Si main ya avanzó, este run no opina sobre el estado de HOY.
            if (context.eventName === "push" && context.ref === "refs/heads/main") {
              const b = await github.rest.repos.getBranch({ ...context.repo, branch: "main" });
              if (b.data.commit.sha !== context.sha) {
                core.info(`main ya está en ${b.data.commit.sha.slice(0,7)}; este run es de ${context.sha.slice(0,7)}: no toco el issue.`);
                return;
              }
            }
            const LABEL = "suite-en-rojo";
            const sha = context.sha.slice(0, 7);
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const abiertos = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: LABEL, per_page: 10,
            });
            const issue = abiertos.data[0];

            if (!roja) {
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                  body: `✅ Suite en verde de nuevo en \`${sha}\`. [Ver el run](${run})` });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
              }
              return;
            }

            // qué falló: el resumen que imprime tests/run.sh al final (v21.53)
            let detalle = "";
            try {
              const txt = fs.readFileSync("/tmp/suite.txt", "utf8");
              const i = txt.lastIndexOf("SUITE EN ROJO");
              if (i >= 0) detalle = txt.slice(i).split("======").shift().trim();
            } catch (_e) {}
            if (!detalle) detalle = "(no se pudo leer el resumen; ver el log del run)";

            const cuerpo = [
              `La suite de tests está en rojo desde el commit \`${sha}\`.`, "",
              "```", detalle, "```", "",
              `[Ver el run completo](${run})`, "",
              "Este issue lo abre y lo cierra el CI solo. Mientras esté abierto, la suite está rota.",
              "La regla está en el CLAUDE.md: «LA SUITE NO SE DEJA EN ROJO — el que rompe, arregla».",
            ].join("\n");

            if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: cuerpo });
            } else {
              await github.rest.issues.create({ ...context.repo, title: "🔴 La suite de tests está en rojo",
                labels: [LABEL], body: cuerpo });
            }
