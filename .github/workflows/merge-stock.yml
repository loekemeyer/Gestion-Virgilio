name: merge-stock-1800
# Merge programado de la feature de stock (rama claude/awesome-sagan-9Sfkd) a main
# a las 18:02 AR (21:02 UTC) del 26/06. Se autodestruye después de mergear.
on:
  schedule:
    - cron: '2 21 * * *'      # 21:02 UTC = 18:02 America/Argentina/Buenos_Aires
  workflow_dispatch: {}        # permite dispararlo a mano si el schedule se demora
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Gate de fecha (solo 26/06, salvo trigger manual)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%Y-%m-%d)" = "2026-06-26" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout main
        if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge de la rama de stock + autodestruir workflow
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin claude/awesome-sagan-9Sfkd
          git merge --no-ff origin/claude/awesome-sagan-9Sfkd -m "v4.07: stock online a main (merge programado 18hs AR)"
          git rm -q .github/workflows/merge-stock.yml
          git commit -q -m "ci: remover workflow one-shot de merge (ya ejecutado)"
          git push origin main
