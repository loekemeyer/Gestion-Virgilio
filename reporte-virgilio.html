<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte diario — Logística Virgilio</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<style>
  :root{
    --azul:#1e6bd6; --azul-d:#1554ac; --tinta:#0f172a; --gris:#64748b;
    --linea:#e2e8f0; --fondo:#f1f5f9; --panel:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);
       font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:14px;}
  header{background:var(--azul);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;}
  header .tt{font-size:16px;font-weight:800;letter-spacing:.2px}
  header .sub{font-size:12.5px;opacity:.9;font-weight:600}
  header a.volver{margin-left:auto;color:#fff;text-decoration:none;font-weight:700;font-size:13px;
       background:rgba(255,255,255,.15);padding:6px 12px;border-radius:999px}
  header a.volver:hover{background:rgba(255,255,255,.28)}
  .wrap{max-width:1180px;margin:16px auto;padding:0 16px}
  .ctrl{background:var(--panel);border:1px solid var(--linea);border-radius:12px;
        padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .ctrl label{font-weight:700;font-size:13.5px;color:var(--tinta)}
  .ctrl input[type=date]{font-size:14px;padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;
        color:var(--tinta);background:#fff}
  .quick{display:flex;gap:6px}
  .quick button{font-size:12.5px;font-weight:700;color:var(--azul);background:#eef4fd;
        border:1px solid #cfe0f7;border-radius:999px;padding:6px 11px;cursor:pointer}
  .quick button:hover{background:#e0ebfb}
  .gen{margin-left:auto;font-size:14.5px;font-weight:800;color:#fff;background:var(--azul);
        border:none;border-radius:9px;padding:9px 20px;cursor:pointer}
  .gen:hover{background:var(--azul-d)}
  .gen:disabled{background:#9db8e0;cursor:default}
  .estado{min-height:20px;margin:12px 2px;font-size:13.5px;font-weight:600;color:var(--gris)}
  .estado.err{color:#b91c1c}
  .estado.ok{color:#15803d}
  .barra{display:none;align-items:center;gap:14px;flex-wrap:wrap;margin:0 2px 10px;font-size:13.5px}
  .barra .meta{font-weight:700;color:var(--tinta)}
  .barra a{color:var(--azul);font-weight:700;text-decoration:none}
  .barra a:hover{text-decoration:underline}
  .visor{display:none;background:var(--panel);border:1px solid var(--linea);border-radius:12px;
        overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .visor iframe{display:block;width:100%;height:78vh;border:0;background:#fff}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #cbd5e1;border-top-color:var(--azul);
        border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:640px){.gen{margin-left:0;width:100%}.visor iframe{height:70vh}}
</style>
</head>
<body>
<header>
  <span class="tt">Reporte diario</span>
  <span class="sub">Logística Virgilio</span>
  <a class="volver" href="index.html">← Volver al panel</a>
</header>

<div class="wrap">
  <div class="ctrl">
    <label for="fecha">Día:</label>
    <input type="date" id="fecha">
    <div class="quick">
      <button type="button" id="qAyer">Ayer</button>
      <button type="button" id="qViernes">Últ. viernes</button>
    </div>
    <button class="gen" id="btnGen">Generar</button>
  </div>

  <div class="estado" id="estado">Elegí un día y tocá <b>Generar</b>. El reporte se arma en el momento (no se envía WhatsApp).</div>

  <div class="barra" id="barra">
    <span class="meta" id="meta"></span>
    <a id="lnkAbrir" target="_blank" rel="noopener">Abrir en pestaña ↗</a>
    <a id="lnkDesc" download>Descargar PDF ↓</a>
  </div>

  <div class="visor" id="visor"><iframe id="pdf" title="Reporte PDF"></iframe></div>
</div>

<script src="supabase-config.js?v=1201"></script>
<script>
(function(){
  const URL = window.VIR_SUPABASE_URL, KEY = window.VIR_SUPABASE_KEY;
  const FN  = URL + "/functions/v1/gv-reporte-diario-virgilio";
  const $ = id => document.getElementById(id);
  const fecha=$("fecha"), btn=$("btnGen"), estado=$("estado"),
        barra=$("barra"), meta=$("meta"), visor=$("visor"), pdf=$("pdf"),
        lnkAbrir=$("lnkAbrir"), lnkDesc=$("lnkDesc");

  const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const hoy = new Date();
  fecha.max = iso(hoy);

  function setAyer(){ const d=new Date(hoy); d.setDate(d.getDate()-1); fecha.value=iso(d); }
  function setUltViernes(){ const d=new Date(hoy); // 5 = viernes; retrocede hasta el viernes anterior o de hoy
    do{ d.setDate(d.getDate()-1); }while(d.getDay()!==5); fecha.value=iso(d); }
  setAyer();
  $("qAyer").onclick    = setAyer;
  $("qViernes").onclick = setUltViernes;

  function setEstado(txt, cls){ estado.className="estado"+(cls?" "+cls:""); estado.innerHTML=txt; }

  async function generar(){
    const f = fecha.value;
    if(!f){ setEstado("Elegí una fecha.","err"); return; }
    btn.disabled=true; barra.style.display="none"; visor.style.display="none";
    setEstado('<span class="spin"></span>Generando el reporte del '+f.split("-").reverse().join("/")+"…");
    try{
      const r = await fetch(FN, {
        method:"POST",
        headers:{ apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json" },
        body: JSON.stringify({ solo_pdf:true, fecha:f })
      });
      const j = await r.json().catch(()=>null);
      if(!r.ok || !j || !j.pdfUrl){
        const m = (j && (j.error||j.message)) || ("HTTP "+r.status);
        setEstado("No se pudo generar: "+m, "err"); btn.disabled=false; return;
      }
      const dd = f.split("-").reverse().join("/");
      const ops = (j.operarios!=null) ? j.operarios : "?";
      if(j.operarios===0){
        setEstado("El "+dd+" no tiene datos de operarios cargados.","err");
      }else{
        setEstado("Listo — "+dd+" · "+ops+" operario"+(ops===1?"":"s")+".","ok");
      }
      meta.textContent = dd+" · "+ops+" operario"+(ops===1?"":"s");
      lnkAbrir.href = j.pdfUrl;
      lnkDesc.href  = j.pdfUrl;
      lnkDesc.setAttribute("download","Virgilio-"+f+".pdf");
      barra.style.display="flex";
      pdf.src = j.pdfUrl;
      visor.style.display="block";
    }catch(e){
      setEstado("Error de red: "+(e&&e.message||e), "err"); btn.disabled=false; return;
    }
    btn.disabled=false;
  }

  btn.onclick = generar;
  fecha.addEventListener("keydown", e=>{ if(e.key==="Enter") generar(); });
})();
</script>
</body>
</html>
