<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mon. Admin · Virgilio</title>
<!-- ═══════════════════════════════════════════════════════════════════════════
     Mon. Admin — ESPEJO INTERACTIVO del monitor de pared.
     ⚠ ARCHIVO GENERADO desde monitor/tv.html por monitor/build-admin.cjs.
        NO EDITAR A MANO. Todo cambio del tablero se hace en tv.html y se regenera
        con `node monitor/build-admin.cjs`. Lo sostiene tests/mon-admin.cjs (falla
        si admin.html quedó desincronizado de tv.html).
     Qué agrega sobre tv.html: celdas clickeables (m³/h picking · armado, las de
     «NPs por Día» y las tandas) que abren un pop-up con el desglose, armado con lo
     que el tablero YA tiene en memoria. Es la pestaña «🛠️ Mon. Admin» del monitor
     del admin; la TV de pared sigue usando tv.html, liviano y de solo lectura.
     ═══════════════════════════════════════════════════════════════════════════ -->
<!-- ============================================================================
     MONITOR TV — versión LIVIANA y de SOLO LECTURA del monitor de planta.

     Por qué existe (pedido de Luis, 2026-09-16): la TV de pared cargaba el
     `index.html` entero para mostrar el tablero. Eso son ~4,97 MB (3,63 MB de
     index + jsPDF + Chart + supabase-js + recepcion.js), de los cuales el
     monitor usa el 8,9%. En el SoC de una TV eso se traduce en un arranque
     lento y en que la pestaña se quede sin RAM: por eso el modo kiosko se
     recarga sola cada 7 minutos (v6.35), o sea que baja y parsea esos ~5 MB
     ocho veces por hora. Esta página pesa ~40 KB y no necesita ese parche.

     Qué NO tiene, a propósito:
       · nada clickeable (una TV colgada no tiene puntero: los detalles de
         tanda, los mensajes y las inconsistencias del monitor grande son
         inalcanzables desde la pared);
       · ni supabase-js, ni Chart.js, ni jsPDF, ni service worker. Lee la API
         REST con `fetch` pelado, que es lo que el monitor grande ya hacía;
       · la tabla "Mts3 x Hora" por operario, que depende de `computeClosureDur`
         (la parte más pesada y más delicada del cálculo). En su lugar van los
         m³ de picking y de armado terminados hoy, que es el número que se lee
         de lejos.

     Qué SÍ tiene, igual que el monitor grande y con las MISMAS fuentes:
       · tandas de la ventana de entrega con picking / armado en vivo;
       · quién está trabajando en qué AHORA;
       · tandas a facturar (con el ✅ de facturada);
       · m³ por día y por camión;
       · el aviso de agregados y el de tandas trabajadas que no están en la PPP.

     ⚠ Esta página NO reemplaza al monitor grande: es una segunda vista de los
     mismos datos. Si cambia una regla del tablero (qué entra en la ventana,
     cuándo una tanda sale del monitor), hay que tocar los dos lados. Los
     puntos donde eso aplica están marcados con «≡ index.html».

     URL:  <repo>/monitor/tv.html?key=tv   (la primera vez; después queda
           enrolada en localStorage y entra con /monitor/tv.html pelado, igual
           que el modo kiosko del monitor grande).
     ========================================================================= -->
<style>
/* ── Base ─────────────────────────────────────────────────────────────────
   Pensada para una TV de 50" mirada desde 3-5 m: fondo oscuro (menos brillo
   en planta), texto grande y contraste alto. Nada de hover ni de cursor. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b1220;color:#e2e8f0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;cursor:none;user-select:none}
html.embebido body{cursor:default}
/* La TV recorta los bordes (overscan). 1,6% de colchón para que no se coma
   ni el reloj ni la última columna. */
#app{height:100%;display:flex;flex-direction:column;padding:1.6vh 1.6vw;gap:1vh}
.hide{display:none!important}

/* ── Header ───────────────────────────────────────────────────────────── */
/* v24.38 (Luis): TRES columnas —vacia | codigo | reloj+estado— para que el codigo
   quede centrado en la PANTALLA, no en el hueco que dejan los vecinos. Sigue en el
   flujo, asi que el alto del header lo da la rueda y nada se corta. */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.4vw;flex:0 0 auto}
.h-der{display:flex;align-items:center;justify-content:flex-end;gap:1.4vw;min-width:0}
.h-sp{flex:1}
.h-reloj{font-size:calc(3.1*var(--u));font-weight:900;color:#f8fafc;font-variant-numeric:tabular-nums}
.h-est{font-size:calc(1.6*var(--u));font-weight:800;color:#4ade80;white-space:nowrap}
.h-est.stale{color:#fbbf24}
.h-est.err{color:#f87171}
/* v23.92 (Luis) — CÓDIGO DE LOGIN: grande y con la rueda que se vacía en el minuto que dura.
   Reemplaza al QR de fichada (se ficha entrando con este código) y a la barra de avance del
   header, que era texto que nadie leía de lejos. */
/* v24.38 (Luis): CENTRADO y en UNA linea — «CODIGO DE INGRESO: 4145» — con su
   rueda al lado. ≡ index.html (.mon-clave). Sale del flujo con position:absolute:
   quedandose en la fila habria que equilibrar a mano contra el reloj + estado. */
.clv{display:flex;align-items:center;gap:1.1vw;flex:0 0 auto;justify-self:center}
.clv-anillo{width:8.6vh;height:8.6vh;flex:0 0 auto;transform:rotate(-90deg)}
.clv-anillo circle{fill:none;stroke-width:3.2}
.clv-pista{stroke:#1e293b}
.clv-arco{stroke:#38bdf8;stroke-linecap:round;
  stroke-dasharray:100.53;transition:stroke-dashoffset .9s linear,stroke .3s}
.clv-arco.poco{stroke:#fbbf24}
.clv-txt{display:flex;align-items:baseline;gap:.9vw;white-space:nowrap}
.clv-lab{font-size:calc(2.4*var(--u));font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;line-height:1}
.h-clave{font-size:calc(7.4*var(--u));font-weight:900;color:#f8fafc;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:.16em}
/* Dentro del admin (iframe) el header lo pone el modal: acá sería el segundo reloj y el
   segundo código en la misma pantalla. */
html.embebido header{display:none}

/* ── Grilla principal ─────────────────────────────────────────────────── */
/* v25.6 (Luis): *"que se adapte a la resolución"*. Las letras van en --u = el menor entre
   1vh y el alto que tendría una 16:9 de ese ancho: en una pantalla más angosta achican. */
:root{--u:min(1vh,.5625vw)}
main{flex:1;display:grid;grid-template-columns:1fr auto;gap:.8vw;min-height:0}
.col{display:flex;flex-direction:column;gap:1vh;min-height:0;min-width:0}
.card{background:#111c2f;border:1px solid #1e293b;border-radius:1vh;
  padding:.9vh 1vw;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* v24.39 (Luis): *"Headers centrados"*. Todos los titulos de tarjeta van centrados; la
   clase .izq-t queda por si algun dia hay que dejar uno a la izquierda. */
.card-t{font-size:calc(2.1*var(--u));font-weight:900;color:#93c5fd;letter-spacing:.04em;text-align:center;
  margin-bottom:.7vh;flex:0 0 auto;overflow:hidden;line-height:1.2}
.card-t small{color:#64748b;font-weight:700}
.card-t.izq-t{text-align:left}
.grow{flex:1;min-height:0;overflow:hidden}

/* ── Tablas ───────────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:calc(1.6*var(--u));font-weight:800;color:#64748b;text-align:left;
  padding:.4vh .5vw;border-bottom:.2vh solid #1e293b;text-transform:uppercase;letter-spacing:.04em}
td{padding:.6vh .5vw;border-bottom:1px solid #16203a;font-size:calc(2.4*var(--u));font-weight:700}
.num{text-align:right}
.cen{text-align:center}
tr.curso td{background:#1c2a12}
tr.fact td{background:#14311f}
/* v20.19 — YA SALIÓ y todavía SIN FACTURA: la mercadería está en la calle sin
   papel. Es lo único de esta tabla que hay que resolver hoy, así que se pinta
   violeta (el mismo color que la columna SALIÓ de la PPP) y no verde. */
tr.salio-sinfc td{background:#2a1f45}
/* v23.64 — Resumen de días (≡ Programación de la PPP): colores de sus columnas */
/* v24.39 (Luis): UNA fila por día (eran dos: el 4.º día quedaba cortado). */
.rd th{text-align:center;font-size:calc(1.6*var(--u));font-weight:800;color:#64748b;letter-spacing:.05em;
  padding:.2vh .2vw;text-transform:uppercase}
.rd td{text-align:center;font-weight:900;line-height:1.05;font-size:calc(2.6*var(--u));padding:.7vh .2vw}
/* v25.49 (Luis): como Operarios — la tabla mide lo que el dato, centrada, sin espacio muerto. */
table.rd{width:auto;margin:0 auto}
.rd th,.rd td{padding-left:.7vw;padding-right:.7vw}
.rd td.rd-fe{text-align:center;color:#e2e8f0;white-space:nowrap;font-size:calc(2.4*var(--u))}
.rd tr+tr td{border-top:1px solid #16203a}
.rd td small{display:block;font-size:.62em;font-weight:700;color:inherit;opacity:.85}
.rd tr.hoy td.rd-fe{color:#93c5fd}
.rd .sal{color:#a78bfa}.rd .fac{color:#60a5fa}.rd .arm{color:#4ade80}.rd .pro{color:#fbbf24}.rd .pen{color:#f87171}
.rd .z{color:#334155}
.rd td.rd-m3{color:#e2e8f0;font-variant-numeric:tabular-nums}
.st-salio{font-size:calc(2.1*var(--u))}
.fc-salio{color:#c4b5fd}

/* Separador de día. Reemplaza a la columna «Salida», que salió de la tabla
   cuando entraron cliente, zona y demora: el boceto de Damián encabeza la
   tabla con el día ("Miercoles 23/09") y la ventana son 2-3 días, así que cada
   bloque lleva el suyo. */
tr.dia td{background:#0e1830;color:#93c5fd;font-size:calc(1.9*var(--u));font-weight:900;
  letter-spacing:.07em;text-transform:uppercase;padding:.5vh .5vw;
  border-bottom:.2vh solid #1e293b}

/* Tabla de tandas: el código de tanda es lo que se busca de lejos. */
.t-tanda{font-weight:900;font-size:calc(3.3*var(--u));color:#f8fafc;letter-spacing:.03em;white-space:nowrap}
.t-m3{font-weight:900;font-size:calc(3.1*var(--u));color:#e2e8f0}
.t-fe{color:#94a3b8;font-weight:800}
/* Celda de estado: ✅ terminado · ◍ girando en curso · vacío sin actividad. */
.st{display:inline-flex;align-items:center;gap:.35vw;justify-content:center;white-space:nowrap}
.st-done{color:#4ade80;font-size:calc(2.1*var(--u));font-weight:900}
.spin{display:inline-block;width:1.5vh;height:1.5vh;border:.3vh solid #fbbf24;
  border-top-color:transparent;border-radius:50%;animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Fase abandonada (fichó salida sin cerrarla): quieta, nunca girando. Cuadrado
   y no un emoji de "eject": los emoji los dibuja la fuente del televisor y
   cambian de un modelo a otro; un carácter geométrico se ve igual en todos. */
.st-aband{color:#a78bfa;font-size:calc(1.9*var(--u));font-weight:900}
.ini{background:#1e293b;color:#cbd5e1;border-radius:.5vh;padding:.1vh .5vh;
  font-size:calc(1.5*var(--u));font-weight:900;letter-spacing:.03em}
.dur{font-size:calc(1.4*var(--u));font-weight:800;white-space:nowrap}

/* ── Tabla de tandas (v23.92, Luis): tanda · m³ · progreso, todo centrado ──
   Tres columnas de ancho fijo: sin `table-layout:fixed` el semáforo se corre de
   lugar de una fila a otra y la columna deja de leerse como columna. */
table.tandas{table-layout:fixed}
/* v26.70 (Luis, D29): cada columna mide lo que mide su DATO (en --u, que escala con la letra), no un %
   de la tabla: con % el código de la tanda se pisaba con el m³ en el Mon. Admin («E48L0,4»). El cliente
   se queda con el resto y rota si no entra. */
table.tandas col.c-tan{width:calc(11.5*var(--u) + .8vw)}table.tandas col.c-m3{width:calc(8*var(--u) + .8vw)}
table.tandas col.c-np{width:calc(5*var(--u) + .8vw)}table.tandas col.c-pro{width:calc(10.5vh + 1.6vw)}
/* v24.88: cliente y NP, más chicos que el código de tanda (lo que se busca de lejos sigue siendo la tanda). */
.t-cli{font-weight:800;font-size:calc(2.3*var(--u));color:#e2e8f0}
.t-cli div{overflow:hidden;white-space:nowrap}
/* v24.92 (Luis): las NP van en UNA línea; si no entran, ROTAN como cartel de Wall Street
   (el texto va duplicado y corre de derecha a izquierda sin salto). Si entran, quietas. */
td.t-np{font-weight:900;font-size:calc(2.6*var(--u));color:#cbd5e1}
/* v25.01: rota también el cliente, y el cuadro «Pendientes de salir hoy». */
.tk{display:inline-block}
.tk.rota{animation:ticker linear infinite;will-change:transform}
/* v25.01 (Luis): las luces P/A quedan SIEMPRE centradas; quién la tiene y hace cuánto va abajo. */
.semdet{display:block;margin-top:.3vh;line-height:1}
/* v25.01 (Luis): «Pendientes de salir hoy» — lo del día que todavía no salió en el camión. */
table.pen{width:auto;margin:0 auto}
table.pen td.p-cli div{max-width:17vw}table.pen td.p-np div{max-width:12vw}
table.pen td{text-align:center;padding:.5vh .7vw;font-weight:800;font-size:calc(2.1*var(--u));color:#e2e8f0}
table.pen td.p-tanda{font-weight:900;font-size:calc(2.4*var(--u))}
table.pen td.p-zona{color:#7dd3fc;font-size:calc(2*var(--u))}
table.pen td.p-np{color:#94a3b8;font-size:calc(1.8*var(--u))}
table.pen td div{overflow:hidden;white-space:nowrap}
table.pen tr+tr td{border-top:1px solid #16203a}
table.pen .sal{color:#a78bfa}table.pen .fac{color:#60a5fa}table.pen .arm{color:#4ade80}
table.pen .pro{color:#fbbf24}table.pen .pen{color:#f87171}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
table.tandas td,table.tandas th{text-align:center;padding:.85vh .4vw}
/* Semáforo: dos luces con su letra — P de picking, A de armado. Rojo = no empezó ·
   ámbar = en curso · verde = terminado · violeta = abandonado (fichó salida sin
   cerrar). Son círculos dibujados con CSS, NO emoji: los emoji los pinta la fuente
   del televisor y cambian de un modelo a otro. */
.sem{display:inline-flex;gap:.6vw;align-items:center;justify-content:center;white-space:nowrap}
.sem i{width:4.8vh;height:4.8vh;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;font-style:normal;flex:0 0 auto;font-size:calc(2.6*var(--u));font-weight:900;
  letter-spacing:0;color:#fff;line-height:1}
.sem .s-no{background:#7f1d1d;box-shadow:inset 0 0 0 .25vh #dc2626;color:#fca5a5}
.sem .s-curso{background:#f59e0b;color:#3b2200;animation:pulso 1.4s ease-in-out infinite}
.sem .s-ok{background:#16a34a}
.sem .s-aband{background:#6d28d9;box-shadow:inset 0 0 0 .25vh #a78bfa}
.sem .s-fren{background:#b45309;color:#fff7ed}.st-fren{color:#fbbf24;font-weight:900}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.35}}

/* ── Horas por operario (v21.17, Damián) ─────────────────────────────────
   Las columnas salen de `gv_monitor_horas_operario`: la clasificación de qué
   hora es productiva vive en el BACKEND, no acá. */
table.ops th{font-size:calc(1.6*var(--u));letter-spacing:0;padding:.3vh .7vw;line-height:1.15;
  white-space:normal;text-align:center}
/* v25.47 (Luis): todo centrado y el ancho repartido; el nombre ya no se queda con el sobrante. */
table.ops{width:auto;margin:0 auto}
table.ops td{font-size:calc(2.7*var(--u));padding:.65vh .7vw;text-align:center}
table.ops td:first-child{text-align:center;font-weight:900;color:#f8fafc;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-prod{color:#4ade80}
.op-rit{color:#e2e8f0;font-weight:900}
.op-sep{border-right:.2vh solid #1e293b}
tr.op-grp th{text-align:center;color:#93c5fd;font-size:calc(1.5*var(--u));border-bottom:0;padding-bottom:0}
.op-mov{color:#93c5fd}
.op-no{color:#fbbf24}
.op-tot{color:#f8fafc;font-weight:900}
table.ops td.op-ah{font-size:calc(2*var(--u));color:#cbd5e1;font-weight:700;text-align:left;white-space:nowrap;max-width:22vw;overflow:hidden;text-overflow:ellipsis}
tr.op-tot-row td{border-top:.2vh solid #1e293b;background:#0e1830}

/* ── Panel "En este momento" ──────────────────────────────────────────── */
/* v25.49 (Luis): al ancho del dato, centrada. */
table.act-t{width:auto;margin:0 auto}
table.act-t td{padding:.8vh .7vw;font-size:calc(2.4*var(--u));text-align:left;white-space:nowrap}
table.act-t tr+tr td{border-top:1px solid #16203a}
.act-idle{opacity:.55}
.act-who{font-weight:900;color:#e2e8f0}
.act-who b{color:#60a5fa;margin-right:.35vw}
td.act-what{color:#cbd5e1;font-weight:700;max-width:24vw;overflow:hidden;text-overflow:ellipsis}
td.act-dur{font-weight:900;text-align:center;font-size:calc(2.1*var(--u))}

/* v23.86 (Luis) — ¿LLEGAN? La meta del día es ARMAR lo que sale en 2 días hábiles (armado → factura →
   salida). A las 15:00 se corta: si al ritmo de hoy no llegan, se corrige la PPP ese mismo día.
   v23.92 — dejó de ser una tarjeta: es la banda que encabeza el resumen de días. */
.mt-ver{font-size:calc(2.6*var(--u));font-weight:900;line-height:1.15;margin:.1vh 0 .5vh;text-align:center;
  text-wrap:balance}   /* que no deje el «m³» solo en el segundo renglon */
.mt-ok{color:#4ade80}.mt-no{color:#f87171}.mt-duda{color:#fbbf24}.mt-gris{color:#94a3b8}
.mt-bar{height:1.1vh;border-radius:999px;background:#1e293b;overflow:hidden;margin:.3vh 0 .6vh}
.mt-bar i{display:block;height:100%;background:#16a34a}
.mt-lin{font-size:calc(1.9*var(--u));font-weight:800;color:#cbd5e1;line-height:1.4;text-align:center}
.mt-lin b{color:#f8fafc}
.mt-hoy{color:#64748b;border-top:1px solid #16203a;margin-top:.5vh;padding-top:.5vh}
.mt-corte{background:#450a0a;color:#fecaca;border:2px solid #ef4444;animation:bordeCorte 1.4s ease-in-out infinite}
@keyframes bordeCorte{0%,100%{border-color:#ef4444}50%{border-color:#450a0a}}
.m3box{flex:1;background:#111c2f;border:1px solid #1e293b;border-radius:1vh;
  padding:.9vh 1vw;text-align:center}
.m3lab{font-size:calc(1.7*var(--u));font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
.m3val{font-size:calc(5.2*var(--u));font-weight:900;color:#f8fafc;line-height:1.05;font-variant-numeric:tabular-nums}
.m3val small{font-size:calc(1.8*var(--u));color:#64748b;font-weight:800}

/* ── Avisos ───────────────────────────────────────────────────────────── */
.avisos{flex:0 0 auto;display:flex;flex-direction:column;gap:.6vh}
.aviso{border-radius:.8vh;padding:.7vh 1vw;font-size:calc(2*var(--u));font-weight:800;line-height:1.3}
.aviso-agr{background:#422006;color:#fde68a;border:1px solid #92400e}
.aviso-err{background:#450a0a;color:#fecaca;border:1px solid #991b1b}
/* v20.20 — salió y sin factura: violeta, el mismo color que la columna Salió */
.aviso-salio{background:#2e1065;color:#ddd6fe;border:1px solid #6d28d9}
.t-salio{display:block;font-size:calc(1.5*var(--u));line-height:1}
.vacio{color:#475569;font-size:calc(1.9*var(--u));font-weight:700;padding:1.5vh .5vw;text-align:center}
.mas{color:#64748b;font-size:calc(1.5*var(--u));font-weight:800;padding:.5vh;text-align:center}

/* Cartel de arranque / de caída total */
#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:2vh;background:#0b1220;z-index:9;text-align:center;padding:4vw}
#splash .s1{font-size:calc(3*var(--u));font-weight:900;color:#93c5fd}
#splash .s2{font-size:calc(2*var(--u));font-weight:700;color:#64748b;max-width:60vw;line-height:1.5}

/* Banner de "sin actualizar" — arriba de todo, imposible de no ver. */
#offline{flex:0 0 auto;background:#7f1d1d;color:#fff;border-radius:.8vh;
  padding:.8vh 1vw;font-size:calc(2*var(--u));font-weight:900;text-align:center}
/* ── Capa admin (sólo admin.html, inyectada por build-admin.cjs) ──────────── */
.cx{cursor:pointer}
.cx:hover{outline:2px solid #38bdf8;outline-offset:-2px;background:#0e1830}
#pop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(2,6,23,.74);padding:3vh 3vw}
#pop.hide{display:none!important}

  max-width:min(92vw,920px);max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.6)}

};

var INICIALES_OVERRIDE = { "8": "JF" };

/* ═══════════════════════════════════════════════════════════════════════════
   1 · UTILIDADES
   ═══════════════════════════════════════════════════════════════════════════ */
function esc(s) {
  if (s == null) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function el(id) { return document.getElementById(id); }
function n1(x) { return (Math.round((Number(x) || 0) * 10) / 10).toFixed(1).replace(".", ","); }
/* Horas con UNA decimal y coma, como el resto de los números de la casa. El 0
   se escribe "—": en una pared un cero y un "no hizo nada" se leen igual, y el
   guion no se confunde con un dato. */
function nH(x) {
  /* v23.70 (Luis): TODA hora va en H:MM (horas:minutos); los índices (m³/h) en decimal. */
  var v = Number(x) || 0;
  if (!(v > 0.0083)) return "—";                       // menos de medio minuto = nada
  var m = Math.round(v * 60);
  return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
}
/* Nombre para la tabla de operarios: nombre de pila + inicial del apellido.
   "Farias Juan Hilario" → "Farias J." — el apellido va primero porque así
   están cargados en `Empleados`. */
function nombreCorto(nombre, legajo) {
  /* Se saltean los pedazos sin letras: un nombre como "Entrevista / Prueba"
     salía "Entrevista /." — la inicial era la barra. */
  var p = String(nombre || "").trim().split(/\s+/)
            .filter(function (x) { return /[A-Za-zÁÉÍÓÚÑáéíóúñ]/.test(x); });
  if (!p.length) return "Leg " + legajo;
  if (p.length === 1) return p[0];
  return p[0] + " " + p[1].charAt(0).toUpperCase() + ".";
}

/* Día YYYY-MM-DD en hora de Buenos Aires, salga de donde salga el reloj de la
   TV. ≡ index.html isoToDayKey. Argentina no usa horario de verano: UTC-3 fijo. */
function dayKey(isoOrMs) {
  var ts = typeof isoOrMs === "number" ? isoOrMs : new Date(isoOrMs).getTime();
  var d = new Date(new Date(ts).toLocaleString("en-US", { timeZone: TZ }));
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
         "-" + String(d.getDate()).padStart(2, "0");
}
function hoyKey() { return dayKey(Date.now()); }

/* ≡ index.html monitorFmtFecha / monitorRawFecha */
function fmtFecha(s) {
  if (!s) return "";
  var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[3] + "/" + m[2];
  var m2 = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m2) return m2[1].padStart(2, "0") + "/" + m2[2].padStart(2, "0");
  var m3 = String(s).match(/^(\d{1,2})\/(\d{1,2})\s*$/);
  if (m3) return m3[1].padStart(2, "0") + "/" + m3[2].padStart(2, "0");
  return String(s).slice(0, 10);
}
function rawFecha(s) {
  if (!s) return "";
  var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + "-" + m[2] + "-" + m[3];
  var m2 = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m2) { var y = m2[3]; if (y.length === 2) y = "20" + y;
            return y + "-" + m2[2].padStart(2, "0") + "-" + m2[1].padStart(2, "0"); }
  var m3 = String(s).match(/^(\d{1,2})\/(\d{1,2})\s*$/);
  if (m3) return (new Date().getFullYear()) + "-" + m3[2].padStart(2, "0") + "-" + m3[1].padStart(2, "0");
  return "";
}
/* ≡ index.html tandaCamion — letra + número: D60A, E60A y F60A son camiones
   DISTINTOS aunque compartan el 60 (idea 7828). */
function tandaCamion(code) {
  var s = String(code || "").trim().toUpperCase();
  var m = /^([A-Z]+)-?(\d+)[A-Z]*$/.exec(s);
  if (m) return m[1] + m[2];
  var d = s.match(/\d+/);
  return d ? d[0] : s;
}
/* ≡ index.html monCamionDeTanda / monUnirCentroOeste (v23.64) */
var MON_CAMION_ZONA = { 1: "Capital Sur", 2: "Capital Centro", 3: "Capital Oeste", 4: "GBA Sur", 5: "GBA Oeste", 6: "GBA Norte", 7: "GBA Norte" };
function monCamionDeTanda(v) {
  /* primero la base (gv_monitor_tanda_camion, ve el súper con zona numérica); lo de abajo es respaldo */
  var b = CAMION_DE.get(String((v && v.tanda) || "").trim().toUpperCase());
  if (b && b.camion) return b.camion;
  var z = String((v && v.zonas && v.zonas[0]) || "").trim();
  if (/super/i.test(z)) return "Súper · " + (String((v.clientes && v.clientes[0]) || "").trim() || v.tanda);
  if (/retira/i.test(z)) return "Retira";
  var m = /Zona\s*(\d+)/i.exec(z);
  if (m && MON_CAMION_ZONA[+m[1]]) return MON_CAMION_ZONA[+m[1]];
  return z || tandaCamion(v && v.tanda);
}
function monUnirCentroOeste(porDia) {
  porDia.forEach(function (g) {
    var C = g.camiones.get("Capital Centro"), O = g.camiones.get("Capital Oeste");
    if (!C || !O || !(C.sum < 1 && O.sum < 1)) return;
    g.camiones.delete("Capital Centro"); g.camiones.delete("Capital Oeste");
    g.camiones.set("Capital Centro-Oeste", { sum: C.sum + O.sum, n: C.n + O.n, armadas: C.armadas + O.armadas });
  });
}
/* ≡ index.html pwebNpLabel */
function npLabel(empresa, np) {
  var n = String(np);
  var e = String(empresa || "").trim().toLowerCase();
  return ((e === "chef" || e === "ch") ? "CH" : "LK") + " " + (n.length >= 4 ? n : n.padStart(4, "0"));
}
/* ≡ index.html initialsFromName */
function iniciales(nombre, legajo) {
  var leg = legajo != null ? String(legajo).trim() : "";
  if (leg && INICIALES_OVERRIDE[leg]) return INICIALES_OVERRIDE[leg];
  if (!nombre) return "";
  var p = String(nombre).trim().split(/\s+/).filter(Boolean);
  if (!p.length) return "";
  if (p.length === 1) return p[0].charAt(0).toUpperCase();
  return p[0].charAt(0).toUpperCase() + p[1].charAt(0).toUpperCase();
}
function fmtMin(min) {
  if (!(min >= 0)) return "";
  return Math.floor(min / 60) + ":" + String(min % 60).padStart(2, "0");   // v23.70: H:MM
}

/* ═══════════════════════════════════════════════════════════════════════════
   2 · RED
   PostgREST corta en 1000 filas (db-max-rows) y devuelve 200 sin avisar, así
   que todo lo que puede crecer se pagina con Range. Y todo lleva timeout: un
   fetch colgado (la TV suspendida, un corte de un segundo) deja la promesa
   pendiente para siempre y el tablero se congela sin decir nada.
   ≡ index.html supaFetchAll.
   ═══════════════════════════════════════════════════════════════════════════ */
function conTimeout(promesa, ctrl, queSoy) {
  var tmo;
  var corte = new Promise(function (_res, rej) {
    tmo = setTimeout(function () {
      try { if (ctrl) ctrl.abort(); } catch (_e) {}
      rej(new Error(queSoy + " sin respuesta en " + Math.round(FETCH_TIMEOUT / 1000) + " s"));
    }, FETCH_TIMEOUT);
  });
  return Promise.race([promesa, corte]).finally(function () { clearTimeout(tmo); });
}

/* Una sola página (para tablas chicas y acotadas). */
function get(path, query) {
  var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var url = SB_URL + "/rest/v1/" + path + "?" + query;
  return conTimeout(fetch(url, {
    cache: "no-store", signal: ctrl ? ctrl.signal : undefined, headers: H
  }), ctrl, path).then(function (r) {
    if (!r.ok) throw new Error(path + " HTTP " + r.status);
    return r.json();
  });
}

/* Paginado completo con Range + count=exact. */
function getAll(path, query) {
  var out = [];
  function pagina(desde) {
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var h = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY,
              "Range-Unit": "items", Range: desde + "-" + (desde + 999), Prefer: "count=exact" };
    return conTimeout(fetch(SB_URL + "/rest/v1/" + path + "?" + query, {
      cache: "no-store", signal: ctrl ? ctrl.signal : undefined, headers: h
    }), ctrl, path).then(function (r) {
      if (!r.ok && r.status !== 206) throw new Error(path + " HTTP " + r.status);
      var rango = r.headers.get("content-range") || "";
      return r.json().then(function (chunk) {
        chunk = chunk || [];
        for (var i = 0; i < chunk.length; i++) out.push(chunk[i]);
        /* "0-999/4312" → el total va después de la barra. Sin total (o con "*")
           cortamos cuando la página vino incompleta. */
        var total = Number(String(rango.split("/")[1] || "").trim());
        var hayMas = isFinite(total) ? (desde + chunk.length < total) : (chunk.length === 1000);
        if (hayMas && chunk.length) return pagina(desde + chunk.length);
        return out;
      });
    });
  }
  return pagina(0);
}

/* Caché con vencimiento: envuelve un cargador y evita repetir la consulta
   antes de tiempo. Si la recarga falla, devuelve lo último bueno — el tablero
   prefiere un dato de hace un minuto a un hueco. */
function cache(ttl, cargar) {
  var val = null, ts = 0, enVuelo = null;
  return function () {
    var ahora = Date.now();
    if (val !== null && (ahora - ts) < ttl) return Promise.resolve(val);
    if (enVuelo) return enVuelo;
    enVuelo = cargar().then(function (v) {
      val = v; ts = Date.now(); enVuelo = null; return v;
    }).catch(function (e) {
      enVuelo = null;
      if (val !== null) { console.warn("[tv] recarga fallida, sigo con lo viejo:", e.message); return val; }
      throw e;
    });
    return enVuelo;
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   3 · FUENTES DE DATOS
   Las mismas vistas y tablas que usa el monitor grande.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Programación: ISIS (gv_ppp_programacion_diaria) + web (PPP_Web_Programacion),
   sumadas en UN mapa por código de tanda. ≡ index.html fetchMonitorFromSupabase
   + mergeMonitorPppWeb. */
var cargarProgramacion = cache(PROG_TTL, function () {
  return Promise.all([
    getAll("gv_ppp_programacion_diaria",
      "select=tanda,np,m3,fecha_entrega,razon_social,zona,fecha_recep&order=tanda.asc,np.asc"),
    getAll("PPP_Web_Programacion",
      "select=empresa,np,tanda,fecha_entrega,razon_social,zona,fecha_recep,m3,es_agregado,agregado_a_np,cod_cliente" +
      "&tanda=not.is.null&order=tanda.asc,np.asc").catch(function (e) {
        /* Aditivo: si la PPP web falla, las tandas de ISIS se muestran igual.
           ≡ index.html, que envuelve mergeMonitorPppWeb en try/catch. */
        console.warn("[tv] PPP web:", e.message); return [];
      }),
    /* v21.63 — clientes de PRUEBA: la tele es de los operarios y no los muestra.
       ≡ index.html gvSinPrueba (tanda PRUEBAn o cliente de GV_Clientes_Prueba). */
    getAll("GV_Clientes_Prueba", "select=empresa,cod&order=cod.asc").catch(function () { return []; })
  ]).then(function (par) {
    var acc = new Map();
    var isis = par[0] || [], web = par[1] || [];
    var prueba = {};
    (par[2] || []).forEach(function (c) { prueba[String(c.empresa || "").toLowerCase() + "|" + String(c.cod || "").trim()] = 1; });
    var esTandaPrueba = function (t) { return /^PRUEBA\d+$/i.test(String(t == null ? "" : t).trim()); };

    for (var i = 0; i < isis.length; i++) {
      var r = isis[i];
      var np = (r.np == null ? "" : String(r.np)).trim();
      if (!/\d/.test(np)) continue;                 // sólo filas con N° de NP real
      var tanda = (r.tanda == null ? "" : String(r.tanda)).trim();
      if (esTandaPrueba(tanda)) continue;            // v21.63
      var fe = (r.fecha_entrega == null ? "" : String(r.fecha_entrega)).trim();
      var feRaw = rawFecha(fe);
      var display, key;
      if (tanda) { display = tanda; key = tanda.toUpperCase(); }
      else if (feRaw) { display = "S/Tanda"; key = "S/TANDA__" + feRaw; }
      else continue;
      if (!acc.has(key)) acc.set(key, nuevaTanda(display, key, fe));
      var e1 = acc.get(key);
      e1.m3 += Number(r.m3) || 0;
      e1.nps.push(np);
      sumarDestino(e1, r.razon_social, r.zona, r.fecha_recep);
    }

    for (var j = 0; j < web.length; j++) {
      var x = web[j];
      var t = String(x.tanda || "").trim();
      if (!t || !x.np) continue;
      if (esTandaPrueba(t) || prueba[String(x.empresa || "").toLowerCase() + "|" + String(x.cod_cliente || "").trim()]) continue;   // v21.63
      var k2 = t.toUpperCase();
      var fe2 = String(x.fecha_entrega || "").trim();
      if (!acc.has(k2)) acc.set(k2, nuevaTanda(t, k2, fe2));
      var e2 = acc.get(k2);
      e2.m3 += Number(x.m3) || 0;
      e2.nps.push(npLabel(x.empresa, x.np));
      sumarDestino(e2, x.razon_social, x.zona, x.fecha_recep);
      /* Un AGREGADO es un pedido que el cliente sumó cuando su tanda ya estaba
         en la mesa. Si nadie lo ve, el camión sale sin eso: por eso se canta
         fuerte. ≡ index.html pwebAgregadoAviso. */
      if (x.es_agregado) e2.agregados.push({
        np: npLabel(x.empresa, x.np),
        aNp: x.agregado_a_np == null ? "" : npLabel(x.empresa, x.agregado_a_np),
        rs: String(x.razon_social || "").trim()
      });
    }
    return acc;
  });
});

/* Una tanda del tablero. `clientes` y `zonas` son listas SIN repetidos: una
   tanda puede llevar varios pedidos de varios clientes (E12R tenía 6 NP de 4
   clientes el 22/09) y en la pared va UNA fila — pedido de Damián: "si hay
   varias NP que aparezca en una sola fila y con el nombre resumido".
   `recep` es la fecha del pedido MÁS VIEJO de la tanda: la demora de una tanda
   es la del pedido que más esperó, no el promedio. */
function nuevaTanda(display, key, fe) {
  return { tanda: display, key: key, m3: 0, fecha: fmtFecha(fe), fechaRaw: rawFecha(fe),
           nps: [], agregados: [], clientes: [], zonas: [], recep: "" };
}
function sumarDestino(e, rs, zona, recep) {
  var c = String(rs == null ? "" : rs).trim();
  if (c && e.clientes.indexOf(c) < 0) e.clientes.push(c);
  var z = String(zona == null ? "" : zona).trim();
  if (z && e.zonas.indexOf(z) < 0) e.zonas.push(z);
  var r = rawFecha(recep);
  if (r && (!e.recep || r < e.recep)) e.recep = r;
}

/* v23.92 (Luis) — la tabla de tandas quedó en tanda · m³ · progreso, así que se fueron con
   ella `zonaCorta`, `diasDemora` y `colorDemora`: nadie las llamaba más.
   v24.88 (Luis): *"tiene que aparecer en la parte de la izquierda junto a las tandas y los m3:
   el cliente y detalle de NPs"*. Vuelven cliente (resumido, «+N» si son varios) y las NP. */
function resumirCliente(nombre) {
  var s = String(nombre || "").trim()
    .replace(/\s*\((?:[^()]*)\)\s*$/, "")
    .replace(/[\s,.-]*\b(S\.?\s?R\.?\s?L\.?|S\.?\s?A\.?\s?S?\.?|SACIFI?A?|SRL|SA)\b\.?\s*$/i, "")
    .replace(/\s{2,}/g, " ").trim();
  return s;
}
function clienteTanda(v) {
  var cs = (v.clientes || []).map(resumirCliente).filter(Boolean);
  /* v25.6 (Luis): todos los nombres, no «+N»; si no entran, la celda rota. */
  return cs.length ? cs.join(" · ") : "—";
}
/* Las NP con el prefijo UNA vez por empresa: «LK 0101·0102 · 98615». */
/* v24.92 (Luis): «si hay más NPs de las que entran, que rote estilo cartel de Wall Street».
   Sólo la celda que se desborda rota; el texto se duplica para que el giro no tenga salto
   y la velocidad es pareja (~6 caracteres por segundo), sea larga o corta la lista. */
function activarTicker(raiz) {
  if (!raiz) return;
  raiz.querySelectorAll(".tk").forEach(function (tk) {
    var caja = tk.parentNode;
    /* Idempotente (v25.01): se vuelve a medir al cambiar el tamaño o al cargar la fuente, así
       que siempre parte del texto original y quieto. Una celda sin ancho (pestaña oculta del
       admin) no se evalúa: se mide cuando se vea. */
    if (tk.getAttribute("data-txt") == null) tk.setAttribute("data-txt", tk.textContent);
    var txt = tk.getAttribute("data-txt");
    tk.classList.remove("rota"); tk.style.animationDuration = ""; tk.textContent = txt;
    if (!caja || !caja.clientWidth || tk.scrollWidth <= caja.clientWidth + 1) return;
    var sep = "\u00a0\u00a0\u00a0·\u00a0\u00a0\u00a0";
    tk.textContent = txt + sep + txt + sep;
    tk.classList.add("rota");
    /* v25.6 (Luis): a 3/4 de la velocidad de la v24.92 (6 → 4,5 caracteres por segundo). */
    tk.style.animationDuration = Math.max(8, Math.round((txt.length + 7) / 4.5)) + "s";
  });
}
function tickersTodos() { ["tandasBox", "penBox"].forEach(function (id) { activarTicker(el(id)); }); }
(function () {
  var t = null;
  window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(tickersTodos, 250); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(tickersTodos, function () {});
})();
/* v25.01 (Luis): lo de HOY que todavía no salió en el camión, agrupado por tanda y cliente,
   con el estado del más atrasado. Misma fuente que el cuadro de Días (gv_ppp_prog_arbol) y el
   mismo «salió» (CCN sin FSS posterior). */
var PEN_ORDEN = { pendiente: 0, proceso: 1, armado: 2, facturado: 3 };
var PEN_TXT = { pendiente: ["pen", "Pend"], proceso: ["pro", "Proc"], armado: ["arm", "Arm"], facturado: ["fac", "Fact"] };
function pendientesHoy(filas, despachadas) {
  var hoy = hoyKey(), g = new Map();
  (filas || []).forEach(function (r) {
    if (String(r.fecha || "").slice(0, 10) !== hoy) return;
    var np = String(r.np || "").trim().replace(/\.0+$/, "");
    if (!np || despachadas.has(np)) return;
    var tanda = String(r.tanda || "").trim().toUpperCase() || "—";
    var rs = resumirCliente(r.razon_social || "") || "—";
    var k = tanda + "|" + rs, x = g.get(k);
    if (!x) { x = { tanda: tanda, rs: rs, rsFull: r.razon_social || "", nps: [], m3: 0, est: "facturado", zonas: [] }; g.set(k, x); }
    /* v25.43 (Luis): la zona de cada pendiente, corta (Z4 · Súper · Retira). */
    var zc = String(r.zona_corta || r.zona || "").trim().replace(/^zona\s*(\d+).*$/i, "Z$1");
    if (zc && x.zonas.indexOf(zc) < 0) x.zonas.push(zc);
    x.nps.push(np); x.m3 += Number(r.m3) || 0;
    var e = PEN_ORDEN[r.estado] != null ? r.estado : "pendiente";
    if (PEN_ORDEN[e] < PEN_ORDEN[x.est]) x.est = e;
  });
  return Array.from(g.values()).sort(function (a, b) {
    return (PEN_ORDEN[a.est] - PEN_ORDEN[b.est]) || a.tanda.localeCompare(b.tanda);
  });
}
function npsCortas(nps) {
  var orden = [], grupos = {}, vistos = {};
  (nps || []).forEach(function (n) {
    var t = String(n || "").trim();
    if (!t || vistos[t]) return;
    vistos[t] = 1;
    var m = /^(LK|CH)\s+(\S+)$/i.exec(t);
    var pre = m ? m[1].toUpperCase() : "", num = m ? m[2] : t;
    if (!grupos[pre]) { grupos[pre] = []; orden.push(pre); }
    grupos[pre].push(num);
  });
  return orden.map(function (pre) {
    return (pre ? pre + "\u00a0" : "") + grupos[pre].join("·");
  }).join(" · ") || "—";
}

/* Semáforo de la tanda: dos luces, picking y armado. Pedido de Damián: "lo
   quiere ver como semáforo". No reemplaza el detalle — al lado siguen las
   iniciales de quién la tiene y hace cuánto, que es lo que se acciona. */
/* v23.92 (Luis): la luz lleva la letra de su etapa adentro — P de picking, A de armado. */
function luz(estado, aband, letra) {
  var c = aband ? "s-aband" : (estado === "done" ? "s-ok" : (estado === "curso" ? "s-curso" : (estado === "frenada" ? "s-fren" : "s-no")));
  var t = aband ? "Abandonada" : (estado === "done" ? "Terminado" : (estado === "curso" ? "En curso" : (estado === "frenada" ? "Frenada" : "Sin empezar")));
  return '<i class="' + c + '" title="' + (letra === "P" ? "Picking" : "Armado") + ': ' + t + '">' + letra + '</i>';
}
function semaforo(ev, nombres, horarios) {
  var s = '<span class="sem">' +
    luz(ev.picking, ev.pickAband, "P") + luz(ev.armado, ev.armAband, "A") + '</span>';
  /* El detalle es de la fase que está EN CURSO; si las dos están quietas no
     hay nada que agregar. El armado va primero: es la fase más tardía. */
  var det = "";
  if (ev.armado === "curso")       det = celdaEstado("curso", ev.armLegajo,  ev.armStart,  ev.armAband,  ev.armFj,  nombres, horarios);
  else if (ev.picking === "curso") det = celdaEstado("curso", ev.pickLegajo, ev.pickStart, ev.pickAband, ev.pickFj, nombres, horarios);
  else if (ev.armado === "frenada")  det = celdaEstado("frenada", ev.armLegajo, null, false, null, nombres, horarios);   /* v26.62 */
  else if (ev.picking === "frenada") det = celdaEstado("frenada", ev.pickLegajo, null, false, null, nombres, horarios);
  return s + (det ? '<span class="semdet">' + det + '</span>' : "");
}

/* Estado de cada tanda. `gv_tanda_status` ya resuelve en el backend el último
   EP/TP y AP/TAP, el legajo, el arranque y si la fase quedó ABANDONADA (el
   operario fichó salida sin cerrarla, v18.71). La lista de tandas va troceada:
   un `in.(…)` con 400 códigos arma una URL que algunos proxies rechazan. */
function cargarStatus(keys) {
  var lotes = [], i;
  for (i = 0; i < keys.length; i += 120) lotes.push(keys.slice(i, i + 120));
  if (!lotes.length) return Promise.resolve(new Map());
  return Promise.all(lotes.map(function (lote) {
    return getAll("gv_tanda_status",
      "tanda=in.(" + lote.map(encodeURIComponent).join(",") + ")" +

      "arm_start_ts,pick_abandonado,arm_abandonado,pick_fj_ts,arm_fj_ts");
  })).then(function (partes) {
    var m = new Map();
    partes.forEach(function (filas) {
      (filas || []).forEach(function (row) {
        var t = String(row.tanda || "").trim().toUpperCase();
        if (!t) return;
        m.set(t, {
          /* v26.62: PKF/APF = FRENADA (nadie la está haciendo; la retoma cualquiera) ≡ index.html */
          picking:  !row.last_pick_op ? null : (row.last_pick_op === "TP"  ? "done" : (row.last_pick_op === "PKF" ? "frenada" : "curso")),
          armado:   !row.last_arm_op  ? null : (row.last_arm_op  === "TAP" ? "done" : (row.last_arm_op  === "APF" ? "frenada" : "curso")),
          doneHoyP: false, doneHoyA: false,
          pickLegajo: row.pick_legajo || null, armLegajo: row.arm_legajo || null,
          pickStart: row.pick_start_ts || null, armStart: row.arm_start_ts || null,
          pickAband: !!row.pick_abandonado,     armAband: !!row.arm_abandonado,
          pickFj: row.pick_fj_ts || null,       armFj: row.arm_fj_ts || null
        });
      });
    });
    return m;
  });
}

   Sin respuesta → Map vacío = m³ del pedido (fail-open). ≡ index.html gvFracPickeado. */
function cargarPickeado(tandas) {

/* Fechas a mostrar: TODAS las pasadas o de hoy que todavía tienen tandas
   (están atrasadas pero siguen en cola) + las próximas N con tandas. Los días
   sin tandas — feriados, fines de semana — no consumen lugar.
   ≡ index.html targetDeliveryDates. */
function fechasVentana(prog, n) {
  var hoy = hoyKey(), todas = new Set();
  prog.forEach(function (v) { if (v.fechaRaw) todas.add(v.fechaRaw); });
  var arr = Array.from(todas).sort();
  var pasadas = arr.filter(function (x) { return x <= hoy; });
  var futuras = arr.filter(function (x) { return x > hoy; }).slice(0, n);
  return pasadas.concat(futuras);
}

/* Duración de una fase abierta, en horas LABORALES: un EP que quedó abierto el
   viernes a la tarde no debe marcar 66 h el lunes. Dentro del mismo día es la
   resta directa; si cruzó días, sólo cuentan las horas entre entrada y salida
   de ese operario (fallback 08-17) y se saltean sábados, domingos y feriados.
   ≡ index.html businessDurSinceMs (idea 2865). */
function durLaboralMs(desdeMs, legajo, horarios) {
  var ahora = Date.now();
  if (!(ahora > desdeMs)) return 0;
  var dIni = dayKey(desdeMs), dHoy = dayKey(ahora);
  if (dIni === dHoy) return ahora - desdeMs;
  var h = (horarios && horarios.get) ? (horarios.get(String(legajo)) || {}) : {};
  var hEnt = hhmm(h.entrada); if (hEnt == null) hEnt = 8;
  var hSal = hhmm(h.salida);  if (hSal == null) hSal = 17;
  var horasDia = Math.max(0, hSal - hEnt);
  var libre = function (k) {
    var wd = new Date(k + "T00:00:00-03:00").getUTCDay();
    return wd === 0 || wd === 6 || !!FERIADOS[k];
  };
  var enHora = function (k, hs) {
    var hh = Math.floor(hs), mm = Math.floor((hs - hh) * 60);
    return new Date(k + "T" + String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0") + ":00-03:00").getTime();
  };
  var trozoIni = Math.max(0, enHora(dIni, hSal) - desdeMs);
  var arranqueHoy = Math.max(enHora(dHoy, hEnt), desdeMs);
  var trozoHoy = libre(dHoy) ? 0 : Math.max(0, ahora - arranqueHoy);
  var medio = 0;
  var ms = new Date(dIni + "T00:00:00-03:00").getTime();
  var fin = new Date(dHoy + "T00:00:00-03:00").getTime();
  for (var t = ms + 86400000; t < fin - 1000; t += 86400000) {
    if (!libre(new Date(t).toISOString().slice(0, 10))) medio++;
  }
  return trozoIni + medio * horasDia * 3600000 + trozoHoy;
}
function hhmm(s) {
  if (!s) return null;
  var m = String(s).match(/^(\d{1,2}):(\d{1,2})/);
  return m ? (Number(m[1]) + Number(m[2]) / 60) : null;
}

/* Qué está haciendo AHORA cada operario: replay de los eventos de hoy por
   legajo buscando la acción ABIERTA más reciente (EP sin TP, AP sin TAP, o un
   toggle abierto — el cierre lleva ts_inicio, la apertura no).
   ≡ index.html _monActividadActual. */
function actividadActual(eventos, hoy, fjHoy, fichados) {
  var porLeg = {}, i;
  for (i = 0; i < eventos.length; i++) {
    var ev = eventos[i], leg = String(ev.legajo == null ? "" : ev.legajo).trim();
    if (!leg || leg === "0" || leg === "1") continue;      // legajos de prueba/basura
    if (dayKey(ev.ts_cliente) !== hoy) continue;
    (porLeg[leg] || (porLeg[leg] = [])).push({
      op: ev.opcion, tx: String(ev.texto || "").trim().toUpperCase(),
      ini: ev.ts_inicio, ts: new Date(ev.ts_cliente).getTime()
    });
  }
  var out = [], vistos = {};
  for (var leg2 in porLeg) {
    if (fjHoy.has(leg2)) { vistos[leg2] = 1; continue; }   // ya cerró jornada
    var evs = porLeg[leg2].sort(function (a, b) { return a.ts - b.ts; });
    var pick = null, pickTs = 0, arm = null, armTs = 0, tog = null, togTs = 0, ultTs = 0, gstIni = 0, gstUlt = 0;
    for (var k = 0; k < evs.length; k++) {
      var e = evs[k];
      if (e.ts > ultTs) ultTs = e.ts;
      if (e.op === "GST") { if (!gstIni) gstIni = e.ts; gstUlt = e.ts; continue; }   /* v23.64 */
      gstIni = 0; gstUlt = 0;
      if (e.op === "EP") { pick = e.tx; pickTs = e.ts; }
      else if (e.op === "TP")  { if (!e.tx || pick === e.tx) pick = null; }
      else if (e.op === "PKF") { if (pick === e.tx) pick = null; }   /* v26.62: frenó ≡ index.html */
      else if (e.op === "APF") { if (arm === e.tx) arm = null; }
      else if (e.op === "AP")  { arm = e.tx; armTs = e.ts; }
      else if (e.op === "TAP") { if (!e.tx || arm === e.tx) arm = null; }
      else if (e.op === "MGI") { tog = "MG"; togTs = e.ts; }                       /* ≡ index.html v23.63 */
      else if (e.op === "MGC") { if (tog === "MG") tog = null; }
      else if (e.op === "RKI") { tog = "RKB"; togTs = e.ts; }                      /* v23.66: bajando racks */
      else if (e.op === "IRI") { tog = "IRT"; togTs = e.ts; }                      /* v23.66: ingresando a racks */
      else if (e.op === "MG" && e.ini) { if (tog === "MG") tog = null; }
      else if (ACT_TOGGLES[e.op]) { if (!e.ini) { tog = e.op; togTs = e.ts; } else if (tog === e.op) { tog = null; } }

    var cands = [];
    if (pick) cands.push({ k: "pick", ts: pickTs, tanda: pick });
    if (arm)  cands.push({ k: "arm",  ts: armTs,  tanda: arm });
    if (tog)  cands.push({ k: tog,    ts: togTs });
    if (!cands.length && gstUlt && (Date.now() - gstUlt) <= GST_VIVO_MIN * 60000) cands.push({ k: "GST", ts: gstIni });
    cands.sort(function (a, b) { return b.ts - a.ts; });
    out.push({ legajo: leg2, idle: !cands.length, desde: cands.length ? cands[0].ts : ultTs,
               kind: cands.length ? cands[0].k : null,
               tanda: cands.length ? (cands[0].tanda || "") : "", arranco: true });
    vistos[leg2] = 1;
  }
  fichados.forEach(function (ts, leg3) {
    leg3 = String(leg3);
    if (leg3 === "0" || leg3 === "1" || vistos[leg3] || fjHoy.has(leg3)) return;
    out.push({ legajo: leg3, idle: true, desde: ts, kind: null, tanda: "", arranco: false });
  });
  // trabajando primero; dentro de cada grupo, el que arrancó hace más rato arriba
  out.sort(function (a, b) { return (a.idle - b.idle) || (a.desde - b.desde); });
  return out;
}

/* Cuántas filas entran en un panel. La TV no puede scrollear, así que lo que
   no entra no existe: en vez de cortar por un número fijo —que depende de la
   resolución— se mide el alto real del contenedor. Como todas las medidas de
   la hoja están en `vh`, el alto de fila es proporcional a la pantalla y la
   cuenta sale igual en 1080p que en 720p. */
function cabenFilas(id, conEncabezado) {
  var box = el(id);
  var alto = box ? box.clientHeight : 0;
  var fila = Math.max(12, window.innerHeight * 0.041);   // ≈ padding + texto de una fila (v23.69: fuentes más grandes)
  var libre = alto - (conEncabezado ? fila : 0);
  return Math.max(1, Math.floor(libre / fila));
}

function celdaEstado(estado, legajo, inicio, aband, fjTs, nombres, horarios) {
  if (estado == null) return "";
  /* Una fase abandonada NO lleva el reloj girando: el operario fichó salida y
     se fue, así que mostrarla "en movimiento" es exactamente el malentendido
     que la v18.71 vino a arreglar. Lleva ⏏ y color propio. */
  var icono = estado === "done"
    ? '<span class="st-done">✅</span>'
    : estado === "frenada" ? '<span class="st-fren">⏸</span>' : (aband ? '<span class="st-aband">■</span>' : '<span class="spin"></span>');
  var tag = "";
  if (legajo != null) {
    var nom = nombres.get(String(legajo)) || "";
    tag = '<span class="ini">' + esc(nom ? iniciales(nom, legajo) : String(legajo)) + '</span>';
  }
  var dur = "";
  if (estado === "curso" && inicio) {
    var iniMs = new Date(inicio).getTime();
    /* Si fichó salida sin cerrar, esto no está en curso: está ABANDONADO. La
       duración se congela en el FJ en vez de seguir corriendo — si no, el
       tablero muestra «17h54» de alguien que se fue ayer a las 17 (v18.71). */
    var ms = (aband && fjTs) ? Math.max(0, new Date(fjTs).getTime() - iniMs)
                             : durLaboralMs(iniMs, legajo, horarios);
    var min = Math.round(ms / 60000);
    var col = aband ? "#a78bfa" : (min >= 120 ? "#f87171" : (min >= 60 ? "#fbbf24" : "#64748b"));
    dur = '<span class="dur" style="color:' + col + '">' + esc(fmtMin(min)) + '</span>';
  }
  return '<span class="st">' + icono + tag + dur + '</span>';
}

/* v23.86 (Luis) — orden de ARMADO por camión: 1° el camión con más m³ (si no llegan, se patea el más
   chico y sale la mayor cantidad de mercadería), Retira al final. Lo calcula la base
   (gv_monitor_tanda_camion.orden_camion). Sin ese dato: 99 → orden alfabético de siempre. */
function camionOrden(v) {
  var b = CAMION_DE.get(String((v && v.tanda) || "").trim().toUpperCase());
  return (b && b.orden) || 99;
}
var JORNADA_INI = 8, JORNADA_FIN = 17, CORTE_HORA = 15;   // horas AR
function sumarHabiles(key, n) {
  var t = new Date(key + "T12:00:00-03:00").getTime(), k = key;
  while (n > 0) {
    t += 86400000; k = new Date(t).toISOString().slice(0, 10);
    var wd = new Date(k + "T12:00:00-03:00").getUTCDay();
    if (wd === 0 || wd === 6 || FERIADOS[k]) continue;
    n--;
  }
  return k;
}
function horaAR(ms) { var d = new Date(ms - 3 * 3600000); return d.getUTCHours() + d.getUTCMinutes() / 60; }
/* ¿LLEGAN? Trabajo = m³ × (½ picking + ½ armado): una tanda pickeada y sin armar está a la mitad.
   Pendiente = todo lo que sale hasta la fecha meta y no está armado (lo atrasado primero, después la
   fecha meta camión por camión, en su orden). Ritmo = lo terminado hoy ÷ horas desde las 8. */
function calcularMeta(d) {
  var hoy = hoyKey(), ahora = Date.now();
  var wdHoy = new Date(hoy + "T12:00:00-03:00").getUTCDay();
  var habil = !(wdHoy === 0 || wdHoy === 6 || FERIADOS[hoy]);
  var meta = sumarHabiles(hoy, 2);
  // si ese día no tiene nada programado (sin reparto), la meta es el próximo con tandas
  var conTandas = [];
  d.prog.forEach(function (v) { if (v.fechaRaw && v.fechaRaw >= meta) conTandas.push(v.fechaRaw); });
  conTandas.sort();
  if (conTandas.length && conTandas[0] !== meta) meta = conTandas[0];
  var cams = new Map(), atr = { m3: 0, trab: 0, sinPick: 0, sinArm: 0, n: 0 };
  var tot = 0, arm = 0, sinPick = 0, sinArm = 0;
  d.prog.forEach(function (v, k) {
    if (!v.fechaRaw || v.fechaRaw > meta) return;
    if (tandaSalio(v, d.despachadas)) return;
    var ev = d.status.get(k) || {};
    var pk = ev.picking === "done", ar = ev.armado === "done";
    var trab = (pk ? 0 : v.m3 / 2) + (ar ? 0 : v.m3 / 2);
    if (v.fechaRaw < meta) {
      if (ar) return;                    // lo de antes ya armado no es trabajo de hoy
      atr.m3 += v.m3; atr.trab += trab; atr.n++;
      if (!pk) atr.sinPick += v.m3; else atr.sinArm += v.m3;
      return;
    }
    var cam = monCamionDeTanda(v), o = camionOrden(v);
    if (!cams.has(cam)) cams.set(cam, { cam: cam, orden: o, m3: 0, arm: 0, trab: 0 });
    var c = cams.get(cam);
    c.m3 += v.m3; c.trab += trab; if (ar) c.arm += v.m3;
    if (o < c.orden) c.orden = o;
    tot += v.m3; if (ar) arm += v.m3;
    if (!pk) sinPick += v.m3; else if (!ar) sinArm += v.m3;
  });
  // lo terminado HOY (una vez por tanda y etapa)
  var hecho = 0, visto = {};
  (d.eventos || []).forEach(function (ev) {
    if (ev.opcion !== "TP" && ev.opcion !== "TAP") return;
    if (!ev.ts_inicio || dayKey(ev.ts_cliente) !== hoy) return;
    var t = String(ev.texto || "").trim().toUpperCase(), kk = ev.opcion + "|" + t;
    if (!t || visto[kk]) return; visto[kk] = 1;
    var v = d.prog.get(t); if (v) hecho += (Number(v.m3) || 0) / 2;
  });
  var h = horaAR(ahora);
  var trans = Math.max(0, Math.min(h, JORNADA_FIN) - JORNADA_INI);
  var resta = Math.max(0, JORNADA_FIN - Math.max(h, JORNADA_INI));
  var ritmo = trans >= 0.75 ? hecho / trans : null;
  var capacidad = ritmo == null ? null : ritmo * resta;
  var lista = Array.from(cams.values()).sort(function (a, b) { return (a.orden - b.orden) || (b.m3 - a.m3); });
  // la capacidad se gasta en orden: primero lo atrasado, después camión por camión
  var falta = atr.trab + lista.reduce(function (s2, c) { return s2 + c.trab; }, 0);
  /* Se arma en orden (1°, 2°…). Si no alcanza, se pasan a otro día los ÚLTIMOS camiones del orden
     hasta que lo que queda entre en lo que hacen hasta las 17: así se patea un camión entero y no
     dos a medias. Lo atrasado de antes no se mueve (ya está vencido). */
  var sobra = capacidad == null ? null : falta - capacidad;
  for (var i = lista.length - 1; i >= 0; i--) {
    var c = lista[i];
    if (c.trab <= 0.0001) { c.llega = true; continue; }
    if (sobra == null) { c.llega = null; continue; }
    if (sobra > 0.0001) { c.llega = false; sobra -= c.trab; } else c.llega = true;
  }
  return { hoy: hoy, habil: habil, meta: meta, tot: tot, arm: arm, sinPick: sinPick, sinArm: sinArm,
           atr: atr, cams: lista, falta: falta, hecho: hecho, ritmo: ritmo, capacidad: capacidad,
           hora: h, llegan: capacidad == null ? null : capacidad >= falta - 0.0001 };
}
/* v23.92 (Luis) — la banda que va ARRIBA del resumen de días: el ritmo no dice nada solo, dice
   algo contra lo que hay programado. Mínimo texto: veredicto, barra, la meta, el ritmo y, si algo
   no llega, qué camión se pasa de día. */
function pintarMeta(d, m3PickHoy, m3ArmHoy) {
  var M = calcularMeta(d);
  var ver, cls;
  var corte = M.hora >= CORTE_HORA;
  if (!M.habil) { ver = "Hoy no se trabaja"; cls = "mt-gris"; }
  else if (M.falta <= 0.0001) { ver = "✅ Listo: " + esc(diaEtiqueta(M.meta)) + " armado"; cls = "mt-ok"; }
  else if (M.hora >= JORNADA_FIN) { ver = "⛔ Terminó la jornada: faltan " + n1(M.falta) + " m³"; cls = "mt-no"; }
  else if (M.llegan == null) { ver = "Falta " + n1(M.falta) + " m³ · ritmo desde las 8:45"; cls = "mt-gris"; }
  else if (M.llegan) { ver = "✅ Llegan · faltan " + n1(M.falta) + " m³"; cls = "mt-ok"; }
  else { ver = (corte ? "⛔ NO LLEGAN" : "⚠ Van atrasados") + " · faltan " + n1(M.falta) + " m³"; cls = corte ? "mt-no" : "mt-duda"; }
  var noLlegan = M.cams.filter(function (c) { return c.llega === false; });
  /* v24.38 (Luis): *"saca todo ese texto que es al pedo y pone otro dia mas en ese cuadro"*.
     De la banda quedan las DOS líneas que se leen de lejos y sobre las que se hace algo: el
     veredicto y, si algo no llega, qué camión se pasa de día. Se van la barra de avance, la
     línea de la meta, la del ritmo y la de «Hoy … pickeado · … armado»: son el detalle de la
     misma cuenta que el veredicto ya resume, y en una pared nadie los lee. El espacio que
     dejan es el día 4.º del resumen. */
  var h = '<div class="mt-ver ' + cls + '">' + ver + '</div>';
  if (noLlegan.length)
    h += '<div class="mt-lin mt-no">Pasar de día: <b>' +
         noLlegan.map(function (c) { return esc(c.cam); }).join(" · ") + '</b></div>';
  el("metaBox").innerHTML = h;
  /* el corte: a partir de las 15:00, si al ritmo de hoy no llegan, el cartel de arriba dice qué camión
     hay que pasar a otro día en la PPP (el último en el orden que no llega). */
  if (M.habil && corte && M.hora < JORNADA_FIN && M.llegan === false && noLlegan.length)
    return '<div class="aviso mt-corte">⛔ CORTE 15:00 — NO LLEGAN con el ' + esc(diaEtiqueta(M.meta)) +
      '. Corregir la PPP: pasar a otro día ' +
      noLlegan.map(function (c) { return '<b>' + esc(c.cam) + '</b>'; }).join(" · ") +
      ' y terminar el resto en orden.</div>';
  return "";
}

/* para tests/tv-meta-camion.cjs (la cuenta vive adentro del IIFE) */
window.__tvMeta = { calcular: calcularMeta, pintar: pintarMeta, camiones: function (m) { CAMION_DE = m; } };

function pintar(d) {
  window.__MA_D = d;

  /* ── Filtro de la tabla principal ────────────────────────────────────────
     Entra toda tanda cuya fecha de entrega caiga en la ventana y que no esté
     ya facturada Y despachada. ≡ index.html renderMonitor. */
  var ventana = new Set(d.fechas);

    if (!ventana.has(v.fechaRaw)) return;
    if (despachadaYFacturada(v, d.facturadas, d.despachadas)) return;
    var ev = d.status.get(k) || { picking: null, armado: null, doneHoyP: false, doneHoyA: false };
    tandas.push({ v: v, ev: ev });
  });
  /* Orden: fecha de entrega más cercana primero; dentro del día, lo que está
     en curso arriba y lo terminado abajo. ≡ index.html rankRow. */
  var rank = function (ev) {
    if (ev.picking === "curso" || ev.armado === "curso") return 0;
    if (ev.picking === "done" && ev.armado === "done") return 3;
    if (ev.picking === null && ev.armado === null) return 2;
    return 1;
  };
  tandas.sort(function (a, b) {
    return String(a.v.fechaRaw).localeCompare(String(b.v.fechaRaw)) ||
           (camionOrden(a.v) - camionOrden(b.v)) ||          /* v23.86: por camión, en su orden */
           (rank(a.ev) - rank(b.ev)) ||
           String(a.v.tanda).localeCompare(String(b.v.tanda));
  });
  var m3Pick = 0, m3Arm = 0;
  var fc = [], porDia = new Map(), agregados = [];
  var filas = [], sinAct = 0, enVentana = 0, terminadas = 0, diaEnCurso = "";

  tandas.forEach(function (t) {
    var v = t.v, ev = t.ev;
    if (ev.doneHoyP) m3Pick += v.m3;
    if (ev.doneHoyA) m3Arm  += v.m3;

    // m³ por día, desglosado por camión
    var dk = v.fechaRaw || "_";
    if (!porDia.has(dk)) porDia.set(dk, { fecha: v.fecha, total: 0, camiones: new Map() });
    var g = porDia.get(dk);
    g.total += v.m3;
    var cam = monCamionDeTanda(v);   /* ≡ index.html v23.64: grupo de zonas, no el número de tanda */
    if (!g.camiones.has(cam)) g.camiones.set(cam, { sum: 0, n: 0, armadas: 0, usa: cam !== "Retira" });
    var c = g.camiones.get(cam);
    c.sum += v.m3; c.n++;
    if (ev.armado === "done") c.armadas++;

    enVentana++;
    if (ev.picking === "done" && ev.armado === "done") {
      fc.push({ v: v, ev: ev });
      terminadas++;
      return;                       // las terminadas salen de la tabla y van a "a facturar"
    }
    if (v.agregados.length) agregados.push(v);

    var hayAlgo = (ev.picking !== null || ev.armado !== null);
    if (!hayAlgo) {
      /* De las planificadas sin tocar mostramos sólo las primeras, para
         anticipar lo que viene sin llenar la pantalla. ≡ MAX_PLANNED_NO_ACT. */
      if (sinAct >= MAX_SIN_ACT) return;
      sinAct++;
    }
    var enCurso = (ev.picking === "curso" || ev.armado === "curso");
    /* v20.21 (Thomas) — el 🚚 también acá. En esta tabla están las que NO terminaron, así que una
       tanda con carga al camión registrada es una anomalía que conviene ver: salió sin cerrar el
       picking o el armado. Va pegado al código y no en una columna propia para no confundirse con
       «Salida», que es la fecha de entrega. */
    var salioT = tandaSalio(v, d.despachadas);
    /* v24.88 (Luis) — tanda · m³ · cliente · NP · progreso (retira las TRES columnas de la
       v23.92). Los días y la zona siguen afuera: en una pared lo que se lee es el código de
       la tanda y si está hecha. Las tandas siguen ordenadas por camión (v23.86: ése es el orden de
       armado), pero el rótulo del camión ya no se escribe. */
    if (v.fechaRaw !== diaEnCurso) {
      diaEnCurso = v.fechaRaw;
      filas.push('<tr class="dia"><td colspan="5">' +
        esc(diaEtiqueta(v.fechaRaw) || "Sin fecha") + '</td></tr>');
    }
    filas.push('<tr' + (enCurso ? ' class="curso"' : (salioT ? ' class="salio-sinfc"' : '')) + '>' +
      '<td class="t-tanda">' + esc(v.tanda) +
        (salioT ? ' <span class="t-salio" title="Ya se registró la carga al camión (CCN)">🚚</span>' : '') + '</td>' +
      '<td class="num t-m3">' + n1(v.m3) + '</td>' +
      '<td class="t-cli" title="' + esc((v.clientes || []).join(" · ")) + '"><div><span class="tk">' + esc(clienteTanda(v)) + '</span></div></td>' +
      '<td class="num t-np" title="' + esc((v.nps || []).join(" · ")) + '">' + ((v.nps || []).length || "—") + '</td>' +   // v25.54: cuántas NP
      '<td class="cen">' + semaforo(ev, nombres, horarios) + '</td>' +
      '</tr>');
  });

  /* "A facturar" muestra TODAS las terminadas, también las de fuera de la
     ventana — pedido del dueño: "las tandas a facturar tienen que aparecer
     todas" (v5.99). */
  var yaFc = new Set(fc.map(function (x) { return x.v.key; }));
  d.prog.forEach(function (v, k) {
    if (yaFc.has(v.key)) return;
    var ev = d.status.get(k);
    if (!ev || ev.picking !== "done" || ev.armado !== "done") return;
    if (despachadaYFacturada(v, d.facturadas, d.despachadas)) return;
    fc.push({ v: v, ev: ev }); yaFc.add(v.key);
  });
  fc.sort(function (a, b) {
    return String(a.v.fechaRaw || "").localeCompare(String(b.v.fechaRaw || "")) ||
           String(a.v.tanda || "").localeCompare(String(b.v.tanda || ""));
  });

  // ── Tabla de tandas (v23.92: sin título — el separador de día ya dice de qué día es cada bloque)
  var etiqueta = d.fechas.map(diaEtiqueta).join(" · ") || "—";
  var topeT = cabenFilas("tandasBox", true);
  el("tandasBox").innerHTML = filas.length
    ? '<table class="tandas"><colgroup><col class="c-tan"><col class="c-m3"><col>' +
      '<col class="c-np"><col class="c-pro"></colgroup>' +
      '<thead><tr><th>Tanda</th><th class="num">M³</th><th>Cliente</th><th>NP</th><th class="cen">Progreso</th></tr></thead><tbody>' +
      filas.slice(0, topeT).join("") + '</tbody></table>' +
      (filas.length > topeT ? '<div class="mas">+ ' + (filas.length - topeT) + ' más</div>' : "")
    : '<div class="vacio">' + (tandas.length
        ? "Todo terminado para " + esc(etiqueta) + " ✅"
        : "Sin tandas programadas para las próximas fechas") + '</div>';

  /* v20.21 (Thomas): cuáles de las que faltan facturar YA SE FUERON en el camión. v20.20: la
     lista (no sólo el número) porque el cartel de arriba las nombra. */
  /* v26.70 (D28): sin el dato de lo facturado o de lo cargado no hay cartel — no se sabe. */
  var fcSinFc = (d.facturadas && d.despachadas) ? fc.filter(function (x) {
    return tandaSalio(x.v, d.despachadas) && !tandaFacturada(x.v, d.facturadas);
  }) : [];
  var fcSalidas = fcSinFc.length;

  // ── Avisos: agregados primero (son los que hacen salir un camión incompleto)
  var avisos = pintarMeta(d, m3Pick, m3Arm);   /* v23.86: el corte de las 15:00 va arriba de todo */
  agregados.slice(0, 2).forEach(function (v) {
    v.agregados.slice(0, 2).forEach(function (a) {
      avisos += '<div class="aviso aviso-agr">⚠ ' + esc(a.np || "(sin numerar)") +
        ' ES UN AGREGADO AL PEDIDO ' + esc(a.aNp || "?") + ' Y SALEN JUNTOS — ARMENLO YA' +
        (a.rs ? " · " + esc(a.rs) : "") + '</div>';
    });
  });
  /* v20.21 (Thomas) — el cartel de lo que se fue sin papel. La lista va completa: son las que
     alguien tiene que facturar hoy, y en una pared un "+3 más" no sirve para nada. */
  if (fcSinFc.length >= AVISO_SALIO_SIN_FC) {
    /* v20.23 (Thomas): cada tanda con sus m³, y el total adelante. En una pared el volumen es lo
       que dice si lo que está afuera sin papel es un pedido chico o medio camión. */
    var m3SinFc = fcSinFc.reduce(function (s, x) { return s + (x.v.m3 || 0); }, 0);
    avisos += '<div class="aviso aviso-salio">🚚 ' + fcSinFc.length +
      (fcSinFc.length === 1 ? ' TANDA YA SALIÓ Y NO ESTÁ FACTURADA' : ' TANDAS YA SALIERON Y NO ESTÁN FACTURADAS') +
      ' (' + n1(m3SinFc) + ' m³): ' +
      fcSinFc.map(function (x) { return esc(x.v.tanda) + ' <b>' + n1(x.v.m3) + '</b>'; }).join(" · ") + '</div>';
  }
  if (d.alertas.length) {
    avisos += '<div class="aviso aviso-err">⚠ Tandas trabajadas que NO están en la PPP: ' +
      d.alertas.slice(0, 8).map(esc).join(" · ") + '</div>';
  }
  el("avisos").innerHTML = avisos;

  // ── Resumen de días (v23.64, reemplaza "A facturar") ≡ Programación de la PPP
  if (d.arbol === null) {
    el("fcTit").innerHTML = "NPs por Día";
    el("fcBox").innerHTML = '<div class="vacio">No se pudo leer la programación</div>';
  } else if (d.despachadas === null) {   // v26.70 (D28): sin lo cargado, «Salió» diría 0 y es falso
    el("fcTit").innerHTML = "NPs por Día";
    el("fcBox").innerHTML = '<div class="vacio">No se pudo leer lo cargado al camión</div>';
  } else {
    var rds = resumenDias(d.arbol, d.despachadas, 4);   /* v24.38 (Luis): un día más */
    el("fcTit").innerHTML = "NPs por Día" +
      (fcSalidas ? " <small>· <b class=\"fc-salio\">" + fcSalidas + (fcSalidas === 1 ? " salió" : " salieron") + " sin FC</b></small>" : "");
    var pc = function (nn, tot, cls) {
      var p = tot ? Math.round(100 * nn / tot) : 0;
      /* v25.01 (Luis): el número de pedidos grande y el % chiquito abajo, los dos en color. */
      return '<td class="' + cls + (nn ? '' : ' z') + '">' + nn + '<small>' + p + '%</small></td>';
    };
    /* v24.70: el m³ del día es el mismo que daba «Total por día» (las tandas del día). */
    var m3Dia = function (x) { var g = porDia.get(x.key); return g ? g.total : x.m3; };
    el("fcBox").innerHTML = rds.length ? '<table class="rd"><thead><tr><th></th><th>M³</th>' +
      '<th>Salió</th><th>Fact</th><th>Arm</th><th>Proc</th><th>Pend</th>' +
      '</tr></thead><tbody>' + rds.map(function (x) {
        var neto = function (k) { return x.est[k] - (x.estSal[k] || 0); };
        return '<tr' + (x.key === hoyKey() ? ' class="hoy"' : '') + '>' +
          '<td class="rd-fe">' + esc(diaEtiqueta(x.key)) + '</td>' +
          '<td class="rd-m3">' + n1(m3Dia(x)) + '</td>' +
          pc(x.salio, x.nps, "sal") + pc(neto("facturado"), x.nps, "fac") + pc(neto("armado"), x.nps, "arm") +
          pc(neto("proceso"), x.nps, "pro") + pc(neto("pendiente"), x.nps, "pen") + '</tr>';
      }).join("") + '</tbody></table>'
      : '<div class="vacio">Nada programado</div>';
  }

  // ── Operarios · horas de hoy (v21.17, Damián)
  pintarHoras(d.horas, d);

  // ── Pendientes de salir hoy (v25.01, Luis)
  if (d.arbol === null) {
    el("penTit").innerHTML = "Pendientes de salir hoy";
    el("penBox").innerHTML = '<div class="vacio">No se pudo leer la programación</div>';
  } else if (d.despachadas === null) {   // v26.70 (D28): sin lo cargado, todo el día parecería pendiente
    el("penTit").innerHTML = "Pendientes de salir hoy";
    el("penBox").innerHTML = '<div class="vacio">No se pudo leer lo cargado al camión</div>';
  } else {
    var pens = pendientesHoy(d.arbol, d.despachadas);
    var penNp = pens.reduce(function (a, x) { return a + x.nps.length; }, 0);
    var penM3 = pens.reduce(function (a, x) { return a + x.m3; }, 0);
    el("penTit").innerHTML = "🚚 Pendientes de salir hoy" + (pens.length
      ? " <small>· " + pens.length + (pens.length === 1 ? " pedido" : " pedidos") + " · " + penNp + " NP · " + n1(penM3) + " m³</small>" : "");
    /* v25.6 (Luis): *"queda cortado En este momento"*. Pendientes toma a lo sumo la mitad de
       lo que queda libre; si no entran todos, la última fila es «+ N más». */
    el("penBox").innerHTML = "";
    var PEN_MAX = Math.max(1, cabenFilas("penBox", false));
    if (pens.length > PEN_MAX) PEN_MAX = Math.max(1, PEN_MAX - 1);
    el("penBox").innerHTML = pens.length
      ? '<table class="pen"><tbody>' +
        pens.slice(0, PEN_MAX).map(function (x) {
          var et = PEN_TXT[x.est] || PEN_TXT.pendiente;
          return '<tr><td class="p-tanda">' + esc(x.tanda) + '</td>' +
            '<td class="p-zona">' + esc(x.zonas.join("·") || "—") + '</td>' +
            '<td class="p-cli" title="' + esc(x.rsFull) + '"><div><span class="tk">' + esc(x.rs) + '</span></div></td>' +
            '<td class="p-np" title="' + esc(x.nps.join(" · ")) + '"><div><span class="tk">' + esc(npsCortas(x.nps)) + '</span></div></td>' +
            '<td class="' + et[0] + '">' + et[1] + '</td></tr>';
        }).join("") + '</tbody></table>' +
        (pens.length > PEN_MAX ? '<div class="mas">+ ' + (pens.length - PEN_MAX) + ' más</div>' : "")
      : '<div class="vacio">✅ Salió todo lo de hoy</div>';
  }
  tickersTodos();

  tickersTodos();   // v25.51: la columna derecha va al ancho del dato; recién acá queda fijo el ancho de la izquierda
  if (window.__MA_INSTR) window.__MA_INSTR();

  /* v23.92 (Luis): la barra de avance y los conteos salieron del header (texto que de lejos no
     se lee). La cuenta se conserva acá porque es la que dice qué tanda vale por terminada, y
     `tests/mon-tv.cjs` la mira. */
  window.__tvUlt = {
    terminadas: terminadas, enVentana: enVentana, aFc: fc.length, programadas: d.prog.size,
    enCurso: tandas.filter(function (t) {
      return t.ev.picking === "curso" || t.ev.armado === "curso";
    }).length
  };
}

/* "2026-09-23" → "Mié 23/09". Los nombres van a mano y no por `toLocaleDateString`:
   el televisor puede no tener el locale es-AR y devolver "Wed". */
var DIA_NOMBRE = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
function diaEtiqueta(raw) {
  if (!raw) return "";
  var wd = new Date(raw + "T00:00:00-03:00").getUTCDay();
  return DIA_NOMBRE[wd] + " " + raw.slice(8, 10) + "/" + raw.slice(5, 7);
}

/* Horas de hoy por operario. Las cuatro columnas de la derecha son la pregunta
   de Damián: cuánto tardó en promedio cada tanda, y en qué se fue el resto del
   día. El criterio de qué es productivo está en `gv_monitor_horas_operario`. */
function pintarHoras(filas, d) {
  /* v23.70 (Luis) — dos bloques:
     · RITMO (índice, decimal): m³/h de picking y de armado = m³ de las tandas que ese operario
       (v26.55: el m³ de una tanda pickeada es lo PICKEADO)
       cerró HOY (TP / TAP, cada tanda una vez) ÷ sus horas de picking / armado (`hs_pick` / `hs_arm`
       de la vista, lo cerrado). Reemplaza al «h/tanda», que no servía: una tanda no mide nada fijo.
     · HORAS (H:MM): v25.89 — Prod = picking + armado; No prod = el resto de la jornada. */
  filas = filas || [];
  if (!filas.length && !((d && d.actividad) || []).length) {
    el("opsTit").innerHTML = "Operarios";
    el("opsBox").innerHTML = '<div class="vacio">Nadie fichado todavía</div>';
    return;
  }
  var m3 = {}, cred = (d && d.credito) || new Map();   // legajo -> { pick: {tanda:m3}, arm: {...} }
  ((d && d.eventos) || []).forEach(function (ev) {
    if (ev.opcion !== "TP" && ev.opcion !== "TAP") return;
    if (!ev.ts_inicio || dayKey(ev.ts_cliente) !== hoyKey()) return;
    var leg = String(ev.legajo == null ? "" : ev.legajo).trim(), t = String(ev.texto || "").trim().toUpperCase();
    if (!leg || !t) return;
    var v = d.prog && d.prog.get(t); if (!v) return;
    var k = ev.opcion === "TP" ? "pick" : "arm", mm = (m3[leg] = m3[leg] || { pick: {}, arm: {} });
    if (cred.has(t + "|" + (k === "pick" ? "picking" : "armado"))) return;   // v26.67: frenada → se reparte abajo
    mm[k][t] = Number(v.m3) || 0;   // v26.55: ya es lo PICKEADO (picking y armado)
  });
  /* v26.67: la parte de una frenada se cuenta cuando ESE operario cierra su tramo hoy (TP/TAP/PKF/APF) ≡ index gvM3ConCredito */
  var cierreHoy = {};
  ((d && d.eventos) || []).forEach(function (ev) {
    if (!/^(TP|TAP|PKF|APF)$/.test(ev.opcion) || !ev.ts_inicio || dayKey(ev.ts_cliente) !== hoyKey()) return;
    cierreHoy[String(ev.legajo == null ? "" : ev.legajo).trim() + "|" + String(ev.texto || "").trim().toUpperCase() + "|" + (/^(TP|PKF)$/.test(ev.opcion) ? "picking" : "armado")] = 1;
  });
  cred.forEach(function (rows, key) { var z = key.split("|"), k = z[1] === "picking" ? "pick" : "arm";
    rows.forEach(function (x) { var leg = String(x.legajo || "").trim(); if (!leg || String(x.dia) !== hoyKey() || !cierreHoy[leg + "|" + key]) return;
      var mm = (m3[leg] = m3[leg] || { pick: {}, arm: {} }); mm[k][z[0]] = (mm[k][z[0]] || 0) + (Number(x.m3) || 0); }); });
  window.__MA_M3 = m3;
  var suma = function (o) { var s2 = 0; for (var k in o) s2 += o[k]; return s2; };
  var ritmo = function (m, h) { h = Number(h) || 0; return (h > 0.05 && m > 0) ? n1(m / h) : "—"; };
  /* v25.89 (Luis, 01/10) — REGLA GENERAL: Prod = SOLAMENTE picking + armado. Todo lo demás es No
     prod (movimiento, carga, remitos, baño, comida… y el tiempo muerto) = jornada − prod. La columna
     Total se fue: en su lugar «Ahora» dice qué está haciendo cada uno (era «En este momento»). */
  var nombres = (d && d.empleados && d.empleados.nombres) || new Map();
  var act = {}; ((d && d.actividad) || []).forEach(function (r) { act[String(r.legajo)] = r; });
  var ahora = function (leg) {
    var r = act[leg]; if (!r) return '<td class="op-ah act-idle">—</td>';
    var min = Math.round((Date.now() - r.desde) / 60000);
    var col = min >= 120 ? "#f87171" : (min >= 60 ? "#fbbf24" : "#64748b");
    var q;
    if (r.idle) q = (r.arranco === false) ? "🕐 sin arrancar" : "💤 libre";
    else { var info = ACT_INFO[r.kind] || { ic: "•", tx: r.kind }; q = (info.ic || "•") + " " + (info.vb ? (info.vb + " " + esc(r.tanda)) : info.tx); }
    return '<td class="op-ah' + (r.idle ? " act-idle" : "") + '">' + q + ' <b style="color:' + col + '">' + esc(fmtMin(min)) + '</b></td>';
  };
  var tPm = 0, tPh = 0, tAm = 0, tAh = 0, tProd = 0, tNo = 0, vistos = {};
  var fila = function (o) {
    var leg = String(o.legajo); vistos[leg] = 1;
    var mm = m3[leg] || { pick: {}, arm: {} };
    var mp = suma(mm.pick), ma = suma(mm.arm);
    var prod = (Number(o.hs_pick) || 0) + (Number(o.hs_arm) || 0);
    var no = Math.max(0, (Number(o.hs_total) || 0) - prod);
    tPm += mp; tPh += Number(o.hs_pick) || 0; tAm += ma; tAh += Number(o.hs_arm) || 0;
    tProd += prod; tNo += no;
    return '<tr><td title="' + esc(o.nombre) + '">' + esc(nombreCorto(o.nombre, o.legajo)) +
      (o.en_jornada ? "" : ' <span style="color:#475569;font-weight:800">✓</span>') + '</td>' +
      '<td class="op-rit">' + ritmo(mp, o.hs_pick) + '</td>' +
      '<td class="op-rit op-sep">' + ritmo(ma, o.hs_arm) + '</td>' +
      '<td class="op-prod">' + nH(prod) + '</td>' +
      '<td class="op-no op-sep">' + nH(no) + '</td>' + ahora(leg) + '</tr>';
  };
  var cuerpo = filas.map(fila).join("");
  /* el que fichó y todavía no cerró nada también sale, con su «Ahora» */
  ((d && d.actividad) || []).forEach(function (r) {
    var leg = String(r.legajo); if (vistos[leg]) return;
    var nom = nombres.get(leg) || "";
    cuerpo += '<tr><td>' + esc(nombreCorto(nom, leg)) + '</td><td class="op-rit">—</td><td class="op-rit op-sep">—</td>' +
      '<td class="op-prod">—</td><td class="op-no op-sep">—</td>' + ahora(leg) + '</tr>';
  });
  var total = '<tr class="op-tot-row"><td>Total</td>' +
    '<td class="op-rit">' + ritmo(tPm, tPh) + '</td><td class="op-rit op-sep">' + ritmo(tAm, tAh) + '</td>' +
    '<td class="op-prod">' + nH(tProd) + '</td><td class="op-no op-sep">' + nH(tNo) + '</td><td></td></tr>';
  el("opsTit").innerHTML = "Operarios";
  el("opsBox").innerHTML = '<table class="ops"><thead>' +
    '<tr class="op-grp"><th></th><th colspan="2" class="op-sep">Ritmo</th><th colspan="2" class="op-sep">Horas</th><th></th></tr>' +
    '<tr><th>Operario</th>' +
    '<th title="m³ pickeados hoy ÷ horas de picking">m³/h<br>picking</th>' +
    '<th class="op-sep" title="m³ armados hoy ÷ horas de armado">m³/h<br>armado</th>' +
    '<th title="Sólo picking y armado">Prod</th>' +
    '<th class="op-sep" title="Todo lo demás: movimiento, carga, remitos, baño, comida y tiempo muerto">No prod</th>' +
    '<th>Ahora</th></tr></thead><tbody>' + cuerpo + total + '</tbody></table>';
}

/* v20.21 (Thomas) — ¿esta tanda YA SALIÓ? Es la misma pregunta que contesta la
   columna SALIÓ de la PPP (≡ index.html _pgaSalio) y la misma respuesta:
   **sólo cuenta la carga al camión registrada** (evento CCN, ya descontado el

(function () {

  var enrolada = false;

    enrolada = true;

      u.searchParams.delete("cb");

  if (!enrolada) {
    el("splashMsg").innerHTML = "Esta pantalla se habilita una sola vez por televisor.<br>" +
      "Abrila con <b>?key=" + esc(TV_KEY) + "</b> al final de la dirección.";

  el("app").classList.remove("hide");

  setTimeout(function () { try { location.reload(); } catch (_e) {} }, RELOAD_CADA_MS);
